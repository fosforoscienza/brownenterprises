<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, follow" />
<meta name="theme-color" content="#0E1217" />
<title>404 — Pagina non trovata · Brown Enterprises</title>
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;min-height:100svh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1100px 620px at 50% -12%, rgba(255,255,255,.06), transparent 60%), #0E1217;
    color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-align:center;
    padding:max(env(safe-area-inset-top),32px) 24px max(env(safe-area-inset-bottom),32px)}
  .card{width:100%;max-width:560px}
  .logo{width:96px;height:96px;margin:0 auto 24px;border-radius:24px;display:grid;place-items:center;
    background:#141a22;border:1px solid rgba(255,255,255,.1);box-shadow:0 18px 50px rgba(0,0,0,.45)}
  .logo svg{width:58px;height:58px}
  .code{font-size:14px;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.55);margin:0 0 8px}
  h1{margin:0 0 6px;font-size:clamp(26px,6vw,38px);line-height:1.1;letter-spacing:-.02em}
  .en{color:rgba(255,255,255,.5);font-size:15px;margin:0 0 22px}
  p.lead{color:rgba(255,255,255,.66);font-size:16px;line-height:1.6;max-width:420px;margin:0 auto 30px}
  .btn{display:inline-block;background:#fff;color:#0e1217;font-weight:700;font-size:15px;
    padding:14px 30px;border-radius:999px;text-decoration:none;box-shadow:0 10px 30px rgba(0,0,0,.35);transition:transform .12s}
  .btn:hover{transform:translateY(-1px)}
  .alt{display:block;margin-top:16px;color:rgba(255,255,255,.55);font-size:14px;text-decoration:none}
  .alt:hover{color:#fff}
</style>
</head>
<body>
  <main class="card" role="main">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 38h56l-5-9-12-4-8-7H22l-8 9-10 2v9z" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" fill="rgba(255,255,255,0.06)"/>
        <path d="M22 18l-3 9h24l-6-9H22z" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/>
        <circle cx="19" cy="42" r="6" stroke="#fff" stroke-width="2.4" fill="#0E1217"/>
        <circle cx="45" cy="42" r="6" stroke="#fff" stroke-width="2.4" fill="#0E1217"/>
      </svg>
    </div>
    <p class="code">Errore 404</p>
    <h1>Pagina non trovata</h1>
    <p class="en">Page not found</p>
    <p class="lead">La pagina che cerchi non esiste o è stata spostata.<br>The page you're looking for doesn't exist or has moved.</p>
    <a class="btn" href="/">Torna alla home</a>
    <a class="alt" href="/en/">Go to the English homepage →</a>
  </main>
</body>
</html>
