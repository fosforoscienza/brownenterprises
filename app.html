}

/* Selettore dei destinatari: una pillola per persona, se ne accendono quante si vuole */
function buildAssigneePicker(proj, selected, inModal){
  var chosen = {};
  (selected || []).forEach(function(id){ chosen[id] = true; });
  var wrap = document.createElement("div");
  wrap.className = "assignee-row";
  if(!inModal){
    var lab = document.createElement("span");
    lab.className = "label";
    lab.textContent = "Destinatari";
    wrap.appendChild(lab);
  }
  var people = projectPeople(proj);
  people.forEach(function(p){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "priority-pill person-pill";
    b.setAttribute("aria-pressed", !!chosen[p.id]);
    if(chosen[p.id]) b.classList.add("active");
    b.innerHTML = '<span class="person-dot"></span><span class="pn"></span>';
    b.querySelector(".person-dot").style.background = personHue(p.id);
    b.querySelector(".person-dot").textContent = personInitials(p.name);
    b.querySelector(".pn").textContent = p.id === state.me.id ? p.name + " (io)" : p.name;
    b.addEventListener("click", function(){
      chosen[p.id] = !chosen[p.id];
      b.classList.toggle("active", chosen[p.id]);
      b.setAttribute("aria-pressed", chosen[p.id]);
    });
    wrap.appendChild(b);
  });
  if(people.length <= 1){
    var hint = document.createElement("span");
    hint.className = "assignee-hint";
    hint.textContent = proj.personal ? "Progetto personale: condividilo per assegnare il task ad altri." : "";
    if(hint.textContent) wrap.appendChild(hint);
  }
  /* l'ordine segue quello delle persone, non dei clic */
  wrap.getValue = function(){
    return people.filter(function(p){ return chosen[p.id]; }).map(function(p){ return p.id; });
  };
  return wrap;
}

async function saveAssignees(card, ids){
  var before = card.assignees || [];
  var add = ids.filter(function(id){ return before.indexOf(id) < 0; });
  var del = before.filter(function(id){ return ids.indexOf(id) < 0; });
  if(!add.length && !del.length) return;
  var jobs = [];
  if(add.length){
    jobs.push(sb.from("be_card_assignees").insert(add.map(function(id){
      return { card_id: card.id, user_id: id };
    })));
  }
  if(del.length){
    jobs.push(sb.from("be_card_assignees").delete().eq("card_id", card.id).in("user_id", del));
  }
  var results = await Promise.all(jobs);
  var failed = results.find(function(r){ return r.error; });
  if(failed){ notify(errorText(failed.error, "Destinatari non salvati")); return; }
  card.assignees = ids.slice();
  renderBoard();
}

async function loadEverything(){
  var sessionRes = await sb.auth.getSession();
  var session = sessionRes.data && sessionRes.data.session;
  if(!session){
    // Offline getSession puo' fallire pur avendo un refresh token valido in
    // locale: rimandare al login qui significava accusare l'utente di non
    // essere autenticato solo perche' manca la rete.
    if(isNetworkError(sessionRes.error)){ showOfflinePanel(); return false; }
    // l'indirizzo di una sezione (#chi-fa-cosa) sopravvive al login
    window.location.replace("login.html" + (/^#[a-z0-9-]+$/.test(location.hash) ? location.hash : ""));
    return false;
  }
  var user = session.user;
  state.me = {
    id: user.id,
    email: user.email,
    display_name: (user.user_metadata && user.user_metadata.display_name) || user.email,
    apple_ics_url: (user.user_metadata && user.user_metadata.apple_ics_url) || "",
    cal_default_view: (user.user_metadata && user.user_metadata.cal_default_view) || ""
  };

  state.isTeam = /@brown\.internal$/i.test(user.email || "");

  var results = await Promise.all([
    sb.from("be_profiles").select("id, display_name"),
    fetchProjects(),
    sb.from("be_project_shares").select("project_id, user_id"),
    sb.from("be_columns").select("id, project_id, name, position").order("position", { ascending: true }),
    fetchCards()
  ]);

  for (var i = 0; i < results.length; i++){
    if(results[i].error){
      if(isNetworkError(results[i].error)){ showOfflinePanel(); return false; }
      showErrorPanel("Errore nel caricamento dei dati", results[i].error.message);
      return false;
    }
  }

  state.profiles = results[0].data || [];

  var sharesByProject = {};
  (results[2].data || []).forEach(function(s){
    (sharesByProject[s.project_id] = sharesByProject[s.project_id] || []).push(s.user_id);
  });

  var columnsByProject = {};
  var columnById = {};
  (results[3].data || []).forEach(function(c){
    var col = { id: c.id, name: c.name, position: c.position, cards: [] };
    columnById[c.id] = col;
    (columnsByProject[c.project_id] = columnsByProject[c.project_id] || []).push(col);
  });

  (results[4].data || []).forEach(function(c){
    var col = columnById[c.column_id];
    if(col) col.cards.push({
      id: c.id, title: c.title, priority: c.priority, position: c.position,
      start_date: c.start_date || null, due_date: c.due_date || null, done_at: c.done_at || null,
      assignees: []
    });
  });

  state.projects = (results[1].data || []).map(function(p){
    return {
      id: p.id,
      name: p.name,
      owner_id: p.owner_id,
      area: normalizeArea(p.area),
      personal: p.personal === undefined ? !state.isTeam : !!p.personal,
      category_id: p.category_id || null,
      archived_at: p.archived_at || null,
      // undefined: manca sql/coordinatore.sql; null: il coordinatore non l'ha ancora visto
      reviewed_at: p.reviewed_at === undefined ? undefined : (p.reviewed_at || null),
      created_at: p.created_at || null,
      isOwner: p.owner_id === state.me.id,
      shares: sharesByProject[p.id] || [],
      columns: columnsByProject[p.id] || []
    };
  });

  syncActiveProject();

  await Promise.all([loadLibrary(), loadCategories(), loadCoordinator(), loadAssignees()]);
  return true;
}

/* Senza sql/categorie.sql le colonne nuove non ci sono: si ricarica senza,

/* =====================================================================
 * Categorie della colonna di sinistra (sql/categorie.sql)
 *
 * Le categorie sono una lista sola per tutto il team: un progetto sta in
 * una categoria per tutti, e chiunque del team le crea, le rinomina e ci
 * sposta dentro i progetti. Accanto ci sono quattro gruppi fissi:
 *   - «Preferiti»: la stellina, privata di ognuno, fissa in cima;
 *   - «Personale»: i miei progetti che il team non vede (personal),
 *     condivisibili con singole persone;
 *   - «Condivisi con me»: il Personale di un altro, aperto a me;
 *   - «Archiviati»: archived_at pieno, uguale per tutti.
 * Le aree di lavoro in alto restano un filtro sopra a tutto questo.
 * ===================================================================== */
var GROUP_FAV      = "__preferiti__";
var GROUP_NONE     = "__senza__";
var GROUP_PERSONAL = "__personale__";
var GROUP_SHARED   = "__condivisi__";
var GROUP_ARCHIVED = "__archiviati__";
var GROUPS_TOGGLED_KEY = "be_groups_toggled_v1";

async function loadCategories(){
  state.categories = [];
  state.favorites = {};
  state.teamIds = [];
  if(state.categoriesError) return;
  var res = await Promise.all([
    sb.from("be_categories").select("id, name, position").order("position", { ascending: true }),
    sb.from("be_project_favorites").select("project_id"),
    sb.rpc("be_team")
  ]);
  var err = res[0].error || res[1].error;
  if(err){ state.categoriesError = err.message; return; }
  state.categories = res[0].data || [];
  (res[1].data || []).forEach(function(r){ state.favorites[r.project_id] = true; });
  // setof uuid: a seconda della versione di PostgREST stringhe o oggetti
  state.teamIds = (res[2].data || []).map(function(r){ return typeof r === "string" ? r : r.be_team; });
}

function categoryById(id){
  return state.categories.find(function(c){ return c.id === id; }) || null;
}
function sortedCategories(){
  return state.categories.slice().sort(function(a,b){
    if(a.position !== b.position) return a.position - b.position;
    return a.name.localeCompare(b.name, "it");
  });
}
function isFavorite(p){ return !!state.favorites[p.id]; }
function projectById(id){
  return state.projects.find(function(p){ return p.id === id; }) || null;
}

/* Il gruppo in cui sta un progetto, Preferiti a parte */
function projectGroup(p){
  if(p.archived_at) return GROUP_ARCHIVED;
  if(p.personal) return p.isOwner ? GROUP_PERSONAL : GROUP_SHARED;
  return categoryById(p.category_id) ? p.category_id : GROUP_NONE;
}
function groupName(id){
  if(id === GROUP_FAV)      return "Preferiti";
  if(id === GROUP_NONE)     return "Senza categoria";
  if(id === GROUP_PERSONAL) return "Personale";
  if(id === GROUP_SHARED)   return "Condivisi con me";
  if(id === GROUP_ARCHIVED) return "Archiviati";
  var c = categoryById(id);
  return c ? c.name : "";
}
function isCategoryGroup(id){ return !!categoryById(id); }

/* Gli stessi permessi di sql/categorie.sql (il database ha comunque
   l'ultima parola): categoria e archivio dei progetti del team li cambia
   chiunque del team, il Personale solo il proprietario. */
function canCategorize(p){ return p.personal ? (p.isOwner && state.isTeam) : state.isTeam; }
function canArchive(p){ return p.isOwner || (!p.personal && state.isTeam); }

/* I gruppi in ordine, con dentro i progetti. Li usano la colonna di
   sinistra (una sola area, Preferiti solo in cima) e «Chi fa cosa»
   (tutte le aree, niente Archiviati).
   opts: { area, archived, favoritesApart, sort } */
function projectGroups(opts){
  opts = opts || {};
  var groups = [], byId = {};
  function add(id){
    var g = { id: id, name: groupName(id), projects: [] };
    groups.push(g);
    byId[id] = g;
  }
  add(GROUP_FAV);
  sortedCategories().forEach(function(c){ add(c.id); });
  add(GROUP_NONE);
  add(GROUP_PERSONAL);
  add(GROUP_SHARED);
  if(opts.archived) add(GROUP_ARCHIVED);

  var list = state.projects.filter(function(p){ return !opts.area || p.area === opts.area; });
  if(opts.sort) list.sort(function(a,b){ return a.name.localeCompare(b.name, "it"); });
  list.forEach(function(p){
    var g = projectGroup(p);
    if(g === GROUP_ARCHIVED){
      if(opts.archived) byId[g].projects.push(p);
      return;
    }
    if(isFavorite(p)){
      byId[GROUP_FAV].projects.push(p);
      if(opts.favoritesApart) return;
    }
    byId[g].projects.push(p);
  });
  return groups;
}

/* Gruppi chiusi: preferenza locale del browser, non del database.
   Si salvano i gruppi cambiati rispetto al default (Archiviati chiuso). */
function readToggled(){
  try {
    var v = JSON.parse(localStorage.getItem(GROUPS_TOGGLED_KEY) || "[]");
    return Array.isArray(v) ? v : [];
  } catch(e){ return []; }
}
function isCollapsed(id){
  var toggled = readToggled().indexOf(id) >= 0;
  return id === GROUP_ARCHIVED ? !toggled : toggled;
}
function toggleCollapsed(id){
  var ids = readToggled(), i = ids.indexOf(id);
  if(i >= 0) ids.splice(i, 1); else ids.push(id);
  try { localStorage.setItem(GROUPS_TOGGLED_KEY, JSON.stringify(ids)); } catch(e){}
}

function categoriesUnavailable(){
  if(!state.categoriesError) return false;
  notify("Le categorie non sono ancora attive sul database.\n\n" + state.categoriesError +
        "\n\nEsegui lo script sql/categorie.sql nell'editor SQL di Supabase.");
  return true;
}

/* --- categorie ------------------------------------------------------------ */
function categoryNameTaken(name, exceptId){
  var n = name.toLowerCase();
  return state.categories.some(function(c){ return c.id !== exceptId && c.name.trim().toLowerCase() === n; }) ||
    [GROUP_FAV, GROUP_NONE, GROUP_PERSONAL, GROUP_SHARED, GROUP_ARCHIVED].some(function(g){
      return groupName(g).toLowerCase() === n;
    });
}

function promptNewCategory(onDone){
  if(categoriesUnavailable()) return;
  showInputModal({
    title: "Nuova categoria",
    label: "Nome della categoria (la vede tutto il team)",
    placeholder: "Es. Bandi, Scuole, Eventi",
    confirmText: "Crea",
    onConfirm: async function(name){
      var n = (name || "").trim();
      if(!n) return;
      if(categoryNameTaken(n)){ notify("C'è già un gruppo con questo nome."); return; }
      var pos = state.categories.reduce(function(m, c){ return Math.max(m, c.position); }, -1) + 1;
      var res = await sb.from("be_categories").insert({ name: n, position: pos }).select("id, name, position").single();
      if(res.error){ notify(errorText(res.error, "Categoria non creata")); return; }
      state.categories.push(res.data);
      renderSidebar();
      if(onDone) onDone(res.data);
    }
  });
}

function promptRenameCategory(cat){
  showInputModal({
    title: "Rinomina categoria",
    label: "Nome della categoria (cambia per tutto il team)",
    value: cat.name,
    confirmText: "Salva",
    onConfirm: async function(name){
      var n = (name || "").trim();
      if(!n || n === cat.name) return;
      if(categoryNameTaken(n, cat.id)){ notify("C'è già un gruppo con questo nome."); return; }
      var res = await sb.from("be_categories").update({ name: n }).eq("id", cat.id);
      if(res.error){ notify(errorText(res.error)); return; }
      cat.name = n;
      render();
    }
  });
}

async function deleteCategory(cat){
  /* Contati su tutte le aree: la categoria esiste al di sopra delle dashboard. */
  var n = state.projects.filter(function(p){ return !p.personal && p.category_id === cat.id; }).length;
  var msg = "Eliminare la categoria «" + cat.name + "» per tutto il team?";
  if(n){
    msg += "\n\n" + (n === 1 ? "Il progetto contenuto non verrà eliminato: finirà"
                             : "I " + n + " progetti contenuti non verranno eliminati: finiranno") +
           " in «" + groupName(GROUP_NONE) + "».";
  }
  if(!confirm(msg)) return;
  var res = await sb.from("be_categories").delete().eq("id", cat.id);
  if(res.error){ notify(errorText(res.error, "Categoria non eliminata")); return; }
  state.categories = state.categories.filter(function(c){ return c.id !== cat.id; });
  state.projects.forEach(function(p){ if(p.category_id === cat.id) p.category_id = null; });
  renderSidebar();
}

/* --- spostamenti, anche in blocco -------------------------------------- */
function plural(n, one, many){ return n + " " + (n === 1 ? one : many); }

/* Una sola update per gruppo di progetti con lo stesso payload. Con
   .select() tornano solo le righe che la RLS ha lasciato cambiare. */
async function updateProjects(ids, payload){
  if(!ids.length) return { ids: [] };
  var res = await sb.from("be_projects").update(payload).in("id", ids).select("id");
  if(res.error) return { error: res.error, ids: [] };
  return { ids: (res.data || []).map(function(r){ return r.id; }) };
}

function applyLocal(ids, payload){
  ids.forEach(function(id){
    var p = projectById(id);
    if(p) Object.keys(payload).forEach(function(k){ p[k] = payload[k]; });
  });
}

function reportSkipped(skipped, what){
  if(!skipped.length) return;
  var names = skipped.slice(0, 3).map(function(p){ return "«" + p.name + "»"; }).join(", ") +
    (skipped.length > 3 ? " e altri " + (skipped.length - 3) : "");
  notify(names + ": " + what);
}

/* target: l'id di una categoria, GROUP_NONE, GROUP_PERSONAL o GROUP_ARCHIVED.
   Spostare in una categoria tira fuori dagli Archiviati. */
async function moveProjects(ids, target){
  if(categoriesUnavailable()) return false;
  var projs = ids.map(projectById).filter(Boolean);
  var ok = [], skipped = [], why;

  if(target === GROUP_ARCHIVED){
    why = "può archiviarli solo chi li vede come progetti del team, o il proprietario.";
    projs.forEach(function(p){
      if(p.archived_at) return;
      (canArchive(p) ? ok : skipped).push(p);
    });
    if(!ok.length){ reportSkipped(skipped, why); return !skipped.length; }
    var stamp = new Date().toISOString();
    var a = await updateProjects(ok.map(function(p){ return p.id; }), { archived_at: stamp });
    if(a.error){ notify(errorText(a.error, "Non sono riuscito ad archiviare")); return false; }
    applyLocal(a.ids, { archived_at: stamp });
    return finishMove(ok, a.ids, skipped, why);
  }

  if(target === GROUP_PERSONAL){
    why = "solo il proprietario può metterlo nel suo Personale.";
    projs.forEach(function(p){
      if(p.personal && !p.archived_at) return;
      (p.isOwner ? ok : skipped).push(p);
    });
    if(!ok.length){ reportSkipped(skipped, why); return !skipped.length; }
    // «Personale» vuol dire solo per me: le condivisioni che il progetto
    // aveva da progetto del team si tolgono (quelle di un Personale
    // archiviato e ripristinato restano)
    var fromTeam = ok.filter(function(p){ return !p.personal; }).map(function(p){ return p.id; });
    var shared = [];
    ok.forEach(function(p){
      if(fromTeam.indexOf(p.id) < 0) return;
      p.shares.forEach(function(uid){
        var n = profileName(uid);
        if(shared.indexOf(n) < 0) shared.push(n);
      });
    });
    if(shared.length && !confirm(
      (ok.length === 1 ? "«" + ok[0].name + "» lo vedrai" : plural(ok.length, "progetto", "progetti") + " li vedrai") +
      " solo tu: tolgo anche le condivisioni con " + shared.join(", ") + ".\n\n" +
      "Potrai ricondividere con chi vuoi dal pulsante Condividi.")) return false;
    var pay = { personal: true, category_id: null, archived_at: null };
    var r = await updateProjects(ok.map(function(p){ return p.id; }), pay);
    if(r.error){ notify(errorText(r.error, "Non sono riuscito a spostare")); return false; }
    applyLocal(r.ids, pay);
    var withShares = r.ids.filter(function(id){ return fromTeam.indexOf(id) >= 0 && projectById(id).shares.length; });
    if(withShares.length){
      var s = await sb.from("be_project_shares").delete().in("project_id", withShares);
      if(s.error) notify(errorText(s.error, "Spostato in Personale, ma le condivisioni sono rimaste"));
      else withShares.forEach(function(id){ projectById(id).shares = []; });
    }
    return finishMove(ok, r.ids, skipped, why);
  }

  // una categoria del team (o nessuna)
  var catId = target === GROUP_NONE ? null : target;
  why = "è nel Personale di un altro: può spostarlo solo il proprietario.";
  projs.forEach(function(p){
    if(!p.personal && !p.archived_at && p.category_id === catId) return;
    (canCategorize(p) ? ok : skipped).push(p);
  });
  if(!ok.length){ reportSkipped(skipped, why); return !skipped.length; }
  var mine   = ok.filter(function(p){ return p.personal; });        // dal mio Personale al team
  var others = ok.filter(function(p){ return !p.personal; });
  var payTeam = { personal: false, category_id: catId, archived_at: null };
  var payCat  = { category_id: catId, archived_at: null };
  var res = await Promise.all([
    updateProjects(mine.map(function(p){ return p.id; }), payTeam),
    updateProjects(others.map(function(p){ return p.id; }), payCat)
  ]);
  var err = res[0].error || res[1].error;
  if(err) notify(errorText(err, "Non sono riuscito a spostare"));
  applyLocal(res[0].ids, payTeam);
  applyLocal(res[1].ids, payCat);
  return finishMove(ok, res[0].ids.concat(res[1].ids), skipped, why) && !err;
}

/* Ripristina dagli Archiviati: il progetto torna nella sua categoria */
async function restoreProjects(ids){
  if(categoriesUnavailable()) return false;
  var ok = [], skipped = [];
  ids.map(projectById).filter(Boolean).forEach(function(p){
    if(!p.archived_at) return;
    (canArchive(p) ? ok : skipped).push(p);
  });
  var why = "può ripristinarlo solo il proprietario.";
  if(!ok.length){ reportSkipped(skipped, why); return !skipped.length; }
  var r = await updateProjects(ok.map(function(p){ return p.id; }), { archived_at: null });
  if(r.error){ notify(errorText(r.error, "Non sono riuscito a ripristinare")); return false; }
  applyLocal(r.ids, { archived_at: null });
  return finishMove(ok, r.ids, skipped, why);
}

/* Quelli che il database non ha cambiato (RLS) contano come saltati */
function finishMove(tried, doneIds, skipped, why){
  tried.forEach(function(p){ if(doneIds.indexOf(p.id) < 0) skipped.push(p); });
  render();
  reportSkipped(skipped, why);
  return !skipped.length;
}

async function setFavorite(ids, on){
  if(categoriesUnavailable()) return false;
  var res;
  if(on){
    ids = ids.filter(function(id){ return !state.favorites[id]; });
    if(!ids.length) return true;
    res = await sb.from("be_project_favorites").upsert(
      ids.map(function(id){ return { user_id: state.me.id, project_id: id }; }),
      { onConflict: "user_id,project_id", ignoreDuplicates: true }
    );
  } else {
    res = await sb.from("be_project_favorites").delete().eq("user_id", state.me.id).in("project_id", ids);
  }
  if(res.error){ notify(errorText(res.error, "Preferiti non aggiornati")); return false; }
  ids.forEach(function(id){
    if(on) state.favorites[id] = true; else delete state.favorites[id];
  });
  renderSidebar();
  return true;
}

function itemButton(cls, html, tip, fn){

  b.className = cls;

  b.setAttribute("aria-label", tip);

function projectTooltip(proj){
  var bits = [proj.name];
  if(!proj.isOwner) bits.push((proj.personal ? "condiviso da " : "di ") + profileName(proj.owner_id));
  if(proj.archived_at) bits.push("archiviato");

}

function buildProjectItem(proj){
  var selecting = state.selecting;
  var picked = !!state.selected[proj.id];
  var item = document.createElement("div");
  item.className = "project-item" +
    (!selecting && state.view === "board" && proj.id === state.activeProjectId ? " active" : "") +
    (selecting ? " selectable" : "") + (picked ? " picked" : "") +
    (proj.archived_at ? " archived" : "");
  item.dataset.projectId = proj.id;

  var ico = document.createElement("div");
  ico.className = selecting ? "project-check" : "project-icon";
  if(!selecting) ico.textContent = projectInitial(proj.name);

  var name = document.createElement("div");
  name.className = "project-name";
  name.textContent = proj.name;
  name.title = projectTooltip(proj);

  item.appendChild(ico);
  item.appendChild(name);

  if(selecting){
    item.setAttribute("role", "checkbox");
    item.setAttribute("aria-checked", picked ? "true" : "false");
    item.addEventListener("click", function(){
      if(picked) delete state.selected[proj.id]; else state.selected[proj.id] = true;
      renderSidebar();
    });
    return item;
  }

  /* Le azioni compaiono sopra la riga al passaggio del mouse, cosi' il
     nome usa tutta la larghezza; su touch restano sempre visibili. */
  var acts = document.createElement("div");
  acts.className = "project-actions";
  item.appendChild(acts);

  if(!state.categoriesError){
    var fav = isFavorite(proj);
    var star = itemButton("project-star" + (fav ? " on" : ""), ICON_STAR,
      fav ? "Togli dai preferiti" : "Aggiungi ai preferiti (solo per te)",
      function(){ setFavorite([proj.id], !fav); });
    star.setAttribute("aria-pressed", fav ? "true" : "false");
    acts.appendChild(star);

    if(canArchive(proj)){
      acts.appendChild(proj.archived_at
        ? itemButton("project-archive", ICON_RESTORE, "Ripristina", function(){ restoreProjects([proj.id]); })
        : itemButton("project-archive", ICON_ARCHIVE, "Archivia", function(){ moveProjects([proj.id], GROUP_ARCHIVED); }));
    }
  }

  // Il trascinamento e' HTML5 DnD, che da un dito non parte mai: su iOS e
  // Android questo bottone e' l'unico modo di spostare un progetto.
  acts.appendChild(itemButton("project-move", ICON_MOVE, "Sposta o archivia",
    function(){ openProjectSheet(proj); }));

  if(proj.isOwner){
    acts.appendChild(itemButton("project-share", ICON_SHARE, "Condividi progetto",
      function(){ openShareModal(proj.id); }));

      });

  return item;
}

/* Dove si lascia un progetto trascinato su un gruppo */
function dropOnGroup(groupId, projectId){
  if(groupId === GROUP_FAV) return setFavorite([projectId], true);

  moveProjects([projectId], groupId);
}

var GROUP_HINTS = {};
GROUP_HINTS[GROUP_FAV]      = "I tuoi preferiti: la stellina la vedi solo tu";
GROUP_HINTS[GROUP_NONE]     = "Progetti del team non ancora in una categoria";
GROUP_HINTS[GROUP_PERSONAL] = "Li vedi solo tu, e chi scegli con Condividi";
GROUP_HINTS[GROUP_SHARED]   = "Progetti personali di altri, condivisi con te";
GROUP_HINTS[GROUP_ARCHIVED] = "Progetti archiviati: non compaiono in Panoramica, scadenze e Chi fa cosa";

/* Un gruppo della colonna di sinistra: una categoria del team o uno dei
   gruppi fissi (Preferiti, Senza categoria, Personale, ...). */
function buildGroup(g){
  var cat = categoryById(g.id);
  var group = document.createElement("div");
  group.className = "label-group" + (isCollapsed(g.id) ? " collapsed" : "") +
    (g.id === GROUP_FAV ? " fav-group" : "") + (g.id === GROUP_ARCHIVED ? " archived-group" : "");
  group.dataset.groupId = g.id;

  var head = document.createElement("div");
  head.className = "label-head";
  head.title = cat ? cat.name + " · categoria del team" : GROUP_HINTS[g.id];

  var caret = document.createElement("span");
  caret.className = "label-caret";
  caret.innerHTML = ICON_CARET;

  var title = document.createElement("span");
  title.className = "label-title";
  title.textContent = g.name;

  var count = document.createElement("span");
  count.className = "label-count";
  count.textContent = g.projects.length;

  head.appendChild(caret);
  if(g.id === GROUP_FAV || g.id === GROUP_PERSONAL){
    var badge = document.createElement("span");
    badge.className = "label-shared";
    badge.innerHTML = g.id === GROUP_FAV ? ICON_STAR : ICON_LOCK;
    head.appendChild(badge);
  }
  head.appendChild(title);
  head.appendChild(count);

  function action(html, tip, danger, fn){
    var b = itemButton("label-btn" + (danger ? " danger" : ""), html, tip, fn);
    head.appendChild(b);
    return b;
  }
  if(!state.selecting){
    if(cat && state.isTeam){
      action(ICON_PLUS,  "Nuovo progetto in «" + cat.name + "»", false, function(){ openNewProjectModal(cat.id); });
      action(ICON_PEN,   "Rinomina categoria", false, function(){ promptRenameCategory(cat); });
      action(ICON_TRASH, "Elimina categoria",  true,  function(){ deleteCategory(cat); });
    } else if(g.id === GROUP_PERSONAL){
      action(ICON_PLUS, "Nuovo progetto personale", false, function(){ openNewProjectModal(GROUP_PERSONAL); });
    }
  }

  head.addEventListener("click", function(){
    toggleCollapsed(g.id);
    group.classList.toggle("collapsed");
  });

  var body = document.createElement("div");
  body.className = "label-body";
  if(g.projects.length){
    g.projects.forEach(function(p){ body.appendChild(buildProjectItem(p)); });
  } else {
    var empty = document.createElement("div");
    empty.className = "label-empty";
    empty.textContent = g.id === GROUP_PERSONAL ? "Qui vanno i progetti che vedi solo tu."
      : (state.isTeam ? "Vuota — trascina qui un progetto o usa +." : "Vuota.");
    body.appendChild(empty);
  }

  group.appendChild(head);
  group.appendChild(body);

  /* destinazione del trascinamento */
  if(g.id !== GROUP_SHARED){
    var dragging = function(e){
      var types = (e.dataTransfer && e.dataTransfer.types)
        ? Array.prototype.slice.call(e.dataTransfer.types) : [];
      return types.indexOf("text/project-id") >= 0;
    };
    group.addEventListener("dragover", function(e){
      if(!dragging(e)) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      group.classList.add("drop-target");
    });
    group.addEventListener("dragleave", function(e){
      if(!group.contains(e.relatedTarget)) group.classList.remove("drop-target");
    });
    group.addEventListener("drop", function(e){
      if(!dragging(e)) return;
      e.preventDefault();
      group.classList.remove("drop-target");
      var pid = e.dataTransfer.getData("text/project-id");
      if(pid) dropOnGroup(g.id, pid);
    });
  }

  return group;
}

/* Barra della selezione multipla: sposta, stellina e archivia in blocco */
function selectedIds(){
  return Object.keys(state.selected).filter(function(id){ return projectById(id); });
}
function endSelection(){
  state.selecting = false;
  state.selected = {};
  renderSidebar();
}
function buildSelectBar(){
  var ids = selectedIds();
  var projs = ids.map(projectById);
  var allFav = projs.length && projs.every(isFavorite);
  var allArchived = projs.length && projs.every(function(p){ return !!p.archived_at; });

  var bar = document.createElement("div");
  bar.className = "select-bar";
  bar.innerHTML =
    '<div class="select-bar-top">' +
      '<span class="select-count"></span>' +
      '<button type="button" class="select-link" data-a="all">Tutti</button>' +
      '<button type="button" class="select-link" data-a="done">Fine</button>' +
    '</div>' +
    '<div class="select-actions">' +
      '<button type="button" class="select-btn" data-a="move">' + ICON_MOVE + '<span>Sposta</span></button>' +
      '<button type="button" class="select-btn" data-a="fav">' + ICON_STAR + '<span>' + (allFav ? "Togli" : "Preferiti") + '</span></button>' +
      '<button type="button" class="select-btn" data-a="archive">' + (allArchived ? ICON_RESTORE : ICON_ARCHIVE) +
        '<span>' + (allArchived ? "Ripristina" : "Archivia") + '</span></button>' +
      '<button type="button" class="select-btn" data-a="share">' + ICON_SHARE + '<span>Condividi</span></button>' +
    '</div>';
  bar.querySelector(".select-count").textContent = ids.length
    ? plural(ids.length, "selezionato", "selezionati") : "Tocca i progetti da selezionare";
  bar.querySelectorAll(".select-btn").forEach(function(b){ b.disabled = !ids.length; });
  // condivide solo chi ha creato il progetto
  var $share = bar.querySelector('[data-a="share"]');
  if(ids.length && !projs.some(function(p){ return p.isOwner; })){
    $share.disabled = true;
    $share.title = "Nessuno di questi progetti è tuo: li condivide solo chi li ha creati";
  }

  bar.addEventListener("click", async function(e){
    var b = e.target.closest("button");
    if(!b || b.disabled) return;
    var a = b.dataset.a;
    if(a === "done") return endSelection();
    if(a === "all"){
      areaProjects().forEach(function(p){ state.selected[p.id] = true; });
      return renderSidebar();
    }
    if(a === "move") return openMoveSheet(ids, function(){ endSelection(); });
    if(a === "share") return openBulkShareModal(ids);
    var ok;
    if(a === "fav") ok = await setFavorite(ids, !allFav);
    else if(allArchived) ok = await restoreProjects(ids);
    else ok = await moveProjects(ids, GROUP_ARCHIVED);
    if(ok) endSelection();
  });
  return bar;
}

function renderSidebar(){
  // ridisegnando, la lista non deve tornare in cima (selezione, stelline)
  var scroll = $projects.scrollTop;
  renderSidebarContent();
  $projects.scrollTop = scroll;
}

function renderSidebarContent(){
  $projects.innerHTML = "";
  $projects.classList.toggle("selecting", state.selecting);

  var visible = areaProjects();

  if(!state.selecting) $projects.appendChild(buildOverviewItem());

  /* Migrazione sql/categorie.sql non ancora eseguita: lista piatta + avviso */
  if(state.categoriesError){
    state.selecting = false;

  projectGroups({ area: state.area, archived: true }).forEach(function(g){
    // le categorie si vedono anche vuote (sono la destinazione del
    // trascinamento), Personale pure; gli altri gruppi solo se servono
    var always = (isCategoryGroup(g.id) && state.isTeam) || g.id === GROUP_PERSONAL;

}

var AREA_LABELS = {
  in_progettazione: "In progettazione",
  in_corso: "In corso",
  amministrazione: "Amministrazione"
};

/* Le scelte "dove va": le categorie del team, Personale e + Nuova categoria */
function categoryChoices(current, allowPersonal){
  var html = "";
  sortedCategories().forEach(function(c){
    var on = current === c.id;
    html += '<button type="button" class="move-opt' + (on ? " current" : "") +
      '" data-kind="cat" data-value="' + c.id + '"' + (on ? " disabled" : "") + '>' +
      escHtml(c.name) + (on ? ' <span class="move-now">attuale</span>' : '') + '</button>';
  });
  if(allowPersonal){
    var onP = current === GROUP_PERSONAL;
    html += '<button type="button" class="move-opt move-personal' + (onP ? " current" : "") +
      '" data-kind="cat" data-value="' + GROUP_PERSONAL + '"' + (onP ? " disabled" : "") + '>' +
      ICON_LOCK + ' Personale' + (onP ? ' <span class="move-now">attuale</span>' : '') + '</button>';
  }
  if(state.isTeam) html += '<button type="button" class="move-opt" data-kind="new-cat">+ Nuova categoria</button>';
  return html;
}

function openSheet(html){
  var backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML = html;
  document.body.appendChild(backdrop);
  function close(){ backdrop.remove(); document.removeEventListener("keydown", onKey); }
  function onKey(e){ if(e.key === "Escape") close(); }
  document.addEventListener("keydown", onKey);
  backdrop.addEventListener("click", function(e){ if(e.target === backdrop) close(); });
  var $c = backdrop.querySelector("#m-close");
  if($c) $c.addEventListener("click", close);
  return { el: backdrop, close: close };
}

/* "Sposta in…" della selezione multipla */
function openMoveSheet(ids, onDone){
  var sheet = openSheet(
    '<div class="modal" role="dialog" aria-label="Sposta progetti">' +
      '<h2>Sposta ' + plural(ids.length, "progetto", "progetti") + '</h2>' +
      '<p class="move-label">Categoria <span class="move-hint">· vale per tutto il team; Personale solo per te</span></p>' +
      '<div class="move-group">' + categoryChoices(null, true) + '</div>' +
      '<div class="actions"><button class="btn-cancel" id="m-close">Annulla</button></div>' +
    '</div>');
  sheet.el.querySelectorAll(".move-opt").forEach(function(b){
    b.addEventListener("click", async function(){
      sheet.close();
      var ok;
      if(b.dataset.kind === "new-cat"){
        return promptNewCategory(async function(c){
          if(await moveProjects(ids, c.id) && onDone) onDone();
        });
      }
      ok = await moveProjects(ids, b.dataset.value);
      if(ok && onDone) onDone();
    });
  });
}

/* Il pannello di un progetto: l'equivalente esplicito del trascinamento
   (che da telefono non esiste), piu' area, preferiti, archivio ed
   eliminazione. L'area di lavoro la cambia solo il proprietario. */
function openProjectSheet(proj){
  var group = projectGroup(proj);
  var current = proj.personal ? GROUP_PERSONAL : (proj.archived_at ? null : proj.category_id);
  var catRows, catHint;
  if(state.categoriesError){
    catRows = "";
  } else if(!canCategorize(proj)){
    catHint = proj.personal
      ? "È nel Personale di " + profileName(proj.owner_id) + ": può spostarlo solo " + profileName(proj.owner_id) + "."
      : "Solo chi è del team sposta i progetti fra le categorie.";
    catRows = '<p class="move-hint">' + escHtml(catHint) + '</p>';
  } else {
    catRows = categoryChoices(current, proj.isOwner);
  }

  var areaRows = "";
  AREAS.forEach(function(a){
    var on = proj.area === a;
    areaRows += '<button type="button" class="move-opt' + (on ? " current" : "") +
      '" data-kind="area" data-value="' + a + '"' + (on || !proj.isOwner ? " disabled" : "") + '>' +
      AREA_LABELS[a] + (on ? ' <span class="move-now">attuale</span>' : '') + '</button>';
  });

  var more = "";
  if(!state.categoriesError){
    var fav = isFavorite(proj);
    more += '<button type="button" class="move-opt" data-kind="fav">' + ICON_STAR + ' ' +
      (fav ? "Togli dai preferiti" : "Aggiungi ai preferiti") + '</button>';
    if(canArchive(proj)){
      more += '<button type="button" class="move-opt" data-kind="archive">' +
        (proj.archived_at ? ICON_RESTORE + ' Ripristina' : ICON_ARCHIVE + ' Archivia') + '</button>';
    }
  }

  var sheet = openSheet(
    '<div class="modal" role="dialog" aria-label="Sposta progetto">' +
      '<h2>&laquo;' + escHtml(proj.name) + '&raquo;</h2>' +
      (proj.archived_at ? '<p class="move-hint move-note">Archiviato. Sceglierne la categoria lo ripristina.</p>' : '') +
      (catRows
        ? '<p class="move-label">Categoria <span class="move-hint">· ' +
          (group === GROUP_SHARED ? "decide " + escHtml(profileName(proj.owner_id))
                                  : "vale per tutto il team" + (proj.isOwner ? "; Personale solo per te" : "")) +
          '</span></p>' +
          '<div class="move-group">' + catRows + '</div>'
        : '') +
      '<p class="move-label">Area di lavoro' +
        (proj.isOwner ? '' : ' <span class="move-hint">· la cambia ' + escHtml(profileName(proj.owner_id)) + '</span>') +
      '</p>' +
      '<div class="move-group">' + areaRows + '</div>' +
      (more ? '<div class="move-group">' + more + '</div>' : '') +
      '<div class="actions"><button class="btn-cancel" id="m-close">Chiudi</button></div>' +
    '</div>');

  sheet.el.querySelectorAll(".move-opt").forEach(function(b){
    b.addEventListener("click", function(){
      sheet.close();
      var k = b.dataset.kind;
      if(k === "cat") moveProjects([proj.id], b.dataset.value);
      else if(k === "new-cat") promptNewCategory(function(c){ moveProjects([proj.id], c.id); });
      else if(k === "area") moveProjectToArea(proj.id, b.dataset.value);
      else if(k === "fav") setFavorite([proj.id], !isFavorite(proj));
      else if(k === "archive") proj.archived_at ? restoreProjects([proj.id]) : moveProjects([proj.id], GROUP_ARCHIVED);
    });
  });
}

/* Aggiorna una colonna sola di be_projects, in modo ottimistico: se la
   scrittura fallisce si torna al valore precedente invece di lasciare la UI
   con una modifica mai salvata. */
async function updateProjectField(projectId, field, value){
  var proj = state.projects.find(function(p){ return p.id === projectId; });
  if(!proj || proj[field] === value) return;
  if(!proj.isOwner){
    notify("Solo " + profileName(proj.owner_id) + " (proprietario) pu\u00F2 spostare questo progetto.");
    return;
  }
  var previous = proj[field];
  proj[field] = value;
  if(field === "area") state.area = value;
  syncActiveProject();
  render();

  var payload = {};
  payload[field] = value;
  var res = await sb.from("be_projects").update(payload).eq("id", projectId);
  if(res.error){
    proj[field] = previous;
    syncActiveProject();
    render();
    notify(errorText(res.error, "Non sono riuscito a spostare il progetto"));
  }
}

function moveProjectToArea(projectId, area){
  return updateProjectField(projectId, "area", area);
}

function openShareModal(projectId){
  var proj = state.projects.find(function(p){ return p.id === projectId; });
  if(!proj) return;
  var others = state.profiles.filter(function(p){ return p.id !== state.me.id; });
  /* Un progetto del team lo vede gia' tutto il team: qui si aggiunge
     solo chi e' da fuori. Il Personale si apre persona per persona. */
  var teamProject = !proj.personal && state.teamIds.length;
  if(teamProject) others = others.filter(function(p){ return state.teamIds.indexOf(p.id) < 0; });
  var note = teamProject
    ? "È un progetto del team: lo vede già tutto il team. Qui puoi aprirlo anche a chi è da fuori."
    : (proj.personal && !state.categoriesError ? "È nel tuo Personale: lo vede solo chi scegli qui." : "");

  var backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML =
    '<div class="modal" role="dialog">' +
      '<h2>Condividi &laquo;' + proj.name.replace(/</g,"&lt;") + '&raquo;</h2>' +
      (note ? '<p class="move-hint move-note">' + note + '</p>' : '') +
      (others.length ? '' : '<p class="move-hint move-note">Non c\'è nessun altro con cui condividerlo.</p>') +
      '<div class="share-list" id="share-list"></div>' +
      '<div class="actions">' +
        '<button class="btn-cancel" id="m-close">Chiudi</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(backdrop);

  var $list = backdrop.querySelector("#share-list");
  others.forEach(function(p){
    var row = document.createElement("div");
    var checked = proj.shares.indexOf(p.id) >= 0;
    row.className = "share-row" + (checked ? " checked" : "");
    row.innerHTML = '<div class="cal-cb"></div><div class="share-row-name">' + p.display_name + '</div>';
    row.addEventListener("click", function(){
      toggleShare(proj, p.id, !row.classList.contains("checked"), row);
    });
    $list.appendChild(row);
  });

  function close(){ backdrop.remove(); }
  backdrop.addEventListener("click", function(e){ if(e.target === backdrop) close(); });
  backdrop.querySelector("#m-close").addEventListener("click", close);
}

/* Condividere piu' progetti insieme. Si tocca una persona e la si aggiunge a
   tutti i progetti scelti (o la si toglie da tutti, se c'era gia' ovunque).
   Vale solo per i progetti propri; chi e' del team vede gia' quelli del team. */
function openBulkShareModal(ids){
  var projs = ids.map(projectById).filter(function(p){ return p && p.isOwner; });
  var skipped = ids.length - projs.length;
  if(!projs.length) return;
  var isTeamMember = function(uid){ return state.teamIds.indexOf(uid) >= 0; };
  function seesIt(p, uid){
    return p.shares.indexOf(uid) >= 0 || (!p.personal && state.teamIds.length && isTeamMember(uid));
  }
  // se sono tutti del team, servono solo le persone da fuori
  var allTeam = state.teamIds.length && projs.every(function(p){ return !p.personal; });
  var others = state.profiles.filter(function(p){
    return p.id !== state.me.id && !(allTeam && isTeamMember(p.id));
  });
  var notes = [];
  if(allTeam) notes.push("Sono progetti del team: li vede già tutto il team. Qui puoi aprirli anche a chi è da fuori.");
  else notes.push("Tocca una persona per aggiungerla a tutti i " + projs.length + " progetti; toccala di nuovo per toglierla da tutti.");
  if(skipped) notes.push(skipped === 1
    ? "1 progetto non è tuo: lo condivide solo chi l'ha creato, quindi resta com'è."
    : skipped + " progetti non sono tuoi: li condivide solo chi li ha creati, quindi restano come sono.");

  var backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML =
    '<div class="modal" role="dialog">' +
      '<h2>Condividi ' + plural(projs.length, "progetto", "progetti") + '</h2>' +
      notes.map(function(n){ return '<p class="move-hint move-note">' + escHtml(n) + '</p>'; }).join("") +
      (others.length ? '' : '<p class="move-hint move-note">Non c\'è nessun altro con cui condividerli.</p>') +
      '<div class="share-list" id="share-list"></div>' +
      '<div class="actions">' +
        '<button class="btn-cancel" id="m-close">Fine</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(backdrop);

  var $list = backdrop.querySelector("#share-list");
  function paint(row, uid){
    var n = projs.filter(function(p){ return seesIt(p, uid); }).length;
    row.classList.toggle("checked", n === projs.length);
    row.classList.toggle("mixed", n > 0 && n < projs.length);
    row.querySelector(".share-row-sub").textContent =
      n > 0 && n < projs.length ? n + " su " + projs.length : "";
  }
  others.forEach(function(p){
    var row = document.createElement("div");
    row.className = "share-row";
    row.innerHTML = '<div class="cal-cb"></div><div class="share-row-name"></div><span class="share-row-sub"></span>';
    row.querySelector(".share-row-name").textContent = p.display_name;
    paint(row, p.id);
    row.addEventListener("click", async function(){
      row.style.pointerEvents = "none";
      await shareMany(projs, p.id, !row.classList.contains("checked"));
      row.style.pointerEvents = "";
      paint(row, p.id);
    });
    $list.appendChild(row);
  });

  function close(){ backdrop.remove(); endSelection(); }
  backdrop.addEventListener("click", function(e){ if(e.target === backdrop) close(); });
  backdrop.querySelector("#m-close").addEventListener("click", close);
}

async function shareMany(projs, userId, add){
  var res;
  if(add){
    var todo = projs.filter(function(p){
      return p.shares.indexOf(userId) < 0 && !(!p.personal && state.teamIds.indexOf(userId) >= 0);
    });
    if(!todo.length) return;
    res = await sb.from("be_project_shares")
      .insert(todo.map(function(p){ return { project_id: p.id, user_id: userId }; }));
    if(res.error){ notify(errorText(res.error)); return; }
    todo.forEach(function(p){ p.shares.push(userId); });
  } else {
    var had = projs.filter(function(p){ return p.shares.indexOf(userId) >= 0; });
    if(!had.length) return;
    res = await sb.from("be_project_shares").delete()
      .eq("user_id", userId).in("project_id", had.map(function(p){ return p.id; }));
    if(res.error){ notify(errorText(res.error)); return; }
    had.forEach(function(p){
      p.shares = p.shares.filter(function(id){ return id !== userId; });
    });
  }
}

async function toggleShare(proj, userId, add, $row){
  $row.style.pointerEvents = "none";
  var res;
  if(add){
    res = await sb.from("be_project_shares").insert({ project_id: proj.id, user_id: userId });
  } else {
    res = await sb.from("be_project_shares").delete().eq("project_id", proj.id).eq("user_id", userId);
  }
  $row.style.pointerEvents = "";
  if(res.error){ notify(errorText(res.error)); return; }
  if(add){
    proj.shares.push(userId);
    $row.classList.add("checked");
  } else {
    proj.shares = proj.shares.filter(function(id){ return id !== userId; });
    $row.classList.remove("checked");
  }
}

  if(!proj.isOwner) title.title = "Solo " + profileName(proj.owner_id) + " (proprietario) può rinominare questo progetto";
  if(proj.isOwner){
    title.addEventListener("change", async function(){
      var v = title.value.trim();
      if(!v){ title.value = proj.name; return; }
      var res = await sb.from("be_projects").update({ name: v }).eq("id", proj.id);
      if(res.error){ notify(errorText(res.error)); title.value = proj.name; return; }
      proj.name = v;
      renderSidebar();
    });
    title.addEventListener("keydown", function(e){
      if(e.key === "Enter"){ e.preventDefault(); title.blur(); }
    });
  }
  var meta = document.createElement("span");
  meta.className = "board-meta";
  var totalCards = cols.reduce(function(sum,col){ return sum + col.cards.length; }, 0);
  var docCount = libraryItems(proj.id).length;
  meta.textContent = totalCards + " card · " + (cols.length + 1) + " liste · " + docCount +
    (docCount === 1 ? " elemento in Archivio" : " elementi in Archivio") +
    (proj.isOwner ? "" : (proj.personal ? " · condiviso da " : " · di ") + profileName(proj.owner_id)) +
    (proj.archived_at ? " · archiviato" : "");
  header.appendChild(title);
  header.appendChild(meta);
  $board.appendChild(header);

  if(state.cardDatesError){
    var $warn = document.createElement("div");
    $warn.className = "board-warning";
    $warn.textContent = "Scadenze e date di completamento non attive: " + state.cardDatesError +
      " — esegui sql/scadenza.sql sul database Supabase.";
    $board.appendChild($warn);
  }

  // Columns
  var content = document.createElement("div");
  content.className = "board-content";

  var doneColId = doneColumnId(proj);

  cols.forEach(function(col){
    var isDoneCol = col.id === doneColId;
    var $col = document.createElement("section");
    $col.className = "column";
    $col.dataset.columnId = col.id;

    var $head = document.createElement("div");
    $head.className = "column-header";
    var $t = document.createElement("div");
    $t.className = "column-title";
    var cnt = col.cards.length;
    $t.innerHTML = '<span>' + col.name + '</span><span class="column-count">' + cnt + '</span>';
    $head.appendChild($t);
    $col.appendChild($head);

    var $cards = document.createElement("div");
    $cards.className = "cards";
    $cards.dataset.columnId = col.id;
    col.cards.slice().sort(function(a,b){ return a.position - b.position; }).forEach(function(card){
      $cards.appendChild(buildCardEl(card, col.id, isDoneCol));
    });
    $col.appendChild($cards);

    var $add = document.createElement("button");
    $add.className = "add-card";
    $add.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Aggiungi una carta';
    $add.addEventListener("click", function(){
      openAddCardForm($col, col.id, isDoneCol);
    });
    $col.appendChild($add);

    // drop zone events on the whole column
    $col.addEventListener("dragover", function(e){
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      $col.classList.add("drag-over");
    });
    $col.addEventListener("dragleave", function(e){
      if(e.target === $col || !$col.contains(e.relatedTarget)){
        $col.classList.remove("drag-over");
      }
    });
    $col.addEventListener("drop", function(e){
      e.preventDefault();
      $col.classList.remove("drag-over");
      var cardId = e.dataTransfer.getData("text/card-id");
      var fromCol = e.dataTransfer.getData("text/from-col");
      if(!cardId) return;

      // figure out drop position relative to the cards in this column
      var afterEl = getDragAfterElement($cards, e.clientY);
      moveCard(cardId, fromCol, col.id, afterEl ? afterEl.dataset.cardId : null);
    });

    content.appendChild($col);
  });

  content.appendChild(buildLibraryColumn(proj));

  $board.appendChild(content);
  renderAlerts();
}

/* =====================================================================
 * Panoramica: To Do / In Progress / Done di tutti i progetti
 * ===================================================================== */
var OVERVIEW_LISTS = [
  { key: "todo",  label: "To Do" },
  { key: "doing", label: "In Progress" },
  { key: "done",  label: "Done" }
];

var NO_ASSIGNEE = "__none__";

/* Filtro per persona: le sue card, oppure quelle senza destinatari */
function matchesPerson(card, person){
  if(!person || state.assigneesError) return true;
  var ids = card.assignees || [];
  return person === NO_ASSIGNEE ? !ids.length : ids.indexOf(person) >= 0;
}

/* Le card di ogni progetto vengono raggruppate nelle tre voci standard:
   l'ultima lista (o quella chiamata Done) e' "done", la prima delle altre
   e' "todo", le rimanenti "doing". */
function overviewEntries(){
  var out = { todo: [], doing: [], done: [] };
  var filter = state.overviewFilter;

  liveAreaProjects().forEach(function(proj){
    if(filter.projectId && proj.id !== filter.projectId) return;
    var cols = proj.columns.slice().sort(function(a,b){ return a.position - b.position; });
    var doneId = doneColumnId(proj);
    var workIndex = 0;
    cols.forEach(function(col){
      var key;
      if(col.id === doneId){ key = "done"; }
      else { key = workIndex === 0 ? "todo" : "doing"; workIndex++; }
      col.cards.slice().sort(function(a,b){ return a.position - b.position; }).forEach(function(card){
        var date = key === "done" ? card.done_at : (card.due_date || card.start_date);
        if(filter.onlyDue && !date) return;
        if(!matchesPerson(card, filter.person)) return;
        out[key].push({ card: card, proj: proj, col: col, key: key, isDone: key === "done", date: date });
      });
    });
  });

  Object.keys(out).forEach(function(key){
    var recentFirst = key === "done";
    out[key].sort(function(a,b){
      if(a.date && b.date){
        if(a.date === b.date) return a.proj.name.localeCompare(b.proj.name);
        if(recentFirst) return a.date < b.date ? 1 : -1;
        return a.date < b.date ? -1 : 1;
      }
      if(a.date) return -1;
      if(b.date) return 1;
      return a.proj.name.localeCompare(b.proj.name);
    });
  });

  return out;
}

function buildCardEl(card, columnId, isDoneCol, ctx){
  ctx = ctx || {};
  var proj = ctx.proj || getActiveProject();
  var isStatic = ctx.showProject === true;

  var $card = document.createElement("article");
  $card.className = "card" + (isStatic ? " static" : "");
  $card.draggable = !isStatic;
  $card.dataset.cardId = card.id;
  $card.dataset.columnId = columnId;

  if(isStatic && (ctx.statusLabel || proj)){
    var $pj = document.createElement("div");
    $pj.className = "card-project";
    $pj.textContent = ctx.statusLabel || proj.name;
    $pj.title = ctx.statusLabel ? "Lista: " + ctx.statusLabel : proj.name;
    $card.appendChild($pj);
  }

  if(card.priority){
    var $p = document.createElement("span");
    $p.className = "card-priority " + card.priority;
    $card.appendChild($p);
  }

  var $t = document.createElement("div");
  $t.className = "card-title";
  $t.textContent = card.title;
  $card.appendChild($t);

  var dateValue = isDoneCol ? card.done_at : (card.due_date || card.start_date);
  var people = state.assigneesError ? [] : (card.assignees || []);
  if((!state.cardDatesError && dateValue) || people.length){
    var $badges = document.createElement("div");
    $badges.className = "card-badges";
    if(!state.cardDatesError && dateValue){
      $badges.appendChild(isDoneCol ? buildDateBadge(card.done_at, true)
                                    : buildTaskDateBadge(card.start_date, card.due_date));
    }
    if(people.length) $badges.appendChild(buildAssigneeAvatars(people));
    $card.appendChild($badges);
  }

  var $actions = document.createElement("div");
  $actions.className = "card-actions";
  var $del = document.createElement("button");
  $del.className = "card-action";
  $del.title = "Elimina";
  $del.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
  $del.addEventListener("click", function(e){
    e.stopPropagation();
    deleteCard(card.id, columnId, proj);
  });
  $actions.appendChild($del);
  $card.appendChild($actions);

  // edit on click
  $card.addEventListener("click", function(e){
    if(e.target.closest(".card-action")) return;
    openEditCardModal(card.id, columnId, isDoneCol, proj);
  });

  // dragging (nella Panoramica le card non si trascinano)
  if(!isStatic){
    $card.addEventListener("dragstart", function(e){
      $card.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/card-id", card.id);
      e.dataTransfer.setData("text/from-col", columnId);
    });
    $card.addEventListener("dragend", function(){
      $card.classList.remove("dragging");
      document.querySelectorAll(".column.drag-over").forEach(function(c){ c.classList.remove("drag-over"); });
    });
  }

  return $card;
}

function getDragAfterElement(container, y){
  var els = Array.prototype.slice.call(container.querySelectorAll(".card:not(.dragging)"));
  var closest = null, closestOffset = -Infinity;
  for(var i=0;i<els.length;i++){
    var box = els[i].getBoundingClientRect();
    var offset = y - box.top - box.height / 2;
    if(offset < 0 && offset > closestOffset){
      closestOffset = offset;
      closest = els[i];
    }
  }
  return closest;
}

/* =====================================================================
 * Mutations
 * ===================================================================== */
async function moveCard(cardId, fromColId, toColId, beforeCardId, projArg){
  var proj = projArg || getActiveProject(); if(!proj) return;
  var fromCol = proj.columns.find(function(c){ return c.id === fromColId; });
  var toCol = proj.columns.find(function(c){ return c.id === toColId; });
  if(!fromCol || !toCol) return;
  var idx = fromCol.cards.findIndex(function(c){ return c.id === cardId; });
  if(idx < 0) return;

  // Fotografia dello stato prima dello spostamento ottimistico: se la
  // scrittura fallisce (tipicamente offline) si ripristina in locale, senza
  // ricaricare da un server che tanto non risponde.
  var snapshot = {
    from: fromCol.cards.slice(),
    to: toCol.cards.slice(),
    positions: proj.columns.reduce(function(acc, c){
      c.cards.forEach(function(k){ acc[k.id] = k.position; });
      return acc;
    }, {}),
    doneAt: fromCol.cards[idx].done_at
  };

  var card = fromCol.cards.splice(idx,1)[0];
  if(beforeCardId){
    var bIdx = toCol.cards.findIndex(function(c){ return c.id === beforeCardId; });
    if(bIdx >= 0){ toCol.cards.splice(bIdx, 0, card); }
    else toCol.cards.push(card);
  } else {
    toCol.cards.push(card);
  }

  var doneColId = doneColumnId(proj);
  var doneChanged = false;
  if(!state.cardDatesError && fromCol.id !== toCol.id){
    if(toCol.id === doneColId && !card.done_at){
      card.done_at = todayISO();
      doneChanged = true;
    } else if(fromCol.id === doneColId && card.done_at){
      card.done_at = null;
      doneChanged = true;
    }
  }
  renderBoard();

  var updates = [];
  if(fromCol.id !== toCol.id){
    fromCol.cards.forEach(function(c, i){
      c.position = i;
      updates.push(sb.from("be_cards").update({ position: i }).eq("id", c.id));
    });
  }
  toCol.cards.forEach(function(c, i){
    c.position = i;
    var payload = { position: i };
    if(c.id === cardId && fromCol.id !== toCol.id) payload.column_id = toColId;
    if(c.id === cardId && doneChanged) payload.done_at = card.done_at;
    updates.push(sb.from("be_cards").update(payload).eq("id", c.id));
  });
  var results = await Promise.all(updates);
  var failed = results.find(function(r){ return r.error; });
  if(failed){
    // Rollback locale: la card torna dov'era, cosi' la board non mostra
    // uno spostamento che sul server non e' mai avvenuto.
    fromCol.cards = snapshot.from;
    toCol.cards = snapshot.to;
    card.done_at = snapshot.doneAt;
    proj.columns.forEach(function(c){
      c.cards.forEach(function(k){
        if(snapshot.positions[k.id] !== undefined) k.position = snapshot.positions[k.id];
      });
    });
    renderBoard();
    notify(errorText(failed.error, "Spostamento non salvato"));
  }
}

async function deleteCard(cardId, columnId, projArg){
  var proj = projArg || getActiveProject(); if(!proj) return;
  var col = proj.columns.find(function(c){ return c.id === columnId; });
  if(!col) return;
  var res = await sb.from("be_cards").delete().eq("id", cardId);
  if(res.error){ notify(errorText(res.error)); return; }
  col.cards = col.cards.filter(function(c){ return c.id !== cardId; });
  renderBoard();
}

/* dateValue: la data di completamento nella lista Done, altrimenti { start, due } */
async function addCard(columnId, title, priority, dateValue, isDoneCol, assigneeIds){
  var proj = getActiveProject(); if(!proj) return;
  var col = proj.columns.find(function(c){ return c.id === columnId; });
  if(!col) return;
  var payload = {
    project_id: proj.id,
    column_id: columnId,
    title: title.trim(),
    priority: priority || null,
    position: col.cards.length,
    created_by: state.me.id
  };
  if(!state.cardDatesError){
    var dates = isDoneCol ? { start: null, due: null } : (dateValue || {});
    payload.due_date = dates.due || null;
    if(!state.startDateError) payload.start_date = dates.start || null;
    payload.done_at  = isDoneCol ? (dateValue || null) : null;
  }
  var res = await sb.from("be_cards").insert(payload).select().single();
  if(res.error){ notify(errorText(res.error)); return; }
  var card = {
    id: res.data.id, title: res.data.title, priority: res.data.priority, position: res.data.position,
    start_date: res.data.start_date || null, due_date: res.data.due_date || null, done_at: res.data.done_at || null,
    assignees: []
  };
  col.cards.push(card);
  renderBoard();
  if(assigneeIds && assigneeIds.length && !state.assigneesError) saveAssignees(card, assigneeIds);
}

async function updateCard(cardId, columnId, title, priority, dateValue, isDoneCol, projArg){
  var proj = projArg || getActiveProject(); if(!proj) return;
  var col = proj.columns.find(function(c){ return c.id === columnId; });
  if(!col) return;
  var card = col.cards.find(function(c){ return c.id === cardId; });
  if(!card) return;
  var payload = { title: title.trim(), priority: priority || null };
  if(!state.cardDatesError){
    if(isDoneCol) payload.done_at = dateValue || null;
    else {
      payload.due_date = (dateValue && dateValue.due) || null;
      if(!state.startDateError) payload.start_date = (dateValue && dateValue.start) || null;
    }
  }
  var res = await sb.from("be_cards").update(payload).eq("id", cardId);
  if(res.error){ notify(errorText(res.error)); return; }
  card.title = payload.title;
  card.priority = payload.priority;
  if(!state.cardDatesError){
    if(isDoneCol) card.done_at = payload.done_at;
    else {
      card.due_date = payload.due_date;
      if(!state.startDateError) card.start_date = payload.start_date;
    }
  }
  renderBoard();
}

/* Lo elimina chi l'ha creato; un progetto del team anche il coordinatore */
function canDelete(p){
  return p.isOwner || (!p.personal && !!state.isCoordinator);
}

/* Prima di eliminare: se il progetto ha schede, Archivio o impegni in
   «Chi fa cosa», si sceglie a quale progetto passarli (be_delete_project). */
async function deleteProject(projectId){
  var proj = projectById(projectId);
  if(!proj) return;
  var cards = proj.columns.reduce(function(n, c){ return n + c.cards.length; }, 0);
  var items = (state.library[projectId] || []).length;
  var ev = await sb.from("be_cal_events").select("id", { count: "exact", head: true }).eq("project_id", projectId);
  var events = ev.error ? 0 : (ev.count || 0);
  if(!cards && !items && !events) return deleteEmptyProject(proj);
  openDeleteMoveSheet(proj, { cards: cards, items: items, events: events });
}

async function deleteEmptyProject(proj){
  if(!confirm("Eliminare definitivamente «" + proj.name + "»? Non ha schede, elementi in Archivio né impegni.")) return;
  var res = await sb.from("be_projects").delete().eq("id", proj.id).select("id");
  if(res.error){ notify(errorText(res.error)); return; }
  if(!res.data || !res.data.length){ notify("Non puoi eliminare questo progetto."); return; }
  forgetProject(proj.id);
  render();
}

function forgetProject(projectId){
  delete state.library[projectId];
  delete state.favorites[projectId];
  delete state.selected[projectId];
  state.projects = state.projects.filter(function(p){ return p.id !== projectId; });
  syncActiveProject();
}

/* I progetti dove si possono passare le cose: per categoria, Archiviati esclusi */
function targetOptions(excludeId){
  var html = '<option value="">— Scegli il progetto —</option>';
  projectGroups({ sort: true }).forEach(function(g){
    if(g.id === GROUP_FAV) return;
    var list = g.projects.filter(function(p){ return p.id !== excludeId; });
    if(!list.length) return;
    html += '<optgroup label="' + escHtml(g.name) + '">' +
      list.map(function(p){ return '<option value="' + p.id + '">' + escHtml(p.name) + '</option>'; }).join("") +
      '</optgroup>';
  });
  return html;
}

/* Al coordinatore, all'apertura: i progetti del team creati da altri che non
   ha ancora visto. Conferma la categoria o la cambia; «Più tardi» li ripropone. */
function checkNewProjects(){
  if(!state.isCoordinator || state.categoriesError) return;
  var list = state.projects.filter(function(p){
    return p.reviewed_at === null && !p.personal && !p.archived_at && !p.isOwner;
  });
  if(!list.length) return;
  var catOpts = function(cur){
    return '<option value="">Senza categoria</option>' + sortedCategories().map(function(c){
      return '<option value="' + c.id + '"' + (c.id === cur ? " selected" : "") + '>' + escHtml(c.name) + '</option>';
    }).join("");
  };
  var sheet = openSheet(
    '<div class="modal np-review" role="dialog" aria-label="Progetti nuovi">' +
      '<h2>' + (list.length === 1 ? "Un progetto nuovo" : list.length + " progetti nuovi") + '</h2>' +
      '<p class="move-hint move-note">Creati dal team dopo il tuo ultimo controllo. Conferma la categoria o cambiala.</p>' +
      '<div class="np-review-list" id="nr-list"></div>' +
      '<div class="actions">' +
        '<button class="btn-cancel" id="m-close">Più tardi</button>' +
        '<button class="btn-primary" id="nr-all">Conferma tutti</button>' +
      '</div>' +
    '</div>');
  var $list = sheet.el.querySelector("#nr-list");
  list.forEach(function(p){
    var row = document.createElement("div");
    row.className = "np-review-row";
    row.dataset.id = p.id;
    var when = p.created_at ? new Date(p.created_at).toLocaleDateString("it-IT", { day: "numeric", month: "short" }) : "";
    row.innerHTML =
      '<div class="np-review-name"><b></b><span></span></div>' +
      '<select class="col-select" aria-label="Categoria">' + catOpts(p.category_id) + '</select>' +
      '<button type="button" class="btn-primary">Conferma</button>';
    row.querySelector("b").textContent = p.name;
    row.querySelector("span").textContent = "di " + profileName(p.owner_id) +
      (when ? " · " + when : "") + " · " + (AREA_LABELS[p.area] || "");
    row.querySelector("button").addEventListener("click", function(){ confirmRows([row]); });
    $list.appendChild(row);
  });
  sheet.el.querySelector("#nr-all").addEventListener("click", function(){
    confirmRows([].slice.call($list.querySelectorAll(".np-review-row")));
  });
  async function confirmRows(rows){
    var stamp = new Date().toISOString();
    for(var i = 0; i < rows.length; i++){
      var row = rows[i], p = projectById(row.dataset.id);
      var cat = row.querySelector("select").value || null;
      row.querySelectorAll("button, select").forEach(function(x){ x.disabled = true; });
      var res = await sb.from("be_projects").update({ category_id: cat, reviewed_at: stamp }).eq("id", p.id);
      if(res.error){
        row.querySelectorAll("button, select").forEach(function(x){ x.disabled = false; });
        notify(errorText(res.error));
        return;
      }
      p.category_id = cat;
      p.reviewed_at = stamp;
      row.remove();
    }
    renderSidebar();
    if(!$list.children.length) sheet.close();
  }
}

/* Un progetto nuovo e' del team, nella categoria scelta; in «Personale»
   lo vede solo chi lo crea. groupId facoltativo: la scelta di partenza
   (il + di una categoria o di Personale). */
function openNewProjectModal(groupId){
  var withCats = !state.categoriesError && state.isTeam;
  var choice = withCats && (isCategoryGroup(groupId) || groupId === GROUP_PERSONAL) ? groupId : null;
  if(!withCats && !state.categoriesError) choice = GROUP_PERSONAL;   // chi e' fuori dal team

  var sheet = openSheet(
    '<div class="modal" role="dialog" aria-label="Nuovo progetto">' +
      '<h2>Nuovo progetto</h2>' +
      '<label for="np-name">Nome del progetto</label>' +
      '<input type="text" id="np-name" placeholder="Es. Sito istituzionale" maxlength="120">' +
      (withCats
        ? '<label>Categoria</label>' +
          '<div class="move-group np-cats">' + categoryChoices(null, true) + '</div>' +
          '<p class="np-hint" id="np-hint"></p>'
        : '') +
      '<p class="cm-error" id="np-error" role="alert"></p>' +
      '<div class="actions">' +
        '<button class="btn-cancel" id="m-close">Annulla</button>' +
        '<button class="btn-primary" id="np-ok">Crea</button>' +
      '</div>' +
    '</div>');
  var el = sheet.el;
  var $name = el.querySelector("#np-name"), $err = el.querySelector("#np-error");

  function sync(){
    el.querySelectorAll('.np-cats .move-opt[data-kind="cat"]').forEach(function(b){
      b.disabled = false;
      b.classList.toggle("on", b.dataset.value === choice);
      b.setAttribute("aria-pressed", b.dataset.value === choice ? "true" : "false");
    });
    var $hint = el.querySelector("#np-hint");
    if($hint) $hint.textContent = !choice ? "Scegli dove metterlo."
      : choice === GROUP_PERSONAL ? "Lo vedrai solo tu: potrai condividerlo con singole persone."
      : "Lo vedrà tutto il team, in «" + groupName(choice) + "».";
  }
  el.querySelectorAll(".np-cats .move-opt").forEach(function(b){
    b.addEventListener("click", function(){
      if(b.dataset.kind === "new-cat"){
        return promptNewCategory(function(c){
          var $n = document.createElement("button");
          $n.type = "button";
          $n.className = "move-opt";
          $n.dataset.kind = "cat";
          $n.dataset.value = c.id;
          $n.textContent = c.name;
          $n.addEventListener("click", function(){ choice = c.id; sync(); });
          b.parentNode.insertBefore($n, el.querySelector('.np-cats [data-value="' + GROUP_PERSONAL + '"]'));
          choice = c.id;
          sync();
        });
      }
      choice = b.dataset.value;
      sync();
    });
  });
  sync();
  setTimeout(function(){ $name.focus(); }, 0);

  var busy = false;
  async function create(){
    if(busy) return;
    var n = $name.value.trim();
    if(!n){ $err.textContent = "Scrivi il nome del progetto."; $name.focus(); return; }
    if(withCats && !choice){ $err.textContent = "Scegli la categoria, oppure Personale."; return; }
    busy = true;
    var row = { owner_id: state.me.id, name: n, area: state.area };
    if(!state.categoriesError){
      row.personal = choice === GROUP_PERSONAL;
      row.category_id = row.personal ? null : choice;
    }
    var pRes = await sb.from("be_projects").insert(row).select().single();
    busy = false;
    if(pRes.error){ $err.textContent = errorText(pRes.error, "Progetto non creato"); return; }
    sheet.close();
    var project = pRes.data;
    var colsPayload = DEFAULT_COLUMNS.map(function(colName, i){
      return { project_id: project.id, name: colName, position: i };
    });
    var cRes = await sb.from("be_columns").insert(colsPayload).select();
    if(cRes.error){ notify(errorText(cRes.error, "Colonne non create")); }
    var columns = (cRes.data || []).map(function(c){
      return { id: c.id, name: c.name, position: c.position, cards: [] };
    });
    state.projects.push({
      id: project.id, name: project.name, owner_id: project.owner_id,
      area: normalizeArea(project.area),
      personal: project.personal === undefined ? !state.isTeam : !!project.personal,
      category_id: project.category_id || null,
      archived_at: null,
      isOwner: true, shares: [], columns: columns
    });
    state.activeProjectId = project.id;
    state.view = "board";
    render();
  }
  el.querySelector("#np-ok").addEventListener("click", create);
  $name.addEventListener("keydown", function(e){
    if(e.key === "Enter"){ e.preventDefault(); create(); }
  });
}

}

function openEditCardModal(cardId, columnId, isDoneCol, projArg){
  var proj = projArg || getActiveProject(); if(!proj) return;
  var col = proj.columns.find(function(c){ return c.id === columnId; });

  backdrop.innerHTML =
    '<div class="modal" role="dialog">' +

      '<label>Priorità</label>' +
      '<div class="priority-row" style="margin-bottom:14px">' +

      '<select id="m-col" class="col-select"></select>' +
      '<div class="actions">' +
        '<button class="btn-cancel" id="m-cancel">Annulla</button>' +
        '<button class="btn-primary" id="m-save">Salva</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(backdrop);

  // Da telefono il drag non parte: senza questo selettore una card non si
  // puo' proprio spostare di lista.
  var $col = backdrop.querySelector("#m-col");
  proj.columns.slice().sort(function(a,b){ return a.position - b.position; })
    .forEach(function(c){
      var o = document.createElement("option");
      o.value = c.id;
      o.textContent = c.name;
      if(c.id === columnId) o.selected = true;
      $col.appendChild(o);
    });

  var $ta = backdrop.querySelector("#m-title");
  $ta.value = card.title;
  setTimeout(function(){ $ta.focus(); $ta.select(); }, 0);

  var $dateField = null;
  var $slot = backdrop.querySelector("#m-date-slot");
  if(state.cardDatesError){
    $slot.remove();
  } else {
    var lab = document.createElement("label");
    lab.textContent = isDoneCol ? "Completata il" : (state.startDateError ? "Scadenza" : "Date");
    $slot.appendChild(lab);
    $dateField = isDoneCol ? buildDateField(card.done_at, true, true)
                           : buildTaskDateField(card.start_date, card.due_date, true);
    $dateField.style.marginTop = "0";
    $dateField.style.marginBottom = "14px";
    $slot.appendChild($dateField);
  }

  var $people = null;
  var $pslot = backdrop.querySelector("#m-people-slot");
  if(state.assigneesError){
    $pslot.remove();
  } else {
    var plab = document.createElement("label");
    plab.textContent = "Destinatari";
    $pslot.appendChild(plab);
    $people = buildAssigneePicker(proj, card.assignees || [], true);
    $people.style.marginBottom = "14px";
    $pslot.appendChild($people);
  }

  var priority = card.priority || "green";
  var $pills = backdrop.querySelectorAll(".priority-row .priority-pill");
  $pills.forEach(function(p){
    if(p.dataset.priority === priority) p.classList.add("active");
    p.addEventListener("click", function(){
      $pills.forEach(function(x){ x.classList.remove("active"); });
      p.classList.add("active");
      priority = p.dataset.priority;
    });
  });

  function close(){ backdrop.remove(); document.removeEventListener("keydown", onKey); }
  function save(){
    var v = $ta.value.trim();
    if(!v) { $ta.focus(); return; }
    var target = $col.value;
    updateCard(cardId, columnId, v, priority, $dateField ? $dateField.getValue() : null, isDoneCol, proj);
    if($people) saveAssignees(card, $people.getValue());
    // Lo spostamento passa dalla stessa funzione del drop handler, cosi'
    // riordino delle position e data di completamento restano coerenti.
    if(target && target !== columnId) moveCard(cardId, columnId, target, null, proj);
    close();
  }
  function onKey(e){
    if(e.key === "Escape") close();
    if(e.key === "Enter" && (e.metaKey || e.ctrlKey)) save();
  }
  document.addEventListener("keydown", onKey);

  backdrop.addEventListener("click", function(e){ if(e.target === backdrop) close(); });
  backdrop.querySelector("#m-cancel").addEventListener("click", close);
  backdrop.querySelector("#m-save").addEventListener("click", save);
}

/* =====================================================================
 * Archivio — file e link del progetto
 * ===================================================================== */
var LIBRARY_BUCKET = "be-library";
var LIBRARY_MAX_BYTES = 50 * 1024 * 1024;
var pendingUploads = [];

async function loadLibrary(){
  var res = await sb.from("be_library_items")
    .select("id, project_id, kind, title, url, storage_path, mime_type, size_bytes, position, created_by")
    .order("position", { ascending: true });
  if(res.error){
    state.library = {};
    state.libraryError = res.error.message;
    return;
  }
  state.libraryError = null;
  var byProject = {};
  (res.data || []).forEach(function(it){
    (byProject[it.project_id] = byProject[it.project_id] || []).push(it);
  });
  state.library = byProject;
}

function libraryItems(projectId){
  return (state.library[projectId] || []).slice().sort(function(a,b){ return a.position - b.position; });
}

function fileExtension(name){
  var m = /\.([A-Za-z0-9]{1,8})$/.exec(name || "");
  return m ? m[1].toLowerCase() : "";
}

function formatBytes(n){
  if(n === null || n === undefined) return "";
  if(n < 1024) return n + " B";
  var units = ["KB","MB","GB"], i = -1, v = n;
  do { v = v / 1024; i++; } while(v >= 1024 && i < units.length - 1);
  return (v >= 10 ? Math.round(v) : v.toFixed(1)) + " " + units[i];
}

function safeFileName(name){
  return (name || "file")
    .normalize("NFKD")
    .replace(/[^A-Za-z0-9._-]+/g, "_")
    .replace(/_{2,}/g, "_")
    .slice(-80);
}

function linkHost(url){
  try { return new URL(url).hostname.replace(/^www\./, ""); } catch(e){ return ""; }
}

function isDriveHost(host){
  return /(^|\.)(drive|docs|sheets|slides)\.google\.com$/.test(host);
}

var LIB_ICON_COLORS = {
  pdf:"#f87168",
  doc:"#579dff", docx:"#579dff", odt:"#579dff", rtf:"#579dff", pages:"#579dff",
  xls:"#4bce97", xlsx:"#4bce97", csv:"#4bce97", numbers:"#4bce97",
  ppt:"#f5a623", pptx:"#f5a623", key:"#f5a623",
  png:"#c9a6ff", jpg:"#c9a6ff", jpeg:"#c9a6ff", gif:"#c9a6ff", webp:"#c9a6ff",
  svg:"#c9a6ff", heic:"#c9a6ff", ai:"#c9a6ff", psd:"#c9a6ff",
  mp4:"#f5cd47", mov:"#f5cd47", mp3:"#f5cd47", wav:"#f5cd47",
  zip:"#8c9bab", rar:"#8c9bab", "7z":"#8c9bab"
};

function buildLibIcon(item){
  var box = document.createElement("div");
  box.className = "lib-icon";
  if(item.kind === "link"){
    var host = linkHost(item.url);
    if(isDriveHost(host)){
      box.classList.add("drive");
      box.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>';
    } else {
      box.classList.add("link");
      box.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>';
    }
    return box;
  }
  var ext = fileExtension(item.title) || fileExtension(item.storage_path || "");
  box.style.background = LIB_ICON_COLORS[ext] || "#8c9bab";
  box.textContent = ext ? ext.slice(0,4) : "FILE";
  return box;
}

function buildLibItem(proj, item){
  var $it = document.createElement("article");
  $it.className = "lib-item";
  $it.appendChild(buildLibIcon(item));

  var $body = document.createElement("div");
  $body.className = "lib-body";
  var $t = document.createElement("div");
  $t.className = "lib-title";
  $t.textContent = item.title;
  $body.appendChild($t);

  var bits = [];
  if(item.kind === "link"){
    var host = linkHost(item.url);
    bits.push(isDriveHost(host) ? "Google Drive" : (host || "link"));
  } else {

  $actions.className = "lib-actions";

    $dl.className = "lib-action";

    $dl.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
    $dl.addEventListener("click", function(e){
      e.stopPropagation();
      openLibraryItem(item, true);
    });
    $actions.appendChild($dl);
  }

  var $del = document.createElement("button");
  $del.className = "lib-action danger";
  $del.title = "Elimina";
  $del.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
  $del.addEventListener("click", function(e){
    e.stopPropagation();
    deleteLibraryItem(proj.id, item.id);
  });
  $actions.appendChild($del);
  $it.appendChild($actions);

  $it.addEventListener("click", function(e){
    if(e.target.closest(".lib-action")) return;
    openLibraryItem(item, false);
  });

  return $it;
}

function buildLibraryColumn(proj){

        'Archivio' +

  $col.appendChild($head);

    $list.appendChild($warn);
  }

  uploads.forEach(function(u){
    var $up = document.createElement("div");
    $up.className = "lib-upload";
    $up.innerHTML = '<div class="lib-spinner"></div>';
