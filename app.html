<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mario Project Manager · Brown Enterprises</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E1217">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brown Enterprises">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
  /* --- reset & base ----------------------------------------------------- */
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",Roboto,sans-serif;
    background:#1d2125;
    color:#b6c2cf;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer}
  ::selection{background:rgba(87,157,255,0.4);color:#fff}

  /* --- layout ----------------------------------------------------------- */
  .app{
    display:grid;
    grid-template-rows:44px 1fr;
    grid-template-columns:260px 1fr;
    grid-template-areas:"topbar topbar" "sidebar board";
    height:100vh;
  }

  /* --- top bar ---------------------------------------------------------- */
  .topbar{
    grid-area:topbar;
    background:#1d2125;
    border-bottom:1px solid #2c3338;
    display:flex;
    align-items:center;
    padding:0 16px;
    gap:14px;
    z-index:20;
  }
  .topbar-logo{
    display:flex;
    align-items:center;
    gap:10px;
    color:#f4f5f7;
    font-weight:700;
    font-size:14px;
    letter-spacing:0.2px;
  }
  .topbar-logo img{height:24px;filter:invert(1) brightness(2)}
  .topbar-spacer{flex:1}
  .topbar-user{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .topbar-user .avatar{
    width:28px;height:28px;border-radius:50%;
    background:linear-gradient(135deg,#579dff,#9f8fef);
    color:#1d2125;
    font-weight:700;font-size:12px;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn{
    background:transparent;border:0;color:#9fadbc;
    width:32px;height:32px;border-radius:4px;
    display:inline-flex;align-items:center;justify-content:center;
    transition:background 0.15s,color 0.15s;
  }
  .icon-btn:hover{background:#2c3338;color:#f4f5f7}

  /* --- sidebar ---------------------------------------------------------- */
  .sidebar{
    grid-area:sidebar;
    background:#1d2125;
    border-right:1px solid #2c3338;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .sidebar-header{
    padding:14px 14px 8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .sidebar-title{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.8px;
    color:#9fadbc;
    font-weight:700;
  }
  .sidebar-add{
    background:transparent;border:0;color:#9fadbc;
    width:24px;height:24px;border-radius:4px;
    display:inline-flex;align-items:center;justify-content:center;
    transition:background 0.15s,color 0.15s;
  }
  .sidebar-add:hover{background:#2c3338;color:#f4f5f7}
  .projects{
    flex:1;
    overflow-y:auto;
    padding:4px 8px 12px;
  }
  .project-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 8px;
    border-radius:4px;
    cursor:pointer;
    color:#b6c2cf;
    transition:background 0.12s,color 0.12s;
    margin-bottom:2px;
    user-select:none;
    position:relative;
  }
  .project-item:hover{background:#2c3338}
  .project-item.active{
    background:#1c2b41;
    color:#cce0ff;
  }
  .project-item.active .project-icon{background:#579dff;color:#1d2125}
  .project-icon{
    width:22px;height:22px;border-radius:4px;
    background:linear-gradient(135deg,#4bce97,#579dff);
    color:#1d2125;
    font-size:11px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .project-name{
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:14px;
  }
  .project-delete{
    opacity:0;
    background:transparent;border:0;color:#9fadbc;
    width:22px;height:22px;border-radius:4px;
    display:inline-flex;align-items:center;justify-content:center;
    transition:opacity 0.12s,background 0.12s,color 0.12s;
  }
  .project-item:hover .project-delete{opacity:1}
  .project-delete:hover{background:#412a2a;color:#f87168}
  .empty-projects{
    text-align:center;
    color:#738496;
    font-size:12px;
    padding:24px 12px;
    line-height:1.5;
  }
  .sidebar-section-title{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.6px;
    color:#738496;
    font-weight:700;
    padding:10px 4px 4px 8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .sidebar-section-title:first-child{padding-top:2px}
  .sidebar-section-add{
    background:transparent;border:0;color:#9fadbc;
    width:20px;height:20px;border-radius:4px;
    display:inline-flex;align-items:center;justify-content:center;
    transition:background 0.15s,color 0.15s;
  }
  .sidebar-section-add:hover{background:#2c3338;color:#f4f5f7}
  .project-share{
    opacity:0;
    background:transparent;border:0;color:#9fadbc;
    width:22px;height:22px;border-radius:4px;
    display:inline-flex;align-items:center;justify-content:center;
    transition:opacity 0.12s,background 0.12s,color 0.12s;
  }
  .project-item:hover .project-share{opacity:1}
  .project-share:hover{background:#1c2b41;color:#85b8ff}
  .share-list{
    display:flex;flex-direction:column;gap:2px;
    margin-bottom:14px;
    max-height:260px;overflow-y:auto;
  }
  .share-row{
    display:flex;align-items:center;gap:10px;
    padding:8px;border-radius:6px;
    cursor:pointer;user-select:none;
  }
  .share-row:hover{background:#1d2125}
  .share-row .cal-cb{
    width:16px;height:16px;
    border:2px solid #38414b;
    border-radius:4px;
    flex-shrink:0;
    background:#1d2125;
    position:relative;
    transition:background 0.12s,border-color 0.12s;
  }
  .share-row.checked .cal-cb{background:#579dff;border-color:#579dff}
  .share-row.checked .cal-cb::after{
    content:"";position:absolute;left:4px;top:1px;
    width:4px;height:8px;border:solid #1d2125;border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }
  .share-row-name{font-size:14px;color:#f4f5f7}
  .sidebar-footer{
    padding:10px 14px;
    border-top:1px solid #2c3338;
    font-size:11px;
    color:#738496;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .logout-btn{
    background:transparent;border:0;color:#9fadbc;
    font-size:12px;
    display:inline-flex;align-items:center;gap:4px;
    padding:4px 8px;border-radius:4px;
    transition:background 0.12s,color 0.12s;
  }
  .logout-btn:hover{background:#2c3338;color:#f4f5f7}

  /* --- board ------------------------------------------------------------ */
  .board{
    grid-area:board;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    background:#1d2125;
    background-image:linear-gradient(180deg,rgba(87,157,255,0.05),transparent 280px);
  }
  .board-header{
    padding:14px 24px;
    display:flex;
    align-items:center;
    gap:12px;
    flex-shrink:0;
  }
  .board-title{
    font-size:18px;
    font-weight:700;
    color:#f4f5f7;
    background:transparent;
    border:1px solid transparent;
    border-radius:4px;
    padding:4px 8px;
    margin:0;
    outline:none;
    min-width:120px;
    max-width:600px;
  }
  .board-title:hover{background:rgba(255,255,255,0.04)}
  .board-title:focus{background:#22272b;border-color:#579dff}
  .board-meta{
    color:#8c9bab;
    font-size:12px;
  }
  .board-content{
    flex:1;
    overflow-x:auto;
    overflow-y:hidden;
    padding:0 24px 24px;
    display:flex;
    align-items:flex-start;
    gap:12px;
    scrollbar-width:thin;
    scrollbar-color:#38414b transparent;
  }
  .board-content::-webkit-scrollbar{height:12px}
  .board-content::-webkit-scrollbar-track{background:transparent}
  .board-content::-webkit-scrollbar-thumb{background:#38414b;border-radius:6px;border:3px solid #1d2125}

  /* --- columns ---------------------------------------------------------- */
  .column{
    background:#101204;
    border-radius:10px;
    width:280px;
    flex-shrink:0;
    max-height:100%;
    display:flex;
    flex-direction:column;
    box-shadow:0 1px 0 rgba(255,255,255,0.04);
  }
  .column.drag-over{
    background:#161a1d;
    outline:2px dashed #579dff;
    outline-offset:-2px;
  }
  .column-header{
    padding:10px 12px 6px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-shrink:0;
  }
  .column-title{
    font-size:13px;
    font-weight:700;
    color:#f4f5f7;
    display:flex;align-items:center;gap:8px;
  }
  .column-count{
    background:#22272b;
    color:#9fadbc;
    font-size:11px;
    font-weight:600;
    padding:1px 7px;
    border-radius:10px;
  }
  .cards{
    flex:1;
    overflow-y:auto;
    padding:0 8px;
    scrollbar-width:thin;
    scrollbar-color:#38414b transparent;
    min-height:8px;
  }
  .cards::-webkit-scrollbar{width:8px}
  .cards::-webkit-scrollbar-track{background:transparent}
  .cards::-webkit-scrollbar-thumb{background:#38414b;border-radius:4px}

  /* --- card ------------------------------------------------------------- */
  .card{
    background:#22272b;
    border-radius:8px;
    padding:8px 12px;
    margin-bottom:8px;
    cursor:grab;
    transition:background 0.12s,box-shadow 0.12s,transform 0.12s;
    border:1px solid transparent;
    box-shadow:0 1px 0 rgba(0,0,0,0.25);
    position:relative;
    user-select:none;
  }
  .card:hover{
    background:#2c3338;
    border-color:#38414b;
  }
  .card.dragging{
    opacity:0.4;
    cursor:grabbing;
    transform:rotate(1.5deg);
  }
  .card-priority{
    display:inline-block;
    height:6px;
    width:42px;
    border-radius:3px;
    margin-bottom:6px;
  }
  .card-priority.red   { background:#f87168 }
  .card-priority.yellow{ background:#f5cd47 }
  .card-priority.green { background:#4bce97 }
  .card-title{
    color:#f4f5f7;
    font-size:14px;
    line-height:1.35;
    word-wrap:break-word;
    white-space:pre-wrap;
  }
  .card-actions{
    position:absolute;
    top:6px;
    right:6px;
    opacity:0;
    transition:opacity 0.12s;
  }
  .card:hover .card-actions{opacity:1}
  .card-action{
    background:rgba(0,0,0,0.4);
    border:0;color:#9fadbc;
    width:22px;height:22px;border-radius:4px;
    display:inline-flex;align-items:center;justify-content:center;
    margin-left:2px;
    transition:background 0.12s,color 0.12s;
  }
  .card-action:hover{background:#412a2a;color:#f87168}

  /* --- add card --------------------------------------------------------- */
  .add-card{
    margin:4px 8px 8px;
    padding:8px 12px;
    color:#9fadbc;
    background:transparent;
    border:0;
    border-radius:6px;
    font-size:14px;
    text-align:left;
    display:flex;
    align-items:center;
    gap:6px;
    transition:background 0.12s,color 0.12s;
  }
  .add-card:hover{
    background:rgba(255,255,255,0.06);
    color:#f4f5f7;
  }
  .add-card-form{
    margin:4px 8px 8px;
    background:transparent;
  }
  .add-card-form textarea{
    width:100%;
    background:#22272b;
    border:1px solid #579dff;
    color:#f4f5f7;
    border-radius:8px;
    padding:8px 12px;
    font-family:inherit;
    font-size:14px;
    resize:vertical;
    min-height:60px;
    outline:none;
    box-shadow:0 1px 0 rgba(0,0,0,0.25);
  }
  .add-card-form .priority-row{
    display:flex;
    gap:6px;
    margin-top:8px;
    align-items:center;
  }
  .priority-row .label{font-size:11px;color:#9fadbc;text-transform:uppercase;letter-spacing:0.5px;font-weight:700;margin-right:2px}
  .priority-pill{
    background:transparent;
    border:1px solid #38414b;
    border-radius:999px;
    padding:3px 10px;
    font-size:11px;
    color:#b6c2cf;
    display:inline-flex;align-items:center;gap:5px;
    transition:background 0.12s,border-color 0.12s;
  }
  .priority-pill:hover{background:#2c3338}
  .priority-pill.active{border-color:#579dff;background:#1c2b41}
  .priority-pill .dot{
    width:8px;height:8px;border-radius:50%;
  }
  .priority-pill .dot.red{background:#f87168}
  .priority-pill .dot.yellow{background:#f5cd47}
  .priority-pill .dot.green{background:#4bce97}
  .add-card-form .actions{
    display:flex;
    gap:6px;
    margin-top:8px;
    align-items:center;
  }
  .btn-primary{
    background:#579dff;
    color:#1d2125;
    border:0;
    padding:7px 14px;
    border-radius:4px;
    font-weight:700;
    font-size:13px;
    transition:background 0.12s;
  }
  .btn-primary:hover{background:#85b8ff}
  .btn-cancel{
    background:transparent;
    border:0;
    color:#9fadbc;
    padding:6px 8px;
    border-radius:4px;
    font-size:13px;
  }
  .btn-cancel:hover{background:#2c3338;color:#f4f5f7}

  /* --- date sulle card --------------------------------------------------- */
  .card-badges{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-top:7px;
  }
  .card-badge{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-size:11px;
    font-weight:600;
    padding:2px 7px;
    border-radius:4px;
    background:#2c3338;
    color:#9fadbc;
    white-space:nowrap;
  }
  .card-badge svg{flex-shrink:0}
  .card-badge.overdue{background:#412a2a;color:#f87168}
  .card-badge.soon{background:#413a1f;color:#f5cd47}
  .card-badge.done{background:#173328;color:#4bce97}
  .date-row{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:8px;
    flex-wrap:wrap;
  }
  .date-row .label{
    font-size:11px;color:#9fadbc;text-transform:uppercase;
    letter-spacing:0.5px;font-weight:700;
    flex:0 0 100%;
    margin-bottom:-2px;
  }
  input[type=date].date-input{
    background:#22272b;
    border:1px solid #38414b;
    color:#f4f5f7;
    border-radius:6px;
    padding:5px 8px;
    font-family:inherit;
    font-size:12.5px;
    outline:none;
    color-scheme:dark;
  }
  input[type=date].date-input:focus{border-color:#579dff}
  .date-clear{
    background:transparent;border:0;color:#8c9bab;
    font-size:11px;padding:4px 7px;border-radius:4px;
  }
  .date-clear:hover{background:#2c3338;color:#f4f5f7}
  .board-warning{
    margin:0 24px 12px;
    background:#412a2a;
    border:1px solid #5d3a3a;
    color:#ffbdad;
    font-size:12px;
    line-height:1.45;
    border-radius:8px;
    padding:8px 12px;
  }

  /* --- messaggi / alert -------------------------------------------------- */
  .topbar-msg{position:relative}
  .msg-badge{
    position:absolute;top:-6px;right:-6px;
    min-width:18px;height:18px;padding:0 4px;
    border-radius:9px;
    background:#f87168;color:#1d2125;
    font-size:10px;font-weight:800;line-height:1;
    display:flex;align-items:center;justify-content:center;
    border:2px solid #1d2125;
  }
  .msg-badge[hidden]{display:none}
  .msg-badge.quiet{background:#f5cd47}
  .msg-panel{
    position:fixed;
    top:50px;right:16px;
    width:344px;max-width:calc(100vw - 24px);
    max-height:min(72vh,540px);
    background:#22272b;
    border:1px solid #38414b;
    border-radius:10px;
    box-shadow:0 12px 32px rgba(0,0,0,0.55);
    z-index:60;
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  .msg-panel[hidden]{display:none}
  .msg-panel-head{
    padding:11px 12px;
    border-bottom:1px solid #2c3338;
    display:flex;align-items:center;gap:8px;
  }
  .msg-panel-head h3{font-size:14px;color:#f4f5f7;margin:0;flex:1;font-weight:700}
  .msg-panel-list{overflow-y:auto;padding:6px;scrollbar-width:thin;scrollbar-color:#38414b transparent}
  .msg-panel-list::-webkit-scrollbar{width:8px}
  .msg-panel-list::-webkit-scrollbar-thumb{background:#38414b;border-radius:4px}
  .msg-item{
    display:flex;gap:10px;align-items:flex-start;
    padding:9px 10px;border-radius:8px;cursor:pointer;
    transition:background 0.12s;
  }
  .msg-item:hover{background:#2c3338}
  .msg-item.unread{background:#1c2b41}
  .msg-item.unread:hover{background:#213a5c}
  .msg-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0;background:#579dff}
  .msg-dot.overdue{background:#f87168}
  .msg-dot.today{background:#f5cd47}
  .msg-body{flex:1;min-width:0}
  .msg-title{font-size:13px;color:#f4f5f7;line-height:1.35;word-wrap:break-word}
  .msg-meta{font-size:11px;color:#8c9bab;margin-top:3px;line-height:1.4}
  .msg-when{font-weight:700;color:#85b8ff}
  .msg-when.overdue{color:#f87168}
  .msg-when.today{color:#f5cd47}
  .msg-empty{padding:26px 16px;text-align:center;color:#738496;font-size:12.5px;line-height:1.5}
  .msg-panel-foot{
    border-top:1px solid #2c3338;
    padding:7px 10px;
    display:flex;align-items:center;gap:6px;justify-content:space-between;
  }
  .msg-foot-btn{
    background:transparent;border:0;color:#9fadbc;
    font-size:11.5px;padding:5px 8px;border-radius:4px;
  }
  .msg-foot-btn:hover{background:#2c3338;color:#f4f5f7}
  .msg-foot-btn[hidden]{display:none}

  /* --- panoramica -------------------------------------------------------- */
  .overview-item .project-icon{background:linear-gradient(135deg,#f5cd47,#579dff);color:#1d2125}
  .overview-item .project-icon svg{color:#1d2125}
  .overview-filters{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:0 24px 12px;
  }
  .overview-filters select{
    background:#22272b;border:1px solid #38414b;color:#f4f5f7;
    border-radius:6px;padding:6px 8px;
    font-family:inherit;font-size:12.5px;outline:none;
  }
  .overview-filters select:focus{border-color:#579dff}
  .overview-filters .chk{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12.5px;color:#b6c2cf;cursor:pointer;user-select:none;
  }
  .overview-filters .chk input{accent-color:#579dff;width:15px;height:15px}
  .card.static{cursor:pointer}
  .card-project{
    display:inline-block;
    vertical-align:top;
    margin-bottom:6px;
    font-size:10.5px;font-weight:700;
    letter-spacing:0.3px;text-transform:uppercase;
    color:#9fadbc;
    background:#1d2125;
    border:1px solid #38414b;
    border-radius:4px;
    padding:1px 6px;
    max-width:100%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .column-empty{
    text-align:center;color:#738496;
    font-size:12px;padding:18px 10px;line-height:1.5;
  }

  /* --- archivio --------------------------------------------------------- */
  .column.library{
    background:#0f1215;
    border:1px solid #2a3340;
  }
  .column.library .lib-head{display:inline-flex;align-items:center;gap:6px}
  .column.library .lib-head svg{color:#9fadbc;flex-shrink:0}
  .column.library.file-over{
    outline:2px dashed #4bce97;
    outline-offset:-2px;
    background:#101a15;
  }
  .lib-items{
    flex:1;
    overflow-y:auto;
    padding:0 8px;
    scrollbar-width:thin;
    scrollbar-color:#38414b transparent;
    min-height:8px;
  }
  .lib-items::-webkit-scrollbar{width:8px}
  .lib-items::-webkit-scrollbar-track{background:transparent}
  .lib-items::-webkit-scrollbar-thumb{background:#38414b;border-radius:4px}
  .lib-item{
    background:#22272b;
    border:1px solid transparent;
    border-radius:8px;
    padding:8px 10px;
    margin-bottom:8px;
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
    position:relative;
    box-shadow:0 1px 0 rgba(0,0,0,0.25);
    transition:background 0.12s,border-color 0.12s;
  }
  .lib-item:hover{background:#2c3338;border-color:#38414b}
  .lib-icon{
    width:32px;height:32px;
    flex-shrink:0;
    border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    font-size:9px;font-weight:800;letter-spacing:0.3px;
    color:#1d2125;
    background:#8c9bab;
    text-transform:uppercase;
  }
  .lib-icon.link{background:#1c2b41;color:#85b8ff}
  .lib-icon.drive{background:#16301f;color:#4bce97}
  .lib-body{min-width:0;flex:1}
  .lib-title{
    color:#f4f5f7;
    font-size:13.5px;
    line-height:1.3;
    word-break:break-word;
  }
  .lib-meta{
    color:#8c9bab;
    font-size:11px;
    margin-top:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .lib-actions{
    position:absolute;
    top:6px;right:6px;
    opacity:0;
    transition:opacity 0.12s;
    display:flex;
  }
  .lib-item:hover .lib-actions{opacity:1}
  .lib-action{
    background:rgba(0,0,0,0.45);
    border:0;color:#9fadbc;
    width:22px;height:22px;border-radius:4px;
    display:inline-flex;align-items:center;justify-content:center;
    margin-left:2px;
    transition:background 0.12s,color 0.12s;
  }
  .lib-action:hover{background:#2c3338;color:#f4f5f7}
  .lib-action.danger:hover{background:#412a2a;color:#f87168}
  .lib-empty{
    color:#738496;
    font-size:12.5px;
    line-height:1.45;
    text-align:center;
    border:1px dashed #2a3340;
    border-radius:8px;
    padding:16px 12px;
    margin-bottom:8px;
  }
  .lib-warning{
    background:#412a2a;
    border:1px solid #5d3a3a;
    color:#ffbdad;
    font-size:11.5px;
    line-height:1.45;
    border-radius:8px;
    padding:9px 10px;
    margin-bottom:8px;
    word-break:break-word;
  }
  .lib-upload{
    background:#1c2b41;
    border:1px solid #2a4a75;
    border-radius:8px;
    padding:8px 10px;
    margin-bottom:8px;
    display:flex;align-items:center;gap:10px;
  }
  .lib-upload .lib-title{color:#b6c2cf}
  .lib-spinner{
    width:16px;height:16px;flex-shrink:0;
    border:2px solid #2a4a75;
    border-top-color:#85b8ff;
    border-radius:50%;
    animation:lib-spin 0.7s linear infinite;
  }
  @keyframes lib-spin{to{transform:rotate(360deg)}}
  .lib-drop-hint{
    display:none;
    margin:0 8px 8px;
    padding:14px 10px;
    border:2px dashed #4bce97;
    border-radius:8px;
    color:#4bce97;
    font-size:12.5px;
    font-weight:600;
    text-align:center;
  }
  .column.library.file-over .lib-drop-hint{display:block}
  .lib-buttons{display:flex;flex-direction:column}

  /* --- empty state ------------------------------------------------------ */
  .empty-board{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#738496;
    text-align:center;
    padding:40px;
  }
  .empty-board h2{
    color:#b6c2cf;
    font-size:18px;
    margin:0 0 8px;
  }
  .empty-board p{margin:0 0 16px;font-size:14px}
  .empty-board .btn-primary{padding:9px 18px;font-size:14px}

  /* --- modal ------------------------------------------------------------ */
  .modal-backdrop{
    position:fixed;inset:0;
    background:rgba(0,0,0,0.6);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
    backdrop-filter:blur(2px);
  }
  .modal{
    background:#22272b;
    border:1px solid #38414b;
    border-radius:10px;
    padding:24px;
    width:100%;
    max-width:420px;
    box-shadow:0 24px 60px rgba(0,0,0,0.6);
  }
  .modal h2{
    margin:0 0 16px;
    color:#f4f5f7;
    font-size:16px;
    font-weight:700;
  }
  .modal label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:#9fadbc;
    font-weight:700;
    margin-bottom:6px;
  }
  .modal textarea,.modal input[type=text],.modal input[type=date]{
    width:100%;
    background:#1d2125;
    border:1px solid #38414b;
    color:#f4f5f7;
    border-radius:6px;
    padding:9px 11px;
    font-family:inherit;
    font-size:14px;
    outline:none;
    margin-bottom:14px;
  }
  .modal textarea{resize:vertical;min-height:80px}
  .modal textarea:focus,.modal input[type=text]:focus,.modal input[type=date]:focus{border-color:#579dff}
  .modal input[type=date]{color-scheme:dark;width:auto;min-width:180px}
  .modal .actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:8px;
  }

  /* --- topbar button (calendar) ----------------------------------------- */
  .topbar-btn{
    background:transparent;border:1px solid #38414b;color:#b6c2cf;
    padding:6px 12px;border-radius:6px;
    display:inline-flex;align-items:center;gap:6px;
    font-size:13px;font-weight:600;
    transition:background 0.12s,color 0.12s,border-color 0.12s;
  }
  .topbar-btn:hover{background:#2c3338;color:#f4f5f7;border-color:#579dff}
  .topbar-btn svg{flex-shrink:0}

  /* --- calendar overlay ------------------------------------------------- */
  .cal-overlay{
    position:fixed;inset:0;
    background:#1d2125;
    z-index:50;
    display:flex;flex-direction:column;
    visibility:hidden;
    opacity:0;
    transition:opacity 0.18s;
  }
  .cal-overlay.show{visibility:visible;opacity:1}

  .cal-header{
    padding:12px 20px;
    border-bottom:1px solid #2c3338;
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
  }
  .cal-title{
    font-size:18px;font-weight:700;color:#f4f5f7;
    display:flex;align-items:center;gap:10px;
    margin:0;
  }
  .cal-title svg{color:#579dff}
  .cal-spacer{flex:1}
  .cal-nav{
    display:flex;align-items:center;gap:2px;
  }
  .cal-nav-btn{
    background:#22272b;border:1px solid #38414b;color:#b6c2cf;
    width:30px;height:30px;
    border-radius:6px;
    display:inline-flex;align-items:center;justify-content:center;
    transition:background 0.12s,color 0.12s;
  }
  .cal-nav-btn:hover{background:#2c3338;color:#f4f5f7}
  .cal-today-btn{
    background:#22272b;border:1px solid #38414b;color:#b6c2cf;
    padding:6px 12px;border-radius:6px;
    font-size:12px;font-weight:600;
    transition:background 0.12s,color 0.12s;
  }
  .cal-today-btn:hover{background:#2c3338;color:#f4f5f7}
  .cal-period{
    color:#f4f5f7;font-weight:700;font-size:15px;
    min-width:200px;text-align:center;
    text-transform:capitalize;
  }
  .cal-views{
    display:inline-flex;background:#22272b;border:1px solid #38414b;border-radius:6px;padding:2px;
  }
  .cal-views button{
    background:transparent;border:0;color:#9fadbc;
    padding:6px 14px;border-radius:4px;
    font-size:12px;font-weight:600;
    transition:background 0.12s,color 0.12s;
  }
  .cal-views button.active{background:#1c2b41;color:#cce0ff}
  .cal-views button:hover:not(.active){background:#2c3338;color:#f4f5f7}
  .cal-add-btn{
    background:#579dff;color:#1d2125;
    border:0;padding:7px 14px;border-radius:6px;
    font-weight:700;font-size:13px;
    display:inline-flex;align-items:center;gap:6px;
    transition:background 0.12s;
  }
  .cal-add-btn:hover{background:#85b8ff}
  .cal-close{
    background:transparent;border:0;color:#9fadbc;
    width:32px;height:32px;border-radius:6px;
    display:inline-flex;align-items:center;justify-content:center;
    transition:background 0.12s,color 0.12s;
  }
  .cal-close:hover{background:#412a2a;color:#f87168}

  .cal-main{flex:1;display:flex;overflow:hidden}
  .cal-side{
    width:220px;flex-shrink:0;
    background:#1d2125;
    border-right:1px solid #2c3338;
    padding:12px 10px;
    overflow-y:auto;
    display:flex;flex-direction:column;
    gap:2px;
  }
  .cal-side h3{
    margin:0 0 8px;padding:0 8px;
    font-size:11px;font-weight:700;color:#9fadbc;
    text-transform:uppercase;letter-spacing:0.6px;
  }
  .cal-person-row{
    display:flex;align-items:center;gap:10px;
    padding:7px 8px;
    border-radius:6px;
    cursor:pointer;
    user-select:none;
    font-size:13px;
    color:#b6c2cf;
    transition:background 0.12s;
    --pc:#579dff;
  }
  .cal-person-row:hover{background:#2c3338}
  .cal-person-row.all{
    font-weight:700;color:#cce0ff;
    margin-bottom:4px;
  }
  .cal-cb{
    width:16px;height:16px;
    border:2px solid #38414b;
    border-radius:4px;
    flex-shrink:0;
    background:#1d2125;
    position:relative;
    transition:background 0.12s,border-color 0.12s;
  }
  .cal-person-row.checked .cal-cb{
    background:var(--pc);
    border-color:var(--pc);
  }
  .cal-person-row.checked .cal-cb::after{
    content:"";
    position:absolute;
    left:4px;top:1px;
    width:4px;height:8px;
    border:solid #1d2125;
    border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }
  .cal-person-name{
    flex:1;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .cal-person-count{
    background:#22272b;
    color:#9fadbc;
    font-size:10px;font-weight:700;
    padding:1px 7px;border-radius:10px;
    flex-shrink:0;
  }
  .cal-side-divider{
    height:1px;background:#2c3338;
    margin:6px 4px;
  }
  .cal-side-actions{
    display:flex;gap:6px;margin:6px 0 4px;
  }
  .cal-side-actions button{
    flex:1;
    background:#22272b;border:1px solid #38414b;color:#9fadbc;
    padding:5px 8px;border-radius:4px;
    font-size:11px;font-weight:600;
    transition:background 0.12s,color 0.12s;
  }
  .cal-side-actions button:hover{background:#2c3338;color:#f4f5f7}

  .cal-body{flex:1;overflow:hidden;display:flex;flex-direction:column;background:#101204}

  /* Month view */
  .cal-month{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .cal-month-headrow{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    background:#1d2125;
    border-bottom:1px solid #2c3338;
  }
  .cal-month-headrow > div{
    padding:8px 12px;
    font-size:11px;text-transform:uppercase;letter-spacing:0.5px;
    font-weight:700;color:#9fadbc;
    border-right:1px solid #2c3338;
  }
  .cal-month-headrow > div:last-child{border-right:0}
  .cal-month-grid{
    flex:1;
    display:grid;
    grid-template-columns:repeat(7,1fr);
    grid-auto-rows:minmax(100px,1fr);
    overflow-y:auto;
  }
  .cal-day-cell{
    background:#1d2125;
    border-right:1px solid #2c3338;
    border-bottom:1px solid #2c3338;
    padding:6px 6px 4px;
    display:flex;flex-direction:column;
    cursor:pointer;
    transition:background 0.12s;
    overflow:hidden;
  }
  .cal-day-cell:hover{background:#22272b}
  .cal-day-cell.other-month{background:#161a1d}
  .cal-day-cell.other-month .cal-day-num{color:#5c6c7e}
  .cal-day-cell.today{background:#1c2b41}
  .cal-day-cell.today .cal-day-num{
    background:#579dff;color:#1d2125;
    border-radius:50%;width:24px;height:24px;
    display:inline-flex;align-items:center;justify-content:center;
    font-weight:700;
  }
  .cal-day-num{
    font-size:12px;font-weight:600;color:#b6c2cf;
    align-self:flex-start;
    padding:0 4px;
    margin-bottom:4px;
  }
  .cal-day-events{
    display:flex;flex-direction:column;gap:2px;
    overflow:hidden;
  }
  .cal-event{
    color:#f4f5f7;
    font-size:11px;
    padding:2px 6px;
    border-radius:3px;
    border-left:3px solid #579dff;
    background:#22272b;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    line-height:1.3;
    cursor:pointer;
  }
  .cal-event:hover{background:#2c3338}
  .cal-event-more{
    font-size:10px;color:#9fadbc;padding:1px 6px;
    cursor:pointer;
  }
  .cal-event-more:hover{color:#cce0ff}

  /* Week view */
  .cal-week{
    flex:1;
    display:grid;
    grid-template-columns:repeat(7,1fr);
    overflow:hidden;
    background:#101204;
  }
  .cal-week-col{
    background:#1d2125;
    border-right:1px solid #2c3338;
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  .cal-week-col:last-child{border-right:0}
  .cal-week-head{
    padding:10px 12px;
    border-bottom:1px solid #2c3338;
    cursor:pointer;
    transition:background 0.12s;
  }
  .cal-week-head:hover{background:#22272b}
  .cal-week-head.today{background:#1c2b41}
  .cal-week-head.today .cal-week-day-num{color:#579dff}
  .cal-week-day-name{font-size:11px;color:#9fadbc;text-transform:uppercase;letter-spacing:0.5px;font-weight:700}
  .cal-week-day-num{font-size:20px;font-weight:700;color:#f4f5f7;margin-top:2px}
  .cal-week-events{
    flex:1;overflow-y:auto;
    padding:8px;
    display:flex;flex-direction:column;gap:6px;
  }

  .cal-week-event{
    background:#22272b;
    border-left:3px solid #579dff;
    padding:6px 8px;
    border-radius:4px;
    cursor:pointer;
    transition:background 0.12s;
  }
  .cal-week-event:hover{background:#2c3338}
  .cal-week-event-time{color:#9fadbc;font-size:10px;font-weight:700;margin-bottom:2px;letter-spacing:0.3px}
  .cal-week-event-title{color:#f4f5f7;font-weight:600;line-height:1.3;font-size:12px;word-wrap:break-word}
  .cal-week-event-person{color:#9fadbc;font-size:11px;margin-top:3px;display:flex;align-items:center;gap:5px}
  .cal-person-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}

  /* Day view */
  .cal-day-view{
    flex:1;
    display:flex;flex-direction:column;
    overflow:hidden;
    background:#101204;
  }
  .cal-day-view-head{
    padding:18px 24px;
    border-bottom:1px solid #2c3338;
    background:#1d2125;
    text-align:center;
  }
  .cal-day-view-head h3{
    margin:0;color:#f4f5f7;
    font-size:24px;font-weight:700;
    text-transform:capitalize;
  }
  .cal-day-view-head.today h3 span.daynum{color:#579dff}
  .cal-day-list{
    flex:1;overflow-y:auto;
    padding:18px 24px;
    display:flex;flex-direction:column;gap:8px;
    max-width:840px;margin:0 auto;
    width:100%;
  }
  .cal-day-event-card{
    background:#1d2125;
    border:1px solid #2c3338;
    border-left:4px solid #579dff;
    padding:12px 16px;
    border-radius:6px;
    cursor:pointer;
    display:flex;align-items:flex-start;gap:14px;
    transition:background 0.12s,border-color 0.12s;
  }
  .cal-day-event-card:hover{background:#22272b;border-color:#38414b}
  .cal-day-event-time{
    color:#cce0ff;font-weight:700;font-size:13px;
    min-width:90px;flex-shrink:0;
    padding-top:1px;
  }
  .cal-day-event-time.notime{color:#738496;font-style:italic;font-weight:600}
  .cal-day-event-body{flex:1;min-width:0}
  .cal-day-event-title{color:#f4f5f7;font-size:15px;font-weight:600;margin-bottom:4px;word-wrap:break-word}
  .cal-day-event-meta{color:#9fadbc;font-size:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .cal-day-event-notes{color:#9fadbc;font-size:12px;margin-top:6px;line-height:1.4;white-space:pre-wrap}

  .cal-empty{
    text-align:center;color:#738496;padding:80px 24px;font-size:14px;
  }
  .cal-empty h3{margin:0 0 8px;color:#b6c2cf;font-size:16px;font-weight:600}
  .cal-empty p{margin:0 0 18px}

  /* --- mobile drawer toggles (hidden on desktop) ----------------------- */
  .sidebar-toggle,
  .cal-side-toggle{display:none}
  .sidebar-backdrop{
    display:none;position:fixed;inset:0;
    background:rgba(0,0,0,0.5);
    z-index:55;opacity:0;pointer-events:none;
    transition:opacity 0.18s;
  }
  .cal-side-backdrop{
    display:none;position:absolute;inset:0;
    background:rgba(0,0,0,0.45);
    z-index:4;opacity:0;pointer-events:none;
    transition:opacity 0.18s;
  }

  /* --- responsive ------------------------------------------------------- */
  @media (max-width:780px){
    .app{
      grid-template-columns:1fr;
      grid-template-areas:"topbar" "board";
      grid-template-rows:48px 1fr;
    }
    .topbar{padding:0 10px;gap:8px}
    .topbar-logo{font-size:13px}
    .topbar-logo span{display:none}
    .topbar-logo img{height:22px}

    /* Hamburger toggle */
    .sidebar-toggle{
      display:inline-flex;
      background:transparent;border:0;color:#b6c2cf;
      width:38px;height:38px;border-radius:6px;
      align-items:center;justify-content:center;
      flex-shrink:0;
      transition:background 0.12s,color 0.12s;
    }
    .sidebar-toggle:hover,.sidebar-toggle:active{background:#2c3338;color:#f4f5f7}
    .sidebar-toggle.active{background:#1c2b41;color:#cce0ff}

    /* Sidebar becomes off-canvas drawer */
    .sidebar{
      display:flex;
      position:fixed;
      top:48px;left:0;bottom:0;
      width:80%;max-width:300px;
      border-right:1px solid #2c3338;
      z-index:60;
      transform:translateX(-100%);
      transition:transform 0.22s cubic-bezier(.4,0,.2,1);
      box-shadow:8px 0 24px rgba(0,0,0,0.5);
    }
    .sidebar.drawer-open{transform:translateX(0)}
    .sidebar-backdrop{display:block;top:48px}
    .sidebar-backdrop.show{opacity:1;pointer-events:auto}

    /* Project items: bigger tap targets */
    .project-item{padding:10px 8px}
    .project-icon{width:26px;height:26px;font-size:12px}
    .project-name{font-size:15px}
    .project-delete{opacity:1;width:30px;height:30px}

    /* Top bar buttons */
    .topbar-btn{padding:7px 10px;border-radius:6px}
    .topbar-btn span{display:none}

    /* Board */
    .board-header{padding:12px 14px;gap:8px}
    .board-title{font-size:17px;min-width:0;flex:1;max-width:none}
    .board-meta{display:none}
    .board-content{
      padding:0 14px 16px;gap:10px;
      scroll-snap-type:x mandatory;
      -webkit-overflow-scrolling:touch;
      scroll-padding-left:14px;
    }
    .column{width:84vw;max-width:300px;scroll-snap-align:start}

    /* Cards: visible delete (no hover on touch) */
    .card{padding:10px 12px}
    .card-actions{opacity:1}
    .card-action{background:rgba(0,0,0,0.35);width:28px;height:28px}
    .add-card{padding:10px 12px}

    .board-warning{margin:0 14px 10px;font-size:11.5px}
    input[type=date].date-input{padding:7px 9px;font-size:13px}

    /* Messaggi e panoramica */
    .msg-panel{top:54px;right:8px;left:8px;width:auto;max-width:none}
    .overview-filters{padding:0 14px 10px}

    /* Archivio */
    .lib-item{padding:10px}
    .lib-actions{opacity:1}
    .lib-action{background:rgba(0,0,0,0.35);width:28px;height:28px}

    /* Modal: bottom-sheet style */
    .modal-backdrop{align-items:flex-end;padding:0}
    .modal{
      max-width:100%;
      width:100%;
      border-radius:14px 14px 0 0;
      padding:20px 18px 24px;
      padding-bottom:calc(24px + env(safe-area-inset-bottom));
      max-height:92vh;
      overflow-y:auto;
    }
    .modal h2{font-size:17px}
    .modal .actions{flex-wrap:wrap;gap:6px}
    .modal .actions .btn-primary,
    .modal .actions .btn-cancel{padding:10px 16px;font-size:14px}

    /* Add-card form pills wrap */
    .add-card-form .priority-row{flex-wrap:wrap;row-gap:6px}
    .priority-pill{padding:6px 12px}

    /* Calendar header */
    .cal-header{padding:10px 12px;gap:6px;row-gap:8px}
    .cal-title{font-size:15px;gap:8px;flex-shrink:0}
    .cal-title svg{width:18px;height:18px}
    .cal-spacer{display:none}
    .cal-period{
      min-width:0;font-size:13px;
      flex:1 1 100%;text-align:left;
      order:10;padding:0 2px;
    }
    .cal-views{order:7}
    .cal-views button{padding:6px 10px;font-size:11px}
    .cal-today-btn{padding:6px 10px;font-size:11px;order:8}
    .cal-nav{order:9;margin-left:auto}
    .cal-add-btn{padding:7px 11px;font-size:12px;order:6}
    .cal-add-btn svg{width:13px;height:13px}
    .cal-close{width:34px;height:34px;flex-shrink:0}

    /* People filter: drawer */
    .cal-main{position:relative}
    .cal-side-toggle{
      display:inline-flex;
      background:#22272b;border:1px solid #38414b;color:#b6c2cf;
      width:34px;height:34px;border-radius:6px;
      align-items:center;justify-content:center;
      flex-shrink:0;
      transition:background 0.12s,color 0.12s,border-color 0.12s;
    }
    .cal-side-toggle:hover{background:#2c3338;color:#f4f5f7;border-color:#579dff}
    .cal-side-toggle.active{background:#1c2b41;color:#cce0ff;border-color:#579dff}
    .cal-side{
      position:absolute;
      top:0;left:0;bottom:0;
      width:78%;max-width:260px;
      transform:translateX(-100%);
      transition:transform 0.22s cubic-bezier(.4,0,.2,1);
      box-shadow:6px 0 18px rgba(0,0,0,0.5);
      z-index:6;
    }
    .cal-side.drawer-open{transform:translateX(0)}
    .cal-side-backdrop{display:block}
    .cal-side-backdrop.show{opacity:1;pointer-events:auto}
    .cal-person-row{padding:9px 8px}
    .cal-person-name{font-size:13px}

    /* Month view */
    .cal-month-headrow > div{padding:6px 2px;font-size:10px;letter-spacing:0.3px}
    .cal-month-grid{grid-auto-rows:minmax(72px,1fr)}
    .cal-day-cell{padding:4px 3px 2px}
    .cal-day-num{font-size:11px;padding:0 2px;margin-bottom:2px}
    .cal-day-cell.today .cal-day-num{width:20px;height:20px;font-size:11px}
    .cal-event{padding:1px 4px;font-size:10px;line-height:1.25;border-left-width:2px}
    .cal-event-more{font-size:9px;padding:0 2px}

    /* Day view */
    .cal-day-view-head{padding:14px 14px}
    .cal-day-view-head h3{font-size:18px}
    .cal-day-list{padding:12px 14px;gap:6px}
    .cal-day-event-card{padding:11px 13px;gap:8px;flex-direction:column}
    .cal-day-event-time{min-width:0;font-size:12px}
    .cal-day-event-title{font-size:14px}

    /* Prevent iOS zoom-on-focus (inputs need >=16px) */
    input[type=text],input[type=password],
    input[type=date],input[type=time],
    textarea,select{font-size:16px}
    .board-title{font-size:17px}
  }

  @media (max-width:560px){
    .cal-week{grid-auto-flow:row;grid-template-columns:1fr}
    .cal-week-col{border-right:0;border-bottom:1px solid #2c3338;min-height:80px}
    .cal-week-head{padding:8px 12px}
    .cal-week-day-num{font-size:18px}
  }

  @media (max-width:420px){
    .topbar{padding:0 6px;gap:4px}
    .topbar-btn{padding:6px 8px;border-radius:5px}
    .cal-header{padding:8px 10px}
    .cal-add-btn{width:34px;height:34px;padding:0;justify-content:center}
    .cal-add-btn svg{width:14px;height:14px}
    .cal-views button{padding:5px 8px}
    .cal-today-btn{padding:5px 8px}
    .cal-period{font-size:12px}
    .board-content{padding:0 10px 16px}
    .column{width:88vw}
  }

  /* Touch devices: always show secondary actions */
  @media (hover: none){
    .card-actions{opacity:1}
    .lib-actions{opacity:1}
    .project-delete{opacity:1}
  }
</style>
</head>

<script src="vendor/supabase-js.min.js"></script>
<script src="js/be-config.js"></script>
<script>
/* =====================================================================
 * Auth gate + data layer (Supabase)
 * ===================================================================== */
var sb = window.beClient;
var DEFAULT_COLUMNS = ["To Do", "In Progress", "Done"];

function uid(prefix){
  return prefix + "_" + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);
}

/* =====================================================================
 * State
 * ===================================================================== */
var state = {
  me: null, profiles: [], projects: [], activeProjectId: null,
  view: "board",                                   /* "board" | "overview" */
  overviewFilter: { projectId: "", onlyDue: false },
  alerts: [], msgHighlight: [],
  library: {}, libraryError: null, cardDatesError: null
};

function getActiveProject(){
  return state.projects.find(function(p){ return p.id === state.activeProjectId; }) || state.projects[0] || null;
}
function profileName(userId){
  var p = state.profiles.find(function(x){ return x.id === userId; });
  return p ? p.display_name : "?";
}

/* Le colonne due_date/done_at potrebbero non essere ancora state migrate:
   in quel caso si ricarica senza, e la UI delle date resta nascosta. */
async function fetchCards(){
  var full = await sb.from("be_cards")
    .select("id, project_id, column_id, title, priority, position, due_date, done_at")
    .order("position", { ascending: true });
  if(!full.error){ state.cardDatesError = null; return full; }
  var basic = await sb.from("be_cards")
    .select("id, project_id, column_id, title, priority, position")
    .order("position", { ascending: true });
  if(!basic.error) state.cardDatesError = full.error.message;
  return basic;
}

/* =====================================================================
 * Date: scadenza (liste di lavoro) e completamento (lista Done)
 * ===================================================================== */
var DONE_COLUMN_NAMES = ["done","fatto","fatti","completato","completati","completed","finito","finiti","chiuso","chiusi"];

function doneColumnId(proj){
  var cols = (proj.columns || []).slice().sort(function(a,b){ return a.position - b.position; });
  if(!cols.length) return null;
  var byName = cols.find(function(c){
    return DONE_COLUMN_NAMES.indexOf((c.name || "").trim().toLowerCase()) >= 0;
  });
  return byName ? byName.id : cols[cols.length - 1].id;
}

function todayISO(){
  var d = new Date();
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
}

function parseISODate(iso){
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || "");
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}

function formatDateIT(iso){
  var d = parseISODate(iso);
  if(!d) return "";
  var opts = { day: "numeric", month: "short" };
  if(d.getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
  return d.toLocaleDateString("it-IT", opts);
}

function daysUntil(iso){
  var d = parseISODate(iso);
  if(!d) return null;
  var t = new Date(); t.setHours(0,0,0,0);
  return Math.round((d - t) / 86400000);
}

function buildDateBadge(iso, isDone){
  var $b = document.createElement("span");
  $b.className = "card-badge";
  var label = formatDateIT(iso);
  var icon;
  if(isDone){
    $b.classList.add("done");
    icon = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    $b.title = "Completata il " + label;
  } else {
    var n = daysUntil(iso);
    if(n < 0){ $b.classList.add("overdue"); label = "Scaduta · " + label; }
    else if(n === 0){ $b.classList.add("soon"); label = "Oggi"; }
    else if(n === 1){ $b.classList.add("soon"); label = "Domani"; }
    else if(n <= 3){ $b.classList.add("soon"); }
    icon = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';
    $b.title = "Scadenza: " + formatDateIT(iso);
  }
  $b.innerHTML = icon + "<span></span>";
  $b.querySelector("span").textContent = label;
  return $b;
}

/* Riga con input data, usata dal form di aggiunta e dalla modale */
function buildDateField(value, isDone, inModal){
  var wrap = document.createElement("div");
  wrap.className = "date-row";
  if(!inModal){
    var lab = document.createElement("span");
    lab.className = "label";
    lab.textContent = isDone ? "Completata il" : "Scadenza";
    wrap.appendChild(lab);
  }
  var input = document.createElement("input");
  input.type = "date";
  input.className = "date-input";
  input.value = value || "";
  wrap.appendChild(input);

  var clear = document.createElement("button");
  clear.type = "button";
  clear.className = "date-clear";
  clear.textContent = "Rimuovi";
  clear.addEventListener("click", function(){ input.value = ""; });
  wrap.appendChild(clear);

  wrap.getValue = function(){ return input.value || null; };
  return wrap;
}

async function loadEverything(){
  var sessionRes = await sb.auth.getSession();
  var session = sessionRes.data && sessionRes.data.session;
  if(!session){ window.location.replace("login.html"); return false; }
  var user = session.user;
  state.me = {
    id: user.id,
    email: user.email,
    display_name: (user.user_metadata && user.user_metadata.display_name) || user.email
  };

  var results = await Promise.all([
    sb.from("be_profiles").select("id, display_name"),
    sb.from("be_projects").select("id, name, owner_id, created_at").order("created_at", { ascending: true }),
    sb.from("be_project_shares").select("project_id, user_id"),
    sb.from("be_columns").select("id, project_id, name, position").order("position", { ascending: true }),
    fetchCards()
  ]);

  for (var i = 0; i < results.length; i++){
    if(results[i].error){
      alert("Errore nel caricamento dei dati: " + results[i].error.message);
      return false;
    }
  }

  state.profiles = results[0].data || [];

  var sharesByProject = {};
  (results[2].data || []).forEach(function(s){
    (sharesByProject[s.project_id] = sharesByProject[s.project_id] || []).push(s.user_id);
  });

  var columnsByProject = {};
  var columnById = {};
  (results[3].data || []).forEach(function(c){
    var col = { id: c.id, name: c.name, position: c.position, cards: [] };
    columnById[c.id] = col;
    (columnsByProject[c.project_id] = columnsByProject[c.project_id] || []).push(col);
  });

  (results[4].data || []).forEach(function(c){
    var col = columnById[c.column_id];
    if(col) col.cards.push({
      id: c.id, title: c.title, priority: c.priority, position: c.position,
      due_date: c.due_date || null, done_at: c.done_at || null
    });
  });

  state.projects = (results[1].data || []).map(function(p){
    return {
      id: p.id,
      name: p.name,
      owner_id: p.owner_id,
      isOwner: p.owner_id === state.me.id,
      shares: sharesByProject[p.id] || [],
      columns: columnsByProject[p.id] || []
    };
  });

  if(!state.activeProjectId || !state.projects.some(function(p){ return p.id === state.activeProjectId; })){
    state.activeProjectId = state.projects.length ? state.projects[0].id : null;
  }

  await loadLibrary();
  return true;
}

/* =====================================================================
 * Rendering
 * ===================================================================== */
var $projects = document.getElementById("projects");
var $board    = document.getElementById("board");

function projectInitial(name){
  return (name || "?").trim().charAt(0).toUpperCase() || "?";
}

function buildProjectItem(proj){
  var item = document.createElement("div");
  item.className = "project-item" + (state.view === "board" && proj.id === state.activeProjectId ? " active" : "");
  item.dataset.projectId = proj.id;

  var ico = document.createElement("div");
  ico.className = "project-icon";
  ico.textContent = projectInitial(proj.name);

  var name = document.createElement("div");
  name.className = "project-name";
  name.textContent = proj.name;
  name.title = proj.isOwner ? proj.name : (proj.name + " · di " + profileName(proj.owner_id));

  item.appendChild(ico);
  item.appendChild(name);

  if(proj.isOwner){
    var share = document.createElement("button");
    share.className = "project-share";
    share.title = "Condividi progetto";
    share.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.6" x2="15.4" y2="6.4"/><line x1="8.6" y1="13.4" x2="15.4" y2="17.6"/></svg>';
    share.addEventListener("click", function(e){
      e.stopPropagation();
      openShareModal(proj.id);
    });
    item.appendChild(share);

    var del = document.createElement("button");
    del.className = "project-delete";
    del.title = "Elimina progetto";
    del.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>';
    del.addEventListener("click", function(e){
      e.stopPropagation();
      deleteProject(proj.id);
    });
    item.appendChild(del);
  }

  item.addEventListener("click", function(){
    state.view = "board";
    state.activeProjectId = proj.id;
    render();
  });

  return item;
}

function buildSidebarSectionHeader(title){
  var h = document.createElement("div");
  h.className = "sidebar-section-title";

  var label = document.createElement("span");
  label.textContent = title;
  h.appendChild(label);

  var add = document.createElement("button");
  add.className = "sidebar-section-add";
  add.title = "Nuovo progetto";
  add.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
  add.addEventListener("click", function(){ promptNewProject(); });
  h.appendChild(add);

  return h;
}

/* Voce fissa in cima: To Do / In Progress / Done di tutti i progetti */
function buildOverviewItem(){
  var item = document.createElement("div");
  item.className = "project-item overview-item" + (state.view === "overview" ? " active" : "");
  item.title = "Tutte le card di tutti i progetti";
  item.innerHTML =
    '<div class="project-icon">' +
      '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>' +
    '</div>' +
    '<div class="project-name">Panoramica</div>';
  item.addEventListener("click", function(){
    state.view = "overview";
    render();
  });
  return item;
}

function renderSidebar(){
  $projects.innerHTML = "";

  $projects.appendChild(buildOverviewItem());
  $projects.appendChild(buildSidebarSectionHeader("Progetti"));

  if(!state.projects.length){
    var empty = document.createElement("div");
    empty.className = "empty-projects";
    empty.textContent = "Nessuno. Creane uno con +";
    $projects.appendChild(empty);
    return;
  }

  state.projects.forEach(function(proj){ $projects.appendChild(buildProjectItem(proj)); });
}

function openShareModal(projectId){
  var proj = state.projects.find(function(p){ return p.id === projectId; });
  if(!proj) return;
  var others = state.profiles.filter(function(p){ return p.id !== state.me.id; });

  var backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML =
    '<div class="modal" role="dialog">' +
      '<h2>Condividi &laquo;' + proj.name.replace(/</g,"&lt;") + '&raquo;</h2>' +

async function toggleShare(proj, userId, add, $row){
  $row.style.pointerEvents = "none";
  var res;
  if(add){
    res = await sb.from("be_project_shares").insert({ project_id: proj.id, user_id: userId });
  } else {
    res = await sb.from("be_project_shares").delete().eq("project_id", proj.id).eq("user_id", userId);
  }
  $row.style.pointerEvents = "";
  if(res.error){ alert("Errore: " + res.error.message); return; }
  if(add){
    proj.shares.push(userId);
    $row.classList.add("checked");
  } else {
    proj.shares = proj.shares.filter(function(id){ return id !== userId; });
    $row.classList.remove("checked");
  }
}

function renderBoard(){

  }

  if(proj.isOwner){

      if(res.error){ alert("Errore: " + res.error.message); title.value = proj.name; return; }
      proj.name = v;

    });
  }
  var meta = document.createElement("span");
  meta.className = "board-meta";
  var totalCards = cols.reduce(function(sum,col){ return sum + col.cards.length; }, 0);
  var docCount = libraryItems(proj.id).length;
  meta.textContent = totalCards + " card · " + (cols.length + 1) + " liste · " + docCount +
    (docCount === 1 ? " elemento in Archivio" : " elementi in Archivio") +
    (proj.isOwner ? "" : " · condiviso da " + profileName(proj.owner_id));
  header.appendChild(title);
  header.appendChild(meta);
  $board.appendChild(header);

  if(state.cardDatesError){
    var $warn = document.createElement("div");
    $warn.className = "board-warning";
    $warn.textContent = "Scadenze e date di completamento non attive: " + state.cardDatesError +
      " — esegui sql/scadenze.sql sul database Supabase.";
    $board.appendChild($warn);
  }

  // Columns
  var content = document.createElement("div");
  content.className = "board-content";

  var doneColId = doneColumnId(proj);

  cols.forEach(function(col){
    var isDoneCol = col.id === doneColId;
    var $col = document.createElement("section");
    $col.className = "column";
    $col.dataset.columnId = col.id;

    var $head = document.createElement("div");
    $head.className = "column-header";
    var $t = document.createElement("div");
    $t.className = "column-title";
    var cnt = col.cards.length;
    $t.innerHTML = '<span>' + col.name + '</span><span class="column-count">' + cnt + '</span>';
    $head.appendChild($t);
    $col.appendChild($head);

    var $cards = document.createElement("div");
    $cards.className = "cards";
    $cards.dataset.columnId = col.id;
    col.cards.slice().sort(function(a,b){ return a.position - b.position; }).forEach(function(card){
      $cards.appendChild(buildCardEl(card, col.id, isDoneCol));
    });
    $col.appendChild($cards);

    var $add = document.createElement("button");
    $add.className = "add-card";
    $add.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Aggiungi una carta';
    $add.addEventListener("click", function(){
      openAddCardForm($col, col.id, isDoneCol);
    });
    $col.appendChild($add);

    // drop zone events on the whole column
    $col.addEventListener("dragover", function(e){
      e.preventDefault();
      e.dataTransfer.dropEffect = "move";
      $col.classList.add("drag-over");
    });
    $col.addEventListener("dragleave", function(e){
      if(e.target === $col || !$col.contains(e.relatedTarget)){
        $col.classList.remove("drag-over");
      }
    });
    $col.addEventListener("drop", function(e){
      e.preventDefault();
      $col.classList.remove("drag-over");
      var cardId = e.dataTransfer.getData("text/card-id");
      var fromCol = e.dataTransfer.getData("text/from-col");
      if(!cardId) return;

      // figure out drop position relative to the cards in this column
      var afterEl = getDragAfterElement($cards, e.clientY);
      moveCard(cardId, fromCol, col.id, afterEl ? afterEl.dataset.cardId : null);
    });

    content.appendChild($col);
  });

  content.appendChild(buildLibraryColumn(proj));

  $board.appendChild(content);
  renderAlerts();
}

/* =====================================================================
 * Panoramica: To Do / In Progress / Done di tutti i progetti
 * ===================================================================== */
var OVERVIEW_LISTS = [
  { key: "todo",  label: "To Do" },
  { key: "doing", label: "In Progress" },
  { key: "done",  label: "Done" }
];

/* Le card di ogni progetto vengono raggruppate nelle tre voci standard:
   l'ultima lista (o quella chiamata Done) e' "done", la prima delle altre
   e' "todo", le rimanenti "doing". */
function overviewEntries(){
  var out = { todo: [], doing: [], done: [] };
  var filter = state.overviewFilter;

  state.projects.forEach(function(proj){
    if(filter.projectId && proj.id !== filter.projectId) return;
    var cols = proj.columns.slice().sort(function(a,b){ return a.position - b.position; });
    var doneId = doneColumnId(proj);
    var workIndex = 0;
    cols.forEach(function(col){
      var key;
      if(col.id === doneId){ key = "done"; }
      else { key = workIndex === 0 ? "todo" : "doing"; workIndex++; }
      col.cards.slice().sort(function(a,b){ return a.position - b.position; }).forEach(function(card){
        var date = key === "done" ? card.done_at : card.due_date;
        if(filter.onlyDue && !date) return;
        out[key].push({ card: card, proj: proj, col: col, isDone: key === "done", date: date });
      });
    });
  });

  Object.keys(out).forEach(function(key){
    var recentFirst = key === "done";
    out[key].sort(function(a,b){
      if(a.date && b.date){
        if(a.date === b.date) return a.proj.name.localeCompare(b.proj.name);
        if(recentFirst) return a.date < b.date ? 1 : -1;
        return a.date < b.date ? -1 : 1;
      }
      if(a.date) return -1;
      if(b.date) return 1;
      return a.proj.name.localeCompare(b.proj.name);
    });
  });

  return out;
}

function buildCardEl(card, columnId, isDoneCol, ctx){
  ctx = ctx || {};
  var proj = ctx.proj || getActiveProject();
  var isStatic = ctx.showProject === true;

  var $card = document.createElement("article");
  $card.className = "card" + (isStatic ? " static" : "");
  $card.draggable = !isStatic;
  $card.dataset.cardId = card.id;
  $card.dataset.columnId = columnId;

  if(isStatic && proj){
    var $pj = document.createElement("div");
    $pj.className = "card-project";
    $pj.textContent = proj.name;
    $pj.title = proj.name;
    $card.appendChild($pj);
  }

  if(card.priority){
    var $p = document.createElement("span");
    $p.className = "card-priority " + card.priority;
    $card.appendChild($p);
  }

  var $t = document.createElement("div");
  $t.className = "card-title";
  $t.textContent = card.title;
  $card.appendChild($t);

  var dateValue = isDoneCol ? card.done_at : card.due_date;
  if(!state.cardDatesError && dateValue){
    var $badges = document.createElement("div");
    $badges.className = "card-badges";
    $badges.appendChild(buildDateBadge(dateValue, isDoneCol));
    $card.appendChild($badges);
  }

  var $actions = document.createElement("div");
  $actions.className = "card-actions";
  var $del = document.createElement("button");
  $del.className = "card-action";
  $del.title = "Elimina";
  $del.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
  $del.addEventListener("click", function(e){
    e.stopPropagation();
    deleteCard(card.id, columnId, proj);
  });
  $actions.appendChild($del);
  $card.appendChild($actions);

  // edit on click
  $card.addEventListener("click", function(e){
    if(e.target.closest(".card-action")) return;
    openEditCardModal(card.id, columnId, isDoneCol, proj);
  });

  // dragging (nella Panoramica le card non si trascinano)
  if(!isStatic){
    $card.addEventListener("dragstart", function(e){
      $card.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/card-id", card.id);
      e.dataTransfer.setData("text/from-col", columnId);
    });
    $card.addEventListener("dragend", function(){
      $card.classList.remove("dragging");
      document.querySelectorAll(".column.drag-over").forEach(function(c){ c.classList.remove("drag-over"); });
    });
  }

  return $card;
}

function getDragAfterElement(container, y){
  var els = Array.prototype.slice.call(container.querySelectorAll(".card:not(.dragging)"));
  var closest = null, closestOffset = -Infinity;
  for(var i=0;i<els.length;i++){
    var box = els[i].getBoundingClientRect();
    var offset = y - box.top - box.height / 2;
    if(offset < 0 && offset > closestOffset){
      closestOffset = offset;
      closest = els[i];
    }
  }
  return closest;
}

/* =====================================================================
 * Mutations
 * ===================================================================== */
async function moveCard(cardId, fromColId, toColId, beforeCardId){
  var proj = getActiveProject(); if(!proj) return;
  var fromCol = proj.columns.find(function(c){ return c.id === fromColId; });
  var toCol = proj.columns.find(function(c){ return c.id === toColId; });
  if(!fromCol || !toCol) return;
  var idx = fromCol.cards.findIndex(function(c){ return c.id === cardId; });
  if(idx < 0) return;
  var card = fromCol.cards.splice(idx,1)[0];
  if(beforeCardId){
    var bIdx = toCol.cards.findIndex(function(c){ return c.id === beforeCardId; });
    if(bIdx >= 0){ toCol.cards.splice(bIdx, 0, card); }
    else toCol.cards.push(card);
  } else {
    toCol.cards.push(card);
  }

  var doneColId = doneColumnId(proj);
  var doneChanged = false;
  if(!state.cardDatesError && fromCol.id !== toCol.id){
    if(toCol.id === doneColId && !card.done_at){
      card.done_at = todayISO();
      doneChanged = true;
    } else if(fromCol.id === doneColId && card.done_at){
      card.done_at = null;
      doneChanged = true;
    }
  }
  renderBoard();

  var updates = [];
  if(fromCol.id !== toCol.id){
    fromCol.cards.forEach(function(c, i){
      c.position = i;
      updates.push(sb.from("be_cards").update({ position: i }).eq("id", c.id));
    });
  }
  toCol.cards.forEach(function(c, i){
    c.position = i;
    var payload = { position: i };
    if(c.id === cardId && fromCol.id !== toCol.id) payload.column_id = toColId;
    if(c.id === cardId && doneChanged) payload.done_at = card.done_at;
    updates.push(sb.from("be_cards").update(payload).eq("id", c.id));
  });
  var results = await Promise.all(updates);
  var failed = results.find(function(r){ return r.error; });
  if(failed){
    alert("Errore nel salvataggio dello spostamento: " + failed.error.message);
    var ok = await loadEverything();
    if(ok) render();
  }
}

async function deleteCard(cardId, columnId, projArg){
  var proj = projArg || getActiveProject(); if(!proj) return;
  var col = proj.columns.find(function(c){ return c.id === columnId; });
  if(!col) return;
  var res = await sb.from("be_cards").delete().eq("id", cardId);
  if(res.error){ alert("Errore: " + res.error.message); return; }
  col.cards = col.cards.filter(function(c){ return c.id !== cardId; });
  renderBoard();
}

async function addCard(columnId, title, priority, dateValue, isDoneCol){
  var proj = getActiveProject(); if(!proj) return;
  var col = proj.columns.find(function(c){ return c.id === columnId; });
  if(!col) return;
  var payload = {
    project_id: proj.id,
    column_id: columnId,
    title: title.trim(),
    priority: priority || null,
    position: col.cards.length,
    created_by: state.me.id
  };
  if(!state.cardDatesError){
    payload.due_date = isDoneCol ? null : (dateValue || null);
    payload.done_at  = isDoneCol ? (dateValue || null) : null;
  }
  var res = await sb.from("be_cards").insert(payload).select().single();
  if(res.error){ alert("Errore: " + res.error.message); return; }
  col.cards.push({
    id: res.data.id, title: res.data.title, priority: res.data.priority, position: res.data.position,
    due_date: res.data.due_date || null, done_at: res.data.done_at || null
  });
  renderBoard();
}

async function updateCard(cardId, columnId, title, priority, dateValue, isDoneCol, projArg){
  var proj = projArg || getActiveProject(); if(!proj) return;
  var col = proj.columns.find(function(c){ return c.id === columnId; });
  if(!col) return;
  var card = col.cards.find(function(c){ return c.id === cardId; });
  if(!card) return;
  var payload = { title: title.trim(), priority: priority || null };
  if(!state.cardDatesError){
    if(isDoneCol) payload.done_at = dateValue || null;
    else payload.due_date = dateValue || null;
  }
  var res = await sb.from("be_cards").update(payload).eq("id", cardId);
  if(res.error){ alert("Errore: " + res.error.message); return; }
  card.title = payload.title;
  card.priority = payload.priority;
  if(!state.cardDatesError){
    if(isDoneCol) card.done_at = payload.done_at;
    else card.due_date = payload.due_date;
  }
  renderBoard();
}

async function deleteProject(projectId){
  if(!confirm("Eliminare definitivamente questo progetto? Verranno eliminati anche colonne, card, elementi dell'Archivio e condivisioni.")) return;
  var paths = (state.library[projectId] || [])
    .filter(function(it){ return it.kind === "file" && it.storage_path; })
    .map(function(it){ return it.storage_path; });
  var res = await sb.from("be_projects").delete().eq("id", projectId);
  if(res.error){ alert("Errore: " + res.error.message); return; }
  if(paths.length){ try { await sb.storage.from(LIBRARY_BUCKET).remove(paths); } catch(e){} }
  delete state.library[projectId];
  state.projects = state.projects.filter(function(p){ return p.id !== projectId; });
  if(state.activeProjectId === projectId){
    state.activeProjectId = state.projects.length ? state.projects[0].id : null;
  }
  render();
}

function promptNewProject(){
  showInputModal({
    title: "Nuovo progetto",
    label: "Nome del progetto",
    placeholder: "Es. Sito istituzionale",
    confirmText: "Crea",
    onConfirm: async function(name){
      var n = name.trim();
      if(!n) return;
      var pRes = await sb.from("be_projects").insert({ owner_id: state.me.id, name: n }).select().single();
      if(pRes.error){ alert("Errore: " + pRes.error.message); return; }
      var project = pRes.data;
      var colsPayload = DEFAULT_COLUMNS.map(function(colName, i){
        return { project_id: project.id, name: colName, position: i };
      });
      var cRes = await sb.from("be_columns").insert(colsPayload).select();
      if(cRes.error){ alert("Errore nella creazione delle colonne: " + cRes.error.message); }
      var columns = (cRes.data || []).map(function(c){
        return { id: c.id, name: c.name, position: c.position, cards: [] };
      });
      state.projects.push({
        id: project.id, name: project.name, owner_id: project.owner_id,
        isOwner: true, shares: [], columns: columns
      });
      state.activeProjectId = project.id;
      state.view = "board";
      render();
    }
  });
}

function openAddCardForm($col, columnId, isDoneCol){
  // close any other open form
  document.querySelectorAll(".add-card-form").forEach(function(f){ f.remove(); });
  document.querySelectorAll(".add-card").forEach(function(b){ b.style.display = ""; });

  var $existingBtn = $col.querySelector(".add-card");
  if($existingBtn) $existingBtn.style.display = "none";

  var form = document.createElement("div");
  form.className = "add-card-form";
  form.innerHTML =
    '<textarea placeholder="Inserisci un titolo per la carta..."></textarea>' +
    '<div class="priority-row">' +
      '<span class="label">Priorità</span>' +
      '<button class="priority-pill" data-priority="red"   ><span class="dot red"></span>Alta</button>' +
      '<button class="priority-pill" data-priority="yellow"><span class="dot yellow"></span>Media</button>' +
      '<button class="priority-pill active" data-priority="green" ><span class="dot green"></span>Bassa</button>' +
    '</div>' +
    '<div class="actions">' +
      '<button class="btn-primary">Aggiungi carta</button>' +
      '<button class="btn-cancel">Annulla</button>' +
    '</div>';
  $col.appendChild(form);

  var $dateField = null;
  if(!state.cardDatesError){
    $dateField = buildDateField(isDoneCol ? todayISO() : "", isDoneCol, false);
    form.insertBefore($dateField, form.querySelector(".actions"));
  }

  var $ta      = form.querySelector("textarea");
  var $confirm = form.querySelector(".btn-primary");
  var $cancel  = form.querySelector(".btn-cancel");
  var $pills   = form.querySelectorAll(".priority-pill");
  var priority = "green";

  $pills.forEach(function(p){
    p.addEventListener("click", function(){
      $pills.forEach(function(x){ x.classList.remove("active"); });
      p.classList.add("active");
      priority = p.dataset.priority;
    });
  });

  function close(){
    form.remove();
    if($existingBtn) $existingBtn.style.display = "";
  }
  function commit(){
    var v = $ta.value.trim();
    if(!v){ $ta.focus(); return; }
    addCard(columnId, v, priority, $dateField ? $dateField.getValue() : null, isDoneCol);
  }
  $confirm.addEventListener("click", commit);
  $cancel.addEventListener("click", close);
  $ta.addEventListener("keydown", function(e){
    if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); commit(); }
    if(e.key === "Escape"){ close(); }
  });
  $ta.focus();
}

function openEditCardModal(cardId, columnId, isDoneCol, projArg){
  var proj = projArg || getActiveProject(); if(!proj) return;
  var col = proj.columns.find(function(c){ return c.id === columnId; });
  var card = col && col.cards.find(function(c){ return c.id === cardId; });
  if(!card) return;

  var backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML =
    '<div class="modal" role="dialog">' +
      '<h2>Modifica carta</h2>' +
      '<label>Titolo</label>' +
      '<textarea id="m-title"></textarea>' +
      '<label>Priorità</label>' +
      '<div class="priority-row" style="margin-bottom:14px">' +
        '<button class="priority-pill" data-priority="red"   ><span class="dot red"></span>Alta</button>' +
        '<button class="priority-pill" data-priority="yellow"><span class="dot yellow"></span>Media</button>' +
        '<button class="priority-pill" data-priority="green" ><span class="dot green"></span>Bassa</button>' +
      '</div>' +
      '<div id="m-date-slot"></div>' +
      '<div class="actions">' +
        '<button class="btn-cancel" id="m-cancel">Annulla</button>' +
        '<button class="btn-primary" id="m-save">Salva</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(backdrop);

  var $ta = backdrop.querySelector("#m-title");
  $ta.value = card.title;
  setTimeout(function(){ $ta.focus(); $ta.select(); }, 0);

  var $dateField = null;
  var $slot = backdrop.querySelector("#m-date-slot");
  if(state.cardDatesError){
    $slot.remove();
  } else {
    var lab = document.createElement("label");
    lab.textContent = isDoneCol ? "Completata il" : "Scadenza";
    $slot.appendChild(lab);
    $dateField = buildDateField(isDoneCol ? card.done_at : card.due_date, isDoneCol, true);
    $dateField.style.marginTop = "0";
    $dateField.style.marginBottom = "14px";
    $slot.appendChild($dateField);
  }

  var priority = card.priority || "green";
  var $pills = backdrop.querySelectorAll(".priority-pill");
  $pills.forEach(function(p){
    if(p.dataset.priority === priority) p.classList.add("active");
    p.addEventListener("click", function(){
      $pills.forEach(function(x){ x.classList.remove("active"); });
      p.classList.add("active");
      priority = p.dataset.priority;
    });
  });

  function close(){ backdrop.remove(); document.removeEventListener("keydown", onKey); }
  function save(){
    var v = $ta.value.trim();
    if(!v) { $ta.focus(); return; }
    updateCard(cardId, columnId, v, priority, $dateField ? $dateField.getValue() : null, isDoneCol, proj);
    close();
  }
  function onKey(e){
    if(e.key === "Escape") close();
    if(e.key === "Enter" && (e.metaKey || e.ctrlKey)) save();
  }
  document.addEventListener("keydown", onKey);

  backdrop.addEventListener("click", function(e){ if(e.target === backdrop) close(); });
  backdrop.querySelector("#m-cancel").addEventListener("click", close);
  backdrop.querySelector("#m-save").addEventListener("click", save);
}

function showInputModal(opts){

  backdrop.className = "modal-backdrop";
  backdrop.innerHTML =

      '<h2></h2>' +
      '<label></label>' +

        '<button class="btn-cancel" id="m-cancel">Annulla</button>' +
        '<button class="btn-primary" id="m-confirm"></button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(backdrop);

  backdrop.querySelector("h2").textContent = opts.title;
  backdrop.querySelector("label").textContent = opts.label;
  var $i = backdrop.querySelector("#m-input");
  $i.placeholder = opts.placeholder || "";
  var $c = backdrop.querySelector("#m-confirm");
  $c.textContent = opts.confirmText || "OK";

  setTimeout(function(){ $i.focus(); }, 0);

  function close(){ backdrop.remove(); document.removeEventListener("keydown", onKey); }
  function commit(){
    var v = $i.value;
    close();
    if(opts.onConfirm) opts.onConfirm(v);
  }
  function onKey(e){
    if(e.key === "Escape") close();
    if(e.key === "Enter") commit();
  }
  document.addEventListener("keydown", onKey);

  backdrop.addEventListener("click", function(e){ if(e.target === backdrop) close(); });
  backdrop.querySelector("#m-cancel").addEventListener("click", close);
  $c.addEventListener("click", commit);
}
