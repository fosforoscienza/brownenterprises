var LIBRARY_BUCKET = "be-library";
var LIBRARY_MAX_BYTES = 50 * 1024 * 1024;
var pendingUploads = [];

async function loadLibrary(){
  var res = await sb.from("be_library_items")
    .select("id, project_id, kind, title, url, storage_path, mime_type, size_bytes, position, created_by")
    .order("position", { ascending: true });
  if(res.error){
    state.library = {};
    state.libraryError = res.error.message;
    return;
  }
  state.libraryError = null;
  var byProject = {};
  (res.data || []).forEach(function(it){
    (byProject[it.project_id] = byProject[it.project_id] || []).push(it);
  });
  state.library = byProject;
}

function libraryItems(projectId){
  return (state.library[projectId] || []).slice().sort(function(a,b){ return a.position - b.position; });
}

function fileExtension(name){
  var m = /\.([A-Za-z0-9]{1,8})$/.exec(name || "");
  return m ? m[1].toLowerCase() : "";
}

function formatBytes(n){
  if(n === null || n === undefined) return "";
  if(n < 1024) return n + " B";
  var units = ["KB","MB","GB"], i = -1, v = n;
  do { v = v / 1024; i++; } while(v >= 1024 && i < units.length - 1);
  return (v >= 10 ? Math.round(v) : v.toFixed(1)) + " " + units[i];
}

function safeFileName(name){
  return (name || "file")
    .normalize("NFKD")
    .replace(/[^A-Za-z0-9._-]+/g, "_")
    .replace(/_{2,}/g, "_")
    .slice(-80);
}

function linkHost(url){
  try { return new URL(url).hostname.replace(/^www\./, ""); } catch(e){ return ""; }
}

function isDriveHost(host){
  return /(^|\.)(drive|docs|sheets|slides)\.google\.com$/.test(host);
}

var LIB_ICON_COLORS = {
  pdf:"#f87168",
  doc:"#579dff", docx:"#579dff", odt:"#579dff", rtf:"#579dff", pages:"#579dff",
  xls:"#4bce97", xlsx:"#4bce97", csv:"#4bce97", numbers:"#4bce97",
  ppt:"#f5a623", pptx:"#f5a623", key:"#f5a623",
  png:"#c9a6ff", jpg:"#c9a6ff", jpeg:"#c9a6ff", gif:"#c9a6ff", webp:"#c9a6ff",
  svg:"#c9a6ff", heic:"#c9a6ff", ai:"#c9a6ff", psd:"#c9a6ff",
  mp4:"#f5cd47", mov:"#f5cd47", mp3:"#f5cd47", wav:"#f5cd47",
  zip:"#8c9bab", rar:"#8c9bab", "7z":"#8c9bab"
};

function buildLibIcon(item){
  var box = document.createElement("div");
  box.className = "lib-icon";
  if(item.kind === "link"){
    var host = linkHost(item.url);
    if(isDriveHost(host)){
      box.classList.add("drive");
      box.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>';
    } else {
      box.classList.add("link");
      box.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>';
    }
    return box;
  }
  var ext = fileExtension(item.title) || fileExtension(item.storage_path || "");
  box.style.background = LIB_ICON_COLORS[ext] || "#8c9bab";
  box.textContent = ext ? ext.slice(0,4) : "FILE";
  return box;
}

function buildLibItem(proj, item){
  var $it = document.createElement("article");
  $it.className = "lib-item";
  $it.appendChild(buildLibIcon(item));

  var $body = document.createElement("div");
  $body.className = "lib-body";
  var $t = document.createElement("div");
  $t.className = "lib-title";
  $t.textContent = item.title;
  $body.appendChild($t);

  var bits = [];
  if(item.kind === "link"){
    var host = linkHost(item.url);
    bits.push(isDriveHost(host) ? "Google Drive" : (host || "link"));
  } else {
    var ext = fileExtension(item.title);
    if(ext) bits.push(ext.toUpperCase());
    if(item.size_bytes) bits.push(formatBytes(item.size_bytes));
  }
  if(item.created_by) bits.push(profileName(item.created_by));
  var $m = document.createElement("div");
  $m.className = "lib-meta";
  $m.textContent = bits.join(" · ");
  $m.title = item.kind === "link" ? item.url : bits.join(" · ");
  $body.appendChild($m);
  $it.appendChild($body);

  var $actions = document.createElement("div");
  $actions.className = "lib-actions";

  if(item.kind === "file"){
    var $dl = document.createElement("button");
    $dl.className = "lib-action";
    $dl.title = "Scarica";
    $dl.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
    $dl.addEventListener("click", function(e){
      e.stopPropagation();
      openLibraryItem(item, true);
    });
    $actions.appendChild($dl);
  }

  var $del = document.createElement("button");
  $del.className = "lib-action danger";
  $del.title = "Elimina";
  $del.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
  $del.addEventListener("click", function(e){
    e.stopPropagation();
    deleteLibraryItem(proj.id, item.id);
  });
  $actions.appendChild($del);
  $it.appendChild($actions);

  $it.addEventListener("click", function(e){
    if(e.target.closest(".lib-action")) return;
    openLibraryItem(item, false);
  });

  return $it;
}

function buildLibraryColumn(proj){
  var items = libraryItems(proj.id);
  var uploads = pendingUploads.filter(function(u){ return u.projectId === proj.id; });

  var $col = document.createElement("section");
  $col.className = "column library";

  var $head = document.createElement("div");

  $head.innerHTML =
    '<div class="column-title">' +
      '<span class="lib-head">' +
        '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>' +
        'Archivio' +
      '</span>' +
      '<span class="column-count">' + items.length + '</span>' +
    '</div>';
  $col.appendChild($head);

  var $list = document.createElement("div");
  $list.className = "lib-items";

  if(state.libraryError){
    var $warn = document.createElement("div");
    $warn.className = "lib-warning";
    $warn.textContent = "Archivio non disponibile: " + state.libraryError +
      " — esegui sql/archivio.sql sul database Supabase.";
    $list.appendChild($warn);
  }

  uploads.forEach(function(u){
    var $up = document.createElement("div");
    $up.className = "lib-upload";
    $up.innerHTML = '<div class="lib-spinner"></div>';
    var $b = document.createElement("div");
    $b.className = "lib-body";
    $b.innerHTML = '<div class="lib-title"></div><div class="lib-meta">Caricamento in corso…</div>';
    $b.querySelector(".lib-title").textContent = u.name;
    $up.appendChild($b);
    $list.appendChild($up);
  });

  if(!items.length && !uploads.length && !state.libraryError){
    var $empty = document.createElement("div");
    $empty.className = "lib-empty";
    $empty.textContent = "Archivio vuoto. Trascina qui i file oppure aggiungi un link (Drive, Dropbox, una pagina web…).";
    $list.appendChild($empty);
  }

  items.forEach(function(item){ $list.appendChild(buildLibItem(proj, item)); });
  $col.appendChild($list);

  var $hint = document.createElement("div");
  $hint.className = "lib-drop-hint";
  $hint.textContent = "Rilascia qui per caricare";
  $col.appendChild($hint);

  var $file = document.createElement("input");
  $file.type = "file";
  $file.multiple = true;
  $file.style.display = "none";
  $file.addEventListener("change", function(){
    var files = $file.files;
    $file.value = "";
    uploadLibraryFiles(proj, files);
  });
  $col.appendChild($file);

  var $buttons = document.createElement("div");
  $buttons.className = "lib-buttons";

  var $addFile = document.createElement("button");
  $addFile.className = "add-card";
  $addFile.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> Carica un file';
  $addFile.addEventListener("click", function(){ $file.click(); });
  $buttons.appendChild($addFile);

  var $addLink = document.createElement("button");
  $addLink.className = "add-card";
  $addLink.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg> Aggiungi un link';
  $addLink.addEventListener("click", function(){ openAddLinkModal(proj); });
  $buttons.appendChild($addLink);

  $col.appendChild($buttons);

  /* --- drag & drop di file e link ---------------------------------------- */
  function dragKind(e){
    var dt = e.dataTransfer;
    if(!dt) return null;
    var types = dt.types ? Array.prototype.slice.call(dt.types) : [];
    if(types.indexOf("Files") >= 0) return "file";
    if(types.indexOf("text/uri-list") >= 0) return "link";
    return null;
  }
  function onOver(e){
    if(!dragKind(e)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "copy";
    $col.classList.add("file-over");
  }
  $col.addEventListener("dragenter", onOver);
  $col.addEventListener("dragover", onOver);
  $col.addEventListener("dragleave", function(e){
    if(e.target === $col || !$col.contains(e.relatedTarget)) $col.classList.remove("file-over");
  });
  $col.addEventListener("drop", function(e){
    var kind = dragKind(e);
    if(!kind) return;
    e.preventDefault();
    $col.classList.remove("file-over");
    if(kind === "file" && e.dataTransfer.files && e.dataTransfer.files.length){
      uploadLibraryFiles(proj, e.dataTransfer.files);
      return;
    }
    var uri = (e.dataTransfer.getData("text/uri-list") || e.dataTransfer.getData("text/plain") || "")
      .split("\n")
      .map(function(l){ return l.trim(); })
      .filter(function(l){ return l && l.charAt(0) !== "#"; })[0];
    if(uri) addLibraryLink(proj, uri, "");
  });

  return $col;
}

/* --- mutazioni Archivio --------------------------------------------------- */
function libraryUnavailable(){
  if(!state.libraryError) return false;
  alert("L'Archivio non è ancora attivo sul database.\n\n" + state.libraryError +
        "\n\nEsegui lo script sql/archivio.sql nell'editor SQL di Supabase.");
  return true;
}

async function uploadLibraryFiles(proj, fileList){
  if(libraryUnavailable()) return;
  var files = Array.prototype.slice.call(fileList || []);
  if(!files.length) return;

  var tooBig = files.filter(function(f){ return f.size > LIBRARY_MAX_BYTES; });
  files = files.filter(function(f){ return f.size <= LIBRARY_MAX_BYTES; });
  if(tooBig.length){
    alert("File troppo grandi (limite " + formatBytes(LIBRARY_MAX_BYTES) + "):\n" +
      tooBig.map(function(f){ return "· " + f.name + " (" + formatBytes(f.size) + ")"; }).join("\n"));
  }
  if(!files.length) return;

  var tickets = files.map(function(f){
    var t = { projectId: proj.id, name: f.name };
    pendingUploads.push(t);
    return t;
  });
  renderBoard();

  var errors = [];
  for(var i = 0; i < files.length; i++){
    var err = await uploadOneFile(proj, files[i]);
    if(err) errors.push(files[i].name + ": " + err);
    pendingUploads = pendingUploads.filter(function(t){ return t !== tickets[i]; });
    renderBoard();
  }
  if(errors.length) alert("Caricamento non riuscito:\n" + errors.join("\n"));
}

async function uploadOneFile(proj, file){
  var items = state.library[proj.id] || (state.library[proj.id] = []);
  var path = proj.id + "/" + uid("f").slice(2) + "_" + safeFileName(file.name);

  var up = await sb.storage.from(LIBRARY_BUCKET).upload(path, file, {
    cacheControl: "3600",
    upsert: false,
    contentType: file.type || "application/octet-stream"
  });
  if(up.error) return up.error.message;

  var ins = await sb.from("be_library_items").insert({
    project_id: proj.id,
    kind: "file",
    title: file.name,
    storage_path: path,
    mime_type: file.type || null,
    size_bytes: file.size,
    position: items.length,
    created_by: state.me.id
  }).select().single();

  if(ins.error){
    try { await sb.storage.from(LIBRARY_BUCKET).remove([path]); } catch(e){}
    return ins.error.message;
  }
  items.push(ins.data);
  return null;
}

function normalizeUrl(raw){
  var v = (raw || "").trim();
  if(!v) return null;
  if(!/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(v)) v = "https://" + v;
  try {
    var u = new URL(v);
    if(u.protocol !== "http:" && u.protocol !== "https:") return null;
    return u.href;
  } catch(e){ return null; }
}

function titleFromUrl(url){
  try {
    var u = new URL(url);
    var host = u.hostname.replace(/^www\./, "");
    if(isDriveHost(host)) return "Documento su Google Drive";
    var seg = u.pathname.split("/").filter(Boolean).pop();
    if(seg) return decodeURIComponent(seg).replace(/[-_]+/g, " ").slice(0, 80);
    return host;
  } catch(e){ return url.slice(0, 80); }
}

async function addLibraryLink(proj, rawUrl, rawTitle){
  if(libraryUnavailable()) return;
  var url = normalizeUrl(rawUrl);
  if(!url){ alert("Indirizzo non valido. Usa un URL http:// o https://"); return; }
  var items = state.library[proj.id] || (state.library[proj.id] = []);
  var title = (rawTitle || "").trim() || titleFromUrl(url);

  var res = await sb.from("be_library_items").insert({
    project_id: proj.id,
    kind: "link",
    title: title,
    url: url,
    position: items.length,
    created_by: state.me.id
  }).select().single();
  if(res.error){ alert("Errore: " + res.error.message); return; }
  items.push(res.data);
  renderBoard();
}

async function deleteLibraryItem(projectId, itemId){
  var items = state.library[projectId] || [];
  var item = items.find(function(it){ return it.id === itemId; });
  if(!item) return;
  if(!confirm("Eliminare «" + item.title + "» dall'Archivio?")) return;

  var res = await sb.from("be_library_items").delete().eq("id", itemId);
  if(res.error){ alert("Errore: " + res.error.message); return; }
  if(item.kind === "file" && item.storage_path){
    var rm = await sb.storage.from(LIBRARY_BUCKET).remove([item.storage_path]);
    if(rm.error) console.warn("File non rimosso dallo storage:", rm.error.message);
  }
  state.library[projectId] = items.filter(function(it){ return it.id !== itemId; });
  renderBoard();
}

async function openLibraryItem(item, forceDownload){
  if(item.kind === "link"){
    window.open(item.url, "_blank", "noopener");
    return;
  }
  var win = window.open("", "_blank");
  var opts = forceDownload ? { download: item.title } : {};
  var res = await sb.storage.from(LIBRARY_BUCKET).createSignedUrl(item.storage_path, 120, opts);
  if(res.error || !res.data){
    if(win) win.close();
    alert("Impossibile aprire il file: " + ((res.error && res.error.message) || "errore sconosciuto"));
    return;
  }
  if(win) win.location.href = res.data.signedUrl;
  else window.location.href = res.data.signedUrl;
}

function openAddLinkModal(proj){
  var backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML =
    '<div class="modal" role="dialog">' +
      '<h2>Aggiungi un link all\'Archivio</h2>' +
      '<label>Indirizzo (Google Drive, Dropbox, una pagina web… qualsiasi URL)</label>' +
      '<input type="text" id="m-url" placeholder="https://drive.google.com/…">' +
      '<label>Nome (facoltativo)</label>' +
      '<input type="text" id="m-name" placeholder="Es. Brief di progetto">' +
      '<div class="actions">' +
        '<button class="btn-cancel" id="m-cancel">Annulla</button>' +
        '<button class="btn-primary" id="m-save">Aggiungi</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(backdrop);

  var $url  = backdrop.querySelector("#m-url");
  var $name = backdrop.querySelector("#m-name");
  setTimeout(function(){ $url.focus(); }, 0);

  function close(){ backdrop.remove(); document.removeEventListener("keydown", onKey); }
  function save(){
    var v = $url.value.trim();
    if(!v){ $url.focus(); return; }
    if(!normalizeUrl(v)){ alert("Indirizzo non valido. Usa un URL http:// o https://"); $url.focus(); return; }
    var name = $name.value;
    close();
    addLibraryLink(proj, v, name);
  }
  function onKey(e){
    if(e.key === "Escape") close();
    if(e.key === "Enter") save();
  }
  document.addEventListener("keydown", onKey);

  backdrop.addEventListener("click", function(e){ if(e.target === backdrop) close(); });
  backdrop.querySelector("#m-cancel").addEventListener("click", close);
  backdrop.querySelector("#m-save").addEventListener("click", save);
}

/* =====================================================================
 * Messaggi: alert generati dalle scadenze delle card
 * ===================================================================== */
var ALERT_LEAD_DAYS       = 7;                  /* preavviso in giorni */
var ALERTS_READ_KEY       = "be_alerts_read_v1";
var ALERTS_NOTIFIED_KEY   = "be_alerts_notified_v1";
var ALERTS_REFRESH_MS     = 5 * 60 * 1000;

function readIdList(key){
  try {
    var raw = localStorage.getItem(key);
    var arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch(e){ return []; }
}
function writeIdList(key, ids){
  try { localStorage.setItem(key, JSON.stringify(ids)); } catch(e){}
}

/* Un alert per ogni card con scadenza entro ALERT_LEAD_DAYS (o gia' scaduta),
   escluse le card nella lista Done. */
function collectAlerts(){
  if(state.cardDatesError) return [];
  var out = [];
  state.projects.forEach(function(proj){
    var doneId = doneColumnId(proj);
    proj.columns.forEach(function(col){
      if(col.id === doneId) return;
      col.cards.forEach(function(card){
        if(!card.due_date) return;
        var n = daysUntil(card.due_date);
        if(n === null || n > ALERT_LEAD_DAYS) return;
        out.push({
          id: card.id + "|" + card.due_date,
          card: card, proj: proj, col: col, days: n,
          level: n < 0 ? "overdue" : (n <= 1 ? "today" : "soon")
        });
      });
    });
  });
  out.sort(function(a,b){
    if(a.days !== b.days) return a.days - b.days;
    return a.proj.name.localeCompare(b.proj.name);
  });
  return out;
}

function alertWhen(a){
  if(a.days < 0) return a.days === -1 ? "Scaduta ieri" : "Scaduta da " + Math.abs(a.days) + " giorni";
  if(a.days === 0) return "Scade oggi";
  if(a.days === 1) return "Scade domani";
  return "Scade tra " + a.days + " giorni";
}

function renderAlerts(){
  state.alerts = collectAlerts();

  var ids = state.alerts.map(function(a){ return a.id; });
  /* le scadenze sparite (card chiusa, data cambiata) escono dagli elenchi */
  var read = readIdList(ALERTS_READ_KEY).filter(function(id){ return ids.indexOf(id) >= 0; });
  writeIdList(ALERTS_READ_KEY, read);
  var unread = state.alerts.filter(function(a){ return read.indexOf(a.id) < 0; });

  var $badge = document.getElementById("msg-badge");
  if($badge){
    if(unread.length){
      $badge.hidden = false;
      $badge.textContent = unread.length > 99 ? "99+" : String(unread.length);
      $badge.classList.toggle("quiet", !unread.some(function(a){ return a.level === "overdue"; }));
    } else {
      $badge.hidden = true;
    }
  }

  var $btn = document.getElementById("open-msgs-btn");
  if($btn){
    $btn.title = state.alerts.length
      ? state.alerts.length + (state.alerts.length === 1 ? " scadenza da controllare" : " scadenze da controllare")
      : "Nessuna scadenza nei prossimi " + ALERT_LEAD_DAYS + " giorni";
  }

  var $panel = document.getElementById("msg-panel");
  if($panel && !$panel.hidden) renderMsgList();

  fireDesktopAlerts(unread);
}

function renderMsgList(){
  var $list = document.getElementById("msg-list");
  if(!$list) return;
  $list.innerHTML = "";

  var highlight = state.msgHighlight || [];

  if(!state.alerts.length){
    var $e = document.createElement("div");
    $e.className = "msg-empty";
    $e.textContent = state.cardDatesError
      ? "Le scadenze non sono ancora attive sul database: esegui sql/scadenze.sql su Supabase."
      : "Nessun messaggio. Le scadenze entro " + ALERT_LEAD_DAYS + " giorni compaiono qui.";
    $list.appendChild($e);
  } else {
    state.alerts.forEach(function(a){
      var $it = document.createElement("div");
      $it.className = "msg-item" + (highlight.indexOf(a.id) >= 0 ? " unread" : "");

      var $dot = document.createElement("span");
      $dot.className = "msg-dot " + a.level;
      $it.appendChild($dot);

      var $body = document.createElement("div");
      $body.className = "msg-body";

      var $t = document.createElement("div");
      $t.className = "msg-title";
      $t.textContent = a.card.title;
      $body.appendChild($t);

      var $m = document.createElement("div");
      $m.className = "msg-meta";
      var $when = document.createElement("span");
      $when.className = "msg-when" + (a.level === "overdue" ? " overdue" : (a.level === "today" ? " today" : ""));
      $when.textContent = alertWhen(a);
      $m.appendChild($when);
      $m.appendChild(document.createTextNode(" · " + formatDateIT(a.card.due_date) + " · " + a.proj.name + " › " + a.col.name));
      $body.appendChild($m);

      $it.appendChild($body);
      $it.addEventListener("click", function(){
        closeMsgPanel();
        goToAlert(a);
      });
      $list.appendChild($it);
    });
  }

  var $note = document.getElementById("msg-foot-note");
  if($note){
    $note.textContent = state.alerts.length
      ? state.alerts.length + (state.alerts.length === 1 ? " scadenza" : " scadenze") + " entro " + ALERT_LEAD_DAYS + " giorni"
      : "";
  }
  var $nb = document.getElementById("msg-notify-btn");
  if($nb) $nb.hidden = !("Notification" in window) || Notification.permission !== "default";
}

function goToAlert(a){
  state.view = "board";
  state.activeProjectId = a.proj.id;
  render();
  openEditCardModal(a.card.id, a.col.id, false, a.proj);
}

function openMsgPanel(){
  var $panel = document.getElementById("msg-panel");
  var $btn = document.getElementById("open-msgs-btn");
  if(!$panel) return;
  var read = readIdList(ALERTS_READ_KEY);
  /* i non letti restano evidenziati finche' il pannello resta aperto */
  state.msgHighlight = state.alerts
    .filter(function(a){ return read.indexOf(a.id) < 0; })
    .map(function(a){ return a.id; });
  writeIdList(ALERTS_READ_KEY, state.alerts.map(function(a){ return a.id; }));
  $panel.hidden = false;
  if($btn) $btn.setAttribute("aria-expanded", "true");
  renderAlerts();
}

function closeMsgPanel(){
  var $panel = document.getElementById("msg-panel");
  var $btn = document.getElementById("open-msgs-btn");
  if(!$panel || $panel.hidden) return;
  $panel.hidden = true;
  state.msgHighlight = [];
  if($btn) $btn.setAttribute("aria-expanded", "false");
}

/* Notifiche di sistema: una sola volta per scadenza */
function fireDesktopAlerts(unread){
  if(!("Notification" in window) || Notification.permission !== "granted") return;
  var notified = readIdList(ALERTS_NOTIFIED_KEY);
  var fresh = unread.filter(function(a){ return notified.indexOf(a.id) < 0; });
  var live = state.alerts.map(function(a){ return a.id; });
  writeIdList(ALERTS_NOTIFIED_KEY,
    notified.filter(function(id){ return live.indexOf(id) >= 0; })
            .concat(fresh.map(function(a){ return a.id; })));
  if(!fresh.length) return;
  var head = fresh.length === 1
    ? alertWhen(fresh[0]) + ": " + fresh[0].card.title
    : fresh.length + " scadenze da controllare";
  var body = fresh.slice(0, 4).map(function(a){
    return "• " + a.card.title + " — " + a.proj.name + " (" + alertWhen(a).toLowerCase() + ")";
  }).join("\n");
  try { new Notification("Mario Project Manager · " + head, { body: body, tag: "be-scadenze" }); } catch(e){}
}

(function messagesModule(){
  var $btn    = document.getElementById("open-msgs-btn");
  var $panel  = document.getElementById("msg-panel");
  var $mark   = document.getElementById("msg-mark-all");
  var $notify = document.getElementById("msg-notify-btn");
  if(!$btn || !$panel) return;

  $btn.addEventListener("click", function(e){
    e.stopPropagation();
    if($panel.hidden) openMsgPanel(); else closeMsgPanel();
  });

  $panel.addEventListener("click", function(e){ e.stopPropagation(); });

  document.addEventListener("click", function(){ closeMsgPanel(); });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape") closeMsgPanel();
  });

  if($mark){
    $mark.addEventListener("click", function(){
      writeIdList(ALERTS_READ_KEY, state.alerts.map(function(a){ return a.id; }));
      state.msgHighlight = [];
      renderAlerts();
    });
  }

  if($notify){
    $notify.addEventListener("click", function(){
      if(!("Notification" in window)) return;
      Notification.requestPermission().then(function(){ renderAlerts(); });
    });
  }

  /* le scadenze cambiano con il passare del tempo: ricontrollo periodico */
  setInterval(function(){ renderAlerts(); }, ALERTS_REFRESH_MS);
})();

/* Evita che un file rilasciato fuori dall'Archivio faccia navigare il browser */
["dragover","drop"].forEach(function(ev){
  window.addEventListener(ev, function(e){
    var t = e.target;
    if(t && t.closest && t.closest(".column.library")) return;
    var types = (e.dataTransfer && e.dataTransfer.types) ? Array.prototype.slice.call(e.dataTransfer.types) : [];
    if(types.indexOf("Files") >= 0){
      e.preventDefault();
      if(ev === "dragover") e.dataTransfer.dropEffect = "none";
    }
  });
});

/* =====================================================================
 * Mobile drawer toggles (sidebar + calendar people filter)
 * ===================================================================== */
(function mobileDrawers(){
  var MOBILE_QUERY = window.matchMedia("(max-width:780px)");

  function bindDrawer(toggleId, drawerId, backdropId){
    var $toggle   = document.getElementById(toggleId);
    var $drawer   = document.getElementById(drawerId);
    var $backdrop = document.getElementById(backdropId);
    if(!$toggle || !$drawer || !$backdrop) return null;

    function open(){
      $drawer.classList.add("drawer-open");
      $backdrop.classList.add("show");
      $toggle.classList.add("active");
      $toggle.setAttribute("aria-expanded","true");
    }
    function close(){
      $drawer.classList.remove("drawer-open");
      $backdrop.classList.remove("show");
      $toggle.classList.remove("active");
      $toggle.setAttribute("aria-expanded","false");
    }
    function toggle(){
      if($drawer.classList.contains("drawer-open")) close(); else open();
    }
    $toggle.addEventListener("click", function(e){ e.stopPropagation(); toggle(); });
    $backdrop.addEventListener("click", close);
    return { open: open, close: close };
  }

  var sideDrawer = bindDrawer("sidebar-toggle", "sidebar", "sidebar-backdrop");
  var calDrawer  = bindDrawer("cal-side-toggle", "cal-side", "cal-side-backdrop");

  // Close project drawer when a project is picked
  if(sideDrawer){
    document.getElementById("projects").addEventListener("click", function(e){
      var item = e.target.closest(".project-item");
      if(item && !e.target.closest(".project-delete") && MOBILE_QUERY.matches){
        sideDrawer.close();
      }
    });
  }

  // Close drawers when leaving mobile breakpoint
  function onResize(){
    if(!MOBILE_QUERY.matches){
      if(sideDrawer) sideDrawer.close();
      if(calDrawer)  calDrawer.close();
    }
  }
  if(typeof MOBILE_QUERY.addEventListener === "function"){
    MOBILE_QUERY.addEventListener("change", onResize);
  } else if(typeof MOBILE_QUERY.addListener === "function"){
    MOBILE_QUERY.addListener(onResize);
  }

  // Close on Escape
  document.addEventListener("keydown", function(e){
    if(e.key !== "Escape") return;
    if(sideDrawer) sideDrawer.close();
    if(calDrawer)  calDrawer.close();
  });
})();

  /* ---------- storage ---------- */
  function loadCal(){
    var data = null;
    try{
      var raw = localStorage.getItem(CAL_KEY);
      if(raw){
        var p = JSON.parse(raw);
        if(p && Array.isArray(p.events)) data = p;
      }
    }catch(_){}
    if(!data) data = { version:1, events:[], seedVersion:0 };
    if(typeof data.seedVersion !== "number") data.seedVersion = 0;

    // Merge seed events whose deterministic IDs don't already exist locally
    if(data.seedVersion < SEED_VERSION){
      var have = {};
      data.events.forEach(function(e){ have[e.id] = 1; });
      SEED_EVENTS.forEach(function(e){
        if(!have[e.id]) data.events.push(JSON.parse(JSON.stringify(e)));
      });
      data.seedVersion = SEED_VERSION;
      try{ localStorage.setItem(CAL_KEY, JSON.stringify(data)); }catch(_){}
    }
    return data;
  }
  function saveCal(){
    try{ localStorage.setItem(CAL_KEY, JSON.stringify(calState)); }catch(_){}
  }

  /* ---------- state ---------- */
  var calState = loadCal();
  var view = "week";          // 'day' | 'week' | 'month'
  var cursor = new Date();    // anchor date for current view

  /* ---------- person filter ---------- */
  var FILTER_KEY = "brown_calendar_filter_v1";
  var selectedPersons; // Set<string>; null until loaded
  function loadFilter(){
    try{
      var raw = localStorage.getItem(FILTER_KEY);
      if(raw){
        var arr = JSON.parse(raw);
        if(Array.isArray(arr)) return new Set(arr);
      }
    }catch(_){}
    return new Set(KNOWN_PERSONS); // default: all six selected
  }
  function saveFilter(){
    try{
      var arr = []; selectedPersons.forEach(function(p){ arr.push(p); });
      localStorage.setItem(FILTER_KEY, JSON.stringify(arr));
    }catch(_){}
  }
  selectedPersons = loadFilter();

  function eventVisible(e){
    if(!e.person) return true;     // events without a person are always shown
    return selectedPersons.has(e.person);
  }

  /* ---------- DOM refs ---------- */
  var $overlay = document.getElementById("cal-overlay");
  var $body    = document.getElementById("cal-body");
  var $side    = document.getElementById("cal-side");
  var $period  = document.getElementById("cal-period");
  var $views   = $overlay.querySelectorAll(".cal-views button");

  /* ---------- open / close ---------- */
  function open(){
    cursor = new Date();
    $overlay.classList.add("show");
    $overlay.setAttribute("aria-hidden","false");
    document.body.style.overflow = "hidden";
    render();
  }
  function close(){
    $overlay.classList.remove("show");
    $overlay.setAttribute("aria-hidden","true");
    document.body.style.overflow = "";
  }

  /* ---------- view nav ---------- */
  function setView(v){
    view = v;
    $views.forEach(function(b){ b.classList.toggle("active", b.dataset.view === v); });
    render();
  }
  function shift(direction){
    if(view === "day")   cursor = addDays(cursor, direction);
    if(view === "week")  cursor = addDays(cursor, 7*direction);
    if(view === "month") cursor = new Date(cursor.getFullYear(), cursor.getMonth()+direction, 1);
    render();
  }
  function goToday(){ cursor = new Date(); render(); }

  /* ---------- event helpers ---------- */
  function eventsForDate(dateStr){
    return calState.events
      .filter(function(e){ return e.date === dateStr && eventVisible(e); })
      .sort(function(a,b){
        var ta = a.time || "99:99";
        var tb = b.time || "99:99";
        return ta.localeCompare(tb);
      });
  }
  function fmtTimeRange(ev){
    if(!ev.time) return "Tutto il giorno";
    if(ev.endTime && ev.endTime !== ev.time) return ev.time + " – " + ev.endTime;
    return ev.time;
  }

  /* ---------- rendering ---------- */
  function getAllPersons(){
    // Known team first (in stable order), then any extra persons found in events
    var seen = {};
    var ordered = [];
    KNOWN_PERSONS.forEach(function(p){ seen[p]=1; ordered.push(p); });
    var extras = [];
    calState.events.forEach(function(e){
      if(e.person && !seen[e.person]){ seen[e.person]=1; extras.push(e.person); }
    });
    extras.sort(function(a,b){ return a.localeCompare(b); });
    return ordered.concat(extras);
  }

  function renderPersonSide(){
    var people = getAllPersons();
    $side.innerHTML = "";

    var h = document.createElement("h3");
    h.textContent = "Persone";
    $side.appendChild(h);

    // "Tutti" master toggle
    var allRow = document.createElement("div");
    allRow.className = "cal-person-row all";
    var allOn = people.length > 0 && people.every(function(p){ return selectedPersons.has(p); });
    if(allOn) allRow.classList.add("checked");
    allRow.innerHTML = '<div class="cal-cb"></div><div class="cal-person-name">Tutti</div>'+
                       '<div class="cal-person-count">'+ people.length +'</div>';
    allRow.addEventListener("click", function(){
      if(allOn){ selectedPersons.clear(); }
      else { people.forEach(function(p){ selectedPersons.add(p); }); }
      saveFilter();
      render();
    });
    $side.appendChild(allRow);

    var divider = document.createElement("div");
    divider.className = "cal-side-divider";
    $side.appendChild(divider);

    // Per-person rows
    people.forEach(function(p){
      var row = document.createElement("div");
      row.className = "cal-person-row";
      if(selectedPersons.has(p)) row.classList.add("checked");
      row.style.setProperty("--pc", personColor(p));
      var count = calState.events.reduce(function(n,e){ return n + (e.person === p ? 1 : 0); }, 0);
      row.innerHTML =
        '<div class="cal-cb"></div>'+
        '<div class="cal-person-name">'+ escapeHtml(p) +'</div>'+
        '<div class="cal-person-count">'+ count +'</div>';
      row.addEventListener("click", function(e){
        if(e.shiftKey || e.metaKey || e.ctrlKey){
          // modifier-click: solo questa persona
          selectedPersons.clear();
          selectedPersons.add(p);
        } else {
          if(selectedPersons.has(p)) selectedPersons.delete(p);
          else selectedPersons.add(p);
        }
        saveFilter();
        render();
      });
      $side.appendChild(row);
    });

    // Quick-action buttons
    var actions = document.createElement("div");
    actions.className = "cal-side-actions";
    actions.innerHTML =
      '<button data-act="all">Tutti</button>'+
      '<button data-act="none">Nessuno</button>';
    actions.querySelector('[data-act="all"]').addEventListener("click", function(){
      people.forEach(function(p){ selectedPersons.add(p); });
      saveFilter(); render();
    });
    actions.querySelector('[data-act="none"]').addEventListener("click", function(){
      selectedPersons.clear();
      saveFilter(); render();
    });
    $side.appendChild(actions);
  }

  function render(){
    renderPersonSide();
    if(view === "day")   renderDay();
    if(view === "week")  renderWeek();
    if(view === "month") renderMonth();
  }

  function renderMonth(){
    $period.textContent = MONTHS[cursor.getMonth()] + " " + cursor.getFullYear();
    $body.innerHTML = "";

    var wrap = document.createElement("div");
    wrap.className = "cal-month";

    var head = document.createElement("div");
    head.className = "cal-month-headrow";
    DAYS_SHORT.forEach(function(d){
      var h = document.createElement("div");
      h.textContent = d;
      head.appendChild(h);
    });
    wrap.appendChild(head);

    var grid = document.createElement("div");
    grid.className = "cal-month-grid";

    var firstOfMonth = startOfMonth(cursor);
    var gridStart = startOfWeek(firstOfMonth);
    var today = new Date();

    // 6 rows × 7 cols = 42 cells
    for(var i=0;i<42;i++){
      var d = addDays(gridStart, i);
      var cell = document.createElement("div");
      cell.className = "cal-day-cell";
      if(d.getMonth() !== cursor.getMonth()) cell.classList.add("other-month");
      if(isSameDay(d, today)) cell.classList.add("today");

      var num = document.createElement("span");
      num.className = "cal-day-num";
      num.textContent = d.getDate();
      cell.appendChild(num);

      var evs = eventsForDate(fmtDate(d));
      var evWrap = document.createElement("div");
      evWrap.className = "cal-day-events";
      var max = 3;
      evs.slice(0, max).forEach(function(e){
        var chip = document.createElement("div");
        chip.className = "cal-event";
        chip.style.borderLeftColor = personColor(e.person);
        chip.textContent = (e.time ? e.time + " " : "") + e.title;
        chip.addEventListener("click", function(ev){ ev.stopPropagation(); openEventModal(e); });
        evWrap.appendChild(chip);
      });
      if(evs.length > max){
        var more = document.createElement("div");
        more.className = "cal-event-more";
        more.textContent = "+ " + (evs.length - max) + " altri";
        evWrap.appendChild(more);
      }
      cell.appendChild(evWrap);

      (function(date){
        cell.addEventListener("click", function(){
          // single click on day cell → switch to day view
          cursor = date;
          setView("day");
        });
      })(new Date(d));

      grid.appendChild(cell);
    }
    wrap.appendChild(grid);
    $body.appendChild(wrap);
  }

  function renderWeek(){
    var ws = startOfWeek(cursor);
    var we = addDays(ws, 6);
    var sameMonth = ws.getMonth() === we.getMonth();
    if(sameMonth){
      $period.textContent = ws.getDate() + " – " + we.getDate() + " " + MONTHS[ws.getMonth()] + " " + ws.getFullYear();
    } else {
      $period.textContent = ws.getDate() + " " + MONTHS[ws.getMonth()] + " – " + we.getDate() + " " + MONTHS[we.getMonth()] + " " + we.getFullYear();
    }
    $body.innerHTML = "";

    var wrap = document.createElement("div");
    wrap.className = "cal-week";

    var today = new Date();
    for(var i=0;i<7;i++){
      var d = addDays(ws, i);
      var col = document.createElement("div");
      col.className = "cal-week-col";

      var head = document.createElement("div");
      head.className = "cal-week-head";
      if(isSameDay(d, today)) head.classList.add("today");
      head.innerHTML = '<div class="cal-week-day-name">'+ DAYS_SHORT[i] +'</div>'+
                       '<div class="cal-week-day-num">'+ d.getDate() +'</div>';
      (function(date){
        head.addEventListener("click", function(){
          cursor = date;
          setView("day");
        });
      })(new Date(d));
      col.appendChild(head);

      var list = document.createElement("div");
      list.className = "cal-week-events";
      var evs = eventsForDate(fmtDate(d));
      if(!evs.length){
        var ph = document.createElement("button");
        ph.className = "add-card";
        ph.style.margin = "0";
        ph.style.fontSize = "12px";
        ph.style.padding = "6px 8px";
        ph.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Aggiungi';
        (function(date){
          ph.addEventListener("click", function(ev){ ev.stopPropagation(); openEventModal(null, fmtDate(date)); });
        })(new Date(d));
        list.appendChild(ph);
      }
      evs.forEach(function(e){
        var item = document.createElement("div");
        item.className = "cal-week-event";
        item.style.borderLeftColor = personColor(e.person);
        var html = "";
        html += '<div class="cal-week-event-time">'+ escapeHtml(fmtTimeRange(e)) +'</div>';
        html += '<div class="cal-week-event-title">'+ escapeHtml(e.title) +'</div>';
        if(e.person){
          html += '<div class="cal-week-event-person"><span class="cal-person-dot" style="background:'+ personColor(e.person) +'"></span>'+ escapeHtml(e.person) +'</div>';
        }
        item.innerHTML = html;
        item.addEventListener("click", function(){ openEventModal(e); });
        list.appendChild(item);
      });
      col.appendChild(list);

      wrap.appendChild(col);
    }
    $body.appendChild(wrap);
  }

  function renderDay(){
    $period.textContent = cursor.getDate() + " " + MONTHS[cursor.getMonth()] + " " + cursor.getFullYear();
    $body.innerHTML = "";

    var wrap = document.createElement("div");
    wrap.className = "cal-day-view";

    var head = document.createElement("div");
    head.className = "cal-day-view-head";
    var today = new Date();
    if(isSameDay(cursor, today)) head.classList.add("today");
    head.innerHTML = '<h3>'+ DAYS_LONG[(cursor.getDay()+6)%7] +' <span class="daynum">'+ cursor.getDate() +'</span> '+ MONTHS[cursor.getMonth()] +'</h3>';
    wrap.appendChild(head);

    var list = document.createElement("div");
    list.className = "cal-day-list";

    var evs = eventsForDate(fmtDate(cursor));
    if(!evs.length){
      var empty = document.createElement("div");
      empty.className = "cal-empty";
      empty.innerHTML = '<h3>Nessun impegno</h3><p>Non ci sono impegni per questa giornata.</p>';
      var btn = document.createElement("button");
      btn.className = "cal-add-btn";
      btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Aggiungi impegno';
      btn.addEventListener("click", function(){ openEventModal(null, fmtDate(cursor)); });
      empty.appendChild(btn);
      list.appendChild(empty);
    } else {
      evs.forEach(function(e){
        var card = document.createElement("div");
        card.className = "cal-day-event-card";
        card.style.borderLeftColor = personColor(e.person);

        var t = document.createElement("div");
        t.className = "cal-day-event-time" + (e.time ? "" : " notime");
        t.textContent = fmtTimeRange(e);

        var body = document.createElement("div");
        body.className = "cal-day-event-body";
        var title = document.createElement("div");
        title.className = "cal-day-event-title";
        title.textContent = e.title;
        body.appendChild(title);
        if(e.person){
          var meta = document.createElement("div");
          meta.className = "cal-day-event-meta";
          meta.innerHTML = '<span class="cal-person-dot" style="background:'+ personColor(e.person) +'"></span>'+ escapeHtml(e.person);
          body.appendChild(meta);
        }
        if(e.notes){
          var n = document.createElement("div");
          n.className = "cal-day-event-notes";
          n.textContent = e.notes;
          body.appendChild(n);
        }

        card.appendChild(t);
        card.appendChild(body);
        card.addEventListener("click", function(){ openEventModal(e); });
        list.appendChild(card);
      });
    }
    wrap.appendChild(list);
    $body.appendChild(wrap);
  }

  function escapeHtml(s){
    return String(s||"").replace(/[&<>"']/g, function(c){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c];
    });
  }

  /* ---------- event modal ---------- */
  function openEventModal(existing, defaultDate){
    var isEdit = !!existing;
    var data = existing ? Object.assign({}, existing) : {
      id: null,
      date: defaultDate || fmtDate(cursor),
      time: "",
      endTime: "",
      title: "",
      person: "",
      notes: ""
    };

    var bd = document.createElement("div");
    bd.className = "modal-backdrop";
    bd.innerHTML =
      '<div class="modal" role="dialog" style="max-width:480px">' +
        '<h2>'+ (isEdit ? "Modifica impegno" : "Nuovo impegno") +'</h2>' +

        '<label>Titolo</label>' +
        '<input type="text" id="cm-title" placeholder="Cosa va fatto" maxlength="200">' +

        '<label>Persona</label>' +
        '<input type="text" id="cm-person" placeholder="Chi se ne occupa" list="cm-persons" maxlength="80">' +
        '<datalist id="cm-persons"></datalist>' +

        '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
          '<div style="flex:1 1 180px;min-width:0">' +
            '<label>Data</label>' +
            '<input type="date" id="cm-date">' +
          '</div>' +
          '<div style="flex:1 1 110px;min-width:0">' +
            '<label>Inizio</label>' +
            '<input type="time" id="cm-time">' +
          '</div>' +
          '<div style="flex:1 1 110px;min-width:0">' +
            '<label>Fine</label>' +
            '<input type="time" id="cm-end">' +
          '</div>' +
        '</div>' +

        '<label>Note (opzionale)</label>' +
        '<textarea id="cm-notes" placeholder="Dettagli aggiuntivi" style="min-height:60px"></textarea>' +

        '<div class="actions" style="justify-content:space-between">' +
          '<div>' +
            (isEdit ? '<button class="btn-cancel" id="cm-delete" style="color:#f87168">Elimina</button>' : '') +
          '</div>' +
          '<div style="display:flex;gap:8px">' +
            '<button class="btn-cancel" id="cm-cancel">Annulla</button>' +
            '<button class="btn-primary" id="cm-save">Salva</button>' +
          '</div>' +
        '</div>' +
      '</div>';
    document.body.appendChild(bd);

    var $title = bd.querySelector("#cm-title");
    var $person= bd.querySelector("#cm-person");
    var $date  = bd.querySelector("#cm-date");
    var $time  = bd.querySelector("#cm-time");
    var $end   = bd.querySelector("#cm-end");
    var $notes = bd.querySelector("#cm-notes");
    var $list  = bd.querySelector("#cm-persons");

    // populate person suggestions: known team members first, then anything else seen
    var seen = {};
    KNOWN_PERSONS.forEach(function(p){ seen[p] = 1; });
    calState.events.forEach(function(e){ if(e.person) seen[e.person] = 1; });
    Object.keys(seen).sort(function(a,b){
      var ai = KNOWN_PERSONS.indexOf(a), bi = KNOWN_PERSONS.indexOf(b);
      if(ai !== -1 || bi !== -1){
        if(ai === -1) return 1;
        if(bi === -1) return -1;
        return ai - bi;
      }
      return a.localeCompare(b);
    }).forEach(function(name){
      var o = document.createElement("option");
      o.value = name;
      $list.appendChild(o);
    });

    $title.value  = data.title;
    $person.value = data.person || "";
    $date.value   = data.date;
    $time.value   = data.time || "";
    $end.value    = data.endTime || "";
    $notes.value  = data.notes || "";
    setTimeout(function(){ $title.focus(); $title.select(); }, 0);

    function teardown(){ bd.remove(); document.removeEventListener("keydown", onKey); }
    function save(){
      var v = $title.value.trim();
      if(!v){ $title.focus(); return; }
      data.title  = v;
      data.person = $person.value.trim();
      data.date   = $date.value || fmtDate(new Date());
      data.time   = $time.value || "";
      data.endTime= $end.value  || "";
      data.notes  = $notes.value.trim();

      if(isEdit){
        var idx = calState.events.findIndex(function(x){ return x.id === data.id; });
        if(idx >= 0) calState.events[idx] = data;
      } else {
        data.id = "e_" + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);
        calState.events.push(data);
      }
      saveCal();
      teardown();
      render();
    }
    function del(){
      if(!confirm("Eliminare questo impegno?")) return;
      calState.events = calState.events.filter(function(x){ return x.id !== data.id; });
      saveCal();
      teardown();
      render();
    }
    function onKey(e){
      if(e.key === "Escape") teardown();
      if(e.key === "Enter" && (e.metaKey || e.ctrlKey)) save();
    }
    document.addEventListener("keydown", onKey);

    bd.addEventListener("click", function(e){ if(e.target === bd) teardown(); });
    bd.querySelector("#cm-cancel").addEventListener("click", teardown);
    bd.querySelector("#cm-save").addEventListener("click", save);
    var $del = bd.querySelector("#cm-delete");
    if($del) $del.addEventListener("click", del);
  }

  /* ---------- wire up ---------- */
  document.getElementById("open-calendar-btn").addEventListener("click", open);
  document.getElementById("cal-close").addEventListener("click", close);
  document.getElementById("cal-prev").addEventListener("click", function(){ shift(-1); });
  document.getElementById("cal-next").addEventListener("click", function(){ shift(1); });
  document.getElementById("cal-today-btn").addEventListener("click", goToday);
  document.getElementById("cal-add-btn").addEventListener("click", function(){ openEventModal(null, fmtDate(cursor)); });
  $views.forEach(function(b){
    b.addEventListener("click", function(){ setView(b.dataset.view); });
  });
  document.addEventListener("keydown", function(e){
    if(!$overlay.classList.contains("show")) return;
    if(e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
    if(e.key === "Escape") close();
    if(e.key === "ArrowLeft") shift(-1);
    if(e.key === "ArrowRight") shift(1);
    if(e.key === "t" || e.key === "T") goToday();
    if(e.key === "1") setView("day");
    if(e.key === "2") setView("week");
    if(e.key === "3") setView("month");
  });

  // initial active view
  $views.forEach(function(b){ b.classList.toggle("active", b.dataset.view === view); });
})();
</script>

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () {});
    });
  }
</script>
