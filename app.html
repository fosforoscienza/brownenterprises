    badge.title = label.mine ? "Condivisa col team: i progetti che ci metti li vedono tutti"
                             : "Label condivisa da " + label.owner;
    head.title = label.name + " · " + badge.title;
    head.appendChild(badge);
  }
  head.appendChild(count);

  function action(html, tip, danger, fn){
    var b = document.createElement("button");
    b.className = "label-btn" + (danger ? " danger" : "");
    b.title = tip;
    b.innerHTML = html;
    b.addEventListener("click", function(e){ e.stopPropagation(); fn(); });
    head.appendChild(b);
    return b;
  }

  // la label condivisa di un altro si guarda soltanto
  if(isNone || label.mine){
    action(ICON_PLUS, isNone ? "Nuovo progetto senza label" : "Nuovo progetto in « " + label.name + " »",
      false, function(){ promptNewProject(isNone ? null : label.id); });
  }
  if(isNone){
    action(ICON_PEN, "Rinomina gruppo", false, promptRenameNoLabel);
  } else if(label.mine){
    action(ICON_PEN,   "Rinomina label", false, function(){ promptRenameLabel(label); });
    action(ICON_TRASH, "Elimina label",  true,  function(){ deleteLabel(label); });
  }

  head.addEventListener("click", function(){
    toggleCollapsed(groupId);
    group.classList.toggle("collapsed");
  });

  var body = document.createElement("div");
  body.className = "label-body";
  if(projects.length){
    projects.forEach(function(p){ body.appendChild(buildProjectItem(p)); });
  } else {
    var empty = document.createElement("div");
    empty.className = "label-empty";
    empty.textContent = !isNone ? (label.mine ? "Vuota — trascina qui un progetto o usa +."
                                              : "Vuota — la riempie " + label.owner + ".")
      : (areaProjects().length ? "Tutti i progetti sono in una label."
                               : "Nessun progetto in quest'area. Creane uno con +.");
    body.appendChild(empty);
  }

  group.appendChild(head);
  group.appendChild(body);

  /* destinazione del trascinamento */
  function dragging(e){
    var types = (e.dataTransfer && e.dataTransfer.types)
      ? Array.prototype.slice.call(e.dataTransfer.types) : [];
    return types.indexOf("text/project-id") >= 0;
  }
  group.addEventListener("dragover", function(e){
    if(!dragging(e)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    group.classList.add("drop-target");
  });
  group.addEventListener("dragleave", function(e){
    if(!group.contains(e.relatedTarget)) group.classList.remove("drop-target");
  });
  group.addEventListener("drop", function(e){
    if(!dragging(e)) return;
    e.preventDefault();
    group.classList.remove("drop-target");
    var pid = e.dataTransfer.getData("text/project-id");
    if(pid) setProjectLabel(pid, isNone ? null : label.id);
  });

  return group;
}

var AREA_LABELS = {

/* Il trascinamento resta, ma da telefono non esiste: questo pannello e'
   l'equivalente esplicito, e sposta anche fra le tre aree \u2014 cosa che il
   drag'n'drop nella sidebar non permette comunque.
   La label e' una scelta privata di chi guarda; l'area di lavoro e' invece
   condivisa, quindi solo il proprietario del progetto puo' cambiarla. */
function openMoveProjectSheet(proj){
  var backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";

  var current = state.projectLabels[proj.id] || NO_LABEL;
  var locked = lockedByShared(proj.id);
  var labelRows = "";
  if(!state.labelsError && locked){
    labelRows = '<p class="move-hint">È nella label condivisa «' + locked.name.replace(/</g, "&lt;") +
      '»: può spostarlo solo ' + locked.owner.replace(/</g, "&lt;") + '.</p>';
  } else if(!state.labelsError){
    [{ id: NO_LABEL, name: noLabelName() }].concat(ownLabels()).forEach(function(l){
      var on = current === l.id;
      labelRows += '<button type="button" class="move-opt' + (on ? " current" : "") +
        '" data-kind="label" data-value="' + l.id + '"' + (on ? " disabled" : "") + '>' +
        l.name.replace(/</g, "&lt;") + (on ? ' <span class="move-now">attuale</span>' : '') + '</button>';
    });
    labelRows += '<button type="button" class="move-opt" data-kind="new-label">+ Nuova label</button>';
  }

  var areaRows = "";
  AREAS.forEach(function(a){
    var on = proj.area === a;
    areaRows += '<button type="button" class="move-opt' + (on ? " current" : "") +
      '" data-kind="area" data-value="' + a + '"' + (on ? " disabled" : "") + '>' +
      AREA_LABELS[a] + (on ? ' <span class="move-now">attuale</span>' : '') + '</button>';
  });

  backdrop.innerHTML =
    '<div class="modal" role="dialog" aria-label="Sposta progetto">' +
      '<h2>Sposta &laquo;' + proj.name.replace(/</g, "&lt;") + '&raquo;</h2>' +
      (labelRows
        ? '<p class="move-label">Label <span class="move-hint">\u00B7 ' +
          (ownLabels().some(function(l){ return l.shared; }) ? "quelle condivise valgono per tutto il team" : "solo per te") +
          '</span></p>' +
          '<div class="move-group">' + labelRows + '</div>'
        : '') +
      '<p class="move-label">Area di lavoro</p>' +
      '<div class="move-group">' + areaRows + '</div>' +
      '<div class="actions"><button class="btn-cancel" id="m-close">Chiudi</button></div>' +
    '</div>';
  document.body.appendChild(backdrop);

  function close(){ backdrop.remove(); document.removeEventListener("keydown", onKey); }
  function onKey(e){ if(e.key === "Escape") close(); }
  document.addEventListener("keydown", onKey);
  backdrop.addEventListener("click", function(e){ if(e.target === backdrop) close(); });
  backdrop.querySelector("#m-close").addEventListener("click", close);

  backdrop.querySelectorAll(".move-opt").forEach(function(b){
    b.addEventListener("click", function(){
      close();
      if(b.dataset.kind === "label"){
        setProjectLabel(proj.id, b.dataset.value === NO_LABEL ? null : b.dataset.value);
      } else if(b.dataset.kind === "new-label"){
        promptNewLabel(function(label){ setProjectLabel(proj.id, label.id); });
      } else {
        moveProjectToArea(proj.id, b.dataset.value);
      }
    });
  });
}

/* Aggiorna una colonna sola di be_projects, in modo ottimistico: se la
   scrittura fallisce si torna al valore precedente invece di lasciare la UI
   con una modifica mai salvata. */
async function updateProjectField(projectId, field, value){
  var proj = state.projects.find(function(p){ return p.id === projectId; });
  if(!proj || proj[field] === value) return;
  if(!proj.isOwner){
    notify("Solo " + profileName(proj.owner_id) + " (proprietario) pu\u00F2 spostare questo progetto.");
    return;
  }
  var previous = proj[field];
  proj[field] = value;
  if(field === "area") state.area = value;
  syncActiveProject();
  render();

  var payload = {};
  payload[field] = value;
  var res = await sb.from("be_projects").update(payload).eq("id", projectId);
  if(res.error){
    proj[field] = previous;
    syncActiveProject();
    render();
    notify(errorText(res.error, "Non sono riuscito a spostare il progetto"));
  }
}

function moveProjectToArea(projectId, area){
  return updateProjectField(projectId, "area", area);
}

function openShareModal(projectId){

    '<div class="modal" role="dialog">' +

      '<div class="share-list" id="share-list"></div>' +
      '<div class="actions">' +
        '<button class="btn-cancel" id="m-close">Chiudi</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(backdrop);

  var $list = backdrop.querySelector("#share-list");
  others.forEach(function(p){
    var row = document.createElement("div");
    var checked = proj.shares.indexOf(p.id) >= 0;
    row.className = "share-row" + (checked ? " checked" : "");
    row.innerHTML = '<div class="cal-cb"></div><div class="share-row-name">' + p.display_name + '</div>';
    row.addEventListener("click", function(){
      toggleShare(proj, p.id, !row.classList.contains("checked"), row);
    });

async function toggleShare(proj, userId, add, $row){
  $row.style.pointerEvents = "none";
  var res;
  if(add){
    res = await sb.from("be_project_shares").insert({ project_id: proj.id, user_id: userId });
  } else {
    res = await sb.from("be_project_shares").delete().eq("project_id", proj.id).eq("user_id", userId);
  }
  $row.style.pointerEvents = "";
  if(res.error){ notify(errorText(res.error)); return; }
  if(add){
    proj.shares.push(userId);
    $row.classList.add("checked");
  } else {
    proj.shares = proj.shares.filter(function(id){ return id !== userId; });
    $row.classList.remove("checked");
  }
}

/* =====================================================================
 * Panoramica: To Do / In Progress / Done di tutti i progetti
 * ===================================================================== */
var OVERVIEW_LISTS = [
  { key: "todo",  label: "To Do" },
  { key: "doing", label: "In Progress" },
  { key: "done",  label: "Done" }
];

/* Le card di ogni progetto vengono raggruppate nelle tre voci standard:
   l'ultima lista (o quella chiamata Done) e' "done", la prima delle altre
   e' "todo", le rimanenti "doing". */
function overviewEntries(){
  var out = { todo: [], doing: [], done: [] };
  var filter = state.overviewFilter;

  areaProjects().forEach(function(proj){
    if(filter.projectId && proj.id !== filter.projectId) return;
    var cols = proj.columns.slice().sort(function(a,b){ return a.position - b.position; });
    var doneId = doneColumnId(proj);
    var workIndex = 0;
    cols.forEach(function(col){
      var key;
      if(col.id === doneId){ key = "done"; }
      else { key = workIndex === 0 ? "todo" : "doing"; workIndex++; }
      col.cards.slice().sort(function(a,b){ return a.position - b.position; }).forEach(function(card){
        var date = key === "done" ? card.done_at : card.due_date;
        if(filter.onlyDue && !date) return;
        out[key].push({ card: card, proj: proj, col: col, isDone: key === "done", date: date });
      });
    });
  });

  Object.keys(out).forEach(function(key){
    var recentFirst = key === "done";
    out[key].sort(function(a,b){
      if(a.date && b.date){
        if(a.date === b.date) return a.proj.name.localeCompare(b.proj.name);
        if(recentFirst) return a.date < b.date ? 1 : -1;
        return a.date < b.date ? -1 : 1;
      }
      if(a.date) return -1;
      if(b.date) return 1;
      return a.proj.name.localeCompare(b.proj.name);
    });
  });

  return out;
}

function buildCardEl(card, columnId, isDoneCol, ctx){
  ctx = ctx || {};
  var proj = ctx.proj || getActiveProject();
  var isStatic = ctx.showProject === true;

  var $card = document.createElement("article");
  $card.className = "card" + (isStatic ? " static" : "");
  $card.draggable = !isStatic;
  $card.dataset.cardId = card.id;
  $card.dataset.columnId = columnId;

  if(isStatic && proj){
    var $pj = document.createElement("div");
    $pj.className = "card-project";
    $pj.textContent = proj.name;
    $pj.title = proj.name;
    $card.appendChild($pj);
  }

  if(card.priority){
    var $p = document.createElement("span");
    $p.className = "card-priority " + card.priority;
    $card.appendChild($p);
  }

  var $t = document.createElement("div");
  $t.className = "card-title";
  $t.textContent = card.title;
  $card.appendChild($t);

  var dateValue = isDoneCol ? card.done_at : card.due_date;
  if(!state.cardDatesError && dateValue){
    var $badges = document.createElement("div");
    $badges.className = "card-badges";
    $badges.appendChild(buildDateBadge(dateValue, isDoneCol));
    $card.appendChild($badges);
  }

  var $actions = document.createElement("div");
  $actions.className = "card-actions";
  var $del = document.createElement("button");
  $del.className = "card-action";
  $del.title = "Elimina";
  $del.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
  $del.addEventListener("click", function(e){
    e.stopPropagation();
    deleteCard(card.id, columnId, proj);
  });
  $actions.appendChild($del);
  $card.appendChild($actions);

  // edit on click
  $card.addEventListener("click", function(e){
    if(e.target.closest(".card-action")) return;
    openEditCardModal(card.id, columnId, isDoneCol, proj);
  });

  // dragging (nella Panoramica le card non si trascinano)
  if(!isStatic){
    $card.addEventListener("dragstart", function(e){
      $card.classList.add("dragging");
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/card-id", card.id);
      e.dataTransfer.setData("text/from-col", columnId);
    });
    $card.addEventListener("dragend", function(){
      $card.classList.remove("dragging");
      document.querySelectorAll(".column.drag-over").forEach(function(c){ c.classList.remove("drag-over"); });
    });
  }

  return $card;
}

function getDragAfterElement(container, y){
  var els = Array.prototype.slice.call(container.querySelectorAll(".card:not(.dragging)"));
  var closest = null, closestOffset = -Infinity;
  for(var i=0;i<els.length;i++){
    var box = els[i].getBoundingClientRect();
    var offset = y - box.top - box.height / 2;
    if(offset < 0 && offset > closestOffset){
      closestOffset = offset;
      closest = els[i];
    }
  }
  return closest;
}

/* =====================================================================
 * Mutations
 * ===================================================================== */
async function moveCard(cardId, fromColId, toColId, beforeCardId, projArg){
  var proj = projArg || getActiveProject(); if(!proj) return;
  var fromCol = proj.columns.find(function(c){ return c.id === fromColId; });
  var toCol = proj.columns.find(function(c){ return c.id === toColId; });
  if(!fromCol || !toCol) return;
  var idx = fromCol.cards.findIndex(function(c){ return c.id === cardId; });
  if(idx < 0) return;

  // Fotografia dello stato prima dello spostamento ottimistico: se la
  // scrittura fallisce (tipicamente offline) si ripristina in locale, senza
  // ricaricare da un server che tanto non risponde.
  var snapshot = {
    from: fromCol.cards.slice(),
    to: toCol.cards.slice(),
    positions: proj.columns.reduce(function(acc, c){
      c.cards.forEach(function(k){ acc[k.id] = k.position; });
      return acc;
    }, {}),
    doneAt: fromCol.cards[idx].done_at
  };

  var card = fromCol.cards.splice(idx,1)[0];
  if(beforeCardId){
    var bIdx = toCol.cards.findIndex(function(c){ return c.id === beforeCardId; });
    if(bIdx >= 0){ toCol.cards.splice(bIdx, 0, card); }
    else toCol.cards.push(card);
  } else {
    toCol.cards.push(card);
  }

  var doneColId = doneColumnId(proj);
  var doneChanged = false;
  if(!state.cardDatesError && fromCol.id !== toCol.id){
    if(toCol.id === doneColId && !card.done_at){
      card.done_at = todayISO();
      doneChanged = true;
    } else if(fromCol.id === doneColId && card.done_at){
      card.done_at = null;
      doneChanged = true;
    }
  }
  renderBoard();

  var updates = [];
  if(fromCol.id !== toCol.id){
    fromCol.cards.forEach(function(c, i){
      c.position = i;
      updates.push(sb.from("be_cards").update({ position: i }).eq("id", c.id));
    });
  }
  toCol.cards.forEach(function(c, i){
    c.position = i;
    var payload = { position: i };
    if(c.id === cardId && fromCol.id !== toCol.id) payload.column_id = toColId;
    if(c.id === cardId && doneChanged) payload.done_at = card.done_at;
    updates.push(sb.from("be_cards").update(payload).eq("id", c.id));
  });
  var results = await Promise.all(updates);
  var failed = results.find(function(r){ return r.error; });
  if(failed){
    // Rollback locale: la card torna dov'era, cosi' la board non mostra
    // uno spostamento che sul server non e' mai avvenuto.
    fromCol.cards = snapshot.from;
    toCol.cards = snapshot.to;
    card.done_at = snapshot.doneAt;
    proj.columns.forEach(function(c){
      c.cards.forEach(function(k){
        if(snapshot.positions[k.id] !== undefined) k.position = snapshot.positions[k.id];
      });
    });
    renderBoard();
    notify(errorText(failed.error, "Spostamento non salvato"));
  }
}

async function deleteCard(cardId, columnId, projArg){
  var proj = projArg || getActiveProject(); if(!proj) return;
  var col = proj.columns.find(function(c){ return c.id === columnId; });
  if(!col) return;
  var res = await sb.from("be_cards").delete().eq("id", cardId);
  if(res.error){ notify(errorText(res.error)); return; }
  col.cards = col.cards.filter(function(c){ return c.id !== cardId; });
  renderBoard();
}

async function addCard(columnId, title, priority, dateValue, isDoneCol){
  var proj = getActiveProject(); if(!proj) return;
  var col = proj.columns.find(function(c){ return c.id === columnId; });
  if(!col) return;
  var payload = {
    project_id: proj.id,
    column_id: columnId,
    title: title.trim(),
    priority: priority || null,
    position: col.cards.length,
    created_by: state.me.id
  };
  if(!state.cardDatesError){
    payload.due_date = isDoneCol ? null : (dateValue || null);
    payload.done_at  = isDoneCol ? (dateValue || null) : null;
  }
  var res = await sb.from("be_cards").insert(payload).select().single();
  if(res.error){ notify(errorText(res.error)); return; }
  col.cards.push({
    id: res.data.id, title: res.data.title, priority: res.data.priority, position: res.data.position,
    due_date: res.data.due_date || null, done_at: res.data.done_at || null
  });
  renderBoard();
}

async function updateCard(cardId, columnId, title, priority, dateValue, isDoneCol, projArg){
  var proj = projArg || getActiveProject(); if(!proj) return;
  var col = proj.columns.find(function(c){ return c.id === columnId; });
  if(!col) return;
  var card = col.cards.find(function(c){ return c.id === cardId; });
  if(!card) return;
  var payload = { title: title.trim(), priority: priority || null };
  if(!state.cardDatesError){
    if(isDoneCol) payload.done_at = dateValue || null;
    else payload.due_date = dateValue || null;
  }
  var res = await sb.from("be_cards").update(payload).eq("id", cardId);
  if(res.error){ notify(errorText(res.error)); return; }
  card.title = payload.title;
  card.priority = payload.priority;
  if(!state.cardDatesError){
    if(isDoneCol) card.done_at = payload.done_at;
    else card.due_date = payload.due_date;
  }
  renderBoard();
}

async function deleteProject(projectId){
  if(!confirm("Eliminare definitivamente questo progetto? Verranno eliminati anche colonne, card, elementi dell'Archivio e condivisioni.")) return;
  var paths = (state.library[projectId] || [])
    .filter(function(it){ return it.kind === "file" && it.storage_path; })
    .map(function(it){ return it.storage_path; });
  var res = await sb.from("be_projects").delete().eq("id", projectId);
  if(res.error){ notify(errorText(res.error)); return; }
  if(paths.length){ try { await sb.storage.from(LIBRARY_BUCKET).remove(paths); } catch(e){} }
  delete state.library[projectId];
  delete state.projectLabels[projectId];
  state.projects = state.projects.filter(function(p){ return p.id !== projectId; });
  syncActiveProject();
  render();
}

/* labelId facoltativo: il progetto nasce dentro quella label (solo per me) */
function promptNewProject(labelId){
  showInputModal({
    title: labelId ? "Nuovo progetto in « " + labelName(labelId) + " »" : "Nuovo progetto",
    label: "Nome del progetto",
    placeholder: "Es. Sito istituzionale",
    confirmText: "Crea",
    onConfirm: async function(name){
      var n = name.trim();
      if(!n) return;
      var pRes = await sb.from("be_projects")
        .insert({ owner_id: state.me.id, name: n, area: state.area })
        .select().single();
      if(pRes.error){ notify(errorText(pRes.error)); return; }
      var project = pRes.data;
      var colsPayload = DEFAULT_COLUMNS.map(function(colName, i){
        return { project_id: project.id, name: colName, position: i };
      });
      var cRes = await sb.from("be_columns").insert(colsPayload).select();
      if(cRes.error){ notify(errorText(cRes.error, "Colonne non create")); }
      var columns = (cRes.data || []).map(function(c){
        return { id: c.id, name: c.name, position: c.position, cards: [] };
      });
      state.projects.push({
        id: project.id, name: project.name, owner_id: project.owner_id,
        area: normalizeArea(project.area),
        isOwner: true, shares: [], columns: columns
      });
      if(labelId && state.labels.some(function(l){ return l.id === labelId; })){
        var lRes = await sb.from("be_project_labels")
          .insert({ user_id: state.me.id, project_id: project.id, label_id: labelId });
        if(lRes.error) notify(errorText(lRes.error, "Progetto creato, ma non assegnato alla label"));
        else state.projectLabels[project.id] = labelId;
      }
      state.activeProjectId = project.id;
      state.view = "board";
      render();
    }
  });
}

function openEditCardModal(cardId, columnId, isDoneCol, projArg){
  var proj = projArg || getActiveProject(); if(!proj) return;
  var col = proj.columns.find(function(c){ return c.id === columnId; });
  var card = col && col.cards.find(function(c){ return c.id === cardId; });

  var backdrop = document.createElement("div");

  backdrop.innerHTML =

        '<button class="priority-pill" data-priority="yellow"><span class="dot yellow"></span>Media</button>' +
        '<button class="priority-pill" data-priority="green" ><span class="dot green"></span>Bassa</button>' +
      '</div>' +
      '<div id="m-date-slot"></div>' +
      '<label for="m-col">Lista</label>' +
      '<select id="m-col" class="col-select"></select>' +
      '<div class="actions">' +
        '<button class="btn-cancel" id="m-cancel">Annulla</button>' +
        '<button class="btn-primary" id="m-save">Salva</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(backdrop);

  // Da telefono il drag non parte: senza questo selettore una card non si
  // puo' proprio spostare di lista.
  var $col = backdrop.querySelector("#m-col");
  proj.columns.slice().sort(function(a,b){ return a.position - b.position; })
    .forEach(function(c){
      var o = document.createElement("option");
      o.value = c.id;
      o.textContent = c.name;
      if(c.id === columnId) o.selected = true;
      $col.appendChild(o);
    });

  var $ta = backdrop.querySelector("#m-title");
  $ta.value = card.title;
  setTimeout(function(){ $ta.focus(); $ta.select(); }, 0);

  var $dateField = null;
  var $slot = backdrop.querySelector("#m-date-slot");
  if(state.cardDatesError){
    $slot.remove();
  } else {
    var lab = document.createElement("label");
    lab.textContent = isDoneCol ? "Completata il" : "Scadenza";
    $slot.appendChild(lab);
    $dateField = buildDateField(isDoneCol ? card.done_at : card.due_date, isDoneCol, true);
    $dateField.style.marginTop = "0";
    $dateField.style.marginBottom = "14px";
    $slot.appendChild($dateField);
  }

  var priority = card.priority || "green";
  var $pills = backdrop.querySelectorAll(".priority-pill");
  $pills.forEach(function(p){
    if(p.dataset.priority === priority) p.classList.add("active");
    p.addEventListener("click", function(){
      $pills.forEach(function(x){ x.classList.remove("active"); });
      p.classList.add("active");
      priority = p.dataset.priority;
    });
  });

  function close(){ backdrop.remove(); document.removeEventListener("keydown", onKey); }
  function save(){
    var v = $ta.value.trim();
    if(!v) { $ta.focus(); return; }
    var target = $col.value;
    updateCard(cardId, columnId, v, priority, $dateField ? $dateField.getValue() : null, isDoneCol, proj);
    // Lo spostamento passa dalla stessa funzione del drop handler, cosi'
    // riordino delle position e data di completamento restano coerenti.
    if(target && target !== columnId) moveCard(cardId, columnId, target, null, proj);
    close();
  }
  function onKey(e){
    if(e.key === "Escape") close();
    if(e.key === "Enter" && (e.metaKey || e.ctrlKey)) save();
  }
  document.addEventListener("keydown", onKey);

  backdrop.addEventListener("click", function(e){ if(e.target === backdrop) close(); });
  backdrop.querySelector("#m-cancel").addEventListener("click", close);
  backdrop.querySelector("#m-save").addEventListener("click", save);
}

/* =====================================================================
 * Archivio — file e link del progetto
 * ===================================================================== */
var LIBRARY_BUCKET = "be-library";
var LIBRARY_MAX_BYTES = 50 * 1024 * 1024;
var pendingUploads = [];

async function loadLibrary(){
  var res = await sb.from("be_library_items")
    .select("id, project_id, kind, title, url, storage_path, mime_type, size_bytes, position, created_by")
    .order("position", { ascending: true });
  if(res.error){
    state.library = {};
    state.libraryError = res.error.message;
    return;
  }
  state.libraryError = null;
  var byProject = {};
  (res.data || []).forEach(function(it){
    (byProject[it.project_id] = byProject[it.project_id] || []).push(it);
  });
  state.library = byProject;
}

function libraryItems(projectId){
  return (state.library[projectId] || []).slice().sort(function(a,b){ return a.position - b.position; });
}

function fileExtension(name){
  var m = /\.([A-Za-z0-9]{1,8})$/.exec(name || "");
  return m ? m[1].toLowerCase() : "";
}

function formatBytes(n){
  if(n === null || n === undefined) return "";
  if(n < 1024) return n + " B";
  var units = ["KB","MB","GB"], i = -1, v = n;
  do { v = v / 1024; i++; } while(v >= 1024 && i < units.length - 1);
  return (v >= 10 ? Math.round(v) : v.toFixed(1)) + " " + units[i];
}

function safeFileName(name){
  return (name || "file")
    .normalize("NFKD")
    .replace(/[^A-Za-z0-9._-]+/g, "_")
    .replace(/_{2,}/g, "_")
    .slice(-80);
}

function linkHost(url){
  try { return new URL(url).hostname.replace(/^www\./, ""); } catch(e){ return ""; }
}

function isDriveHost(host){
  return /(^|\.)(drive|docs|sheets|slides)\.google\.com$/.test(host);
}

var LIB_ICON_COLORS = {
  pdf:"#f87168",
  doc:"#579dff", docx:"#579dff", odt:"#579dff", rtf:"#579dff", pages:"#579dff",
  xls:"#4bce97", xlsx:"#4bce97", csv:"#4bce97", numbers:"#4bce97",
  ppt:"#f5a623", pptx:"#f5a623", key:"#f5a623",
  png:"#c9a6ff", jpg:"#c9a6ff", jpeg:"#c9a6ff", gif:"#c9a6ff", webp:"#c9a6ff",
  svg:"#c9a6ff", heic:"#c9a6ff", ai:"#c9a6ff", psd:"#c9a6ff",
  mp4:"#f5cd47", mov:"#f5cd47", mp3:"#f5cd47", wav:"#f5cd47",
  zip:"#8c9bab", rar:"#8c9bab", "7z":"#8c9bab"
};

function buildLibIcon(item){
  var box = document.createElement("div");
  box.className = "lib-icon";
  if(item.kind === "link"){
    var host = linkHost(item.url);
    if(isDriveHost(host)){
      box.classList.add("drive");
      box.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>';
    } else {
      box.classList.add("link");
      box.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>';
    }
    return box;
  }
  var ext = fileExtension(item.title) || fileExtension(item.storage_path || "");
  box.style.background = LIB_ICON_COLORS[ext] || "#8c9bab";
  box.textContent = ext ? ext.slice(0,4) : "FILE";
  return box;
}

function buildLibItem(proj, item){
  var $it = document.createElement("article");
  $it.className = "lib-item";
  $it.appendChild(buildLibIcon(item));

  var $body = document.createElement("div");
  $body.className = "lib-body";
  var $t = document.createElement("div");
  $t.className = "lib-title";
  $t.textContent = item.title;
  $body.appendChild($t);

  var bits = [];
  if(item.kind === "link"){
    var host = linkHost(item.url);
    bits.push(isDriveHost(host) ? "Google Drive" : (host || "link"));
  } else {
    var ext = fileExtension(item.title);
    if(ext) bits.push(ext.toUpperCase());
    if(item.size_bytes) bits.push(formatBytes(item.size_bytes));
  }
  if(item.created_by) bits.push(profileName(item.created_by));
  var $m = document.createElement("div");
  $m.className = "lib-meta";
  $m.textContent = bits.join(" · ");
  $m.title = item.kind === "link" ? item.url : bits.join(" · ");
  $body.appendChild($m);
  $it.appendChild($body);

  var $actions = document.createElement("div");
  $actions.className = "lib-actions";

  if(item.kind === "file"){
    var $dl = document.createElement("button");
    $dl.className = "lib-action";
    $dl.title = "Scarica";
    $dl.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
    $dl.addEventListener("click", function(e){
      e.stopPropagation();
      openLibraryItem(item, true);
    });
    $actions.appendChild($dl);
  }

  var $del = document.createElement("button");
  $del.className = "lib-action danger";
  $del.title = "Elimina";
  $del.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
  $del.addEventListener("click", function(e){
    e.stopPropagation();
    deleteLibraryItem(proj.id, item.id);
  });
  $actions.appendChild($del);
  $it.appendChild($actions);

  $it.addEventListener("click", function(e){
    if(e.target.closest(".lib-action")) return;
    openLibraryItem(item, false);
  });

  return $it;
}

function buildLibraryColumn(proj){
  var items = libraryItems(proj.id);
  var uploads = pendingUploads.filter(function(u){ return u.projectId === proj.id; });

  var $col = document.createElement("section");
  $col.className = "column library";

  var $head = document.createElement("div");
  $head.className = "column-header";
  $head.innerHTML =

  var $file = document.createElement("input");
  $file.type = "file";
  $file.multiple = true;
  $file.style.display = "none";
  $file.addEventListener("change", function(){
    var files = $file.files;

  });
  $col.appendChild($file);

  var $buttons = document.createElement("div");
  $buttons.className = "lib-buttons";

  var $addFile = document.createElement("button");
  $addFile.className = "add-card";
  $addFile.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> Carica un file';
  $addFile.addEventListener("click", function(){ $file.click(); });
  $buttons.appendChild($addFile);

  var $addLink = document.createElement("button");
  $addLink.className = "add-card";
  $addLink.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg> Aggiungi un link';
  $addLink.addEventListener("click", function(){ openAddLinkModal(proj); });
  $buttons.appendChild($addLink);

  $col.appendChild($buttons);

  /* --- drag & drop di file e link ---------------------------------------- */
  function dragKind(e){
    var dt = e.dataTransfer;
    if(!dt) return null;
    var types = dt.types ? Array.prototype.slice.call(dt.types) : [];
    if(types.indexOf("Files") >= 0) return "file";
    if(types.indexOf("text/uri-list") >= 0) return "link";
    return null;
  }
  function onOver(e){
    if(!dragKind(e)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "copy";
    $col.classList.add("file-over");
  }
  $col.addEventListener("dragenter", onOver);
  $col.addEventListener("dragover", onOver);
  $col.addEventListener("dragleave", function(e){
    if(e.target === $col || !$col.contains(e.relatedTarget)) $col.classList.remove("file-over");
  });
  $col.addEventListener("drop", function(e){
    var kind = dragKind(e);
    if(!kind) return;
    e.preventDefault();
    $col.classList.remove("file-over");
    if(kind === "file" && e.dataTransfer.files && e.dataTransfer.files.length){
      uploadLibraryFiles(proj, e.dataTransfer.files);
      return;
    }
    var uri = (e.dataTransfer.getData("text/uri-list") || e.dataTransfer.getData("text/plain") || "")
      .split("\n")
      .map(function(l){ return l.trim(); })
      .filter(function(l){ return l && l.charAt(0) !== "#"; })[0];
    if(uri) addLibraryLink(proj, uri, "");
  });

  return $col;
}

/* --- mutazioni Archivio --------------------------------------------------- */
function libraryUnavailable(){
  if(!state.libraryError) return false;
  alert("L'Archivio non è ancora attivo sul database.\n\n" + state.libraryError +
        "\n\nEsegui lo script sql/archivio.sql nell'editor SQL di Supabase.");
  return true;
}

async function uploadLibraryFiles(proj, fileList){
  if(libraryUnavailable()) return;
  var files = Array.prototype.slice.call(fileList || []);
  if(!files.length) return;

  var tooBig = files.filter(function(f){ return f.size > LIBRARY_MAX_BYTES; });
  files = files.filter(function(f){ return f.size <= LIBRARY_MAX_BYTES; });
  if(tooBig.length){
    alert("File troppo grandi (limite " + formatBytes(LIBRARY_MAX_BYTES) + "):\n" +
      tooBig.map(function(f){ return "· " + f.name + " (" + formatBytes(f.size) + ")"; }).join("\n"));
  }
  if(!files.length) return;

  var tickets = files.map(function(f){
    var t = { projectId: proj.id, name: f.name };
    pendingUploads.push(t);
    return t;
  });
  renderBoard();

  var errors = [];
  for(var i = 0; i < files.length; i++){
    var err = await uploadOneFile(proj, files[i]);
    if(err) errors.push(files[i].name + ": " + err);
    pendingUploads = pendingUploads.filter(function(t){ return t !== tickets[i]; });
    renderBoard();
  }
  if(errors.length) alert("Caricamento non riuscito:\n" + errors.join("\n"));
}

async function uploadOneFile(proj, file){
  var items = state.library[proj.id] || (state.library[proj.id] = []);
  var path = proj.id + "/" + uid("f").slice(2) + "_" + safeFileName(file.name);

  var up = await sb.storage.from(LIBRARY_BUCKET).upload(path, file, {
    cacheControl: "3600",
    upsert: false,
    contentType: file.type || "application/octet-stream"
  });
  if(up.error) return up.error.message;

  var ins = await sb.from("be_library_items").insert({
    project_id: proj.id,
    kind: "file",
    title: file.name,
    storage_path: path,
    mime_type: file.type || null,
    size_bytes: file.size,
    position: items.length,
    created_by: state.me.id
  }).select().single();

  if(ins.error){
    try { await sb.storage.from(LIBRARY_BUCKET).remove([path]); } catch(e){}
    return ins.error.message;
  }
  items.push(ins.data);
  return null;
}

function normalizeUrl(raw){
  var v = (raw || "").trim();
  if(!v) return null;
  if(!/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(v)) v = "https://" + v;
  try {
    var u = new URL(v);
    if(u.protocol !== "http:" && u.protocol !== "https:") return null;
    return u.href;
  } catch(e){ return null; }
}

function titleFromUrl(url){
  try {
    var u = new URL(url);
    var host = u.hostname.replace(/^www\./, "");
    if(isDriveHost(host)) return "Documento su Google Drive";
    var seg = u.pathname.split("/").filter(Boolean).pop();
    if(seg) return decodeURIComponent(seg).replace(/[-_]+/g, " ").slice(0, 80);
    return host;
  } catch(e){ return url.slice(0, 80); }
}

async function addLibraryLink(proj, rawUrl, rawTitle){
  if(libraryUnavailable()) return;
  var url = normalizeUrl(rawUrl);
  if(!url){ alert("Indirizzo non valido. Usa un URL http:// o https://"); return; }
  var items = state.library[proj.id] || (state.library[proj.id] = []);
  var title = (rawTitle || "").trim() || titleFromUrl(url);

  var res = await sb.from("be_library_items").insert({
    project_id: proj.id,
    kind: "link",
    title: title,
    url: url,
    position: items.length,
    created_by: state.me.id
  }).select().single();
  if(res.error){ notify(errorText(res.error)); return; }
  items.push(res.data);
  renderBoard();
}

async function deleteLibraryItem(projectId, itemId){
  var items = state.library[projectId] || [];
  var item = items.find(function(it){ return it.id === itemId; });
  if(!item) return;
  if(!confirm("Eliminare «" + item.title + "» dall'Archivio?")) return;

  var res = await sb.from("be_library_items").delete().eq("id", itemId);
  if(res.error){ notify(errorText(res.error)); return; }
  if(item.kind === "file" && item.storage_path){
    var rm = await sb.storage.from(LIBRARY_BUCKET).remove([item.storage_path]);
    if(rm.error) console.warn("File non rimosso dallo storage:", rm.error.message);
  }
  state.library[projectId] = items.filter(function(it){ return it.id !== itemId; });
  renderBoard();
}

async function openLibraryItem(item, forceDownload){
  if(item.kind === "link"){
    window.open(item.url, "_blank", "noopener");
    return;
  }
  var win = window.open("", "_blank");
  var opts = forceDownload ? { download: item.title } : {};
  var res = await sb.storage.from(LIBRARY_BUCKET).createSignedUrl(item.storage_path, 120, opts);
  if(res.error || !res.data){
    if(win) win.close();
    alert("Impossibile aprire il file: " + ((res.error && res.error.message) || "errore sconosciuto"));
    return;
  }
  if(win) win.location.href = res.data.signedUrl;
  else window.location.href = res.data.signedUrl;
}

/* =====================================================================
 * Messaggi: alert generati dalle scadenze delle card
 * ===================================================================== */
var ALERT_LEAD_DAYS       = 7;                  /* preavviso in giorni */
var ALERTS_READ_KEY       = "be_alerts_read_v1";
var ALERTS_NOTIFIED_KEY   = "be_alerts_notified_v1";
var ALERTS_REFRESH_MS     = 5 * 60 * 1000;

function readIdList(key){
  try {
    var raw = localStorage.getItem(key);
    var arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch(e){ return []; }
}
function writeIdList(key, ids){
  try { localStorage.setItem(key, JSON.stringify(ids)); } catch(e){}
}

/* Un alert per ogni card con scadenza entro ALERT_LEAD_DAYS (o gia' scaduta),
   escluse le card nella lista Done. */
function collectAlerts(){
  if(state.cardDatesError) return [];
  var out = [];
  state.projects.forEach(function(proj){
    var doneId = doneColumnId(proj);
    proj.columns.forEach(function(col){
      if(col.id === doneId) return;
      col.cards.forEach(function(card){
        if(!card.due_date) return;
        var n = daysUntil(card.due_date);
        if(n === null || n > ALERT_LEAD_DAYS) return;
        out.push({
          id: card.id + "|" + card.due_date,
          card: card, proj: proj, col: col, days: n,
          level: n < 0 ? "overdue" : (n <= 1 ? "today" : "soon")
        });
      });
    });
  });
  out.sort(function(a,b){
    if(a.days !== b.days) return a.days - b.days;
    return a.proj.name.localeCompare(b.proj.name);
  });
  return out;
}

function alertWhen(a){
  if(a.days < 0) return a.days === -1 ? "Scaduta ieri" : "Scaduta da " + Math.abs(a.days) + " giorni";
  if(a.days === 0) return "Scade oggi";
  if(a.days === 1) return "Scade domani";
  return "Scade tra " + a.days + " giorni";
}

function renderAlerts(){
  state.alerts = collectAlerts();

  var ids = state.alerts.map(function(a){ return a.id; });
  /* le scadenze sparite (card chiusa, data cambiata) escono dagli elenchi */
  var read = readIdList(ALERTS_READ_KEY).filter(function(id){ return ids.indexOf(id) >= 0; });
  writeIdList(ALERTS_READ_KEY, read);
  var unread = state.alerts.filter(function(a){ return read.indexOf(a.id) < 0; });

  var $badge = document.getElementById("msg-badge");
  if($badge){
    if(unread.length){
      $badge.hidden = false;
      $badge.textContent = unread.length > 99 ? "99+" : String(unread.length);
      $badge.classList.toggle("quiet", !unread.some(function(a){ return a.level === "overdue"; }));
    } else {
      $badge.hidden = true;
    }
  }

  var $btn = document.getElementById("open-msgs-btn");
  if($btn){
    $btn.title = state.alerts.length
      ? state.alerts.length + (state.alerts.length === 1 ? " scadenza da controllare" : " scadenze da controllare")
      : "Nessuna scadenza nei prossimi " + ALERT_LEAD_DAYS + " giorni";
  }

  var $panel = document.getElementById("msg-panel");
  if($panel && !$panel.hidden) renderMsgList();

  fireDesktopAlerts(unread);
}

function renderMsgList(){
  var $list = document.getElementById("msg-list");
  if(!$list) return;
  $list.innerHTML = "";

  var highlight = state.msgHighlight || [];

  if(!state.alerts.length){
    var $e = document.createElement("div");
    $e.className = "msg-empty";
    $e.textContent = state.cardDatesError
      ? "Le scadenze non sono ancora attive sul database: esegui sql/scadenza.sql su Supabase."
      : "Nessun messaggio. Le scadenze entro " + ALERT_LEAD_DAYS + " giorni compaiono qui.";
    $list.appendChild($e);
  } else {
    state.alerts.forEach(function(a){
      var $it = document.createElement("div");
      $it.className = "msg-item" + (highlight.indexOf(a.id) >= 0 ? " unread" : "");

      var $dot = document.createElement("span");
      $dot.className = "msg-dot " + a.level;
      $it.appendChild($dot);

      var $body = document.createElement("div");
      $body.className = "msg-body";

      var $t = document.createElement("div");
      $t.className = "msg-title";
      $t.textContent = a.card.title;
      $body.appendChild($t);

      var $m = document.createElement("div");
      $m.className = "msg-meta";
      var $when = document.createElement("span");
      $when.className = "msg-when" + (a.level === "overdue" ? " overdue" : (a.level === "today" ? " today" : ""));
      $when.textContent = alertWhen(a);
      $m.appendChild($when);
      $m.appendChild(document.createTextNode(" · " + formatDateIT(a.card.due_date) + " · " + a.proj.name + " › " + a.col.name));
      $body.appendChild($m);

      $it.appendChild($body);
      $it.addEventListener("click", function(){
        closeMsgPanel();
        goToAlert(a);
      });
      $list.appendChild($it);
    });
  }

  var $note = document.getElementById("msg-foot-note");
  if($note){
    $note.textContent = state.alerts.length
      ? state.alerts.length + (state.alerts.length === 1 ? " scadenza" : " scadenze") + " entro " + ALERT_LEAD_DAYS + " giorni"
      : "";
  }
  var $nb = document.getElementById("msg-notify-btn");
  if($nb) $nb.hidden = !("Notification" in window) || Notification.permission !== "default";
}

function goToAlert(a){
  state.view = "board";
  state.area = normalizeArea(a.proj.area);
  state.activeProjectId = a.proj.id;
  render();
  openEditCardModal(a.card.id, a.col.id, false, a.proj);
}

function openMsgPanel(){
  var $panel = document.getElementById("msg-panel");
  var $btn = document.getElementById("open-msgs-btn");
  if(!$panel) return;
  var read = readIdList(ALERTS_READ_KEY);
  /* i non letti restano evidenziati finche' il pannello resta aperto */
  state.msgHighlight = state.alerts
    .filter(function(a){ return read.indexOf(a.id) < 0; })
    .map(function(a){ return a.id; });
  writeIdList(ALERTS_READ_KEY, state.alerts.map(function(a){ return a.id; }));
  $panel.hidden = false;
  if($btn) $btn.setAttribute("aria-expanded", "true");
  renderAlerts();
}

function closeMsgPanel(){
  var $panel = document.getElementById("msg-panel");
  var $btn = document.getElementById("open-msgs-btn");
  if(!$panel || $panel.hidden) return;
  $panel.hidden = true;
  state.msgHighlight = [];
  if($btn) $btn.setAttribute("aria-expanded", "false");
}

/* Notifiche di sistema: una sola volta per scadenza */
function fireDesktopAlerts(unread){
  if(!("Notification" in window) || Notification.permission !== "granted") return;
  var notified = readIdList(ALERTS_NOTIFIED_KEY);
  var fresh = unread.filter(function(a){ return notified.indexOf(a.id) < 0; });
  var live = state.alerts.map(function(a){ return a.id; });
  writeIdList(ALERTS_NOTIFIED_KEY,
    notified.filter(function(id){ return live.indexOf(id) >= 0; })
            .concat(fresh.map(function(a){ return a.id; })));
  if(!fresh.length) return;
  var head = fresh.length === 1
    ? alertWhen(fresh[0]) + ": " + fresh[0].card.title
    : fresh.length + " scadenze da controllare";
  var body = fresh.slice(0, 4).map(function(a){
    return "• " + a.card.title + " — " + a.proj.name + " (" + alertWhen(a).toLowerCase() + ")";
  }).join("\n");
  try { new Notification("Mario Project Manager · " + head, { body: body, tag: "be-scadenze" }); } catch(e){}
}

(function messagesModule(){
  var $btn    = document.getElementById("open-msgs-btn");
  var $panel  = document.getElementById("msg-panel");
  var $mark   = document.getElementById("msg-mark-all");
  var $notify = document.getElementById("msg-notify-btn");
  if(!$btn || !$panel) return;

  $btn.addEventListener("click", function(e){
    e.stopPropagation();
    if($panel.hidden) openMsgPanel(); else closeMsgPanel();
  });

  $panel.addEventListener("click", function(e){ e.stopPropagation(); });

  document.addEventListener("click", function(){ closeMsgPanel(); });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape") closeMsgPanel();
  });

  if($mark){
    $mark.addEventListener("click", function(){
      writeIdList(ALERTS_READ_KEY, state.alerts.map(function(a){ return a.id; }));
      state.msgHighlight = [];
      renderAlerts();
    });
  }

  if($notify){
    $notify.addEventListener("click", function(){
      if(!("Notification" in window)) return;
      Notification.requestPermission().then(function(){ renderAlerts(); });
    });
  }

  /* le scadenze cambiano con il passare del tempo: ricontrollo periodico */
  setInterval(function(){ renderAlerts(); }, ALERTS_REFRESH_MS);
})();

(function mobileDrawers(){
  var MOBILE_QUERY = window.matchMedia("(max-width:780px)");

  function bindDrawer(toggleId, drawerId, backdropId){
    var $toggle   = document.getElementById(toggleId);
    var $drawer   = document.getElementById(drawerId);
    var $backdrop = document.getElementById(backdropId);
    if(!$toggle || !$drawer || !$backdrop) return null;

    function open(){
      $drawer.classList.add("drawer-open");
      $backdrop.classList.add("show");
      $toggle.classList.add("active");
      $toggle.setAttribute("aria-expanded","true");
    }
    function close(){
      $drawer.classList.remove("drawer-open");
      $backdrop.classList.remove("show");
      $toggle.classList.remove("active");
      $toggle.setAttribute("aria-expanded","false");
    }
    function toggle(){
      if($drawer.classList.contains("drawer-open")) close(); else open();
