    var countTip = " a " + monthName(mk);
    function socioRow(p){
      var row = document.createElement("div");
      row.className = "cal-person-row";
      if(!hiddenPersons.has(p)) row.classList.add("checked");
      row.style.setProperty("--pc", rowColor(p));
      var count = countIn(p);
      row.title = plural(count, "impegno", "impegni") + countTip;
      row.innerHTML =
        '<div class="cal-cb"></div>'+
        '<div class="cal-person-name">'+ escapeHtml(p) +'</div>'+
        '<div class="cal-person-count">'+ count +'</div>';
      row.addEventListener("click", function(e){
        if(e.shiftKey || e.metaKey || e.ctrlKey){
          // modifier-click: solo questo socio
          mine.forEach(function(x){ hiddenPersons.add(x); });
          hiddenPersons.delete(p);
        } else {
          if(hiddenPersons.has(p)) hiddenPersons.delete(p);
          else hiddenPersons.add(p);
        }
        saveFilter();
        render();
      });
      return row;
    }
    function outsideRow(p){
      var row = extraRow(p, mk);
      var extra = findExtra(p);
      var count = countIn(p);
      var c = document.createElement("div");
      c.className = "cal-person-count";
      c.textContent = count;
      c.title = plural(count, "impegno", "impegni") + countTip;
      row.appendChild(c);
      if(!extra) row.classList.add("inactive");
      // gli Extra si rinominano, si spostano e si tolgono dalla loro scheda
      var edit = document.createElement("button");
      edit.type = "button";
      edit.className = "cal-person-del cal-person-edit";
      edit.title = "Modifica " + p;
      edit.setAttribute("aria-label", "Modifica " + p);
      edit.innerHTML = ICON_PEN;
      edit.addEventListener("click", function(ev){ ev.stopPropagation(); openPersonSheet(p); });
      row.appendChild(edit);
      // ...e col mouse si trascinano per cambiare l'ordine (per tutti)
      if(extra){
        row.draggable = true;
        row.addEventListener("dragstart", function(ev){
          dragName = p;
          ev.dataTransfer.effectAllowed = "move";
          try{ ev.dataTransfer.setData("text/plain", p); }catch(_){}
          row.classList.add("dragging");
        });
        row.addEventListener("dragend", function(){
          dragName = null;
          row.classList.remove("dragging");
          $side.querySelectorAll(".drop-before,.drop-after").forEach(function(x){ x.classList.remove("drop-before", "drop-after"); });
        });
        row.addEventListener("dragover", function(ev){
          if(!dragName || dragName === p) return;
          ev.preventDefault();
          var after = ev.offsetY > row.offsetHeight / 2;
          row.classList.toggle("drop-after", after);
          row.classList.toggle("drop-before", !after);
        });
        row.addEventListener("dragleave", function(){ row.classList.remove("drop-before", "drop-after"); });
        row.addEventListener("drop", function(ev){
          ev.preventDefault();
          var moving = findExtra(dragName);
          var after = row.classList.contains("drop-after");
          row.classList.remove("drop-before", "drop-after");
          if(!moving || moving === extra) return;
          var rest = extraPeople.filter(function(x){ return x !== moving; });
          moveExtra(moving, rest.indexOf(extra) + (after ? 1 : 0));
        });
      }
      return row;
    }
    mine.forEach(function(p){ $side.appendChild(socioRow(p)); });

    // Extra: chiusa di base; aperta mostra chi ha la colonna in questo mese
    var open = lsGet(EXTRA_OPEN_KEY) === "1";
    var shownN = outside.filter(function(n){ return extraShown(n, mk); }).length;
    var h2 = document.createElement("button");
    h2.type = "button";
    h2.className = "cal-side-sub cal-extra-toggle" + (open ? " open" : "");
    h2.setAttribute("aria-expanded", open ? "true" : "false");
    h2.title = "Tutti quelli fuori dai soci. Le spunte accendono la colonna in " + monthName(mk) +
      " per tutti; nome e ordine si cambiano con la matita o trascinando.";
    h2.innerHTML = '<span class="cal-extra-caret">' + ICON_CARET + '</span><span>Extra</span>' +
      '<span class="cal-person-count">' + shownN + "/" + outside.length + '</span>';
    h2.addEventListener("click", function(){
      lsSet(EXTRA_OPEN_KEY, open ? "0" : "1");
      renderPersonSide();
    });
    $side.appendChild(h2);
    if(open){
      var eh = document.createElement("p");
      eh.className = "cal-filter-hint";
      eh.textContent = "La spunta accende la colonna solo a " + monthName(mk) + ", per tutti. " +
        "Chi ha qualcosa segnato nel mese ha la colonna comunque.";
      $side.appendChild(eh);
      if(outside.length > 1){
        $side.appendChild(groupRow("Tutti gli Extra", outside, function(n){ return extraShown(n, mk); }, function(on){
          setAllExtras(outside, mk, on);
        }));
      }
      outside.forEach(function(p){ $side.appendChild(outsideRow(p)); });
      var add = document.createElement("button");
      add.type = "button";
      add.className = "cal-add-person";
      add.innerHTML = '<span class="cal-add-plus">+</span>Aggiungi persona';
      add.addEventListener("click", promptAddPerson);
      $side.appendChild(add);
    }

    var actions = document.createElement("div");
    actions.className = "cal-side-actions";
    actions.innerHTML =
      '<button data-act="all">Tutti i soci</button>'+
      '<button data-act="none">Nessuno</button>';
    actions.querySelector('[data-act="all"]').addEventListener("click", function(){
      hiddenPersons.clear();
      saveFilter(); render();
    });
    actions.querySelector('[data-act="none"]').addEventListener("click", function(){
      mine.forEach(function(p){ hiddenPersons.add(p); });
      hiddenPersons.add(NOBODY);
      saveFilter(); render();
    });
    $side.appendChild(actions);

    var legend = document.createElement("div");
    legend.className = "cal-legend";
    legend.innerHTML =
      '<h3>Legenda</h3>'+
      '<div><span class="cal-legend-sw k-lavoro"></span>Lavoro</div>'+
      '<div><span class="cal-legend-sw k-extra"></span>Extra fosforo (non disponibile)</div>'+
      '<div><span class="cal-legend-sw k-ferie"></span>Ferie</div>'+
      '<div><span class="cal-legend-sw k-lavoro tentative"></span>? Da confermare ?</div>';
    $side.appendChild(legend);
  }

  function renderBanner(){
    var msg = null;
    if(mode === "local"){
      msg = "Il calendario non è ancora condiviso: va eseguito sql/calendario.sql su Supabase. " +
            "Nel frattempo gli impegni restano solo in questo browser.";
    } else if(loadError){
      msg = isNetworkError(loadError)
        ? "Sei offline: vedi l'ultima copia scaricata, le modifiche non verranno salvate."
        : "Calendario non aggiornato: " + (loadError.message || "errore imprevisto");
    }
    if(!msg) return;
    var b = document.createElement("div");
    b.className = "cal-banner";
    b.textContent = msg;
    $body.appendChild(b);
  }

  function render(){
    useFilterMonth(monthKey(cursor));
    renderPersonSide();
    $body.innerHTML = "";
    renderBanner();
    if(view === "agenda") renderAgenda();
    if(view === "day")   renderDay();
    if(view === "week")  renderWeek();
    if(view === "month") renderMonth();
    if(selecting) markSelected();
  }

  /* Una casella vuota ma cliccabile: apre un impegno gia' compilato
     con persona, giorno e mezza giornata */
  function newFor(row, dateStr, half){
    if(selecting) return;
    openEventModal(null, {
      date: dateStr, half: half || "am",
      persons: row && row !== NOBODY ? [row] : []
    });
  }

  /* =====================================================================
   * Ricerca
   *
   * Parole: cercano in titolo, progetto, note, persone, tipo e stato
   * (tutte devono esserci, senza badare ad accenti e maiuscole).
   * Date: "27/10", "27/10/2026", "2026-10-27", "27 ottobre", "oggi",
   * "domani", "ieri", un mese ("novembre", anche con l'anno) o un giorno
   * della settimana ("martedì"). Una data da sola porta a quel giorno;
   * insieme a delle parole restringe i risultati.
   * ===================================================================== */
  var MONTH_ABBR = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
  var WEEKDAY_NAMES = ["lunedi","martedi","mercoledi","giovedi","venerdi","sabato","domenica"];
  function norm(s){
    return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  }
  function monthIndex(t, allowAbbr){
    var i = MONTHS.indexOf(t);
    if(i >= 0) return i;
    return allowAbbr ? MONTH_ABBR.indexOf(t.replace(/\.$/, "")) : -1;
  }

  var search = null;   // null = nessuna ricerca
  function parseSearch(q){
    var toks = norm(q).trim().split(/\s+/).filter(Boolean);
    var s = { raw: q.trim(), words: [], days: [], months: [], weekdays: [] };
    var today = new Date();
    for(var i = 0; i < toks.length; i++){
      var t = toks[i], m, next = toks[i + 1], after = toks[i + 2];
      if(t === "oggi" || t === "domani" || t === "ieri"){
        var d = addDays(today, t === "oggi" ? 0 : t === "domani" ? 1 : -1);
        s.days.push({ d: d.getDate(), m: d.getMonth(), y: d.getFullYear() });
        continue;
      }
      if((m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(t))){
        s.days.push({ d: +m[3], m: +m[2] - 1, y: +m[1] });
        continue;
      }
      if((m = /^(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2}|\d{4}))?$/.exec(t)) && +m[1] <= 31 && +m[2] >= 1 && +m[2] <= 12){
        var y = m[3] ? (m[3].length === 2 ? 2000 + +m[3] : +m[3]) : null;
        s.days.push({ d: +m[1], m: +m[2] - 1, y: y });
        continue;
      }
      if(/^\d{1,2}$/.test(t) && next && monthIndex(next, true) >= 0 && +t >= 1 && +t <= 31){
        var dy = after && /^\d{4}$/.test(after) ? +after : null;
        s.days.push({ d: +t, m: monthIndex(next, true), y: dy });
        i += dy ? 2 : 1;
        continue;
      }
      if(monthIndex(t, false) >= 0){
        var my = next && /^\d{4}$/.test(next) ? +next : null;
        s.months.push({ m: monthIndex(t, false), y: my });
        if(my) i++;
        continue;
      }
      var wd = WEEKDAY_NAMES.indexOf(t);
      if(wd >= 0){ s.weekdays.push(wd); continue; }
      s.words.push(t);
    }
    s.hasDate = s.days.length + s.months.length + s.weekdays.length > 0;
    return s;
  }

  /* Il giorno rispetta la parte "data" della ricerca? */
  function searchDayOk(ds){
    if(!search || !search.hasDate) return true;
    var d = parseDate(ds);
    if(search.days.length && !search.days.some(function(x){
      return x.d === d.getDate() && x.m === d.getMonth() && (x.y === null || x.y === d.getFullYear());
    })) return false;
    if(search.months.length && !search.months.some(function(x){
      return x.m === d.getMonth() && (x.y === null || x.y === d.getFullYear());
    })) return false;
    if(search.weekdays.length && search.weekdays.indexOf((d.getDay() + 6) % 7) < 0) return false;
    return true;
  }
  /* L'impegno contiene tutte le parole cercate? */
  function searchEventOk(e){
    if(!search || !search.words.length) return true;
    if(!e._hay){
      e._hay = norm([
        e.title, e.project_name, e.notes, e.location, (e.persons || []).join(" "),
        e.kind === "extra" ? "extra fosforo" : e.kind,
        e.status === "da_confermare" ? "da confermare ?" : "confermato",
        e.source === "apple" ? "apple" : "",
        HALF_LABEL[e.half], e.start_time
      ].join(" "));
    }
    return search.words.every(function(w){ return e._hay.indexOf(w) >= 0; });
  }
  /* Una data da sola (un giorno, un mese) porta li'; tutto il resto filtra */
  function searchFilters(){ return !!search && !searchTarget(); }
  /* Solo date, nessuna parola: la ricerca porta a quel giorno invece di filtrare */
  function searchTarget(){
    if(!search || search.words.length || search.weekdays.length) return null;
    var today = new Date();
    if(search.days.length === 1){
      var x = search.days[0];
      var y = x.y;
      if(y === null){
        // senza anno: la prossima volta che capita (o oggi)
        y = today.getFullYear();
        if(new Date(y, x.m, x.d) < new Date(today.getFullYear(), today.getMonth(), today.getDate() - 1)) y++;
      }
      var d = new Date(y, x.m, x.d);
      return d.getMonth() === x.m ? d : null;
    }
    if(search.months.length === 1 && !search.days.length){
      var mm = search.months[0], yy = mm.y;
      if(yy === null) yy = mm.m < today.getMonth() ? today.getFullYear() + 1 : today.getFullYear();
      return mm.m === today.getMonth() && yy === today.getFullYear() ? today : new Date(yy, mm.m, 1);
    }
    return null;
  }
  function eventShownOn(e, ds){
    if(searchFilters()) return searchDayOk(ds) && searchEventOk(e);
    return true;
  }

  var searchTimer = null;
  function onSearchInput(){
    clearTimeout(searchTimer);
    searchTimer = setTimeout(applySearch, 160);
  }
  function applySearch(){
    var q = document.getElementById("cal-search").value;
    document.getElementById("cal-search-clear").hidden = !q;
    var wasSearching = !!search;
    search = q.trim() ? parseSearch(q) : null;
    // cancellata la ricerca si torna dove si era prima di cominciarla
    if(search && !wasSearching) agenda.beforeSearch = { top: agenda.lastTop, cursor: cursor };
    var target = searchTarget();
    if(target){
      cursor = target;
      agenda.jumpTo = fmtDate(target);
    } else if(!search && wasSearching && agenda.beforeSearch){
      cursor = agenda.beforeSearch.cursor || new Date();
      agenda.jumpTo = agenda.beforeSearch.top || todayKey();
      agenda.beforeSearch = null;
    }
    render();
  }
  function clearSearch(){
    var $i = document.getElementById("cal-search");
    $i.value = "";
    applySearch();
  }

  /* =====================================================================
   * Agenda: i giorni scorrono in verticale senza fine, due righe ciascuno
   * (mattina e pomeriggio); in alto le persone, sempre nello stesso
   * ordine. Si apre sul giorno di oggi; sopra ci sono i giorni passati,
   * attenuati.
   * ===================================================================== */
  var AGENDA_CHUNK = 35;
  var agenda = { from: null, to: null, jumpTo: null, lastTop: null, rows: {}, headMonth: null };

  /* L'agenda scorre senza fine: le colonne sono quelle di un paio di mesi
     indietro e un anno avanti */
  /* Ogni mese dell'agenda ha le sue colonne: chi si vede in quel mese.
     Calcolate una volta per disegno (agenda.rows si svuota a ogni render). */
  function agendaRows(mk){
    agenda.rows = agenda.rows || {};
    if(!agenda.rows[mk]){
      var rows = monthRows(mk);
      agenda.rows[mk] = { rows: rows, tpl: agendaTemplate(rows), all: monthAllRows(mk).length };
    }
    return agenda.rows[mk];
  }
  function agendaTemplate(rows){
    return "var(--alabel) var(--ahalf) repeat(" + Math.max(rows.length, 1) + ", minmax(var(--acol), 1fr))";
  }

  /* Indice giorno -> impegni, solo per i giorni da disegnare */
  function indexByDay(fromStr, toStr){
    var idx = {};
    calEvents.forEach(function(e){
      var end = e.date_end || e.date;
      if(e.date > toStr || end < fromStr) return;
      var d = parseDate(e.date < fromStr ? fromStr : e.date);
      for(var n = 0; n < 400; n++, d = addDays(d, 1)){
        var ds = fmtDate(d);
        if(ds > end || ds > toStr) break;
        (idx[ds] = idx[ds] || []).push(e);
      }
    });
    return idx;
  }

  function agendaChip(e, row){
    var chip = document.createElement("div");
    chip.className = "cal-chip " + chipClass(e);
    paintChip(chip, e, row);
    var html = "";
    if(e.start_time) html += '<span class="cal-chip-time">' + escapeHtml(fmtTimeRange(e)) + '</span>';
    if(e.kind === "extra") html += '<span class="cal-tag">Extra</span>';
    html += '<span class="cal-chip-title">' + escapeHtml(displayTitle(e)) + '</span>';
    if(e.project_name) html += '<span class="cal-chip-proj">' + escapeHtml(e.project_name) + '</span>';
    if(e.location) html += '<span class="cal-chip-proj cal-chip-place">' + ICON_PIN + escapeHtml(e.location) + '</span>';
    chip.innerHTML = html;
    chip.title = eventTooltip(e);
    chip.dataset.ev = e.id;
    // l'Agenda aggiunge i mesi mentre si scorre: la spunta va messa qui
    if(selecting && selected[e.id]) chip.classList.add("cal-sel");
    chip.addEventListener("click", function(ev){ ev.stopPropagation(); if(!pick(ev, [e])) openEventModal(e); });
    return chip;
  }

  function agendaBand(d, isStart){
    var mk = monthKey(d), r = agendaRows(mk);
    var b = document.createElement("div");
    b.className = "cal-aband" + (isStart ? " cal-aband-start" : "");
    b.style.setProperty("--acols", Math.max(r.rows.length, 1));
    b.innerHTML = "<span>" + MONTHS[d.getMonth()] + " " + d.getFullYear() +
      '<button type="button" class="cal-aband-people"></button></span>';
    var btn = b.querySelector("button");
    btn.textContent = "Persone · " + r.rows.length;
    btn.title = "Scegli chi vedi a " + MONTHS[d.getMonth()];
    btn.addEventListener("click", function(){ openMonthPeople(mk); });
    return b;
  }

  function agendaDay(ds, rows, evs, tpl){
    var d = parseDate(ds);
    var today = todayKey();
    var block = document.createElement("div");
    block.className = "cal-aday";
    block.dataset.date = ds;
    block.style.gridTemplateColumns = tpl;
    block.style.setProperty("--acols", Math.max(rows.length, 1));
    if(ds < today) block.classList.add("past");
    if(ds === today) block.classList.add("today");
    var dow = (d.getDay() + 6) % 7;
    if(dow >= 5) block.classList.add("weekend");

    var label = document.createElement("div");
    label.className = "cal-alabel";
    label.innerHTML = '<span class="cal-alabel-dow">' + DAYS_SHORT[dow] + '</span>' +
                      '<span class="cal-alabel-num">' + d.getDate() + '</span>' +
                      '<span class="cal-alabel-mon">' + MONTH_ABBR[d.getMonth()] + '</span>';
    label.title = fmtItalianDay(d);
    label.addEventListener("click", function(){ cursor = d; setView("day"); });
    block.appendChild(label);

    HALVES.forEach(function(h, hi){
      var hl = document.createElement("div");
      hl.className = "cal-ahalf" + (hi ? " pm" : "");
      hl.textContent = hi ? "Pom." : "Mat.";
      hl.title = h.label;
      block.appendChild(hl);
      rows.forEach(function(row){
        var cell = document.createElement("div");
        cell.className = "cal-acell" + (hi ? " pm" : "");
        var se = slotEvents(evs, row, ds, h.key);
        se.forEach(function(e){ cell.appendChild(agendaChip(e, row)); });
        if(!se.length) cell.title = rowLabel(row) + " · " + h.label + ": libero (clic per aggiungere)";
        cell.addEventListener("click", function(){ newFor(row, ds, h.key); });
        block.appendChild(cell);
      });
    });
    return block;
  }

  /* I giorni [fromStr, toStr], con la fascia del mese a ogni inizio mese.
     withStart: anche una fascia in cima se il blocco non parte dal 1. */
  function agendaChunk(fromStr, toStr, withStart){
    var frag = document.createDocumentFragment();
    var idx = indexByDay(fromStr, toStr);
    for(var d = parseDate(fromStr), first = true; fmtDate(d) <= toStr; d = addDays(d, 1), first = false){
      var ds = fmtDate(d), r = agendaRows(monthOf(ds));
      if(d.getDate() === 1) frag.appendChild(agendaBand(d, false));
      else if(first && withStart) frag.appendChild(agendaBand(d, true));
      frag.appendChild(agendaDay(ds, r.rows, idx[ds] || [], r.tpl));
    }
    return frag;
  }

  function agendaHead(rows, tpl){
    var head = document.createElement("div");
    head.className = "cal-ahead";
    head.style.gridTemplateColumns = tpl;
    head.style.setProperty("--acols", Math.max(rows.length, 1));
    head.innerHTML = '<div class="cal-ahead-corner">Giorno</div><div class="cal-ahead-half"></div>';
    rows.forEach(function(row){
      var c = document.createElement("div");
      c.className = "cal-ahead-person";
      c.innerHTML = '<span class="cal-person-dot" style="background:' + rowColor(row) + '"></span>' +
                    '<span>' + escapeHtml(rowLabel(row)) + '</span>';
      head.appendChild(c);
    });
    if(!rows.length){
      var none = document.createElement("div");
      none.className = "cal-ahead-person";
      none.textContent = "Nessuna persona selezionata";
      head.appendChild(none);
    }
    return head;
  }

  /* Il primo giorno visibile sotto l'intestazione */
  function agendaTopDay(scroller){
    var headH = scroller.querySelector(".cal-ahead").offsetHeight;
    var y = scroller.scrollTop + headH + 1;
    var days = scroller.querySelectorAll(".cal-aday");
    for(var i = 0; i < days.length; i++){
      if(days[i].offsetTop + days[i].offsetHeight > y) return days[i];
    }
    return days[days.length - 1] || null;
  }
  function agendaScrollTo(scroller, ds, smooth){
    var el = scroller.querySelector('.cal-aday[data-date="' + ds + '"]');
    if(!el) return false;
    var headH = scroller.querySelector(".cal-ahead").offsetHeight;
    var prev = el.previousElementSibling;
    // se il giorno apre il mese, si mostra anche la fascia del mese
    var top = (prev && prev.classList.contains("cal-aband") ? prev.offsetTop : el.offsetTop) - headH;
    scroller.scrollTo({ top: Math.max(0, top), behavior: smooth ? "smooth" : "auto" });
    return true;
  }
  function agendaUpdatePeriod(scroller){
    if(!scroller.isConnected) return;          // una vista gia' sostituita da un ridisegno
    var top = agendaTopDay(scroller);
    if(!top) return;
    var d = parseDate(top.dataset.date);
    $period.textContent = MONTHS[d.getMonth()] + " " + d.getFullYear();
    agenda.lastTop = top.dataset.date;
    cursor = d;
    agendaSyncHead(scroller, monthKey(d));
  }
  /* Passando a un altro mese cambiano le colonne in alto e il filtro a lato */
  function agendaSyncHead(scroller, mk){
    if(mk === agenda.headMonth) return;
    agenda.headMonth = mk;
    var r = agendaRows(mk);
    var old = scroller.querySelector(".cal-ahead");
    if(old) old.replaceWith(agendaHead(r.rows, r.tpl));
    agendaMonthTitle(scroller.previousElementSibling, mk);
    useFilterMonth(mk);
    renderPersonSide();
  }
  /* In alto, grande e fermo mentre si scorre, il mese in cui si e'
     (come il giorno nella vista Giorno) */
  function agendaMonthTitle(head, mk){
    if(!head || !head.classList.contains("cal-amonth")) return;
    var r = agendaRows(mk);
    head.classList.toggle("today", mk === monthOf(todayKey()));
    head.innerHTML = '<h3><span class="daynum">' + monthName(mk) + '</span> ' + mk.slice(0, 4) +
      '<button type="button" class="cal-aband-people"></button></h3>';
    var btn = head.querySelector("button");
    btn.textContent = "Persone · " + r.rows.length;
    btn.title = "Scegli chi vedi a " + monthName(mk);
    btn.addEventListener("click", function(){ openMonthPeople(mk); });
  }

  function renderAgenda(){
    agenda.rows = {};
    // l'intervallo disegnato resta tra un ridisegno e l'altro: si ricomincia
    // da oggi solo quando si apre il calendario o si salta a un giorno
    var jump = agenda.jumpTo || agenda.lastTop || todayKey();
    agenda.headMonth = monthOf(jump);
    var head = agendaRows(agenda.headMonth);
    var rows = head.rows, tpl = head.tpl;

    var view = document.createElement("div");
    view.className = "cal-day-view";
    var month = document.createElement("div");
    month.className = "cal-day-view-head cal-amonth";
    view.appendChild(month);
    var scroller = document.createElement("div");
    scroller.className = "cal-agenda";
    scroller.style.setProperty("--acols", Math.max(rows.length, 1));
    scroller.appendChild(agendaHead(rows, tpl));
    var list = document.createElement("div");
    list.className = "cal-alist";
    scroller.appendChild(list);
    view.appendChild(scroller);
    $body.appendChild(view);
    agendaMonthTitle(month, agenda.headMonth);

    if(searchFilters()) return renderAgendaResults(scroller, list, rows, tpl);

    agenda.jumpTo = null;
    if(!agenda.from || jump < agenda.from || jump > agenda.to){
      agenda.from = fmtDate(addDays(parseDate(jump), -21));
      agenda.to = fmtDate(addDays(parseDate(jump), 60));
    }
    list.appendChild(agendaChunk(agenda.from, agenda.to, true));
    agendaScrollTo(scroller, jump, false);
    agendaUpdatePeriod(scroller);

    function extendDown(){
      var from = fmtDate(addDays(parseDate(agenda.to), 1));
      var to = fmtDate(addDays(parseDate(agenda.to), AGENDA_CHUNK));
      list.appendChild(agendaChunk(from, to, false));
      agenda.to = to;
    }
    function extendUp(){
      var to = fmtDate(addDays(parseDate(agenda.from), -1));
      var from = fmtDate(addDays(parseDate(agenda.from), -AGENDA_CHUNK));
      // la vecchia fascia "inizio intervallo" non serve piu': il blocco nuovo porta la sua
      var stale = list.querySelector(".cal-aband-start");
      var before = scroller.scrollHeight;
      if(stale) stale.remove();
      list.insertBefore(agendaChunk(from, to, true), list.firstChild);
      scroller.scrollTop += scroller.scrollHeight - before;   // la vista resta ferma dov'era
      agenda.from = from;
    }
    // vicino ai bordi si aggiungono altri giorni: sopra il passato, sotto il futuro
    var EDGE = 900;
    function edges(){
      if(!scroller.isConnected) return;
      // anche piu' volte di fila, se si scorre molto veloce o lo schermo e' alto
      for(var n = 0; n < 6 && scroller.scrollTop + scroller.clientHeight > scroller.scrollHeight - EDGE; n++) extendDown();
      for(var m = 0; m < 6 && scroller.scrollTop < EDGE; m++) extendUp();
    }
    // il mese in alto si aggiorna al massimo ogni 80 ms, e comunque alla fine
    var lastPeriod = 0, periodTimer = null;
    scroller.addEventListener("scroll", function(){
      edges();
      clearTimeout(periodTimer);
      var now = Date.now();
      if(now - lastPeriod > 80){ lastPeriod = now; agendaUpdatePeriod(scroller); }
      else periodTimer = setTimeout(function(){ agendaUpdatePeriod(scroller); }, 90);
    }, { passive: true });
  }

  // cambiando larghezza (telefono girato, finestra stretta) i giorni cambiano
  // altezza senza che si scorra: il mese in alto va ricalcolato
  var agendaResizeTimer = null;
  window.addEventListener("resize", function(){
    clearTimeout(agendaResizeTimer);
    agendaResizeTimer = setTimeout(function(){
      var sc = $body.querySelector(".cal-agenda");
      if(sc && view === "agenda" && !searchFilters()) agendaUpdatePeriod(sc);
    }, 120);
  });

  /* Con una ricerca attiva: solo i giorni con impegni che corrispondono */
  function renderAgendaResults(scroller, list, rows, tpl){
    var days = {};
    calEvents.forEach(function(e){
      if(!searchEventOk(e)) return;
      var end = e.date_end || e.date;
      for(var d = parseDate(e.date), n = 0; n < 400 && fmtDate(d) <= end; d = addDays(d, 1), n++){
        var ds = fmtDate(d);
        if(searchDayOk(ds)) (days[ds] = days[ds] || []).push(e);
      }
    });
    var keys = Object.keys(days).sort();
    var count = 0, seen = {};
    keys.forEach(function(k){ days[k].forEach(function(e){ if(!seen[e.id]){ seen[e.id] = 1; count++; } }); });

    var info = document.createElement("div");
    info.className = "cal-search-info";
    info.innerHTML = count
      ? "<b>" + count + "</b> " + (count === 1 ? "impegno trovato" : "impegni trovati") + " in " + keys.length + (keys.length === 1 ? " giorno" : " giorni")
      : "Nessun impegno trovato";
    var clr = document.createElement("button");
    clr.type = "button";
    clr.className = "btn-cancel";
    clr.textContent = "Cancella ricerca";
    clr.addEventListener("click", clearSearch);
    info.appendChild(clr);
    scroller.insertBefore(info, list);

    var lastMonth = null;
    keys.forEach(function(ds){
      var d = parseDate(ds);
      var mk = d.getFullYear() * 12 + d.getMonth();
      if(mk !== lastMonth){ list.appendChild(agendaBand(d, false)); lastMonth = mk; }
      var r = agendaRows(monthOf(ds));
      list.appendChild(agendaDay(ds, r.rows, days[ds], r.tpl));
    });
    scroller.addEventListener("scroll", function(){
      var top = agendaTopDay(scroller);
      if(top) agendaSyncHead(scroller, monthOf(top.dataset.date));
    }, { passive: true });
    $period.textContent = count ? "Risultati della ricerca" : "—";
    // si parte dal primo risultato da oggi in poi
    var today = todayKey();
    var firstNext = keys.filter(function(k){ return k >= today; })[0] || keys[keys.length - 1];
    if(firstNext) requestAnimationFrame(function(){ agendaScrollTo(scroller, firstNext, false); });
  }

  /* Gli Extra con qualcosa segnato in un giorno: nel Mese non hanno una
     casella, li segnala un'icona */
  function extrasOn(evs, ds){
    var out = [];
    evs.forEach(function(e){
      if(e.date > ds || (e.date_end || e.date) < ds) return;
      (e.persons || []).forEach(function(n){ if(!isKnown(n) && out.indexOf(n) < 0) out.push(n); });
      if(!e.persons || !e.persons.length){ if(out.indexOf(NOBODY) < 0) out.push(NOBODY); }
    });
    return out;
  }
  var ICON_PEOPLE = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>';

  /* Mese: sempre le caselle dei sei soci (mattina | pomeriggio), che si
     adattano all'altezza della finestra; gli Extra con un'icona */
  function renderMonth(){
    $period.textContent = MONTHS[cursor.getMonth()] + " " + cursor.getFullYear();

    var wrap = document.createElement("div");
    wrap.className = "cal-month";

    var head = document.createElement("div");
    head.className = "cal-month-headrow";
    DAYS_SHORT.forEach(function(d){
      var h = document.createElement("div");
      h.innerHTML = d + '<span class="cal-month-halves"><span>mattina</span><span>pom.</span></span>';
      head.appendChild(h);
    });
    wrap.appendChild(head);

    var grid = document.createElement("div");
    grid.className = "cal-month-grid";

    var firstOfMonth = startOfMonth(cursor);
    var gridStart = startOfWeek(firstOfMonth);
    // 5 o 6 settimane, quante ne servono al mese
    var weeks = Math.ceil((((firstOfMonth.getDay() + 6) % 7) + new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0).getDate()) / 7);
    grid.style.gridTemplateRows = "repeat(" + weeks + ", minmax(0, 1fr))";
    var today = new Date();
    var evs = eventsInRange(fmtDate(gridStart), fmtDate(addDays(gridStart, weeks * 7 - 1)));
    var rows = KNOWN_PERSONS;

    for(var i=0;i<weeks*7;i++){
      var d = addDays(gridStart, i);
      var ds = fmtDate(d);
      var cell = document.createElement("div");
      cell.className = "cal-day-cell";
      if(d.getMonth() !== cursor.getMonth()) cell.classList.add("other-month");
      if(isSameDay(d, today)) cell.classList.add("today");

      var top = document.createElement("div");
      top.className = "cal-day-top";
      var num = document.createElement("span");
      num.className = "cal-day-num";
      num.textContent = d.getDate();
      top.appendChild(num);
      var others = extrasOn(evs, ds);
      if(others.length){
        var more = document.createElement("span");
        more.className = "cal-day-more";
        more.innerHTML = ICON_PEOPLE + "<span>+" + others.length + "</span>";
        more.title = "Anche altre persone: " + others.map(rowLabel).join(", ") + ". Clic per vedere il giorno.";
        top.appendChild(more);
      }
      cell.appendChild(top);

      // Una riga per socio, sempre nello stesso ordine; a sinistra la
      // mattina, a destra il pomeriggio. Le caselle vuote restano.
      var mg = document.createElement("div");
      mg.className = "cal-mgrid";
      rows.forEach(function(row){
        HALVES.forEach(function(h){
          var se = slotEvents(evs, row, ds, h.key);
          var slot = document.createElement("div");
          slot.className = "cal-mslot";
          if(se.length){
            var e = se[0];
            slot.className += " full " + chipClass(e);
            paintChip(slot, e, row);
            slot.textContent = (e.status === "da_confermare" ? "? " : "") +
              (e.kind === "ferie" ? "Ferie" : e.title) + (se.length > 1 ? " +" + (se.length - 1) : "");
            slot.title = rowLabel(row) + " · " + h.label + "\n" + se.map(eventTooltip).join("\n\n");
            slot.dataset.ev = se.map(function(x){ return x.id; }).join(" ");
            slot.addEventListener("click", (function(se){
              return function(ev){ ev.stopPropagation(); if(!pick(ev, se)) openEventModal(se[0]); };
            })(se));
          } else {
            slot.title = rowLabel(row) + " · " + h.label + ": libero";
          }
          mg.appendChild(slot);
        });
      });
      cell.appendChild(mg);

      (function(date){
        cell.addEventListener("click", function(){
          cursor = date;
          setView("day");
        });
      })(new Date(d));

      grid.appendChild(cell);
    }
    wrap.appendChild(grid);
    $body.appendChild(wrap);
  }

  /* Settimana: le persone in verticale, ognuna con la riga della mattina
     e quella del pomeriggio; i giorni in orizzontale. */
  function personGrid(days, rows, evs){
    var today = new Date();
    var grid = document.createElement("div");
    grid.className = "cal-pgrid";
    grid.style.setProperty("--pdays", days.length);

    var corner = document.createElement("div");
    corner.className = "cal-pcorner";
    corner.textContent = rows.length ? "Persone" : "";
    grid.appendChild(corner);
    days.forEach(function(d, i){
      var head = document.createElement("div");
      head.className = "cal-week-head";
      if(isSameDay(d, today)) head.classList.add("today");
      head.innerHTML = '<div class="cal-week-day-name">'+ DAYS_SHORT[(d.getDay()+6)%7] +'</div>'+
                       '<div class="cal-week-day-num">'+ d.getDate() +'</div>';
      head.addEventListener("click", function(){ cursor = d; setView("day"); });
      grid.appendChild(head);
    });

    if(!rows.length){
      var none = document.createElement("div");
      none.className = "cal-pnone";
      none.textContent = "Nessuna persona selezionata";
      grid.appendChild(none);
    }

    rows.forEach(function(row){
      var label = document.createElement("div");
      label.className = "cal-plabel";
      label.innerHTML = '<span class="cal-person-dot" style="background:'+ rowColor(row) +'"></span>' +
                        '<span class="cal-wlabel-name">' + escapeHtml(rowLabel(row)) + '</span>';
      grid.appendChild(label);
      HALVES.forEach(function(h, hi){
        var hl = document.createElement("div");
        hl.className = "cal-phalf" + (hi ? " pm" : "");
        hl.textContent = hi ? "Pom." : "Mat.";
        hl.title = h.label;
        grid.appendChild(hl);
        days.forEach(function(d){
          var ds = fmtDate(d);
          var cell = document.createElement("div");
          cell.className = "cal-pcell" + (hi ? " pm" : "");
          if(isSameDay(d, today)) cell.classList.add("today");
          var se = slotEvents(evs, row, ds, h.key);
          se.forEach(function(e){ cell.appendChild(agendaChip(e, row)); });
          if(!se.length) cell.title = rowLabel(row) + " · " + h.label + ": libero (clic per aggiungere)";
          cell.addEventListener("click", function(){ newFor(row, ds, h.key); });
          grid.appendChild(cell);
        });
      });
    });
    return grid;
  }

  function renderWeek(){
    var ws = startOfWeek(cursor);
    var we = addDays(ws, 6);
    if(ws.getMonth() === we.getMonth()){
      $period.textContent = ws.getDate() + " – " + we.getDate() + " " + MONTHS[ws.getMonth()] + " " + ws.getFullYear();
    } else {
      $period.textContent = ws.getDate() + " " + MONTHS[ws.getMonth()] + " – " + we.getDate() + " " + MONTHS[we.getMonth()] + " " + we.getFullYear();
    }
    var evs = eventsInRange(fmtDate(ws), fmtDate(we));
    var rows = visibleRows(evs, fmtDate(ws), fmtDate(we));
    var days = [];
    for(var i = 0; i < 7; i++) days.push(addDays(ws, i));

    var wrap = document.createElement("div");
    wrap.className = "cal-week";
    wrap.appendChild(personGrid(days, rows, evs));
    $body.appendChild(wrap);
  }

  /* Giorno: una riga per persona, due colonne, mattina e pomeriggio */
  function renderDay(){
    $period.textContent = cursor.getDate() + " " + MONTHS[cursor.getMonth()] + " " + cursor.getFullYear();

    meta.className = "cal-day-event-meta";
    var bits = [];
    if(e.kind === "extra") bits.push('<span class="cal-tag">Extra fosforo</span>');
    if(e.kind === "ferie") bits.push('<span class="cal-tag">Ferie</span>');

      bits.push('<span>Dal ' + escapeHtml(fmtShort(e.date)) + ' al ' + escapeHtml(fmtShort(e.date_end)) + '</span>');
    }
    if(e.series_id) bits.push('<span>Ricorrente</span>');
    if(e.location){
      bits.push('<a class="cal-place" href="' + escapeHtml(mapsUrl(e)) + '" target="_blank" rel="noopener" title="Apri in Google Maps">' +
                ICON_PIN + escapeHtml(e.location) + '</a>');

    meta.innerHTML = bits.join("");
    // il luogo apre Google Maps, non l'impegno
    var place = meta.querySelector(".cal-place");
    if(place) place.addEventListener("click", function(ev){ ev.stopPropagation(); });
    if(bits.length) body.appendChild(meta);

    if(e.notes){

    card.addEventListener("click", function(ev){ if(!pick(ev, [e])) openEventModal(e); });

  /* ---------- luogo ----------
   * Si scrive a mano o si sceglie tra i suggerimenti di Google Maps, che
   * arrivano da /api/places: la chiave di Google sta solo su Vercel. Del
   * posto scelto si tiene il place_id, cosi' il link apre proprio quello.
   * Se la funzione non c'e' o non ha la chiave, i suggerimenti vengono da
   * OpenStreetMap via Photon (photon.komoot.io), gratuito e senza chiave;
   * Nominatim, l'altro servizio di OpenStreetMap, vieta di usarlo cosi'. */
  var ICON_PIN = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>';
  var PHOTON_URL = "https://photon.komoot.io/api/";
  function mapsUrl(e){
    return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(e.location) +
      (e.location_place_id ? "&query_place_id=" + encodeURIComponent(e.location_place_id) : "");
  }
  /* "Teatro dell'Aquila, Corso Cefalonia 69, Fermo" da una risposta di Photon */
  function placeLabel(p){
    var street = p.street ? p.street + (p.housenumber ? " " + p.housenumber : "") : "";
    var city = p.city || p.town || p.village || p.county || "";
    var parts = [p.name, street, city].filter(function(x, i, a){ return x && a.indexOf(x) === i; });
    if(!parts.length && p.state) parts.push(p.state);
    return parts.join(", ");
  }
  var placeAbort = null;
  var googlePlaces = true;    // diventa false se /api/places non c'e' o non ha la chiave
  async function searchPlaces(q){
    if(placeAbort) placeAbort.abort();
    placeAbort = window.AbortController ? new AbortController() : null;
    var signal = placeAbort ? placeAbort.signal : undefined;
    if(googlePlaces && mode === "remote"){
      try{
        var list = await searchGoogle(q, signal);
        if(list) return list;
      }catch(err){
        if(err && err.name === "AbortError") throw err;
      }
    }
    return searchPhoton(q, signal);
  }
  async function searchGoogle(q, signal){
    var sess = await sb.auth.getSession();
    var token = sess && sess.data && sess.data.session && sess.data.session.access_token;
    if(!token) return null;
    var r = await fetch("/api/places", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
      body: JSON.stringify({ q: q }),
      signal: signal
    });
    // 503: manca la chiave; 404/405/501: nessuna funzione (server statico)
    if([404, 405, 501, 503].indexOf(r.status) >= 0){ googlePlaces = false; return null; }
    if(!r.ok) return null;
    var j = await r.json();
    return (j.places || []).map(function(p){
      return { label: p.label, place_id: p.place_id, source: "google" };
    });
  }
  async function searchPhoton(q, signal){
    // vicino a Fermo i risultati vengono prima, ma si trova anche altrove
    var url = PHOTON_URL + "?limit=6&lat=43.16&lon=13.72&q=" + encodeURIComponent(q);
    var r = await fetch(url, signal ? { signal: signal } : {});
    if(!r.ok) throw new Error("errore " + r.status);
    var j = await r.json();
    var seen = {};
    return (j.features || []).map(function(f){
      var c = f.geometry && f.geometry.coordinates || [];
      return { label: placeLabel(f.properties || {}), lat: c[1], lon: c[0], source: "osm" };
    }).filter(function(x){
      if(!x.label || seen[x.label]) return false;
      seen[x.label] = 1;
      return true;
    });
  }

  function escapeHtml(s){
    return String(s||"").replace(/[&<>"']/g, function(c){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c];
    });
  }

  function askChoice(title, text, choices){
    return new Promise(function(resolve){
      var bd = document.createElement("div");
      bd.className = "modal-backdrop";
      bd.style.zIndex = "110";
      bd.innerHTML =
        '<div class="modal" role="dialog" aria-modal="true" style="max-width:400px">' +
          '<h2></h2><p class="cm-ask-text"></p><div class="actions cm-ask-actions"></div>' +
        '</div>';
      bd.querySelector("h2").textContent = title;
      bd.querySelector("p").textContent = text;
      var $a = bd.querySelector(".cm-ask-actions");
      function done(v){ bd.remove(); document.removeEventListener("keydown", onKey, true); resolve(v); }
      function onKey(e){ if(e.key === "Escape"){ e.stopPropagation(); done(null); } }
      choices.forEach(function(c){
        var b = document.createElement("button");
        b.className = c.primary ? "btn-primary" : "btn-cancel";
        if(c.danger) b.style.color = "#f87168";
        b.textContent = c.label;
        b.addEventListener("click", function(){ done(c.value); });
        $a.appendChild(b);
      });
      bd.addEventListener("click", function(e){ if(e.target === bd) done(null); });
      document.addEventListener("keydown", onKey, true);
      document.body.appendChild(bd);
    });
  }

  function hourOptions(){

  function minuteOptions(){
    var o = "";

  function projectOptions(current){
    var projs = (state.projects || []).filter(function(p){ return !p.archived_at; })
      .sort(function(a,b){ return a.name.localeCompare(b.name, "it"); });
    var o = '<option value="">— Scegli il progetto —</option>';
    var found = false;
    projs.forEach(function(p){
      if(current && current.project_id === p.id) found = true;
      o += '<option value="'+ escapeHtml(p.id) +'">'+ escapeHtml(p.name) +'</option>';
    });

    if(current && current.project_id && !found){
      o += '<option value="'+ escapeHtml(current.project_id) +'">'+ escapeHtml(current.project_name || "Progetto") +'</option>';
    }
    o += '<option value="__altro__">Altro (specificare)…</option>';
    return o;

          return b.offsetParent !== null;

        var i = rows.indexOf(row);
        if(e.key === "Escape"){ e.preventDefault(); e.stopPropagation(); closePop(true); }
        else if(e.key === "Tab"){ closePop(false); }
        else if(e.key === "ArrowDown" || e.key === "ArrowUp"){
          e.preventDefault();
          var next = rows[Math.min(rows.length - 1, Math.max(0, i + (e.key === "ArrowDown" ? 1 : -1)))];
          if(next){
            next.focus();
            next.scrollIntoView({ block: "nearest" });
            if($col === $ddCats && next.dataset.g) openCat(next.dataset.g, false);
          }

        else if(e.key === "ArrowRight" && row.dataset.g){ e.preventDefault(); openCat(row.dataset.g, true); }
        else if(e.key === "ArrowLeft" && $col === $ddProjs){
          e.preventDefault();

    $date.value = data.date;

    function showPlaces(list){
      placeHits = list; placeIdx = -1;

      list.forEach(function(h, i){

      $place.setAttribute("aria-expanded", list.length ? "true" : "false");

    function markPlace(){
      $placeList.querySelectorAll("li").forEach(function(li, i){ li.classList.toggle("on", i === placeIdx); });
      if(placeIdx >= 0) $place.setAttribute("aria-activedescendant", "cm-place-opt-" + placeIdx);
      else $place.removeAttribute("aria-activedescendant");

    function choosePlace(h){
      placePick = h;

    $place.addEventListener("input", function(){
      placePick = null;           // scritto a mano: niente coordinate

      clearTimeout(placeTimer);

      placeTimer = setTimeout(function(){
        searchPlaces(q).then(function(list){

        }).catch(function(){ /* senza suggerimenti si scrive a mano */ });
      }, 350);
    });
    $place.addEventListener("keydown", function(ev){
      if($placeList.hidden) return;

        placeIdx = ev.key === "ArrowDown" ? (placeIdx + 1) % n : (placeIdx - 1 + n) % n;
        markPlace();

        ev.preventDefault();

    /* --- aspetto in base alle scelte --- */
    function sync(){
      bd.querySelectorAll("#cm-kind button").forEach(function(b){ b.classList.toggle("on", b.dataset.v === kind); b.setAttribute("aria-pressed", b.dataset.v === kind); });
      bd.querySelectorAll("#cm-half button").forEach(function(b){ b.classList.toggle("on", b.dataset.v === half); b.setAttribute("aria-pressed", b.dataset.v === half); });
      bd.querySelectorAll("#cm-status button").forEach(function(b){ b.classList.toggle("on", b.dataset.v === status); b.setAttribute("aria-pressed", b.dataset.v === status); });
      bd.querySelectorAll(".cm-person[data-p]").forEach(function(b){

      $days.querySelectorAll("button").forEach(function(b){ b.classList.toggle("on", recurDays.has(+b.dataset.d)); });

    /* Legge e controlla il modulo: null se qualcosa manca */
    function collect(){
      var out = {
        kind: kind, half: half, status: status,
        title: $title.value.trim(),
        notes: $notes.value.trim() || null,
        location: null, location_lat: null, location_lon: null, location_place_id: null,
        date: $date.value,
        date_end: null,
        start_time: null, end_time: null,
        project_id: null, project_name: null
      };
      out.persons = KNOWN_PERSONS.filter(function(p){ return persons.indexOf(p) >= 0; })
        .concat(persons.filter(function(p){ return !isKnown(p); }));

      if(kind !== "ferie"){
        out.location = $place.value.trim().slice(0, 300) || null;
        if(out.location && placePick && placePick.label === out.location){
          if(placePick.place_id) out.location_place_id = placePick.place_id;
          else { out.location_lat = placePick.lat; out.location_lon = placePick.lon; }
        }
      }
      if(kind === "ferie" && !out.title) out.title = "Ferie";
      if(!out.title) return fail("Scrivi un titolo.", $title);
      if(kind === "lavoro"){
        var pv = $project.value;
        if(!pv) return fail("Scegli a quale progetto si riferisce: senza progetto l'impegno non si salva.",
                            groups ? $ddBtn : $project);
        if(pv === "__altro__"){
          var other = $projOther.value.trim();
          if(!other) return fail("Hai scelto «Altro»: specifica a cosa si riferisce.", $projOther);
          out.project_name = other;
        } else {
          out.project_id = pv;
          var p = (state.projects || []).find(function(x){ return x.id === pv; });
          out.project_name = p ? p.name : (data.project_name || null);
        }
      }
      if(!out.persons.length) return fail("Scegli almeno una persona.", $people.querySelector("button"));
      if(!out.date) return fail("Scegli la data.", $date);
      if(kind === "ferie"){
        var de = $dateEnd.value || out.date;
        if(de < out.date) return fail("La data di fine viene prima di quella d'inizio.", $dateEnd);
        out.date_end = de !== out.date ? de : null;
      } else {
        out.start_time = timeOf($sh, $sm) || null;
        out.end_time = timeOf($eh, $em) || null;
        if(!out.start_time && out.end_time) return fail("Manca l'ora d'inizio.", $sh);
        if(out.start_time && out.end_time && out.end_time <= out.start_time) return fail("La fine viene prima dell'inizio.", $eh);
      }
      return out;
    }

    /* Le date della ricorrenza, dalla data scelta a "fino al" */
    function recurrenceDates(from, to){
      if(!recurDays.size) return fail("Scegli almeno un giorno della settimana.", $days.querySelector("button"));
      if(!to || to < from) return fail("La data «fino al» viene prima dell'inizio.", $recurTo);
      var out = [];
      for(var d = parseDate(from); fmtDate(d) <= to; d = addDays(d, 1)){
        if(recurDays.has(isoDow(d))) out.push(fmtDate(d));
        if(out.length > 400) return fail("Troppe ripetizioni: al massimo un anno.", $recurTo);
      }
      if(!out.length) return fail("Nessun giorno scelto cade in quel periodo.", $recurTo);
      return out;
    }

    function teardown(){ bd.remove(); document.removeEventListener("keydown", onKey); }
    var saving = false;
    async function save(){
      if(saving) return;
      var v = collect();
      if(!v) return;
      $err.textContent = "";

      var rows = [], removeIds = [];
      if(!isEdit || !data.series_id){
        if(kind !== "ferie" && $recur.checked){
          var dates = recurrenceDates(v.date, $recurTo.value);
          if(!dates) return;
          var sid = uid("s");
          var recur = { days: Array.from(recurDays).sort(), from: dates[0], to: $recurTo.value };
          dates.forEach(function(ds){
            rows.push(Object.assign({}, v, { id: uid("e"), date: ds, series_id: sid, recur: recur, source: "mario" }));
          });
          if(isEdit) removeIds.push(data.id);
        } else {
          rows.push(Object.assign({}, data, v, { id: data.id || uid("e"), series_id: null, recur: null }));
        }
      } else {
        var scope = await askChoice("Impegno ricorrente", "Vuoi cambiare solo questo impegno o tutti quelli della serie?", [
          { label: "Annulla", value: null },
          { label: "Tutta la serie", value: "all" },
          { label: "Solo questo", value: "one", primary: true }
        ]);
        if(!scope) return;
        if(scope === "one"){
          rows.push(Object.assign({}, data, v));
        } else {
          // tutta la serie: stessi campi, ognuno resta nel suo giorno
          var shared = Object.assign({}, v);
          delete shared.date; delete shared.date_end;
          calEvents.filter(function(e){ return e.series_id === data.series_id; }).forEach(function(e){
            rows.push(Object.assign({}, e, shared, e.id === data.id ? { date: v.date } : {}));
          });
        }
      }

      saving = true;
      $("cm-save").disabled = true;
      var ok = await saveRows(rows) && await deleteRows(removeIds);
      saving = false;
      $("cm-save").disabled = false;
      if(!ok) return;
      teardown();
      render();
      if(!isEdit) offerUndo(rows);
    }
    async function del(){
      var ids = [data.id];
      var series = data.series_id ? seriesOf(data) : [];
      if(series.length > 1){
        var before = series.filter(function(e){ return e.date < data.date; }).length;
        var after = series.filter(function(e){ return e.date > data.date; }).length;
        var choices = [{ label: "Annulla", value: null }];
        choices.push({ label: "Tutta la serie (" + series.length + ")", value: "all", danger: true });
        if(before) choices.push({ label: "Questo e i precedenti (" + (before + 1) + ")", value: "before", danger: true });
        if(after) choices.push({ label: "Questo e i successivi (" + (after + 1) + ")", value: "after", danger: true });
        choices.push({ label: "Solo questo", value: "one", primary: true });
        var scope = await askChoice("Elimina impegno ricorrente",
          "Questo impegno si ripete: vuoi eliminare solo questo o anche gli altri della serie?", choices);
        if(!scope) return;
        if(scope !== "one"){
          ids = series.filter(function(e){
            return e.id === data.id || scope === "all" ||
                   (scope === "before" ? e.date < data.date : e.date > data.date);
          }).map(function(e){ return e.id; });
        }
      } else if(!confirm("Eliminare questo impegno?")) return;
      if(!(await deleteRows(ids))) return;
      teardown();
      render();
    }
    function onKey(e){
      if(e.key === "Escape") teardown();
      if(e.key === "Enter" && (e.metaKey || e.ctrlKey)) save();
    }
    document.addEventListener("keydown", onKey);

    bd.addEventListener("click", function(e){ if(e.target === bd) teardown(); });
    $("cm-cancel").addEventListener("click", teardown);
    $("cm-save").addEventListener("click", save);
    var $del = $("cm-delete");
    if($del) $del.addEventListener("click", del);
    var $copy = $("cm-copy");
    if($copy) $copy.addEventListener("click", function(){
      teardown();
      openEventModal(null, { copy: data });
    });
  }

  function seriesOf(e){
    return calEvents.filter(function(x){ return x.series_id === e.series_id; });
  }

  /* Subito dopo aver aggiunto un impegno (o una serie) lo si puo' togliere
     con «Annulla» nell'avviso, finche' resta a schermo. */
  function offerUndo(rows){
    var ids = rows.map(function(r){ return r.id; });
    notify(rows.length > 1 ? rows.length + " impegni aggiunti." : "Impegno aggiunto.", {
      warn: false, autoHide: 8000,
      action: { label: "Annulla", run: async function(){
        if(!(await deleteRows(ids, "Impegno non tolto"))) return;
        render();
        notify(rows.length > 1 ? "Impegni tolti." : "Impegno tolto.", { warn: false, autoHide: 2500 });
      } }
    });
  }

  /* Gli impegni arrivati da Apple si cambiano da Apple: qui solo lettura */
  function openAppleEventInfo(e){
    askChoice(displayTitle(e),
      fmtShort(e.date) + (e.date_end ? " – " + fmtShort(e.date_end) : "") + " · " + fmtTimeRange(e) +
      "\nExtra fosforo di " + (e.persons || []).join(", ") +
      ", importato da Apple Calendar: si modifica da lì.",
      [{ label: "Chiudi", value: null, primary: true }]);
  }

  /* =====================================================================
   * Apple Calendar
   *  - da Mario ad Apple: un link di abbonamento (api/cal-feed.js);
   *  - da Apple a Mario: il link del calendario pubblico iCloud, letto da
   *    api/apple-ics.js e salvato come impegni "Extra fosforo".
   * ===================================================================== */
  var FEED_BASE = "webcal://www.brownenterprises.it/api/cal-feed?t=";

  function randomToken(){
    var a = new Uint8Array(24);
    crypto.getRandomValues(a);
    return Array.from(a, function(b){ return ("0" + b.toString(16)).slice(-2); }).join("");
  }
  /* Hash corto e stabile per gli id degli impegni importati */
  function hash53(str){
    var h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for(var i=0; i<str.length; i++){
      var ch = str.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
  }

  async function getFeed(create){
    var res = await sb.from("be_cal_feeds").select("person, token").eq("user_id", state.me.id).maybeSingle();
    if(res.error) return { error: res.error };
    if(res.data && res.data.person !== myPerson() && !create){
      var up = await sb.from("be_cal_feeds").update({ person: myPerson() }).eq("user_id", state.me.id);
      if(up.error) return { error: up.error };
      res.data.person = myPerson();
    }
    if(!create) return { data: res.data };
    var row = { user_id: state.me.id, person: myPerson(), token: randomToken() };
    var ins = await sb.from("be_cal_feeds").upsert(row, { onConflict: "user_id" });
    if(ins.error) return { error: ins.error };
    return { data: row };
  }

  function appleSyncInfo(){
    try{ return JSON.parse(lsGet(APPLE_SYNC_KEY) || "{}")[state.me.id] || null; }catch(_){ return null; }
  }
  function setAppleSyncInfo(info){
    var all = {};
    try{ all = JSON.parse(lsGet(APPLE_SYNC_KEY) || "{}"); }catch(_){}
    all[state.me.id] = info;
    lsSet(APPLE_SYNC_KEY, JSON.stringify(all));
  }

  var appleSyncing = null;
  async function syncApple(){
    var url = state.me && state.me.apple_ics_url;
    if(!url) return { skipped: true };
    if(mode !== "remote" || loadError) return { error: "il calendario condiviso non è disponibile" };
    if(appleSyncing) return appleSyncing;
    appleSyncing = (async function(){
      var me = myPerson();
      var sess = await sb.auth.getSession();
      var token = sess && sess.data && sess.data.session && sess.data.session.access_token;
      if(!token) return { error: "sessione scaduta, rientra" };
      var j;
      try{
        var r = await fetch("/api/apple-ics", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token },
          body: JSON.stringify({ url: url })
        });
        j = await r.json().catch(function(){ return {}; });
        if(!r.ok) return { error: j.error || ("errore " + r.status) };
      }catch(_){
        return { error: "non riesco a raggiungere il server" };
      }

      var fresh = (j.events || []).map(function(ev){
        return {
          id: "ap_" + hash53(me + "|" + ev.key),
          date: ev.date, date_end: ev.dateEnd || null,
          half: ev.allDay || ev.dateEnd ? "day" : (autoHalf(ev.start, ev.end) || "day"),
          start_time: ev.allDay ? null : ev.start, end_time: ev.allDay ? null : ev.end,
          title: ev.title || "Impegno", persons: [me],
          kind: "extra", status: ev.tentative ? "da_confermare" : "confermato",
          project_id: null, project_name: null, notes: null,
          series_id: null, recur: null, source: "apple"
        };
      });
      var freshIds = {};
      fresh.forEach(function(r){ freshIds[r.id] = 1; });
      var old = calEvents.filter(function(e){
        return e.source === "apple" && e.persons && e.persons[0] === me && (e.date_end || e.date) >= j.from;
      });
      var oldById = {};
      old.forEach(function(e){ oldById[e.id] = e; });
      var changed = fresh.filter(function(r){
        return !oldById[r.id] || JSON.stringify(toDb(oldById[r.id])) !== JSON.stringify(toDb(r));
      });
      var gone = old.filter(function(e){ return !freshIds[e.id]; }).map(function(e){ return e.id; });

      var ok = await saveRows(changed, "Impegni Apple non salvati") && await deleteRows(gone, "Impegni Apple non aggiornati");
      if(!ok) return { error: "salvataggio non riuscito" };
      var info = { at: Date.now(), count: fresh.length };
      setAppleSyncInfo(info);
      return info;
    })();
    var out = await appleSyncing;
    appleSyncing = null;
    return out;
  }

  function maybeAutoSyncApple(){
    if(!state.me || !state.me.apple_ics_url || mode !== "remote" || loadError) return;
    var info = appleSyncInfo();
    if(info && Date.now() - info.at < 10 * 60 * 1000) return;
    syncApple().then(function(res){
      if(res && res.error) notify("Apple Calendar non sincronizzato: " + res.error);
      else if($overlay.classList.contains("show")) render();
    });
  }

  function openApplePanel(){
    var me = myPerson();
    var bd = document.createElement("div");
    bd.className = "modal-backdrop";
    bd.innerHTML =
      '<div class="modal cm-modal" role="dialog" aria-modal="true" aria-labelledby="ap-h">' +
        '<h2 id="ap-h">Apple Calendar</h2>' +
        '<div class="ap-box">' +
          '<h3>Da Mario al tuo Apple Calendar</h3>' +
          '<p class="ap-text">I tuoi impegni (quelli dove compare <b></b>) in un calendario a cui Apple si abbona: si aggiorna da solo.</p>' +
          '<div id="ap-feed"><p class="ap-text">Carico…</p></div>' +
        '</div>' +
        '<div class="ap-box">' +
          '<h3>Dal tuo Apple Calendar a Mario</h3>' +
          '<p class="ap-text">I tuoi impegni personali arrivano qui come <b>Extra fosforo</b>, così gli altri vedono che non sei disponibile.</p>' +
          '<ol class="ap-steps">' +
            '<li>Su Mac apri <b>Calendario</b>, clic destro sul calendario da condividere → <b>Condividi calendario…</b> e spunta <b>Calendario pubblico</b>. Su iPhone: Calendario → Calendari → (i) → <b>Calendario pubblico</b>.</li>' +
            '<li>Copia il link (inizia con webcal://) e incollalo qui sotto.</li>' +
          '</ol>' +
          '<input type="text" id="ap-url" placeholder="webcal://p00-caldav.icloud.com/published/2/…" autocomplete="off" spellcheck="false">' +
          '<div class="ap-actions">' +
            '<button class="btn-primary" id="ap-save" type="button">Salva e sincronizza</button>' +
            '<button class="btn-cancel" id="ap-sync" type="button">Sincronizza ora</button>' +
            '<button class="btn-cancel" id="ap-unlink" type="button" style="color:#f87168">Scollega</button>' +
          '</div>' +
          '<p class="ap-status" id="ap-status"></p>' +
        '</div>' +
        '<div class="actions"><button class="btn-cancel" id="ap-close" type="button">Chiudi</button></div>' +
      '</div>';
    bd.querySelector(".ap-text b").textContent = me;
    document.body.appendChild(bd);

    var $feed = bd.querySelector("#ap-feed"), $url = bd.querySelector("#ap-url"), $status = bd.querySelector("#ap-status");
    $url.value = (state.me && state.me.apple_ics_url) || "";

    function teardown(){ bd.remove(); document.removeEventListener("keydown", onKey); }
    function onKey(e){ if(e.key === "Escape") teardown(); }
    document.addEventListener("keydown", onKey);
    bd.addEventListener("click", function(e){ if(e.target === bd) teardown(); });
    bd.querySelector("#ap-close").addEventListener("click", teardown);

    function showStatus(){
      var info = appleSyncInfo();
      if(!state.me.apple_ics_url){ $status.textContent = "Nessun calendario Apple collegato."; return; }
      $status.textContent = info
        ? "Ultima sincronizzazione: " + new Date(info.at).toLocaleString("it-IT") + " · " + info.count + " impegni."
        : "Collegato, non ancora sincronizzato.";
    }
    showStatus();

    var unavailable = mode !== "remote" || loadError;
    if(unavailable){
      $feed.innerHTML = '<p class="ap-text">Disponibile quando il calendario è condiviso su Supabase (sql/calendario.sql).</p>';
      ["ap-save","ap-sync","ap-unlink"].forEach(function(id){ bd.querySelector("#" + id).disabled = true; });
    }

    function drawFeed(row){
      $feed.innerHTML = "";
      if(!row){
        var mk = document.createElement("button");
        mk.className = "btn-primary"; mk.type = "button";
        mk.textContent = "Crea il link di abbonamento";
        mk.addEventListener("click", async function(){
          mk.disabled = true;
          var r = await getFeed(true);
          if(r.error){ mk.disabled = false; notify(errorText(r.error, "Link non creato")); return; }
          drawFeed(r.data);
        });
        $feed.appendChild(mk);
        return;
      }
      var link = FEED_BASE + row.token;
      $feed.innerHTML =
        '<div class="ap-link"><input type="text" readonly id="ap-feed-url"><button class="btn-cancel" type="button" id="ap-copy">Copia</button></div>' +
        '<div class="ap-actions">' +
          '<a class="btn-primary ap-open" id="ap-open">Aggiungi ad Apple Calendar</a>' +
          '<button class="btn-cancel" type="button" id="ap-regen">Rigenera link</button>' +
        '</div>' +
        '<p class="ap-text ap-small">Il link è personale: chi lo ha vede i tuoi impegni. «Rigenera» spegne quello vecchio.</p>';
      $feed.querySelector("#ap-feed-url").value = link;
      $feed.querySelector("#ap-open").href = link;
      $feed.querySelector("#ap-copy").addEventListener("click", function(){
        var $i = $feed.querySelector("#ap-feed-url");
        $i.select();
        (navigator.clipboard ? navigator.clipboard.writeText(link) : Promise.reject())
          .catch(function(){ document.execCommand("copy"); })
          .then(function(){ notify("Link copiato.", { warn: false, autoHide: 2500 }); });
      });
      $feed.querySelector("#ap-regen").addEventListener("click", async function(){
        if(!confirm("Il vecchio link smetterà di funzionare. Continuare?")) return;
        var r = await getFeed(true);
        if(r.error){ notify(errorText(r.error, "Link non rigenerato")); return; }
        drawFeed(r.data);
      });
    }
    if(!unavailable){
      getFeed(false).then(function(r){
        if(r.error){
          $feed.innerHTML = "";
          var p = document.createElement("p");
          p.className = "ap-text";
          p.textContent = isMissingTable(r.error)
            ? "Manca la tabella be_cal_feeds: va eseguito sql/calendario.sql."
            : errorText(r.error, "Link non disponibile");
          $feed.appendChild(p);
          return;
        }
        drawFeed(r.data);
      });
    }

    async function saveUrl(v){
      var res = await sb.auth.updateUser({ data: { apple_ics_url: v || null } });
      if(res.error){ notify(errorText(res.error, "Collegamento non salvato")); return false; }
      state.me.apple_ics_url = v || "";
      return true;
    }
    async function runSync(){
      $status.textContent = "Sincronizzo…";
      var res = await syncApple();
      if(res && res.error) $status.textContent = "Non riuscito: " + res.error;
      else { showStatus(); render(); }
    }
    bd.querySelector("#ap-save").addEventListener("click", async function(){
      var v = $url.value.trim();
      if(!/^(webcals?|https):\/\/[^/]*icloud\.com\//i.test(v)){
        $status.textContent = "Serve il link di un calendario pubblico iCloud (webcal://…icloud.com/…).";
        $url.focus();
        return;
      }
      if(await saveUrl(v)){ setAppleSyncInfo(null); runSync(); }
    });
    bd.querySelector("#ap-sync").addEventListener("click", function(){
      if(!state.me.apple_ics_url){ $status.textContent = "Prima incolla e salva il link."; return; }
      runSync();
    });
    bd.querySelector("#ap-unlink").addEventListener("click", async function(){
      if(!state.me.apple_ics_url) return;
      if(!confirm("Scollegare Apple Calendar? Gli impegni importati da Apple spariranno da Mario.")) return;
      if(!(await saveUrl(""))) return;
      var ids = calEvents.filter(function(e){ return e.source === "apple" && e.persons && e.persons[0] === me; })
                         .map(function(e){ return e.id; });
      await deleteRows(ids, "Impegni Apple non rimossi");
      setAppleSyncInfo(null);
      $url.value = "";
      showStatus();
      render();
    });
  }

  /* ---------- wire up ---------- */
  document.getElementById("open-calendar-btn").addEventListener("click", function(){ open(); });
  document.getElementById("cal-close").addEventListener("click", function(){
    close();
    if(window.beGoHome) window.beGoHome();
  });
  window.addEventListener("hashchange", function(){
    if(location.hash === CAL_HASH){ if(!isOpen()) open(true); }
    else if(isOpen()){ pushedHash = false; close(true); }
  });
  /* All'avvio, a dati caricati (serve sapere chi e' collegato) */
  window.beCalendarFromUrl = function(){
    if(location.hash === CAL_HASH && !isOpen()) open(true);
  };
  document.getElementById("cal-prev").addEventListener("click", function(){ shift(-1); });
  document.getElementById("cal-next").addEventListener("click", function(){ shift(1); });
  document.getElementById("cal-today-btn").addEventListener("click", goToday);
  document.getElementById("cal-apple-btn").addEventListener("click", openApplePanel);
  document.getElementById("cal-default-btn").addEventListener("click", makeDefaultView);
  document.getElementById("cal-search").addEventListener("input", onSearchInput);
  document.getElementById("cal-search").addEventListener("keydown", function(e){
    if(e.key === "Escape"){ e.stopPropagation(); if(this.value) clearSearch(); else this.blur(); }
    if(e.key === "Enter"){ clearTimeout(searchTimer); applySearch(); }
  });
  document.getElementById("cal-search-clear").addEventListener("click", function(){
    clearSearch();
    document.getElementById("cal-search").focus();
  });
  document.getElementById("cal-add-btn").addEventListener("click", function(){ openEventModal(null, { date: fmtDate(cursor) }); });
  $selBtn.addEventListener("click", function(){ setSelecting(!selecting); });
  document.getElementById("cal-sel-done").addEventListener("click", function(){ setSelecting(false); });
  document.getElementById("cal-sel-none").addEventListener("click", function(){ selected = {}; syncSelBar(); markSelected(); });
  $selDel.addEventListener("click", deleteSelected);
  $selEdit.addEventListener("click", openBulkEdit);
  $views.forEach(function(b){
    b.addEventListener("click", function(){ setView(b.dataset.view); });
  });
  document.addEventListener("keydown", function(e){
    if(!$overlay.classList.contains("show")) return;
    if(document.querySelector(".modal-backdrop")) return;
    if(e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") return;
    if(e.key === "Escape"){ if(selecting) setSelecting(false); else close(); }
    if(e.key === "ArrowLeft") shift(-1);
    if(e.key === "ArrowRight") shift(1);
    if(e.key === "t" || e.key === "T") goToday();
    if(e.key === "1") setView("day");
    if(e.key === "2") setView("week");
    if(e.key === "3") setView("month");
    if(e.key === "4") setView("agenda");
    if(e.key === "/"){ e.preventDefault(); document.getElementById("cal-search").focus(); }
  });

  // initial active view
  $views.forEach(function(b){ b.classList.toggle("active", b.dataset.view === view); });
})();
</script>
