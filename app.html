    $b.querySelector(".lib-title").textContent = u.name;
    $up.appendChild($b);
    $list.appendChild($up);
  });

  if(!items.length && !uploads.length && !state.libraryError){
    var $empty = document.createElement("div");
    $empty.className = "lib-empty";
    $empty.textContent = "Archivio vuoto. Trascina qui i file oppure aggiungi un link (Drive, Dropbox, una pagina web…).";
    $list.appendChild($empty);
  }

  items.forEach(function(item){ $list.appendChild(buildLibItem(proj, item)); });
  $col.appendChild($list);

  var $hint = document.createElement("div");
  $hint.className = "lib-drop-hint";
  $hint.textContent = "Rilascia qui per caricare";
  $col.appendChild($hint);

  var $file = document.createElement("input");
  $file.type = "file";
  $file.multiple = true;
  $file.style.display = "none";
  $file.addEventListener("change", function(){
    var files = $file.files;
    $file.value = "";
    uploadLibraryFiles(proj, files);
  });
  $col.appendChild($file);

  var $buttons = document.createElement("div");
  $buttons.className = "lib-buttons";

  var $addFile = document.createElement("button");
  $addFile.className = "add-card";
  $addFile.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg> Carica un file';
  $addFile.addEventListener("click", function(){ $file.click(); });
  $buttons.appendChild($addFile);

  var $addLink = document.createElement("button");
  $addLink.className = "add-card";
  $addLink.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg> Aggiungi un link';
  $addLink.addEventListener("click", function(){ openAddLinkModal(proj); });
  $buttons.appendChild($addLink);

  $col.appendChild($buttons);

  /* --- drag & drop di file e link ---------------------------------------- */
  function dragKind(e){
    var dt = e.dataTransfer;
    if(!dt) return null;
    var types = dt.types ? Array.prototype.slice.call(dt.types) : [];
    if(types.indexOf("Files") >= 0) return "file";
    if(types.indexOf("text/uri-list") >= 0) return "link";
    return null;
  }
  function onOver(e){
    if(!dragKind(e)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "copy";
    $col.classList.add("file-over");
  }
  $col.addEventListener("dragenter", onOver);
  $col.addEventListener("dragover", onOver);
  $col.addEventListener("dragleave", function(e){
    if(e.target === $col || !$col.contains(e.relatedTarget)) $col.classList.remove("file-over");
  });
  $col.addEventListener("drop", function(e){
    var kind = dragKind(e);
    if(!kind) return;
    e.preventDefault();
    $col.classList.remove("file-over");
    if(kind === "file" && e.dataTransfer.files && e.dataTransfer.files.length){
      uploadLibraryFiles(proj, e.dataTransfer.files);
      return;
    }
    var uri = (e.dataTransfer.getData("text/uri-list") || e.dataTransfer.getData("text/plain") || "")
      .split("\n")
      .map(function(l){ return l.trim(); })
      .filter(function(l){ return l && l.charAt(0) !== "#"; })[0];
    if(uri) addLibraryLink(proj, uri, "");
  });

  return $col;
}

/* --- mutazioni Archivio --------------------------------------------------- */
function libraryUnavailable(){
  if(!state.libraryError) return false;
  alert("L'Archivio non è ancora attivo sul database.\n\n" + state.libraryError +
        "\n\nEsegui lo script sql/archivio.sql nell'editor SQL di Supabase.");
  return true;
}

async function uploadLibraryFiles(proj, fileList){
  if(libraryUnavailable()) return;
  var files = Array.prototype.slice.call(fileList || []);
  if(!files.length) return;

  var tooBig = files.filter(function(f){ return f.size > LIBRARY_MAX_BYTES; });
  files = files.filter(function(f){ return f.size <= LIBRARY_MAX_BYTES; });
  if(tooBig.length){
    alert("File troppo grandi (limite " + formatBytes(LIBRARY_MAX_BYTES) + "):\n" +
      tooBig.map(function(f){ return "· " + f.name + " (" + formatBytes(f.size) + ")"; }).join("\n"));
  }
  if(!files.length) return;

  var tickets = files.map(function(f){
    var t = { projectId: proj.id, name: f.name };
    pendingUploads.push(t);
    return t;
  });
  renderBoard();

  var errors = [];
  for(var i = 0; i < files.length; i++){
    var err = await uploadOneFile(proj, files[i]);
    if(err) errors.push(files[i].name + ": " + err);
    pendingUploads = pendingUploads.filter(function(t){ return t !== tickets[i]; });
    renderBoard();
  }
  if(errors.length) alert("Caricamento non riuscito:\n" + errors.join("\n"));
}

async function uploadOneFile(proj, file){
  var items = state.library[proj.id] || (state.library[proj.id] = []);
  var path = proj.id + "/" + uid("f").slice(2) + "_" + safeFileName(file.name);

  var up = await sb.storage.from(LIBRARY_BUCKET).upload(path, file, {
    cacheControl: "3600",
    upsert: false,
    contentType: file.type || "application/octet-stream"
  });
  if(up.error) return up.error.message;

  var ins = await sb.from("be_library_items").insert({
    project_id: proj.id,
    kind: "file",
    title: file.name,
    storage_path: path,
    mime_type: file.type || null,
    size_bytes: file.size,
    position: items.length,
    created_by: state.me.id
  }).select().single();

  if(ins.error){
    try { await sb.storage.from(LIBRARY_BUCKET).remove([path]); } catch(e){}
    return ins.error.message;
  }
  items.push(ins.data);
  return null;
}

function normalizeUrl(raw){
  var v = (raw || "").trim();
  if(!v) return null;
  if(!/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(v)) v = "https://" + v;
  try {
    var u = new URL(v);
    if(u.protocol !== "http:" && u.protocol !== "https:") return null;
    return u.href;
  } catch(e){ return null; }
}

function titleFromUrl(url){
  try {
    var u = new URL(url);
    var host = u.hostname.replace(/^www\./, "");
    if(isDriveHost(host)) return "Documento su Google Drive";
    var seg = u.pathname.split("/").filter(Boolean).pop();
    if(seg) return decodeURIComponent(seg).replace(/[-_]+/g, " ").slice(0, 80);
    return host;
  } catch(e){ return url.slice(0, 80); }
}

async function addLibraryLink(proj, rawUrl, rawTitle){
  if(libraryUnavailable()) return;
  var url = normalizeUrl(rawUrl);
  if(!url){ alert("Indirizzo non valido. Usa un URL http:// o https://"); return; }
  var items = state.library[proj.id] || (state.library[proj.id] = []);
  var title = (rawTitle || "").trim() || titleFromUrl(url);

  var res = await sb.from("be_library_items").insert({
    project_id: proj.id,
    kind: "link",
    title: title,
    url: url,
    position: items.length,
    created_by: state.me.id
  }).select().single();
  if(res.error){ notify(errorText(res.error)); return; }
  items.push(res.data);
  renderBoard();
}

async function deleteLibraryItem(projectId, itemId){
  var items = state.library[projectId] || [];
  var item = items.find(function(it){ return it.id === itemId; });
  if(!item) return;
  if(!confirm("Eliminare «" + item.title + "» dall'Archivio?")) return;

  var res = await sb.from("be_library_items").delete().eq("id", itemId);
  if(res.error){ notify(errorText(res.error)); return; }
  if(item.kind === "file" && item.storage_path){
    var rm = await sb.storage.from(LIBRARY_BUCKET).remove([item.storage_path]);
    if(rm.error) console.warn("File non rimosso dallo storage:", rm.error.message);
  }
  state.library[projectId] = items.filter(function(it){ return it.id !== itemId; });
  renderBoard();
}

async function openLibraryItem(item, forceDownload){
  if(item.kind === "link"){
    window.open(item.url, "_blank", "noopener");
    return;
  }
  var win = window.open("", "_blank");
  var opts = forceDownload ? { download: item.title } : {};
  var res = await sb.storage.from(LIBRARY_BUCKET).createSignedUrl(item.storage_path, 120, opts);
  if(res.error || !res.data){
    if(win) win.close();
    alert("Impossibile aprire il file: " + ((res.error && res.error.message) || "errore sconosciuto"));
    return;
  }
  if(win) win.location.href = res.data.signedUrl;
  else window.location.href = res.data.signedUrl;
}

function openAddLinkModal(proj){
  var backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML =
    '<div class="modal" role="dialog">' +
      '<h2>Aggiungi un link all\'Archivio</h2>' +
      '<label>Indirizzo (Google Drive, Dropbox, una pagina web… qualsiasi URL)</label>' +
      '<input type="text" id="m-url" placeholder="https://drive.google.com/…">' +
      '<label>Nome (facoltativo)</label>' +
      '<input type="text" id="m-name" placeholder="Es. Brief di progetto">' +
      '<div class="actions">' +
        '<button class="btn-cancel" id="m-cancel">Annulla</button>' +
        '<button class="btn-primary" id="m-save">Aggiungi</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(backdrop);

  var $url  = backdrop.querySelector("#m-url");
  var $name = backdrop.querySelector("#m-name");
  setTimeout(function(){ $url.focus(); }, 0);

  function close(){ backdrop.remove(); document.removeEventListener("keydown", onKey); }
  function save(){
    var v = $url.value.trim();
    if(!v){ $url.focus(); return; }
    if(!normalizeUrl(v)){ alert("Indirizzo non valido. Usa un URL http:// o https://"); $url.focus(); return; }
    var name = $name.value;
    close();
    addLibraryLink(proj, v, name);
  }
  function onKey(e){
    if(e.key === "Escape") close();
    if(e.key === "Enter") save();
  }
  document.addEventListener("keydown", onKey);

  backdrop.addEventListener("click", function(e){ if(e.target === backdrop) close(); });
  backdrop.querySelector("#m-cancel").addEventListener("click", close);
  backdrop.querySelector("#m-save").addEventListener("click", save);
}

/* =====================================================================
 * Messaggi: alert generati dalle scadenze delle card
 * ===================================================================== */
var ALERT_LEAD_DAYS       = 7;                  /* preavviso in giorni */
var ALERTS_READ_KEY       = "be_alerts_read_v1";
var ALERTS_NOTIFIED_KEY   = "be_alerts_notified_v1";
var ALERTS_REFRESH_MS     = 5 * 60 * 1000;

function readIdList(key){
  try {
    var raw = localStorage.getItem(key);
    var arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch(e){ return []; }
}
function writeIdList(key, ids){
  try { localStorage.setItem(key, JSON.stringify(ids)); } catch(e){}
}

/* Un alert per ogni card con scadenza entro ALERT_LEAD_DAYS (o gia' scaduta),
   escluse le card nella lista Done. */
function collectAlerts(){
  if(state.cardDatesError) return [];
  var out = [];
  state.projects.forEach(function(proj){
    if(proj.archived_at) return;
    var doneId = doneColumnId(proj);
    proj.columns.forEach(function(col){
      if(col.id === doneId) return;
      col.cards.forEach(function(card){
        if(!card.due_date) return;
        var n = daysUntil(card.due_date);
        if(n === null || n > ALERT_LEAD_DAYS) return;
        out.push({
          id: card.id + "|" + card.due_date,
          card: card, proj: proj, col: col, days: n,
          level: n < 0 ? "overdue" : (n <= 1 ? "today" : "soon")
        });
      });
    });
  });
  out.sort(function(a,b){
    if(a.days !== b.days) return a.days - b.days;
    return a.proj.name.localeCompare(b.proj.name);
  });
  return out;
}

function alertWhen(a){
  if(a.days < 0) return a.days === -1 ? "Scaduta ieri" : "Scaduta da " + Math.abs(a.days) + " giorni";
  if(a.days === 0) return "Scade oggi";
  if(a.days === 1) return "Scade domani";
  return "Scade tra " + a.days + " giorni";
}

function renderAlerts(){
  state.alerts = collectAlerts();

  var ids = state.alerts.map(function(a){ return a.id; });
  /* le scadenze sparite (card chiusa, data cambiata) escono dagli elenchi */
  var read = readIdList(ALERTS_READ_KEY).filter(function(id){ return ids.indexOf(id) >= 0; });
  writeIdList(ALERTS_READ_KEY, read);
  var unread = state.alerts.filter(function(a){ return read.indexOf(a.id) < 0; });

  var $badge = document.getElementById("msg-badge");
  if($badge){
    if(unread.length){
      $badge.hidden = false;
      $badge.textContent = unread.length > 99 ? "99+" : String(unread.length);
      $badge.classList.toggle("quiet", !unread.some(function(a){ return a.level === "overdue"; }));
    } else {
      $badge.hidden = true;
    }
  }

  var $btn = document.getElementById("open-msgs-btn");
  if($btn){
    $btn.title = state.alerts.length
      ? state.alerts.length + (state.alerts.length === 1 ? " scadenza da controllare" : " scadenze da controllare")
      : "Nessuna scadenza nei prossimi " + ALERT_LEAD_DAYS + " giorni";
  }

  var $panel = document.getElementById("msg-panel");
  if($panel && !$panel.hidden) renderMsgList();

  fireDesktopAlerts(unread);
}

function renderMsgList(){
  var $list = document.getElementById("msg-list");
  if(!$list) return;
  $list.innerHTML = "";

  var highlight = state.msgHighlight || [];

  if(!state.alerts.length){
    var $e = document.createElement("div");
    $e.className = "msg-empty";
    $e.textContent = state.cardDatesError
      ? "Le scadenze non sono ancora attive sul database: esegui sql/scadenza.sql su Supabase."
      : "Nessun messaggio. Le scadenze entro " + ALERT_LEAD_DAYS + " giorni compaiono qui.";
    $list.appendChild($e);
  } else {
    state.alerts.forEach(function(a){
      var $it = document.createElement("div");
      $it.className = "msg-item" + (highlight.indexOf(a.id) >= 0 ? " unread" : "");

      var $dot = document.createElement("span");
      $dot.className = "msg-dot " + a.level;
      $it.appendChild($dot);

      var $body = document.createElement("div");
      $body.className = "msg-body";

      var $t = document.createElement("div");
      $t.className = "msg-title";
      $t.textContent = a.card.title;
      $body.appendChild($t);

      var $m = document.createElement("div");
      $m.className = "msg-meta";
      var $when = document.createElement("span");
      $when.className = "msg-when" + (a.level === "overdue" ? " overdue" : (a.level === "today" ? " today" : ""));
      $when.textContent = alertWhen(a);
      $m.appendChild($when);
      $m.appendChild(document.createTextNode(" · " + formatDateIT(a.card.due_date) + " · " + a.proj.name + " › " + a.col.name));
      $body.appendChild($m);

      $it.appendChild($body);
      $it.addEventListener("click", function(){
        closeMsgPanel();
        goToAlert(a);
      });
      $list.appendChild($it);
    });
  }

  var $note = document.getElementById("msg-foot-note");
  if($note){
    $note.textContent = state.alerts.length
      ? state.alerts.length + (state.alerts.length === 1 ? " scadenza" : " scadenze") + " entro " + ALERT_LEAD_DAYS + " giorni"
      : "";
  }
  var $nb = document.getElementById("msg-notify-btn");
  if($nb) $nb.hidden = !("Notification" in window) || Notification.permission !== "default";
}

function goToAlert(a){
  state.view = "board";
  state.area = normalizeArea(a.proj.area);
  state.activeProjectId = a.proj.id;
  render();
  openEditCardModal(a.card.id, a.col.id, false, a.proj);
}

function openMsgPanel(){
  var $panel = document.getElementById("msg-panel");
  var $btn = document.getElementById("open-msgs-btn");
  if(!$panel) return;
  var read = readIdList(ALERTS_READ_KEY);
  /* i non letti restano evidenziati finche' il pannello resta aperto */
  state.msgHighlight = state.alerts
    .filter(function(a){ return read.indexOf(a.id) < 0; })
    .map(function(a){ return a.id; });
  writeIdList(ALERTS_READ_KEY, state.alerts.map(function(a){ return a.id; }));
  $panel.hidden = false;
  if($btn) $btn.setAttribute("aria-expanded", "true");
  renderAlerts();
}

function closeMsgPanel(){
  var $panel = document.getElementById("msg-panel");
  var $btn = document.getElementById("open-msgs-btn");
  if(!$panel || $panel.hidden) return;
  $panel.hidden = true;
  state.msgHighlight = [];
  if($btn) $btn.setAttribute("aria-expanded", "false");
}

/* Notifiche di sistema: una sola volta per scadenza */
function fireDesktopAlerts(unread){
  if(!("Notification" in window) || Notification.permission !== "granted") return;
  var notified = readIdList(ALERTS_NOTIFIED_KEY);
  var fresh = unread.filter(function(a){ return notified.indexOf(a.id) < 0; });
  var live = state.alerts.map(function(a){ return a.id; });
  writeIdList(ALERTS_NOTIFIED_KEY,
    notified.filter(function(id){ return live.indexOf(id) >= 0; })
            .concat(fresh.map(function(a){ return a.id; })));
  if(!fresh.length) return;
  var head = fresh.length === 1
    ? alertWhen(fresh[0]) + ": " + fresh[0].card.title
    : fresh.length + " scadenze da controllare";
  var body = fresh.slice(0, 4).map(function(a){
    return "• " + a.card.title + " — " + a.proj.name + " (" + alertWhen(a).toLowerCase() + ")";
  }).join("\n");
  try { new Notification("Mario Project Manager · " + head, { body: body, tag: "be-scadenze" }); } catch(e){}
}

(function messagesModule(){
  var $btn    = document.getElementById("open-msgs-btn");
  var $panel  = document.getElementById("msg-panel");
  var $mark   = document.getElementById("msg-mark-all");
  var $notify = document.getElementById("msg-notify-btn");
  if(!$btn || !$panel) return;

  $btn.addEventListener("click", function(e){
    e.stopPropagation();
    if($panel.hidden) openMsgPanel(); else closeMsgPanel();
  });

  $panel.addEventListener("click", function(e){ e.stopPropagation(); });

  document.addEventListener("click", function(){ closeMsgPanel(); });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape") closeMsgPanel();
  });

  if($mark){
    $mark.addEventListener("click", function(){
      writeIdList(ALERTS_READ_KEY, state.alerts.map(function(a){ return a.id; }));
      state.msgHighlight = [];
      renderAlerts();
    });
  }

  if($notify){
    $notify.addEventListener("click", function(){
      if(!("Notification" in window)) return;
      Notification.requestPermission().then(function(){ renderAlerts(); });
    });
  }

  /* le scadenze cambiano con il passare del tempo: ricontrollo periodico */
  setInterval(function(){ renderAlerts(); }, ALERTS_REFRESH_MS);
})();

var $areaTabs = document.getElementById("area-tabs");

function renderAreaTabs(){

function render(){

["dragover","drop"].forEach(function(ev){
  window.addEventListener(ev, function(e){
    var t = e.target;
    if(t && t.closest && t.closest(".column.library")) return;
    var types = (e.dataTransfer && e.dataTransfer.types) ? Array.prototype.slice.call(e.dataTransfer.types) : [];

      e.preventDefault();
      if(ev === "dragover") e.dataTransfer.dropEffect = "none";

});

/* =====================================================================
 * Riepilogo email: ogni mattina quello che e' successo ai miei task
 * (api/task-digest). Gli account @brown.internal non ricevono posta,
 * quindi l'indirizzo lo indica ognuno qui.
 * ===================================================================== */
async function openNotifyPrefsModal(){
  if(!state.me) return;
  var res = await sb.from("be_notify_prefs").select("email, daily_digest").eq("user_id", state.me.id).maybeSingle();
  if(res.error){
    notify(isNetworkError(res.error) ? "Sei offline: riprova fra poco."
      : "Il riepilogo email non è ancora attivo sul database: esegui sql/task.sql su Supabase.");
    return;
  }
  var prefs = res.data || { email: "", daily_digest: true };

  var backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.innerHTML =
    '<div class="modal" role="dialog" aria-label="Riepilogo email">' +
      '<h2>Riepilogo email dei task</h2>' +
      '<p class="np-hint" style="margin:-6px 0 14px">Una mail al giorno, la mattina, con quello che è successo ai task di cui sei destinatario: nuovi task, spostamenti di lista, modifiche.</p>' +
      '<label for="np-email">Indirizzo email</label>' +
      '<input type="text" id="np-email" inputmode="email" autocomplete="email" placeholder="nome@esempio.it" maxlength="200">' +
      '<label class="cm-check"><input type="checkbox" id="np-on"> Mandami il riepilogo ogni giorno</label>' +
      '<div class="actions">' +
        '<button class="btn-cancel" id="m-cancel">Annulla</button>' +
        '<button class="btn-primary" id="m-confirm">Salva</button>' +
      '</div>' +
    '</div>';
  document.body.appendChild(backdrop);
  var $email = backdrop.querySelector("#np-email"), $on = backdrop.querySelector("#np-on");
  $email.value = prefs.email || "";
  $on.checked = prefs.daily_digest !== false;
  setTimeout(function(){ $email.focus(); }, 0);

  function close(){ backdrop.remove(); document.removeEventListener("keydown", onKey); }
  async function commit(){
    var email = $email.value.trim();
    if(email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ $email.focus(); notify("Indirizzo email non valido."); return; }
    if(/@brown\.internal$/i.test(email)){ $email.focus(); notify("Gli indirizzi @brown.internal non ricevono posta: usa la tua email."); return; }
    var up = await sb.from("be_notify_prefs").upsert({
      user_id: state.me.id, email: email || null, daily_digest: $on.checked, updated_at: new Date().toISOString()
    });
    if(up.error){ notify(errorText(up.error, "Preferenze non salvate")); return; }
    close();
    notify(email && $on.checked ? "Riceverai il riepilogo ogni mattina a " + email + "." : "Riepilogo email disattivato.", { warn: false });
  }
  function onKey(e){
    if(e.key === "Escape") close();
    if(e.key === "Enter"){ e.preventDefault(); commit(); }
  }
  document.addEventListener("keydown", onKey);
  backdrop.addEventListener("click", function(e){ if(e.target === backdrop) close(); });
  backdrop.querySelector("#m-cancel").addEventListener("click", close);
  backdrop.querySelector("#m-confirm").addEventListener("click", commit);
}
document.getElementById("avatar").addEventListener("click", openNotifyPrefsModal);

async function boot(){
  if(booting) return;
  booting = true;
  try {
    var ok = await loadEverything();
    if(!ok) return;
    document.getElementById("user-label").textContent = state.me.display_name;
    document.getElementById("avatar").textContent = (state.me.display_name || "?").charAt(0).toUpperCase();
    render();
    if(window.beCalendarFromUrl) window.beCalendarFromUrl();
    checkNewProjects();
  } finally {
    booting = false;
  }
}

/* =====================================================================
 * Mobile drawer toggles (sidebar + calendar people filter)
 * ===================================================================== */
(function mobileDrawers(){
  var MOBILE_QUERY = window.matchMedia("(max-width:780px)");

  function bindDrawer(toggleId, drawerId, backdropId){
    var $toggle   = document.getElementById(toggleId);
    var $drawer   = document.getElementById(drawerId);
    var $backdrop = document.getElementById(backdropId);
    if(!$toggle || !$drawer || !$backdrop) return null;

    function open(){
      $drawer.classList.add("drawer-open");
      $backdrop.classList.add("show");
      $toggle.classList.add("active");
      $toggle.setAttribute("aria-expanded","true");
    }
    function close(){
      $drawer.classList.remove("drawer-open");
      $backdrop.classList.remove("show");
      $toggle.classList.remove("active");
      $toggle.setAttribute("aria-expanded","false");
    }
    function toggle(){
      if($drawer.classList.contains("drawer-open")) close(); else open();
    }
    $toggle.addEventListener("click", function(e){ e.stopPropagation(); toggle(); });
    $backdrop.addEventListener("click", close);
    return { open: open, close: close };
  }

  var sideDrawer = bindDrawer("sidebar-toggle", "sidebar", "sidebar-backdrop");
  var calDrawer  = bindDrawer("cal-side-toggle", "cal-side", "cal-side-backdrop");

  // Close project drawer when a project is picked
  if(sideDrawer){
    document.getElementById("projects").addEventListener("click", function(e){
      var item = e.target.closest(".project-item");
      if(item && !e.target.closest("button") && !state.selecting && MOBILE_QUERY.matches){
        sideDrawer.close();
      }
    });
  }

  // Close drawers when leaving mobile breakpoint
  function onResize(){
    if(!MOBILE_QUERY.matches){
      if(sideDrawer) sideDrawer.close();
      if(calDrawer)  calDrawer.close();
    }
  }
  if(typeof MOBILE_QUERY.addEventListener === "function"){
    MOBILE_QUERY.addEventListener("change", onResize);
  } else if(typeof MOBILE_QUERY.addListener === "function"){
    MOBILE_QUERY.addListener(onResize);
  }

  // Close on Escape
  document.addEventListener("keydown", function(e){
    if(e.key !== "Escape") return;
    if(sideDrawer) sideDrawer.close();
    if(calDrawer)  calDrawer.close();
  });
})();

  var HALVES = [{ key:"am", label:"Mattina" }, { key:"pm", label:"Pomeriggio" }];
  var HALF_LABEL = { am:"Mattina", pm:"Pomeriggio", day:"Tutto il giorno" };
  /* Dall'orario alla mezza giornata: si parte prima delle 13 = mattina;
     se poi si va oltre le 14 occupa tutta la giornata. */
  function autoHalf(start, end){
    if(!start) return null;
    if(start >= "13:00") return "pm";
    if(end && end > "14:00") return "day";
    return "am";
  }

  /* ---------- storage ----------
   * Gli impegni stanno nella tabella condivisa be_cal_events. Se la tabella
   * non c'e' ancora (sql/calendario.sql non eseguito) si resta nel browser
   * come prima, con un avviso. */
  var LEGACY_KEY   = "brown_calendar_data_v1";
  var LOCAL_KEY    = "brown_calendar_data_v2";
  var MIGRATED_KEY = "brown_calendar_migrated_v2";
  var APPLE_SYNC_KEY = "brown_calendar_apple_sync_v1";
  var DB_FIELDS = ["id","date","date_end","half","start_time","end_time","title","persons","kind",
                   "status","project_id","project_name","notes","series_id","recur","source"];
  // Il luogo (sql/luogo.sql). Finche' il file non e' eseguito le colonne
  // mancano: il calendario si carica senza e la casella Luogo non c'e'.
  // Il place_id di Google arriva con sql/luogo_google.sql: senza, il luogo
  // c'e' ma il link cerca il testo invece di aprire il posto.
  var LOCATION_FIELDS = ["location","location_lat","location_lon"];
  var hasLocation = true, hasPlaceId = true;
  function dbFields(){
    if(!hasLocation) return DB_FIELDS;
    return DB_FIELDS.concat(LOCATION_FIELDS, hasPlaceId ? ["location_place_id"] : []);
  }

  var calEvents = [];
  var mode = null;            // "remote" | "local"
  var loadError = null;

  function lsGet(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k, v); }catch(_){} }

  /* Il vecchio formato (una persona, "Mattina"/"Pomeriggio" nelle note,
     orari 9-13 / 14.30-18.30 messi d'ufficio) -> il nuovo */
  function fromLegacy(e){
    var notes = String(e.notes || "");
    var half = null;
    if(/^pomeriggio/i.test(notes)) half = "pm";
    else if(/^mattina/i.test(notes)) half = "am";
    notes = notes.replace(/^(mattina|pomeriggio)\s*(·\s*)?/i, "").trim();
    var t = e.time || "", et = e.endTime || "";
    var placeholder = (t === "09:00" && et === "13:00") || (t === "14:30" && et === "18:30");
    if(placeholder){ t = ""; et = ""; }
    return {
      id: e.id, date: e.date, date_end: null,
      half: half || autoHalf(t, et) || "am",
      start_time: t || null, end_time: et || null,
      title: e.title || "Impegno",
      persons: e.person ? [canonicalPerson(e.person)] : [],
      kind: "lavoro", status: "confermato",
      project_id: null, project_name: null,
      notes: notes || null, series_id: null, recur: null, source: "mario"
    };
  }
  /* I dati del vecchio calendario nel browser, seme compreso */
  function loadLegacy(){
    var data = null;
    try{
      var raw = localStorage.getItem(LEGACY_KEY);
      if(raw){
        var p = JSON.parse(raw);
        if(p && Array.isArray(p.events)) data = p;
      }
    }catch(_){}
    if(!data) data = { version:1, events:[], seedVersion:0 };
    if(typeof data.seedVersion !== "number") data.seedVersion = 0;
    if(data.seedVersion < SEED_VERSION){
      var have = {};
      data.events.forEach(function(e){ have[e.id] = 1; });
      SEED_EVENTS.forEach(function(e){ if(!have[e.id]) data.events.push(e); });
    }
    return data.events.map(fromLegacy);
  }
  function loadLocal(){
    try{
      var raw = localStorage.getItem(LOCAL_KEY);
      if(raw){
        var p = JSON.parse(raw);
        if(p && Array.isArray(p.events)) return p.events;
      }
    }catch(_){}
    return loadLegacy();
  }
  function saveLocal(){
    lsSet(LOCAL_KEY, JSON.stringify({ version:2, events: calEvents }));
  }
  function isMissingTable(err){
    if(!err) return false;
    return err.code === "42P01" || err.code === "PGRST205" ||
           /does not exist|could not find the table|schema cache/i.test(err.message || "");
  }
  function toDb(e){
    var o = {};
    dbFields().forEach(function(k){ o[k] = e[k] === undefined ? null : e[k]; });
    if(!o.persons) o.persons = [];
    if(!o.source) o.source = "mario";
    return o;
  }
  function chunks(arr, n){
    var out = [];
    for(var i=0;i<arr.length;i+=n) out.push(arr.slice(i, i+n));
    return out;
  }

  async function fetchRemote(){
    var all = [];
    for(var from = 0; ; from += 1000){
      var res = await sb.from("be_cal_events").select(dbFields().join(","))
        .order("date", { ascending: true }).order("id", { ascending: true })
        .range(from, from + 999);
      if(res.error && res.error.code === "42703"){
        var missing = res.error.message || "";
        if(hasPlaceId && /location_place_id/.test(missing)){
          hasPlaceId = false;   // sql/luogo_google.sql non ancora eseguito
          return fetchRemote();
        }
        if(hasLocation && /location/.test(missing)){
          hasLocation = false;  // sql/luogo.sql non ancora eseguito
          return fetchRemote();
        }
      }
      if(res.error) return { error: res.error };
      all = all.concat(res.data || []);
      if(!res.data || res.data.length < 1000) break;
    }
    return { data: all };
  }

  /* Il primo accesso dopo l'aggiornamento porta nel calendario condiviso
     cio' che ognuno aveva nel browser. Il vecchio seme si carica una
     volta sola, a tabella vuota: altrimenti chi entra per ultimo
     resusciterebbe gli impegni che gli altri hanno cancellato. */
  async function migrateLegacy(remoteCount){
    if(lsGet(MIGRATED_KEY)) return false;
    var seedIds = {};
    SEED_EVENTS.forEach(function(e){ seedIds[e.id] = 1; });
    var rows = loadLegacy().filter(function(e){
      return remoteCount === 0 || !seedIds[e.id];
    });
    for(var i=0, parts = chunks(rows.map(toDb), 200); i<parts.length; i++){
      var res = await sb.from("be_cal_events").upsert(parts[i], { onConflict:"id", ignoreDuplicates:true });
      if(res.error){ notify(errorText(res.error, "Impegni del browser non caricati")); return false; }
    }
    lsSet(MIGRATED_KEY, "1");
    return rows.length > 0;
  }

  async function loadEvents(){
    var res = await fetchRemote();
    if(res.error && isMissingTable(res.error)){
      mode = "local"; loadError = null;
      calEvents = loadLocal();
      return;
    }
    if(res.error){
      // offline o errore: si mostra l'ultima copia nota
      mode = "remote";
      loadError = res.error;
      if(!calEvents.length){
        try{ calEvents = JSON.parse(lsGet("brown_calendar_cache_v2") || "[]"); }catch(_){ calEvents = []; }
      }
      return;
    }
    mode = "remote"; loadError = null;
    calEvents = res.data;
    if(await migrateLegacy(calEvents.length)){
      var again = await fetchRemote();
      if(!again.error) calEvents = again.data;
    }
    lsSet("brown_calendar_cache_v2", JSON.stringify(calEvents));
  }

  function mergeLocal(rows){
    var byId = {};
    rows.forEach(function(r){ byId[r.id] = r; });
    calEvents = calEvents.map(function(e){
      if(byId[e.id]){ var r = byId[e.id]; delete byId[e.id]; return r; }
      return e;
    });
    Object.keys(byId).forEach(function(k){ calEvents.push(byId[k]); });
  }
  async function saveRows(rows, failMsg){
    if(!rows.length) return true;
    rows = rows.map(toDb);
    if(mode === "remote"){
      for(var i=0, parts = chunks(rows, 200); i<parts.length; i++){
        var res = await sb.from("be_cal_events").upsert(parts[i], { onConflict:"id" });
        if(res.error){ notify(errorText(res.error, failMsg || "Impegno non salvato")); return false; }
      }
    }
    mergeLocal(rows);
    if(mode === "local") saveLocal();
    return true;
  }
  async function deleteRows(ids, failMsg){
    if(!ids.length) return true;
    if(mode === "remote"){
      for(var i=0, parts = chunks(ids, 200); i<parts.length; i++){
        var res = await sb.from("be_cal_events").delete().in("id", parts[i]);
        if(res.error){ notify(errorText(res.error, failMsg || "Impegno non eliminato")); return false; }
      }
    }
    var gone = {};
    ids.forEach(function(id){ gone[id] = 1; });
    calEvents = calEvents.filter(function(e){ return !gone[e.id]; });
    if(mode === "local") saveLocal();
    return true;
  }

  /* ---------- persone fuori dal team ----------
   * Al posto della vecchia riga "Altri": chi lavora con noi da fuori si
   * aggiunge col "+" e diventa una riga come quelle del team. Per ogni
   * mese si decide se c'e' (months: { "2026-11": true, "2026-12": false });
   * un mese senza scelta eredita l'ultima scelta fatta prima. Stanno in
   * be_cal_people, condivisa come gli impegni; senza la tabella
   * (sql/calendario_persone.sql non eseguito) restano nel browser. */
  var PEOPLE_KEY = "brown_calendar_people_v1";
  var PEOPLE_CACHE_KEY = "brown_calendar_people_cache_v1";
  var extraPeople = [];       // [{ name, months }] nell'ordine in cui sono arrivate
  var peopleMode = null;      // "remote" | "local"

  function monthKey(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1); }
  function monthOf(ds){ return ds.slice(0, 7); }
  function addMonths(mk, n){ return monthKey(new Date(+mk.slice(0,4), +mk.slice(5,7) - 1 + n, 1)); }
  function monthName(mk){ return MONTHS[+mk.slice(5,7) - 1]; }
  function findExtra(name){
    var k = String(name || "").trim().toLowerCase();
    if(!k) return null;
    for(var i=0;i<extraPeople.length;i++) if(extraPeople[i].name.toLowerCase() === k) return extraPeople[i];
    return null;
  }
  /* Un Extra ha la sua colonna in un mese se qualcuno l'ha accesa per quel
     mese (months: { "2026-11": true }: vale per tutti e solo per quel mese)
     o se quel mese ha qualcosa segnato. Di base gli Extra sono spenti. */
  function activeIn(p, mk){ return !!p.months && p.months[mk] === true; }
  function hasEventsIn(name, fromStr, toStr){
    return eventsInRange(fromStr, toStr).some(function(e){ return !!e.persons && e.persons.indexOf(name) >= 0; });
  }
  function extraBusy(name, mk){ var b = monthBounds(mk); return hasEventsIn(name, b.from, b.to); }
  function extraShown(name, mk){
    var p = findExtra(name);
    return (!!p && activeIn(p, mk)) || extraBusy(name, mk);
  }
  /* Accende o spegne la colonna di un Extra in un mese, per tutti. Con
     qualcosa segnato quel mese la colonna resta comunque. */
  async function setExtraShown(name, mk, on){
    if(!on && extraBusy(name, mk)){
      notify(name + " ha qualcosa segnato a " + monthName(mk) + ": la sua colonna resta.", { warn: false, autoHide: 3500 });
      return false;
    }
    var p = findExtra(name);
    if(!p){ notify(name + " non è tra gli Extra: va eseguito sql/calendario_extra_nomi.sql."); return false; }
    return setMonth(p, mk, on);
  }
  function activeBetween(p, fromStr, toStr){
    for(var mk = monthOf(fromStr), last = monthOf(toStr); mk <= last; mk = addMonths(mk, 1)){
      if(activeIn(p, mk)) return true;
    }
    return false;
  }

  var peopleOrdered = false;  // c'e' be_cal_people.position (sql/calendario_extra.sql)
  async function loadPeople(){
    var res = await sb.from("be_cal_people").select("name, months, position")
      .order("position", { ascending: true, nullsFirst: false }).order("created_at", { ascending: true });
    peopleOrdered = !res.error;
    // senza sql/calendario_extra.sql manca la colonna: l'ordine e' quello di arrivo
    if(res.error && (res.error.code === "42703" || /position/.test(res.error.message || ""))){
      res = await sb.from("be_cal_people").select("name, months").order("created_at", { ascending: true });
    }
    if(res.error && isMissingTable(res.error)){
      peopleMode = "local";
      try{ extraPeople = JSON.parse(lsGet(PEOPLE_KEY) || "[]"); }catch(_){ extraPeople = []; }
      return;
    }
    if(res.error){
      // offline: l'ultima copia nota
      peopleMode = "remote";
      if(!extraPeople.length){
        try{ extraPeople = JSON.parse(lsGet(PEOPLE_CACHE_KEY) || "[]"); }catch(_){ extraPeople = []; }
      }
      return;
    }
    peopleMode = "remote";
    extraPeople = (res.data || []).map(function(r){ return { name: r.name, months: r.months || {} }; });
    lsSet(PEOPLE_CACHE_KEY, JSON.stringify(extraPeople));
  }
  function keepPeople(){
    lsSet(peopleMode === "local" ? PEOPLE_KEY : PEOPLE_CACHE_KEY, JSON.stringify(extraPeople));
  }
  async function savePerson(p){
    if(peopleMode === "remote"){
      var res = await sb.from("be_cal_people").upsert({ name: p.name, months: p.months }, { onConflict: "name" });
      if(res.error){ notify(errorText(res.error, "Persona non salvata")); return false; }
    }
    var old = findExtra(p.name);
    if(old) old.months = p.months;
    else extraPeople.push(p);
    keepPeople();
    return true;
  }
  /* Aggiunge (o rimette) una persona da quel mese in poi. Restituisce il
     nome da usare, null se non si e' potuto. */
  async function addPerson(name, mk){
    var n = String(name || "").trim().replace(/\s+/g, " ");
    if(!n) return null;
    if(n.length > 60){ notify("Il nome è troppo lungo (al massimo 60 caratteri)."); return null; }
    if(isKnown(canonicalPerson(n))) return canonicalPerson(n);
    var p = findExtra(n);
    if(p && activeIn(p, mk)) return p.name;
    var months = Object.assign({}, p ? p.months : {});
    months[mk] = true;
    if(!(await savePerson({ name: p ? p.name : n, months: months }))) return null;
    if(peopleMode === "local") notify("Per ora " + n + " resta solo in questo browser: va eseguito sql/calendario_persone.sql su Supabase.");
    return p ? p.name : n;
  }
  async function setMonth(p, mk, on){
    var months = Object.assign({}, p.months);
    months[mk] = on;
    return savePerson({ name: p.name, months: months });
  }
  async function removePerson(p){
    var ok = await askChoice("Togliere " + p.name + "?",
      "Non si potranno più assegnare impegni a " + p.name + ". Quelli già segnati restano nel calendario.", [
      { label: "Annulla", value: null },
      { label: "Togli", value: "yes", danger: true }
    ]);
    if(!ok) return;
    if(peopleMode === "remote"){
      var res = await sb.from("be_cal_people").delete().eq("name", p.name);
      if(res.error){ notify(errorText(res.error, "Persona non tolta")); return; }
    }
    extraPeople = extraPeople.filter(function(x){ return x !== p; });
    renameInFilters(p.name, null);
    keepPeople();
    render();
  }

  /* ---------- Extra: rinominare e riordinare ----------
   * Valgono per tutti: il nome cambia nell'elenco e in tutti gli impegni
   * (be_cal_rename_person), l'ordine sta in be_cal_people.position. Servono
   * le funzioni di sql/calendario_extra.sql. */
  var EXTRA_SQL_MSG = "Per rinominare e riordinare gli Extra va eseguito sql/calendario_extra.sql su Supabase.";
  function isMissingFunction(err){
    return !!err && (err.code === "PGRST202" || err.code === "42883" ||
                     /could not find the function|function .* does not exist/i.test(err.message || ""));
  }
  function cleanName(name){ return String(name || "").trim().replace(/\s+/g, " "); }
  async function renamePerson(oldName, newName){
    var n = cleanName(newName);
    if(!n || n === oldName) return true;
    if(n.length > 60){ notify("Il nome è troppo lungo (al massimo 60 caratteri)."); return false; }
    if(isKnown(canonicalPerson(n))){ notify(canonicalPerson(n) + " fa parte del team: scegli un altro nome."); return false; }
    // il nome di un altro Extra in elenco: si uniscono, ma solo se si conferma
    var other = findExtra(n), merge = false;
    if(other && findExtra(oldName) && other.name.toLowerCase() !== oldName.toLowerCase()){
      merge = await askChoice("Unire " + oldName + " a " + other.name + "?",
        other.name + " c'è già tra gli Extra. Unendoli, gli impegni di " + oldName + " passano a " +
        other.name + " e " + oldName + " sparisce dall'elenco. Vale per tutti.", [
        { label: "Annulla", value: null },
        { label: "Unisci", value: "yes", danger: true }
      ]);
      if(!merge) return false;
    }
    if(peopleMode !== "remote"){ notify(EXTRA_SQL_MSG); return false; }
    var args = { old_name: oldName, new_name: n };
    if(merge) args.merge = true;
    var res = await sb.rpc("be_cal_rename_person", args);
    if(res.error){
      notify(isMissingFunction(res.error) ? EXTRA_SQL_MSG : errorText(res.error, "Nome non cambiato"));
      return false;
    }
    n = res.data || n;
    // subito qui, poi dal database
    var p = findExtra(oldName);
    if(merge) extraPeople = extraPeople.filter(function(x){ return x !== p; });
    else if(p) p.name = n;
    calEvents.forEach(function(e){
      if(!e.persons || e.persons.indexOf(oldName) < 0) return;
      e.persons = e.persons.map(function(x){ return x === oldName ? n : x; })
        .filter(function(x, i, a){ return a.indexOf(x) === i; });
    });
    renameInFilters(oldName, n);
    keepPeople();
    render();
    refresh();
    return true;
  }
  async function orderPeople(list){
    if(peopleMode !== "remote" || !peopleOrdered){ notify(EXTRA_SQL_MSG); return false; }
    var names = list.map(function(p){ return p.name; });
    var res = await sb.rpc("be_cal_order_people", { names: names });
    if(res.error){
      notify(isMissingFunction(res.error) ? EXTRA_SQL_MSG : errorText(res.error, "Ordine non salvato"));
      return false;
    }
    extraPeople = list;
    keepPeople();
    render();
    return true;
  }
  function moveExtra(p, to){
    var list = extraPeople.filter(function(x){ return x !== p; });
    to = Math.max(0, Math.min(list.length, to));
    list.splice(to, 0, p);
    return orderPeople(list);
  }
  /* La scheda di un Extra: nome, posizione, togli. Chi e' scritto solo
     negli impegni (non in elenco) si puo' solo rinominare. */
  function openPersonSheet(name){
    var p = findExtra(name);
    var i = p ? extraPeople.indexOf(p) : -1;
    var bd = document.createElement("div");
    bd.className = "modal-backdrop";
    bd.innerHTML =
      '<div class="modal cal-person-sheet" role="dialog" aria-modal="true">' +
        '<h2></h2>' +
        '<label for="ps-name">Nome</label>' +
        '<input type="text" id="ps-name" maxlength="60">' +
        '<p class="move-hint move-note">Il nome cambia per tutti, anche negli impegni già segnati.</p>' +
        (p ? '<label>Colonna in Agenda, per tutti</label>' +
             '<div class="cal-ps-order cal-ps-months" id="ps-months"></div>' +
             '<label>Posizione tra gli Extra</label>' +
             '<div class="cal-ps-order">' +
               '<button type="button" class="btn-cancel" id="ps-up">↑ Più su</button>' +
               '<button type="button" class="btn-cancel" id="ps-down">↓ Più giù</button>' +
             '</div>' : '') +
        '<div class="actions">' +
          (p ? '<button type="button" class="btn-cancel cal-ps-del" id="ps-del">Togli</button>' : '') +
          '<button type="button" class="btn-cancel" id="ps-cancel">Annulla</button>' +
          '<button type="button" class="btn-primary" id="ps-save">Salva</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(bd);
    bd.querySelector("h2").textContent = name;
    var $n = bd.querySelector("#ps-name");
    $n.value = name;
    setTimeout(function(){ $n.focus(); $n.select(); }, 0);
    function close(){ bd.remove(); document.removeEventListener("keydown", onKey); }
    async function save(){
      if(await renamePerson(name, $n.value)) close();
    }
    function onKey(e){
      if(e.key === "Escape") close();
      if(e.key === "Enter" && e.target === $n) save();
    }
    document.addEventListener("keydown", onKey);
    bd.addEventListener("click", function(e){ if(e.target === bd) close(); });
    bd.querySelector("#ps-cancel").addEventListener("click", close);
    bd.querySelector("#ps-save").addEventListener("click", save);
    if(p){
      var $up = bd.querySelector("#ps-up"), $down = bd.querySelector("#ps-down");
      function paint(){
        i = extraPeople.indexOf(p);
        $up.disabled = i <= 0;
        $down.disabled = i < 0 || i >= extraPeople.length - 1;
      }
      paint();
      // presenza in questo mese e nel prossimo, come in "Chi c'e'"
      var $months = bd.querySelector("#ps-months");
      function paintMonths(){
        var cur = monthKey(new Date());
        $months.innerHTML = "";
        [cur, addMonths(cur, 1)].forEach(function(mk){
          var on = extraShown(p.name, mk);
          var b = document.createElement("button");
          b.type = "button";
          b.className = "btn-cancel" + (on ? " on" : "");
          b.setAttribute("aria-pressed", on ? "true" : "false");
          b.textContent = (on ? "✓ " : "– ") + monthName(mk);
          b.title = "La colonna di " + p.name + (on ? " c'è" : " non c'è") + " a " + monthName(mk) + ". Clic per cambiare.";
          b.addEventListener("click", async function(){
            if(await setExtraShown(p.name, mk, !on)){ render(); paintMonths(); }
          });
          $months.appendChild(b);
        });
      }
      paintMonths();
      $up.addEventListener("click", async function(){ await moveExtra(p, i - 1); paint(); });
      $down.addEventListener("click", async function(){ await moveExtra(p, i + 1); paint(); });
      bd.querySelector("#ps-del").addEventListener("click", function(){ close(); removePerson(p); });
    }
  }
  function promptAddPerson(){
    showInputModal({
      title: "Aggiungi una persona",
      label: "Nome · la sua colonna si accende a " + monthName(filterMonth || monthKey(new Date())) + ", per tutti",
      placeholder: "Es. Giulia Rossi",
      confirmText: "Aggiungi",
      onConfirm: async function(name){
        var n = String(name || "").trim();
        if(!n) return;
        if(isKnown(canonicalPerson(n))){ notify(canonicalPerson(n) + " fa già parte del team."); return; }
        var got = await addPerson(n, filterMonth || monthKey(new Date()));
        if(!got) return;
        lsSet(EXTRA_OPEN_KEY, "1");
        render();
      }
    });
  }

  /* ---------- state ---------- */
  var view = "agenda";        // 'agenda' | 'day' | 'week' | 'month'
  var cursor = new Date();    // anchor date for current view

  /* ---------- person filter ---------- */
  /* Si ricorda chi e' nascosto, non chi si vede: cosi' chi viene aggiunto
     dopo compare subito. La scelta e' per mese ed e' solo di questo browser:
     un mese senza scelta segue l'ultimo mese scelto prima; prima di ogni
     scelta vale il filtro di sempre (FILTER_KEY). */
  var MONTH_FILTER_KEY = "brown_calendar_hidden_months_v1";
  var FILTER_KEY = "brown_calendar_hidden_v1";
  var OLD_FILTER_KEY = "brown_calendar_filter_v2";
  var hiddenPersons; // Set<string>
  function loadFilter(){
    try{
      var raw = localStorage.getItem(FILTER_KEY);
      if(raw){
        var arr = JSON.parse(raw);
        if(Array.isArray(arr)) return new Set(arr);
      }
      var old = JSON.parse(localStorage.getItem(OLD_FILTER_KEY) || "null");
      if(Array.isArray(old)) return new Set(KNOWN_PERSONS.filter(function(p){ return old.indexOf(p) < 0; }));
    }catch(_){}
    return new Set();
  }
  function loadMonthFilter(){
    try{
      var o = JSON.parse(lsGet(MONTH_FILTER_KEY) || "{}");
      if(o && typeof o === "object" && !Array.isArray(o)) return o;
    }catch(_){}
    return {};
  }
  var baseHidden = loadFilter();         // Set: prima di ogni scelta per mese
  var hiddenByMonth = loadMonthFilter(); // { "2026-11": ["Camilla"], ... }
  var filterMonth = null;                // il mese che il filtro sta mostrando
  /* Il mese da cui viene la scelta che vale in mk (null: il filtro di sempre) */
  function filterSource(mk){
    var best = null;
    Object.keys(hiddenByMonth).forEach(function(k){ if(k <= mk && (best === null || k > best)) best = k; });
    return best;
  }
  function hiddenFor(mk){
    var src = filterSource(mk);
    return new Set(src ? hiddenByMonth[src] : Array.from(baseHidden));
  }
  function useFilterMonth(mk){
    filterMonth = mk;
    hiddenPersons = hiddenFor(mk);
  }
  function saveMonthFilter(){ lsSet(MONTH_FILTER_KEY, JSON.stringify(hiddenByMonth)); }
  /* Salva la scelta del mese mostrato; i mesi dopo senza scelta la seguono */
  function saveFilter(){
    var arr = []; hiddenPersons.forEach(function(p){ arr.push(p); });
    hiddenByMonth[filterMonth || monthKey(new Date())] = arr;
    saveMonthFilter();
  }
  function setHiddenIn(mk, set){
    var arr = []; set.forEach(function(p){ arr.push(p); });
    hiddenByMonth[mk] = arr;
    saveMonthFilter();
    if(mk === filterMonth) hiddenPersons = new Set(arr);
  }
  /* Un nome cambiato (o tolto, con to null) in tutte le scelte salvate */
  function renameInFilters(from, to){
    function fix(arr){
      var out = [];
      arr.forEach(function(x){
        var y = x === from ? to : x;
        if(y && out.indexOf(y) < 0) out.push(y);
      });
      return out;
    }
    Object.keys(hiddenByMonth).forEach(function(k){ hiddenByMonth[k] = fix(hiddenByMonth[k] || []); });
    baseHidden = new Set(fix(Array.from(baseHidden)));
    lsSet(FILTER_KEY, JSON.stringify(Array.from(baseHidden)));
    saveMonthFilter();
    hiddenPersons = hiddenFor(filterMonth || monthKey(new Date()));
  }
  useFilterMonth(monthKey(new Date()));

  /* Tutte le righe possibili in [fromStr, toStr]: il team nell'ordine
     fisso, poi chi da fuori c'e' in quel periodo o vi ha impegni, poi i
     nomi scritti a mano prima del "+" (finche' hanno impegni) e in fondo
     "Senza persona", se serve. */
  function allRows(evs, fromStr, toStr){
    var rows = KNOWN_PERSONS.slice(), seen = {};
    rows.forEach(function(p){ seen[p.toLowerCase()] = 1; });
    function add(n){ var k = n.toLowerCase(); if(!seen[k]){ seen[k] = 1; rows.push(n); } }
    function inEvents(n){ return evs.some(function(e){ return e.persons && e.persons.indexOf(n) >= 0; }); }
    extraPeople.forEach(function(p){
      if(activeBetween(p, fromStr, toStr) || inEvents(p.name)) add(p.name);
    });
    var loose = [];
    evs.forEach(function(e){
      (e.persons || []).forEach(function(n){
        if(!isKnown(n) && !findExtra(n) && loose.indexOf(n) < 0) loose.push(n);
      });
    });
    loose.sort(function(a, b){ return a.localeCompare(b, "it"); }).forEach(add);
    if(evs.some(function(e){ return !e.persons || !e.persons.length; })) rows.push(NOBODY);
    return rows;
  }
  /* Il filtro di ognuno vale per i soci (e "Senza persona"); gli Extra
     si vedono quando la loro colonna e' accesa per tutti */
  function isPersonal(r){ return isKnown(r) || r === NOBODY; }
  function visibleRows(evs, fromStr, toStr){
    return allRows(evs, fromStr, toStr).filter(function(r){ return !(isPersonal(r) && hiddenPersons.has(r)); });
  }
  function monthBounds(mk){
    var d = new Date(+mk.slice(0,4), +mk.slice(5,7) - 1, 1);
    return { from: fmtDate(d), to: fmtDate(new Date(d.getFullYear(), d.getMonth() + 1, 0)) };
  }
  /* Le righe possibili di un mese, e quelle che si vedono */
  function monthAllRows(mk){
    var b = monthBounds(mk);
    return allRows(eventsInRange(b.from, b.to), b.from, b.to);
  }
  function monthRows(mk){
    var hidden = hiddenFor(mk);
    return monthAllRows(mk).filter(function(r){ return !(isPersonal(r) && hidden.has(r)); });
  }
  function hasPerson(e, row){
    if(row === NOBODY) return !e.persons || !e.persons.length;
    return !!e.persons && e.persons.indexOf(row) >= 0;
  }
  function rowColor(row){ return row === NOBODY ? NOBODY_COLOR : personColor(row); }
  function rowLabel(row){ return row === NOBODY ? "Senza persona" : row; }

  /* ---------- DOM refs ---------- */
  var $overlay = document.getElementById("cal-overlay");
  var $body    = document.getElementById("cal-body");
  var $side    = document.getElementById("cal-side");
  var $period  = document.getElementById("cal-period");
  var $views   = $overlay.querySelectorAll(".cal-views button");

  /* ---------- open / close ---------- */
  var loadingPromise = null;
  function refresh(){
    if(!loadingPromise){
      loadingPromise = Promise.all([loadEvents(), loadPeople()]).then(function(){
        loadingPromise = null;
        if($overlay.classList.contains("show")) render();
        maybeAutoSyncApple();
      });
    }
    return loadingPromise;
  }
  /* ---------- indirizzo ----------
   * app.html#chi-fa-cosa apre direttamente il calendario, cosi' si puo'
   * salvare tra i preferiti. Aprendolo dal pulsante l'indirizzo lo segue
   * e "indietro" lo chiude invece di uscire da Mario. */
  var CAL_HASH = "#chi-fa-cosa";
  var pushedHash = false;     // la voce nella cronologia l'abbiamo aggiunta noi
  function isOpen(){ return $overlay.classList.contains("show"); }
  function urlWithoutHash(){ return location.pathname + location.search; }

  function open(fromUrl){
    if(fromUrl !== true && location.hash !== CAL_HASH){
      history.pushState(null, "", CAL_HASH);
      pushedHash = true;
      // pushState non manda hashchange: il manifest si aggiorna a mano
      if(window.beSyncManifest) window.beSyncManifest();
    }
    cursor = new Date();
    view = defaultView();
    $views.forEach(function(b){ b.classList.toggle("active", b.dataset.view === view); });
    syncDefaultBtn();
    agenda.from = agenda.to = agenda.lastTop = null;
    agenda.jumpTo = todayKey();
    $overlay.classList.add("show");
    $overlay.setAttribute("aria-hidden","false");
    document.body.style.overflow = "hidden";
    if(mode === null) $body.innerHTML = '<div class="cal-empty"><p>Carico il calendario…</p></div>';
    else render();
    refresh();
  }
  function close(fromUrl){
    if(fromUrl !== true && location.hash === CAL_HASH){
      // si torna alla voce di prima; chiude poi l'evento hashchange
      if(pushedHash){ pushedHash = false; history.back(); return; }
      history.replaceState(null, "", urlWithoutHash());
      if(window.beSyncManifest) window.beSyncManifest();
    }
    setSelecting(false);
    $overlay.classList.remove("show");
    $overlay.setAttribute("aria-hidden","true");
    document.body.style.overflow = "";
  }

  /* ---------- piu' impegni insieme ----------
   * «Seleziona» (o Ctrl/Cmd/Maiuscolo + clic su un impegno) accende la
   * selezione: un clic sceglie l'impegno invece di aprirlo e la barra in
   * basso li elimina o li modifica tutti insieme, con «Annulla» subito
   * dopo. Nel mese una casella con piu' impegni li sceglie tutti. Quelli
   * arrivati da Apple Calendar restano fuori: si cambiano da Apple. */
  var selecting = false;
  var selected = {};          // id -> true
  var $selBtn = document.getElementById("cal-select-btn");
  var $selBar = document.getElementById("cal-selbar");
  var $selCount = document.getElementById("cal-sel-count");
  var $selEdit = document.getElementById("cal-sel-edit");
  var $selDel = document.getElementById("cal-sel-del");
  var $selNone = document.getElementById("cal-sel-none");

  function selectedEvents(){ return calEvents.filter(function(e){ return selected[e.id]; }); }
  function setSelecting(on){
    selecting = !!on;
    if(!selecting) selected = {};
    $overlay.classList.toggle("selecting", selecting);
    $selBtn.setAttribute("aria-pressed", selecting ? "true" : "false");
    $selBar.hidden = !selecting;
    syncSelBar();
    markSelected();
  }
  function syncSelBar(){
    var n = selectedEvents().length;
    $selCount.textContent = !n ? "Tocca gli impegni da scegliere"
      : n === 1 ? "1 impegno scelto" : n + " impegni scelti";
    $selEdit.disabled = $selDel.disabled = $selNone.disabled = !n;
  }
  function markSelected(){
    $body.querySelectorAll("[data-ev]").forEach(function(el){
      var on = selecting && el.dataset.ev.split(" ").every(function(id){ return selected[id]; });
      el.classList.toggle("cal-sel", on);
    });
  }
  /* Il clic su un impegno: true se l'ha preso la selezione */
  function pick(ev, evs){
    if(!selecting){
      if(!ev || !(ev.metaKey || ev.ctrlKey || ev.shiftKey)) return false;
      setSelecting(true);
    }
    var mine = evs.filter(function(e){ return e.source !== "apple"; });
    if(!mine.length){
      notify("Gli impegni arrivati da Apple Calendar si cambiano da Apple: qui non si scelgono.", { warn: false, autoHide: 3500 });
      return true;
    }
    var all = mine.every(function(e){ return selected[e.id]; });
    mine.forEach(function(e){ if(all) delete selected[e.id]; else selected[e.id] = true; });
    syncSelBar();
    markSelected();
    return true;
  }
  function orderPersons(list){
    return KNOWN_PERSONS.filter(function(p){ return list.indexOf(p) >= 0; })
      .concat(list.filter(function(p, i){ return !isKnown(p) && list.indexOf(p) === i; }));
  }
  function howMany(n){ return n === 1 ? "1 impegno" : n + " impegni"; }

  async function deleteSelected(){
    var evs = selectedEvents();
    if(!evs.length) return;
    var ok = await askChoice("Eliminare " + howMany(evs.length) + "?",
      "Spariscono da «Chi fa cosa» per tutti. Subito dopo puoi ancora annullare.", [
      { label: "Annulla", value: null },
      { label: "Elimina " + howMany(evs.length), value: "yes", danger: true }
    ]);
    if(!ok) return;
    var copies = JSON.parse(JSON.stringify(evs));
    if(!(await deleteRows(evs.map(function(e){ return e.id; })))) return;
    setSelecting(false);
    render();
    notify(evs.length === 1 ? "Impegno eliminato." : evs.length + " impegni eliminati.", {
      warn: false, autoHide: 8000,
      action: { label: "Annulla", run: async function(){
        if(!(await saveRows(copies, "Impegni non ripristinati"))) return;
        render();
        notify("Ripristinati.", { warn: false, autoHide: 2500 });
      } }
    });
  }

  /* Modifica insieme: cambia solo cio' che si tocca, il resto di ogni
     impegno resta com'e'. */
  function openBulkEdit(){
    var evs = selectedEvents();
    if(!evs.length) return;
    var others = [];
    evs.forEach(function(e){
      (e.persons || []).forEach(function(p){ if(!isKnown(p) && others.indexOf(p) < 0) others.push(p); });
    });
    var people = KNOWN_PERSONS.concat(others);
    var change = {};            // persona -> "add" | "del"
    var half = "", status = "";

    var bd = document.createElement("div");
    bd.className = "modal-backdrop";
    bd.innerHTML =
      '<div class="modal cm-modal" role="dialog" aria-modal="true">' +
        '<h2>Modifica ' + howMany(evs.length) + '</h2>' +
        '<p class="cm-bulk-note">Cambia solo quello che tocchi qui: il resto di ogni impegno resta com\'è.</p>' +

        '<label for="cb-title">Titolo</label>' +
        '<input type="text" id="cb-title" placeholder="Lascia vuoto per non cambiarlo" maxlength="200">' +

        '<label for="cb-project">Progetto</label>' +
        '<select id="cb-project" class="col-select"></select>' +
        '<input type="text" id="cb-project-other" placeholder="Specifica a cosa si riferisce" maxlength="120" hidden>' +
        '<p class="cm-bulk-note" style="margin-top:6px">Vale per gli impegni di lavoro.</p>' +

        '<label>Persone</label>' +
        '<p class="cm-bulk-note" style="margin:0 0 8px">Tocca una volta per aggiungere, due per togliere.</p>' +
        '<div class="cm-people" id="cb-people" style="margin-bottom:14px"></div>' +

        '<label>Mezza giornata</label>' +
        '<div class="cm-seg" id="cb-half">' +
          '<button type="button" data-v="">Non cambiare</button>' +
          '<button type="button" data-v="am">Mattina</button>' +
          '<button type="button" data-v="pm">Pomeriggio</button>' +
          '<button type="button" data-v="day">Tutto il giorno</button>' +
        '</div>' +

        '<label>Stato</label>' +
        '<div class="cm-seg" id="cb-status">' +
          '<button type="button" data-v="">Non cambiare</button>' +
          '<button type="button" data-v="confermato">✓ Confermato</button>' +
          '<button type="button" data-v="da_confermare">? Da confermare ?</button>' +
        '</div>' +

        '<label for="cb-shift">Sposta le date</label>' +
        '<div class="cm-shift"><input type="number" id="cb-shift" value="0" step="1" min="-366" max="366" inputmode="numeric"> giorni ' +
          '<span style="color:#738496">(7 = una settimana dopo, -1 = il giorno prima)</span></div>' +

        '<div class="cm-error" id="cb-error" role="alert"></div>' +
        '<div class="actions">' +
          '<button class="btn-cancel" id="cb-cancel">Annulla</button>' +
          '<button class="btn-primary" id="cb-save">Applica a ' + howMany(evs.length) + '</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(bd);
    function $(id){ return bd.querySelector("#" + id); }
    var $title = $("cb-title"), $project = $("cb-project"), $other = $("cb-project-other");
    var $shift = $("cb-shift"), $err = $("cb-error");

    $project.innerHTML = projectOptions(null);
    $project.options[0].textContent = "— Non cambiare —";
    $project.addEventListener("change", function(){
      $other.hidden = $project.value !== "__altro__";
      if(!$other.hidden) $other.focus();
    });

    var $people = $("cb-people");
    people.forEach(function(p){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "cm-person";
      b.style.setProperty("--pc", personColor(p));
      b.style.setProperty("--pcbg", hexA(personColor(p), 0.22));
      b.innerHTML = '<span class="dot"></span><span class="cb-sign"></span>' + escapeHtml(p);
      b.addEventListener("click", function(){
        change[p] = !change[p] ? "add" : change[p] === "add" ? "del" : undefined;
        if(!change[p]) delete change[p];
        b.classList.toggle("add", change[p] === "add");
        b.classList.toggle("del", change[p] === "del");
        b.querySelector(".cb-sign").textContent = change[p] === "add" ? "+ " : change[p] === "del" ? "− " : "";
        b.title = change[p] === "add" ? "Si aggiunge" : change[p] === "del" ? "Si toglie" : "Non cambia";
      });
      $people.appendChild(b);
    });

    function bindSeg(id, set){
      var btns = bd.querySelectorAll("#" + id + " button");
      function paint(v){ btns.forEach(function(b){ b.classList.toggle("on", b.dataset.v === v); }); }
      btns.forEach(function(b){ b.addEventListener("click", function(){ set(b.dataset.v); paint(b.dataset.v); }); });
      paint("");
    }
    bindSeg("cb-half", function(v){ half = v; });
    bindSeg("cb-status", function(v){ status = v; });

    function teardown(){ bd.remove(); document.removeEventListener("keydown", onKey); }
    function fail(msg, $f){ $err.textContent = msg; if($f) $f.focus(); return null; }

    function build(){
      var title = $title.value.trim();
      var pv = $project.value, projId = null, projName = null;
      if(pv === "__altro__"){
        projName = $other.value.trim();
        if(!projName) return fail("Hai scelto «Altro»: specifica a cosa si riferisce.", $other);
      } else if(pv){
        projId = pv;
        var pr = (state.projects || []).find(function(x){ return x.id === pv; });
        projName = pr ? pr.name : null;
      }
      var days = parseInt($shift.value, 10) || 0;
      if(Math.abs(days) > 366) return fail("Al massimo un anno avanti o indietro.", $shift);
      var adds = Object.keys(change).filter(function(p){ return change[p] === "add"; });
      var dels = Object.keys(change).filter(function(p){ return change[p] === "del"; });
      if(!title && !pv && !adds.length && !dels.length && !half && !status && !days){
        return fail("Non hai cambiato niente.");
      }
      var empty = 0;
      var rows = evs.map(function(e){
        var r = JSON.parse(JSON.stringify(e));
        if(title) r.title = title;
        if(pv && r.kind === "lavoro"){ r.project_id = projId; r.project_name = projName; }
        if(adds.length || dels.length){
          r.persons = orderPersons((r.persons || []).filter(function(p){ return dels.indexOf(p) < 0; }).concat(adds));
          if(!r.persons.length) empty++;
        }
        if(half && r.kind !== "ferie") r.half = half;
        if(status) r.status = status;
        if(days){
          r.date = fmtDate(addDays(parseDate(r.date), days));
          if(r.date_end) r.date_end = fmtDate(addDays(parseDate(r.date_end), days));
        }
        return r;
      });
      if(empty) return fail("Così " + howMany(empty) + " resterebbe" + (empty === 1 ? "" : "ro") + " senza nessuna persona.", $people.querySelector("button"));
      return rows;
    }

    var saving = false;
    async function save(){
      if(saving) return;
      $err.textContent = "";
      var rows = build();
      if(!rows) return;
      var copies = JSON.parse(JSON.stringify(evs));
      saving = true;
      $("cb-save").disabled = true;
      var ok = await saveRows(rows, "Impegni non modificati");
      saving = false;
      $("cb-save").disabled = false;
      if(!ok) return;
      teardown();
      setSelecting(false);
      render();
      notify(rows.length === 1 ? "Impegno modificato." : rows.length + " impegni modificati.", {
        warn: false, autoHide: 8000,
        action: { label: "Annulla", run: async function(){
          if(!(await saveRows(copies, "Modifica non annullata"))) return;
          render();
          notify("Modifica annullata.", { warn: false, autoHide: 2500 });
        } }
      });
    }
    function onKey(e){
      if(e.key === "Escape") teardown();
      if(e.key === "Enter" && (e.metaKey || e.ctrlKey)) save();
    }
    document.addEventListener("keydown", onKey);
    bd.addEventListener("click", function(e){ if(e.target === bd) teardown(); });
    $("cb-cancel").addEventListener("click", teardown);
    $("cb-save").addEventListener("click", save);
    $title.focus();
  }

  /* ---------- view nav ---------- */
  function setView(v){
    if(v === "agenda" && view !== "agenda") agenda.jumpTo = fmtDate(cursor);
    view = v;
    $views.forEach(function(b){ b.classList.toggle("active", b.dataset.view === v); });
    syncDefaultBtn();
    render();
  }

  /* ---------- vista predefinita ----------
   * Ognuno sceglie con quale vista si apre "Chi fa cosa". La scelta sta
   * negli user_metadata (come il nome di "Senza label"): segue l'account
   * su ogni dispositivo senza toccare lo schema. */
  var VIEWS = ["agenda", "day", "week", "month"];
  var VIEW_LABEL = { agenda: "Agenda", day: "Giorno", week: "Settimana", month: "Mese" };
  function defaultView(){
    var v = state.me && state.me.cal_default_view;
    return VIEWS.indexOf(v) >= 0 ? v : "agenda";
  }
  function syncDefaultBtn(){
    var $b = document.getElementById("cal-default-btn");
    var on = view === defaultView();
    $b.classList.toggle("on", on);
    $b.setAttribute("aria-pressed", on ? "true" : "false");
    $b.querySelector("span").textContent = on ? "Predefinita" : "Rendi predefinita";
    $b.title = on
      ? "«" + VIEW_LABEL[view] + "» è la vista con cui si apre Chi fa cosa"
      : "Apri sempre Chi fa cosa in «" + VIEW_LABEL[view] + "»";
  }
  async function makeDefaultView(){
    if(!state.me || view === defaultView()) return;
    var prev = state.me.cal_default_view, v = view;
    state.me.cal_default_view = v;
    syncDefaultBtn();
    var res = await sb.auth.updateUser({ data: { cal_default_view: v } });
    if(res.error){
      state.me.cal_default_view = prev;
      syncDefaultBtn();
      notify(errorText(res.error, "Vista predefinita non salvata"));
      return;
    }
    notify("«" + VIEW_LABEL[v] + "» è ora la vista predefinita.", { warn: false, autoHide: 2500 });
  }
  function shift(direction){
    if(view === "agenda"){
      agenda.jumpTo = fmtDate(addDays(parseDate(agenda.lastTop || todayKey()), 7*direction));
    }
    if(view === "day")   cursor = addDays(cursor, direction);
    if(view === "week")  cursor = addDays(cursor, 7*direction);
    if(view === "month") cursor = new Date(cursor.getFullYear(), cursor.getMonth()+direction, 1);
    render();
  }
  function goToday(){
    cursor = new Date();
    agenda.jumpTo = todayKey();
    render();
  }

  /* ---------- event helpers ---------- */
  function covers(e, dateStr){
    return e.date <= dateStr && (e.date_end || e.date) >= dateStr;
  }
  function eventsInRange(fromStr, toStr){
    return calEvents.filter(function(e){ return e.date <= toStr && (e.date_end || e.date) >= fromStr; });
  }
  function byTime(a, b){
    var ka = (a.kind === "ferie" ? "0" : "1") + (a.start_time || "99:99");
    var kb = (b.kind === "ferie" ? "0" : "1") + (b.start_time || "99:99");
    return ka.localeCompare(kb);
  }
  /* Gli impegni di una casella: persona x giorno x mezza giornata */
  function slotEvents(evs, row, dateStr, half){
    return evs.filter(function(e){
      if(!covers(e, dateStr)) return false;
      if(half && e.half !== half && e.half !== "day") return false;
      if(!eventShownOn(e, dateStr)) return false;
      return hasPerson(e, row);
    }).sort(byTime);
  }
  function fmtTimeRange(ev){
    if(!ev.start_time) return HALF_LABEL[ev.half] || "";
    if(ev.end_time && ev.end_time !== ev.start_time) return ev.start_time + " – " + ev.end_time;
    return ev.start_time;
  }
  function displayTitle(e){
    var t = e.kind === "ferie" ? (e.title && e.title !== "Ferie" ? "Ferie · " + e.title : "Ferie") : e.title;
    return e.status === "da_confermare" ? "? " + t + " ?" : t;
  }
  function chipClass(e){
    return "k-" + (e.kind || "lavoro") + (e.status === "da_confermare" ? " tentative" : "") +
           (e.source === "apple" ? " from-apple" : "");
  }
  function paintChip(el, e, row){
    var c = rowColor(row);
    el.style.setProperty("--pc", c);
    el.style.setProperty("--pcbg", hexA(c, 0.22));
  }
  function eventTooltip(e){
    var bits = [displayTitle(e), fmtTimeRange(e)];
    if(e.project_name) bits.push("Progetto: " + e.project_name);
    if(e.location) bits.push("Luogo: " + e.location);
    if(e.persons && e.persons.length) bits.push(e.persons.join(", "));
    if(e.kind === "extra") bits.push("Extra fosforo" + (e.source === "apple" ? " (da Apple Calendar)" : ""));
    return bits.filter(Boolean).join("\n");
  }

  /* ---------- rendering ---------- */
  /* Chi si vede in un mese, dalla fascia del mese nell'Agenda. I soci sono
     una scelta di chi guarda (i mesi dopo senza scelta la seguono); gli
     Extra si accendono per tutti, solo in quel mese. */
  function openMonthPeople(mk){
    var label = monthName(mk) + " " + mk.slice(0, 4);
    var bd = document.createElement("div");
    bd.className = "modal-backdrop";
    bd.innerHTML =
      '<div class="modal cal-mp" role="dialog" aria-modal="true">' +
        '<h2></h2>' +
        '<p class="move-hint move-note" id="mp-note"></p>' +
        '<div class="cal-mp-list" id="mp-list"></div>' +
        '<div class="cal-side-actions">' +
          '<button type="button" data-act="all">Tutti i soci</button>' +
          '<button type="button" data-act="none">Nessuno</button>' +
          '<button type="button" data-act="prev" id="mp-prev">Come il mese prima</button>' +
        '</div>' +
        '<h3 class="cal-mp-sub">Extra · per tutti, solo a ' + escapeHtml(monthName(mk)) + '</h3>' +
        '<div class="cal-mp-list" id="mp-extra"></div>' +
        '<div class="actions"><button type="button" class="btn-primary" id="mp-ok">Fatto</button></div>' +
      '</div>';
    document.body.appendChild(bd);
    bd.querySelector("h2").textContent = "Chi vedi a " + label;
    var $list = bd.querySelector("#mp-list"), $extra = bd.querySelector("#mp-extra");
    var mine = KNOWN_PERSONS.concat(monthAllRows(mk).indexOf(NOBODY) >= 0 ? [NOBODY] : []);

    function paint(){
      var hidden = hiddenFor(mk), src = filterSource(mk);
      var prevSrc = filterSource(addMonths(mk, -1));
      bd.querySelector("#mp-note").textContent = (src === mk
        ? "Soci: scelta tua per " + monthName(mk) + ", vale anche per i mesi dopo che non hai cambiato."
        : "Soci: ora è come " + (src ? "a " + monthName(src) : "il resto del calendario") +
          "; cambiando, vale da " + monthName(mk) + " in poi.") + " Gli altri non la vedono.";
      bd.querySelector("#mp-prev").hidden = src !== mk;
      bd.querySelector("#mp-prev").title = "Togli la tua scelta di " + monthName(mk) + ": torna come " +
        (prevSrc ? monthName(prevSrc) : "il resto del calendario");
      $list.innerHTML = "";
      mine.forEach(function(r){
        var row = document.createElement("div");
        row.className = "cal-person-row" + (hidden.has(r) ? "" : " checked");
        row.style.setProperty("--pc", rowColor(r));
        row.innerHTML = '<div class="cal-cb"></div><div class="cal-person-name"></div>';
        row.querySelector(".cal-person-name").textContent = rowLabel(r);
        row.addEventListener("click", function(){
          var h = hiddenFor(mk);
          if(h.has(r)) h.delete(r); else h.add(r);
          apply(h);
        });
        $list.appendChild(row);
      });
      $extra.innerHTML = "";
      var extras = outsideNames();
      if(extras.length > 1){
        $extra.appendChild(groupRow("Tutti gli Extra", extras, function(n){ return extraShown(n, mk); }, async function(on){
          await setAllExtras(extras, mk, on);
          paint();
        }));
      }
      extras.forEach(function(n){ $extra.appendChild(extraRow(n, mk, paint)); });
      if(!extras.length) $extra.innerHTML = '<p class="cal-dnone">Nessun Extra.</p>';
    }
    function apply(h){
      setHiddenIn(mk, h);
      paint();
      render();
    }
    bd.querySelector('[data-act="all"]').addEventListener("click", function(){ apply(new Set()); });
    bd.querySelector('[data-act="none"]').addEventListener("click", function(){ apply(new Set(mine)); });
    bd.querySelector("#mp-prev").addEventListener("click", function(){
      delete hiddenByMonth[mk];
      saveMonthFilter();
      if(mk === filterMonth) hiddenPersons = hiddenFor(mk);
      paint();
      render();
    });
    function close(){ bd.remove(); document.removeEventListener("keydown", onKey); }
    function onKey(e){ if(e.key === "Escape"){ e.stopPropagation(); close(); } }
    document.addEventListener("keydown", onKey);
    bd.addEventListener("click", function(e){ if(e.target === bd) close(); });
    bd.querySelector("#mp-ok").addEventListener("click", close);
    paint();
  }

  function outsideNames(){
    var out = extraPeople.map(function(p){ return p.name; });
    calEvents.forEach(function(e){
      (e.persons || []).forEach(function(n){
        if(!isKnown(n) && !findExtra(n) && out.indexOf(n) < 0) out.push(n);
      });
    });
    return out;
  }

  /* Una riga "Tutti gli Extra": accesa se si vedono tutti, a meta' se solo
     alcuni. Il clic li mostra tutti, o li nasconde tutti se gia' si vedono. */
  function groupRow(label, names, isShown, onToggle){
    var shown = names.filter(isShown).length;
    var allOn = names.length > 0 && shown === names.length;
    var row = document.createElement("div");
    row.className = "cal-person-row group" + (allOn ? " checked" : "") +
      (shown > 0 && !allOn ? " mixed" : "");
    row.setAttribute("role", "checkbox");
    row.setAttribute("aria-checked", allOn ? "true" : (shown ? "mixed" : "false"));
    row.title = allOn ? "Nascondi tutti gli Extra" : "Mostra tutti gli Extra";
    row.innerHTML = '<div class="cal-cb"></div><div class="cal-person-name"></div>' +
      '<div class="cal-person-count">' + shown + "/" + names.length + '</div>';
    row.querySelector(".cal-person-name").textContent = label;
    row.addEventListener("click", function(){ onToggle(!allOn); });
    return row;
  }
  /* Tutti gli Extra di un mese accesi o spenti insieme, per tutti */
  async function setAllExtras(names, mk, on){
    for(var i = 0; i < names.length; i++){
      var p = findExtra(names[i]);
      if(!p || activeIn(p, mk) === on || (!on && extraBusy(p.name, mk))) continue;
      if(!(await setMonth(p, mk, on))) break;
    }
    render();
  }
  /* La riga di un Extra: la spunta accende la sua colonna in quel mese */
  function extraRow(name, mk, onDone){
    var busy = extraBusy(name, mk), on = extraShown(name, mk);
    var row = document.createElement("div");
    row.className = "cal-person-row" + (on ? " checked" : "") + (busy ? " busy" : "");
    row.style.setProperty("--pc", rowColor(name));
    row.title = busy ? name + " ha qualcosa segnato a " + monthName(mk) + ": la colonna c'è comunque"
                     : (on ? "Spegni" : "Accendi") + " la colonna di " + name + " a " + monthName(mk) + ", per tutti";
    row.innerHTML = '<div class="cal-cb"></div><div class="cal-person-name"></div>';
    row.querySelector(".cal-person-name").textContent = name;
    row.addEventListener("click", async function(){
      if(await setExtraShown(name, mk, !on)){ render(); if(onDone) onDone(); }
    });
    return row;
  }

  var dragName = null;   // l'Extra che si sta trascinando
  /* La sezione Extra a sinistra: chiusa di base, ognuno la apre per se' */
  var EXTRA_OPEN_KEY = "brown_calendar_extra_open_v1";
  function renderPersonSide(){
    var mk = filterMonth;
    var outside = outsideNames();
    var mine = KNOWN_PERSONS.slice();
    $side.innerHTML = "";

    var h = document.createElement("h3");
    h.textContent = "Persone · " + monthName(mk) + " " + mk.slice(0, 4);
    $side.appendChild(h);
    var fh = document.createElement("p");
    fh.className = "cal-filter-hint";
    var src = filterSource(mk);
    fh.textContent = src && src !== mk
      ? "Soci come a " + monthName(src) + ": cambiando, vale da " + monthName(mk) + " in poi. Solo per te."
      : "Soci che vedi a " + monthName(mk) + " e nei mesi dopo che non cambi. Solo per te.";
    $side.appendChild(fh);

    var allRow = document.createElement("div");
    allRow.className = "cal-person-row all";
    var allOn = mine.every(function(p){ return !hiddenPersons.has(p); });
    if(allOn) allRow.classList.add("checked");
    allRow.innerHTML = '<div class="cal-cb"></div><div class="cal-person-name">Tutti i soci</div>';
    allRow.addEventListener("click", function(){
      if(allOn) mine.forEach(function(p){ hiddenPersons.add(p); });
      else { mine.forEach(function(p){ hiddenPersons.delete(p); }); hiddenPersons.delete(NOBODY); }
      saveFilter();
      render();
    });
    $side.appendChild(allRow);

    var divider = document.createElement("div");
    divider.className = "cal-side-divider";
    $side.appendChild(divider);

    // il numero accanto al nome: gli impegni nel mese mostrato
    var mb = monthBounds(mk);
    function countIn(p){
      return eventsInRange(mb.from, mb.to).reduce(function(n,e){
        return n + (hasPerson(e, p) ? 1 : 0);
      }, 0);
    }
