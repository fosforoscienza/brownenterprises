<!DOCTYPE html>
<html data-be-bg="dark" lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover">
<title>Mario Project Manager · Brown Enterprises</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E1217">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<style>
  /* --- reset & base ----------------------------------------------------- */
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",Roboto,sans-serif;
    background:#1d2125;
    color:#b6c2cf;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer}
  ::selection{background:rgba(87,157,255,0.4);color:#fff}

  /* --- layout ----------------------------------------------------------- */
  .app{
    display:grid;
    grid-template-rows:44px 1fr;
    grid-template-columns:260px 1fr;
    grid-template-areas:"topbar topbar" "sidebar board";
    height:100vh;
    /* dvh: su iOS 100vh include la barra di Safari, quindi il fondo della
       board restava irraggiungibile. Il doppio valore tiene i browser vecchi. */
    height:100dvh;
    padding-top:env(safe-area-inset-top,0px);
  }

  /* --- top bar ---------------------------------------------------------- */
  .topbar{
    grid-area:topbar;
    background:#1d2125;
    border-bottom:1px solid #2c3338;
    display:flex;
    align-items:center;
    padding:0 max(16px, env(safe-area-inset-right,0px)) 0 max(16px, env(safe-area-inset-left,0px));
    gap:14px;
    z-index:20;
  }
  .topbar-logo{
    display:flex;
    align-items:center;
    gap:10px;
    color:#f4f5f7;
    font-weight:700;
    font-size:14px;
    letter-spacing:0.2px;
  }
  .topbar-logo img{height:24px}  /* il logo SVG e' gia' bianco */
  .area-tabs{
    display:inline-flex;background:#22272b;border:1px solid #38414b;border-radius:6px;padding:2px;
  }
  .area-tabs button{
    background:transparent;border:0;color:#9fadbc;
    padding:6px 14px;border-radius:4px;
    font-size:12px;font-weight:600;
    white-space:nowrap;
    user-select:none;
    transition:background 0.12s,color 0.12s;
  }
  .area-tabs button.active{background:#1c2b41;color:#cce0ff}
  .area-tabs button:hover:not(.active){background:#2c3338;color:#f4f5f7}
  .topbar-spacer{flex:1}
  .topbar-user{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .topbar-user .avatar{
    width:28px;height:28px;border-radius:50%;
    background:linear-gradient(135deg,#579dff,#9f8fef);
    color:#1d2125;
    font-weight:700;font-size:12px;
    display:flex;align-items:center;justify-content:center;
    border:0;padding:0;font-family:inherit;cursor:pointer;
  }
  .topbar-user .avatar:hover{box-shadow:0 0 0 2px #38414b}
  .icon-btn{
    background:transparent;border:0;color:#9fadbc;
    width:32px;height:32px;border-radius:4px;
    display:inline-flex;align-items:center;justify-content:center;
    transition:background 0.15s,color 0.15s;
  }
  .icon-btn:hover{background:#2c3338;color:#f4f5f7}

  /* --- sidebar ---------------------------------------------------------- */
  .sidebar{
    grid-area:sidebar;
    background:#1d2125;
    border-right:1px solid #2c3338;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .sidebar-header{
    padding:14px 14px 8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .sidebar-title{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.8px;
    color:#9fadbc;
    font-weight:700;
  }
  .sidebar-add{
    background:transparent;border:0;color:#9fadbc;
    width:24px;height:24px;border-radius:4px;
    display:inline-flex;align-items:center;justify-content:center;
    transition:background 0.15s,color 0.15s;
  }
  .sidebar-add:hover{background:#2c3338;color:#f4f5f7}
  .projects{
    flex:1;
    overflow-y:auto;
    padding:4px 8px 12px;
  }
  .project-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 8px;
    border-radius:4px;
    cursor:pointer;
    color:#b6c2cf;
    transition:background 0.12s,color 0.12s;
    margin-bottom:2px;
    user-select:none;
    position:relative;
  }
  .project-item:hover{background:#2c3338}
  .project-item.active{
    background:#1c2b41;
    color:#cce0ff;
  }
  .project-item.active .project-icon{background:#579dff;color:#1d2125}
  .project-icon{
    width:22px;height:22px;border-radius:4px;
    background:linear-gradient(135deg,#4bce97,#579dff);
    color:#1d2125;
    font-size:11px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .project-name{
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:14px;
  }
  .project-delete{
    opacity:0;
    background:transparent;border:0;color:#9fadbc;
    width:22px;height:22px;border-radius:4px;
    display:inline-flex;align-items:center;justify-content:center;
    transition:opacity 0.12s,background 0.12s,color 0.12s;
  }
  .project-item:hover .project-delete{opacity:1}
  .project-delete:hover{background:#412a2a;color:#f87168}
  .empty-projects{
    text-align:center;
    color:#738496;
    font-size:12px;
    padding:24px 12px;
    line-height:1.5;
  }
  .sidebar-section-title{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.6px;
    color:#738496;
    font-weight:700;
    padding:10px 4px 4px 8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .sidebar-section-title:first-child{padding-top:2px}
  .project-item.dragging{opacity:0.4;cursor:grabbing}
  .sidebar-section-add{
    background:transparent;border:0;color:#9fadbc;
    width:20px;height:20px;border-radius:4px;
    display:inline-flex;align-items:center;justify-content:center;
    transition:background 0.15s,color 0.15s;
  }
  .sidebar-section-add:hover{background:#2c3338;color:#f4f5f7}
  /* --- Label: gruppi di progetti creati da ogni utente ------------------ */
  .label-group{
    border-radius:6px;
    margin-bottom:2px;
    transition:box-shadow 0.12s,background 0.12s;
  }
  .label-group.drop-target{
    background:#1c2b41;
    box-shadow:inset 0 0 0 1px #579dff;
  }
  .label-head{
    display:flex;
    align-items:center;
    gap:4px;
    padding:7px 4px 5px 4px;
    border-radius:4px;
    cursor:pointer;
    user-select:none;
    color:#738496;
  }
  .label-head:hover{background:#22272b}
  .label-caret{
    width:14px;height:14px;flex-shrink:0;
    display:inline-flex;align-items:center;justify-content:center;
    transition:transform 0.15s;
  }
  .label-group.collapsed .label-caret{transform:rotate(-90deg)}
  .label-title{
    flex:1;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.6px;
    font-weight:700;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .label-count{
    font-size:10px;font-weight:700;
    background:#2c3338;color:#9fadbc;
    border-radius:9px;padding:1px 6px;
    flex-shrink:0;
  }
  .label-btn{
    opacity:0;
    background:transparent;border:0;color:#9fadbc;
    width:20px;height:20px;border-radius:4px;
    display:inline-flex;align-items:center;justify-content:center;
    flex-shrink:0;
    transition:opacity 0.12s,background 0.12s,color 0.12s;
  }
  .label-head:hover .label-btn{opacity:1}
  .label-btn:hover{background:#2c3338;color:#f4f5f7}
  .label-btn.danger:hover{background:#412a2a;color:#f87168}
  .label-shared{display:inline-flex;align-items:center;color:#579dff;flex-shrink:0}
  .move-group > p.move-hint{margin:0;padding:4px 2px;font-size:13px;line-height:1.4}
  .label-group.collapsed .label-body{display:none}
  .label-empty{
    color:#5c6b7a;
    font-size:11px;
    padding:4px 10px 8px;
    line-height:1.4;
  }
  .project-move{
    opacity:0;
    background:transparent;border:0;color:#9fadbc;
    width:22px;height:22px;border-radius:4px;
    display:inline-flex;align-items:center;justify-content:center;
    transition:opacity 0.12s,background 0.12s,color 0.12s;
  }
  .project-item:hover .project-move{opacity:1}
  .project-move:hover{background:#2c3338;color:#f4f5f7}
  .sidebar-note{
    margin:6px 4px 10px;
    padding:8px 10px;
    border-radius:6px;
    background:#2b2318;
    color:#f5cd47;
    font-size:11px;
    line-height:1.45;
  }
  .project-share{
    opacity:0;
    background:transparent;border:0;color:#9fadbc;
    width:22px;height:22px;border-radius:4px;
    display:inline-flex;align-items:center;justify-content:center;
    transition:opacity 0.12s,background 0.12s,color 0.12s;
  }
  .project-item:hover .project-share{opacity:1}
  .project-share:hover{background:#1c2b41;color:#85b8ff}
  .project-delete{
    background:transparent;border:0;color:#9fadbc;
    width:22px;height:22px;border-radius:4px;flex-shrink:0;
    display:inline-flex;align-items:center;justify-content:center;
    margin-left:4px;
    transition:background 0.12s,color 0.12s;
  }
  .project-delete:hover{background:#412a2a;color:#f87168}
  /* --- Categorie: stellina, archivio, selezione multipla ---------------- */
  .project-star,.project-archive{
    opacity:0;
    background:transparent;border:0;color:#9fadbc;
    width:22px;height:22px;border-radius:4px;flex-shrink:0;
    display:inline-flex;align-items:center;justify-content:center;
    transition:opacity 0.12s,background 0.12s,color 0.12s;
  }
  .project-item:hover .project-star,.project-item:hover .project-archive{opacity:1}
  .project-star:hover,.project-archive:hover{background:#2c3338;color:#f4f5f7}
  .project-star.on{opacity:1;color:#f5cd47}
  .project-star.on svg{fill:currentColor}
  .project-actions{
    display:none;align-items:center;gap:2px;
    position:absolute;right:4px;top:50%;transform:translateY(-50%);
    padding-left:8px;border-radius:4px;background:#2c3338;
    box-shadow:-10px 0 8px -4px #2c3338;
  }
  .project-item.active .project-actions{background:#1c2b41;box-shadow:-10px 0 8px -4px #1c2b41}
  .project-item:hover .project-actions,.project-item:focus-within .project-actions{display:flex}
  .project-actions > button{opacity:1}
  .project-star.on:hover{color:#f8e6a0}
  .project-item.archived .project-name{color:#8c9bab}
  .project-item.archived .project-icon{background:#38414b;color:#9fadbc}
  .fav-group .label-shared{color:#f5cd47}
  .fav-group .label-shared svg{fill:currentColor}
  .label-head .label-shared + .label-title{margin-left:2px}
  .sidebar-section-tools{display:inline-flex;gap:2px}
  .project-check{
    width:18px;height:18px;margin:2px;border-radius:4px;flex-shrink:0;
    border:2px solid #4a5560;background:#1d2125;position:relative;
    transition:background 0.12s,border-color 0.12s;
  }
  .project-item.picked{background:#1c2b41;color:#cce0ff}
  .project-item.picked .project-check{background:#579dff;border-color:#579dff}
  .project-item.picked .project-check::after{
    content:"";position:absolute;left:4px;top:0;
    width:5px;height:10px;border:solid #1d2125;border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }
  .projects.selecting{padding-bottom:0}
  .select-bar{
    position:sticky;bottom:0;z-index:2;
    margin:8px -8px 0;padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));
    background:#22272b;border-top:1px solid #38414b;
    box-shadow:0 -6px 16px rgba(0,0,0,0.35);
  }
  .select-bar-top{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .select-count{flex:1;font-size:12px;font-weight:700;color:#cce0ff}
  .select-link{
    background:transparent;border:0;color:#85b8ff;font-size:12px;font-weight:600;
    padding:4px 6px;border-radius:4px;
  }
  .select-link:hover{background:#2c3338}
  .select-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .select-btn{
    flex:1 1 0;min-width:0;min-height:38px;
    background:#1d2125;border:1px solid #38414b;color:#f4f5f7;border-radius:6px;
    font-size:12px;font-weight:600;padding:6px 4px;
    display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    transition:background 0.12s,border-color 0.12s;
  }
  .select-btn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .select-btn:hover:not(:disabled){background:#2c3338;border-color:#579dff}
  .select-btn:disabled{opacity:0.45;cursor:default}
  .move-opt.on{background:#1c2b41;border-color:#579dff;color:#cce0ff}
  .move-opt svg{flex-shrink:0}
  .move-opt.move-danger{color:#f87168}
  .move-opt.move-danger:hover:not(:disabled){background:#412a2a;border-color:#f87168}
  .move-note{margin:-4px 0 14px;font-size:13px;line-height:1.45}
  .np-cats{margin-bottom:6px}
  .modal.np-review{max-width:600px}
  .np-review-list{display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow-y:auto;margin-bottom:12px}
  .np-review-row{
    display:grid;grid-template-columns:1fr 160px auto;gap:8px;align-items:center;
    padding:8px 10px;border:1px solid #38414b;border-radius:8px;background:#1d2125;
  }
  .np-review-row .col-select{margin:0;padding:7px 9px;font-size:13px}
  .np-review-row button{padding:7px 12px;font-size:13px}
  .np-review-name{min-width:0;display:flex;flex-direction:column;gap:2px}
  .np-review-name b{color:#f4f5f7;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .np-review-name span{color:#9fadbc;font-size:12px}
  @media (max-width:560px){
    .np-review-row{grid-template-columns:1fr auto}
    .np-review-name{grid-column:1 / -1}
  }
  .np-cats .move-opt{flex:0 1 auto;min-height:38px;padding:8px 12px;font-size:13px}
  .np-hint{margin:0 0 12px;font-size:12px;color:#9fadbc;min-height:1.4em}
  .share-list{
    display:flex;flex-direction:column;gap:2px;
    margin-bottom:14px;
    max-height:260px;overflow-y:auto;
  }
  .share-row{
    display:flex;align-items:center;gap:10px;
    padding:8px;border-radius:6px;
    cursor:pointer;user-select:none;
  }
  .share-row:hover{background:#1d2125}
  .share-row .cal-cb{
    width:16px;height:16px;
    border:2px solid #38414b;
    border-radius:4px;
    flex-shrink:0;
    background:#1d2125;
    position:relative;
    transition:background 0.12s,border-color 0.12s;
  }
  .share-row.checked .cal-cb{background:#579dff;border-color:#579dff}
  .share-row.checked .cal-cb::after{
    content:"";position:absolute;left:4px;top:1px;
    width:4px;height:8px;border:solid #1d2125;border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }
  .share-row-name{font-size:14px;color:#f4f5f7}
  /* condivisione in blocco: la persona vede solo alcuni dei progetti scelti */
  .share-row.mixed .cal-cb{background:#579dff;border-color:#579dff;position:relative}
  .share-row.mixed .cal-cb::after{
    content:"";position:absolute;left:3px;right:3px;top:50%;height:2px;margin-top:-1px;
    background:#1d2125;border-radius:1px;
  }
  .share-row-sub{font-size:12px;color:#9fadbc;margin-left:auto;white-space:nowrap}
  .sidebar-footer{
    padding:10px 14px;
    border-top:1px solid #2c3338;
    font-size:11px;
    color:#738496;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .logout-btn{
    background:transparent;border:0;color:#9fadbc;
    font-size:12px;
    display:inline-flex;align-items:center;gap:4px;
    padding:4px 8px;border-radius:4px;
    transition:background 0.12s,color 0.12s;
  }
  .logout-btn:hover{background:#2c3338;color:#f4f5f7}

  /* --- board ------------------------------------------------------------ */
  .board{
    grid-area:board;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    background:#1d2125;
    background-image:linear-gradient(180deg,rgba(87,157,255,0.05),transparent 280px);
  }
  .board-header{
    padding:14px 24px;
    display:flex;
    align-items:center;
    gap:12px;
    flex-shrink:0;
  }
  .board-title{
    font-size:18px;
    font-weight:700;
    color:#f4f5f7;
    background:transparent;
    border:1px solid transparent;
    border-radius:4px;
    padding:4px 8px;
    margin:0;
    outline:none;
    min-width:120px;
    max-width:600px;
  }
  .board-title:hover{background:rgba(255,255,255,0.04)}
  .board-title:focus{background:#22272b;border-color:#579dff}
  .board-meta{
    color:#8c9bab;
    font-size:12px;
  }
  .board-content{
    flex:1;
    overflow-x:auto;
    overflow-y:hidden;
    padding:0 24px 24px;
    display:flex;
    align-items:flex-start;
    gap:12px;
    scrollbar-width:thin;
    scrollbar-color:#38414b transparent;
  }
  .board-content::-webkit-scrollbar{height:12px}
  .board-content::-webkit-scrollbar-track{background:transparent}
  .board-content::-webkit-scrollbar-thumb{background:#38414b;border-radius:6px;border:3px solid #1d2125}

  /* --- columns ---------------------------------------------------------- */
  .column{
    background:#101204;
    border-radius:10px;
    width:280px;
    flex-shrink:0;
    max-height:100%;
    display:flex;
    flex-direction:column;
    box-shadow:0 1px 0 rgba(255,255,255,0.04);
  }
  .column.drag-over{
    background:#161a1d;
    outline:2px dashed #579dff;
    outline-offset:-2px;
  }
  .column-header{
    padding:10px 12px 6px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-shrink:0;
  }
  .column-title{
    font-size:13px;
    font-weight:700;
    color:#f4f5f7;
    display:flex;align-items:center;gap:8px;
  }
  .column-count{
    background:#22272b;
    color:#9fadbc;
    font-size:11px;
    font-weight:600;
    padding:1px 7px;
    border-radius:10px;
  }
  .cards{
    flex:1;
    overflow-y:auto;
    padding:0 8px;
    scrollbar-width:thin;
    scrollbar-color:#38414b transparent;
    min-height:8px;
  }
  .cards::-webkit-scrollbar{width:8px}
  .cards::-webkit-scrollbar-track{background:transparent}
  .cards::-webkit-scrollbar-thumb{background:#38414b;border-radius:4px}

  /* --- card ------------------------------------------------------------- */
  .card{
    background:#22272b;
    border-radius:8px;
    padding:8px 12px;
    margin-bottom:8px;
    cursor:grab;
    transition:background 0.12s,box-shadow 0.12s,transform 0.12s;
    border:1px solid transparent;
    box-shadow:0 1px 0 rgba(0,0,0,0.25);
    position:relative;
    user-select:none;
  }
  .card:hover{
    background:#2c3338;
    border-color:#38414b;
  }
  .card.dragging{
    opacity:0.4;
    cursor:grabbing;
    transform:rotate(1.5deg);
  }
  .card-priority{
    display:inline-block;
    height:6px;
    width:42px;
    border-radius:3px;
    margin-bottom:6px;
  }
  .card-priority.red   { background:#f87168 }
  .card-priority.yellow{ background:#f5cd47 }
  .card-priority.green { background:#4bce97 }
  .card-title{
    color:#f4f5f7;
    font-size:14px;
    line-height:1.35;
    word-wrap:break-word;
    white-space:pre-wrap;
  }
  .card-actions{
    position:absolute;
    top:6px;
    right:6px;
    opacity:0;
    transition:opacity 0.12s;
  }
  .card:hover .card-actions{opacity:1}
  .card-action{
    background:rgba(0,0,0,0.4);
    border:0;color:#9fadbc;
    width:22px;height:22px;border-radius:4px;
    display:inline-flex;align-items:center;justify-content:center;
    margin-left:2px;
    transition:background 0.12s,color 0.12s;
  }
  .card-action:hover{background:#412a2a;color:#f87168}

  /* --- add card --------------------------------------------------------- */
  .add-card{
    margin:4px 8px 8px;
    padding:8px 12px;
    color:#9fadbc;
    background:transparent;
    border:0;
    border-radius:6px;
    font-size:14px;
    text-align:left;
    display:flex;
    align-items:center;
    gap:6px;

  /* Modulo "Nuovo impegno" del calendario */
  .cm-modal{max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto}
  .cm-modal [hidden]{display:none !important}
  .cm-seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .cm-seg button{
    flex:1 1 auto;
    background:#1d2125;border:1px solid #38414b;color:#b6c2cf;

    font-size:13px;font-weight:600;
    transition:background 0.12s,border-color 0.12s,color 0.12s;

  .cm-seg button.on{background:#1c2b41;border-color:#579dff;color:#cce0ff}
  /* Progetto dell'impegno: tendina a colonne, come la vista a colonne del
     Finder. A sinistra le categorie, a destra i progetti di quella scelta */
  .cm-dd{position:relative}
  .cm-dd-btn{
    display:flex;align-items:center;gap:6px;text-align:left;cursor:pointer;
    padding-right:34px;position:relative;
  }
  .cm-dd-btn::after{
    content:"";position:absolute;right:13px;top:50%;
    width:7px;height:7px;margin-top:-6px;
    border-right:2px solid #9fadbc;border-bottom:2px solid #9fadbc;
    transform:rotate(45deg);transition:transform 0.12s;
  }
  .cm-dd-btn[aria-expanded="true"]{border-color:#579dff}
  .cm-dd-btn[aria-expanded="true"]::after{transform:rotate(-135deg);margin-top:-2px}
  .cm-dd-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cm-dd-label .cm-dd-path{color:#9fadbc}
  .cm-dd-label.empty{color:#8c9bab}
  .cm-dd-pop{
    position:absolute;left:0;right:0;top:calc(100% - 10px);z-index:5;
    display:flex;height:280px;max-height:50vh;
    background:#22272b;border:1px solid #38414b;border-radius:8px;
    box-shadow:0 12px 32px rgba(0,0,0,0.5);overflow:hidden;
  }
  .cm-dd-col{flex:1 1 50%;min-width:0;overflow-y:auto;padding:5px;display:flex;flex-direction:column;gap:1px}
  .cm-dd-col + .cm-dd-col{border-left:1px solid #38414b}
  .cm-dd-row{
    display:flex;align-items:center;gap:8px;width:100%;
    background:transparent;border:0;border-radius:5px;
    padding:7px 9px;color:#dee4ea;text-align:left;
    font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;outline:none;
  }
  .cm-dd-row span:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cm-dd-row:hover,.cm-dd-row:focus-visible{background:#2c3338}
  .cm-dd-row.open{background:#38414b}
  .cm-dd-row.open:focus,.cm-dd-row.open:hover{background:#0c66e4;color:#fff}
  .cm-dd-row.on{color:#85b8ff;font-weight:600}
  .cm-dd-row.on::after{content:"✓";font-size:13px}
  .cm-dd-n{font-size:11px;color:#8c9bab}
  .cm-dd-row.open:focus .cm-dd-n,.cm-dd-row.open:hover .cm-dd-n{color:#cce0ff}
  .cm-dd-go{
    width:6px;height:6px;border-right:1.5px solid currentColor;border-top:1.5px solid currentColor;
    transform:rotate(45deg);opacity:0.6;margin-right:2px;
  }
  .cm-dd-sep{height:1px;background:#38414b;margin:4px 6px;flex:none}
  .cm-dd-empty{color:#8c9bab;font-size:12px;padding:10px}
  .cm-dd-back{display:none;color:#85b8ff;font-weight:600}
  .cm-dd-back::before{content:"‹";font-size:16px;line-height:1}
  @media (max-width:560px){
    /* sul telefono una colonna alla volta: si entra nella categoria e si torna indietro */
    .cm-dd-pop[data-col="cats"] .cm-dd-col:last-child,
    .cm-dd-pop[data-col="projs"] .cm-dd-col:first-child{display:none}
    .cm-dd-pop{height:auto;max-height:340px}
    .cm-dd-col + .cm-dd-col{border-left:0}
    .cm-dd-back{display:flex}
    .cm-dd-row{padding:10px 10px;font-size:14px}
  }
  .cm-people{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .cm-person{
    --pc:#579dff;--pcbg:rgba(87,157,255,0.22);
    background:#1d2125;border:1px solid #38414b;color:#b6c2cf;
    border-radius:16px;padding:6px 12px 6px 10px;
    font-size:13px;font-weight:600;
    display:inline-flex;align-items:center;gap:7px;
    transition:background 0.12s,border-color 0.12s,color 0.12s;
  }
  .cm-person .dot{width:9px;height:9px;border-radius:50%;background:var(--pc)}
  .cm-person.on{background:var(--pcbg);border-color:var(--pc);color:#f4f5f7}
  .cm-person-add{border-style:dashed;color:#9fadbc;padding:6px 12px;font-size:14px}
  .cm-person-add:hover{border-color:#579dff;color:#cce0ff}
  .cm-add-person{display:flex;gap:6px;margin-bottom:10px}
  .cm-add-others{max-height:132px;overflow-y:auto}
  .cm-add-others .cm-person{opacity:0.75}
  .cm-add-others .cm-person:hover{opacity:1}
  .modal .cm-add-person input{flex:1;min-width:0;margin:0}
  .cm-add-person button{flex-shrink:0;padding:8px 12px}
  .cm-row{display:flex;gap:10px;flex-wrap:wrap}
  .cm-row > div{flex:1 1 160px;min-width:0}
  .modal .cm-row input[type=date]{width:100%;min-width:0}
  .cm-time{display:flex;align-items:center;gap:4px;margin-bottom:14px;color:#9fadbc;font-weight:700}
  .cm-time .col-select{margin:0;flex:1;min-width:0;padding:9px 8px}
  .cm-time .col-select:disabled{opacity:0.45}
  .modal label.cm-check{
    display:flex;align-items:center;gap:8px;
    text-transform:none;letter-spacing:0;
    font-size:13px;font-weight:600;color:#b6c2cf;
    cursor:pointer;margin-bottom:10px;
  }
  .cm-check input{width:16px;height:16px;accent-color:#579dff;margin:0}
  .cm-days{display:flex;gap:4px;margin-bottom:12px}
  .cm-days button{
    flex:1;max-width:44px;height:34px;
    background:#1d2125;border:1px solid #38414b;color:#b6c2cf;
    border-radius:6px;font-weight:700;font-size:13px;
  }
  .cm-days button.on{background:#1c2b41;border-color:#579dff;color:#cce0ff}
  .cm-series-note{font-size:12.5px;color:#9fadbc;margin:0 0 14px;line-height:1.45}
  /* Luogo: suggerimenti sotto la casella e link a Google Maps */
  .cm-place{position:relative}
  .modal .cm-place input{margin-bottom:6px}
  .cm-place-list{
    position:absolute;left:0;right:0;top:calc(100% - 4px);z-index:5;
    list-style:none;margin:0;padding:4px;
    background:#282e33;border:1px solid #38414b;border-radius:8px;
    box-shadow:0 10px 24px rgba(0,0,0,0.5);
    max-height:240px;overflow-y:auto;
  }
  .cm-place-list li{
    display:flex;align-items:flex-start;gap:8px;
    padding:8px 10px;border-radius:5px;
    color:#dee4ea;font-size:13px;line-height:1.35;cursor:pointer;
  }
  .cm-place-list li svg{flex-shrink:0;margin-top:3px;color:#9fadbc}
  .cm-place-list li:hover,.cm-place-list li.on{background:#1c2b41;color:#fff}
  .cm-place-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 14px;min-height:18px}
  .cm-place-credit{margin-left:auto;font-size:10.5px;color:#738496}
  .cal-place{
    display:inline-flex;align-items:center;gap:4px;
    color:#85b8ff;font-size:12.5px;font-weight:600;text-decoration:none;
  }
  .cal-place[hidden]{display:none}
  .cal-place:hover{text-decoration:underline;color:#cce0ff}
  .cm-error{color:#f87168;font-size:13px;font-weight:600;min-height:18px;margin:0 0 6px}
  .modal .cm-invalid{border-color:#f87168 !important}
  .cm-ask-text{color:#b6c2cf;font-size:14px;line-height:1.5;margin:0 0 12px;white-space:pre-line}
  .cm-ask-actions{flex-wrap:wrap}

  /* Pannello Apple Calendar */
  .ap-box{background:#1d2125;border:1px solid #38414b;border-radius:8px;padding:14px;margin-bottom:14px}
  .ap-box h3{margin:0 0 6px;color:#f4f5f7;font-size:14px}
  .ap-text{color:#9fadbc;font-size:13px;line-height:1.5;margin:0 0 10px}
  .ap-text b{color:#cce0ff}
  .ap-small{font-size:12px;margin:8px 0 0}
  .ap-steps{color:#9fadbc;font-size:12.5px;line-height:1.5;margin:0 0 12px;padding-left:18px}
  .ap-steps b{color:#cce0ff}
  .ap-link{display:flex;gap:6px;align-items:flex-start}
  .modal .ap-link input[type=text]{margin-bottom:8px;font-size:12px}
  .modal .ap-box input[type=text]#ap-url{margin-bottom:10px}
  .ap-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .ap-open{text-decoration:none;display:inline-block}
  .ap-status{color:#9fadbc;font-size:12px;margin:10px 0 0}

  /* Pannello "Sposta progetto": l'alternativa al trascinamento. */
  .move-label{
    margin:0 0 8px;
    font-size:11px;text-transform:uppercase;letter-spacing:0.5px;
    color:#9fadbc;font-weight:700;
  }
  .move-group{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .move-opt{
    flex:1 1 auto;min-height:44px;
    background:#1d2125;border:1px solid #38414b;color:#f4f5f7;
    border-radius:8px;padding:11px 14px;
    font-family:inherit;font-size:14px;font-weight:600;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    transition:background 0.12s,border-color 0.12s;
  }
  .move-opt:hover:not(:disabled){background:#2c3338;border-color:#579dff}
  .move-opt:disabled{opacity:0.55;cursor:default}
  .move-opt.current{background:#1c2b41;border-color:#1c2b41;color:#cce0ff}
  .move-hint{font-weight:600;text-transform:none;letter-spacing:0;color:#738496}
  .move-now{font-size:11px;font-weight:600;opacity:0.7;text-transform:uppercase;letter-spacing:0.4px}
  .project-move{
    opacity:0;
    background:transparent;border:0;color:#9fadbc;
    width:22px;height:22px;border-radius:4px;
    display:inline-flex;align-items:center;justify-content:center;
    transition:opacity 0.12s,background 0.12s,color 0.12s;
  }
  .project-item:hover .project-move{opacity:1}
  .project-move:hover{background:#2c3338;color:#f4f5f7}
  .modal .actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:8px;
  }

  /* --- topbar button (calendar) ----------------------------------------- */
  .topbar-btn{
    background:transparent;border:1px solid #38414b;color:#b6c2cf;
    padding:6px 12px;border-radius:6px;
    display:inline-flex;align-items:center;gap:6px;
    font-size:13px;font-weight:600;
    transition:background 0.12s,color 0.12s,border-color 0.12s;
  }
  .topbar-btn:hover{background:#2c3338;color:#f4f5f7;border-color:#579dff}
  .topbar-btn svg{flex-shrink:0}

  /* --- calendar overlay ------------------------------------------------- */
  .cal-overlay{
    position:fixed;inset:0;
    /* copre tutto lo schermo: lo spazio della barra di stato (e della tacca
       in orizzontale) va lasciato qui, come fa il body per il resto dell'app */
    padding-top:env(safe-area-inset-top,0px);
    padding-left:env(safe-area-inset-left,0px);
    padding-right:env(safe-area-inset-right,0px);
    background:#1d2125;
    z-index:50;
    display:flex;flex-direction:column;
    visibility:hidden;
    opacity:0;
    transition:opacity 0.18s;
  }
  .cal-overlay.show{visibility:visible;opacity:1}

  .cal-header{
    padding:12px 20px;
    border-bottom:1px solid #2c3338;
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
  }
  .cal-title{
    font-size:18px;font-weight:700;color:#f4f5f7;
    display:flex;align-items:center;gap:10px;
    margin:0;
  }
  .cal-title svg{color:#579dff}
  .cal-spacer{flex:1}
  .cal-nav{
    display:flex;align-items:center;gap:2px;
  }
  .cal-nav-btn{
    background:#22272b;border:1px solid #38414b;color:#b6c2cf;
    width:30px;height:30px;
    border-radius:6px;
    display:inline-flex;align-items:center;justify-content:center;
    transition:background 0.12s,color 0.12s;
  }
  .cal-nav-btn:hover{background:#2c3338;color:#f4f5f7}
  .cal-today-btn{
    background:#22272b;border:1px solid #38414b;color:#b6c2cf;
    padding:6px 12px;border-radius:6px;
    font-size:12px;font-weight:600;
    transition:background 0.12s,color 0.12s;
  }
  .cal-today-btn:hover{background:#2c3338;color:#f4f5f7}
  .cal-period{
    color:#f4f5f7;font-weight:700;font-size:15px;
    min-width:200px;text-align:center;
    text-transform:capitalize;
  }
  .cal-views{
    display:inline-flex;background:#22272b;border:1px solid #38414b;border-radius:6px;padding:2px;
  }
  .cal-views button{
    background:transparent;border:0;color:#9fadbc;
    padding:6px 14px;border-radius:4px;
    font-size:12px;font-weight:600;
    transition:background 0.12s,color 0.12s;
  }
  .cal-views button.active{background:#1c2b41;color:#cce0ff}
  .cal-views button:hover:not(.active){background:#2c3338;color:#f4f5f7}
  .cal-add-btn{
    background:#579dff;color:#1d2125;
    border:0;padding:7px 14px;border-radius:6px;
    font-weight:700;font-size:13px;
    display:inline-flex;align-items:center;gap:6px;
    transition:background 0.12s;
  }
  .cal-add-btn:hover{background:#85b8ff}
  .cal-close{
    background:transparent;border:0;color:#9fadbc;
    width:32px;height:32px;border-radius:6px;
    display:inline-flex;align-items:center;justify-content:center;
    transition:background 0.12s,color 0.12s;
  }
  .cal-close:hover{background:#412a2a;color:#f87168}
  /* Al posto della X: chiude il calendario e porta alla Panoramica */
  .cal-home-btn{
    background:#22272b;border:1px solid #38414b;color:#cce0ff;
    padding:6px 12px;border-radius:6px;
    font-size:12px;font-weight:700;
    display:inline-flex;align-items:center;gap:6px;flex-shrink:0;
    transition:background 0.12s,color 0.12s;
  }
  .cal-home-btn:hover{background:#2c3338;color:#f4f5f7}

  .cal-main{flex:1;display:flex;overflow:hidden}

  /* Selezione di piu' impegni: il bottone acceso, la barra in basso e
     l'impegno scelto, bordato di bianco con la spunta */
  .cal-select-btn[aria-pressed="true"]{background:#1c2b41;border-color:#579dff;color:#cce0ff}
  .cal-selbar{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:10px 20px calc(10px + env(safe-area-inset-bottom, 0px));
    border-top:1px solid #2c3338;background:#161a1d;
  }
  .cal-selbar[hidden]{display:none}
  .cal-selbar-count{color:#f4f5f7;font-weight:700;font-size:13px}
  .cal-selbar .cal-today-btn:disabled{opacity:0.45;cursor:default}
  .cal-selbar .cal-sel-del:not(:disabled){color:#f87168}
  /* su telefono l'intestazione riordina e stringe questi bottoni: qui no */
  .cal-selbar .cal-today-btn,.cal-selbar .cal-add-btn{order:0}
  .cal-selbar .cal-add-btn{width:auto;height:auto;padding:7px 14px}
  .cal-overlay.selecting .cal-chip,
  .cal-overlay.selecting .cal-mslot.full,
  .cal-overlay.selecting .cal-day-event-card{-webkit-user-select:none;user-select:none}
  .cal-chip.cal-sel,.cal-mslot.cal-sel,.cal-day-event-card.cal-sel{
    outline:2px solid #fff !important;outline-offset:1px !important;
    box-shadow:0 0 0 4px rgba(87,157,255,0.6);
  }
  .cal-chip.cal-sel,.cal-day-event-card.cal-sel{position:relative}
  .cal-chip.cal-sel::after,.cal-day-event-card.cal-sel::after{
    content:"✓";position:absolute;top:-7px;right:-7px;
    width:16px;height:16px;border-radius:50%;
    background:#579dff;color:#1d2125;font-size:11px;font-weight:800;font-style:normal;
    display:flex;align-items:center;justify-content:center;
  }
  .cm-person.add{background:var(--pcbg);border-color:var(--pc);color:#f4f5f7}
  .cm-person.del{border-color:#f87168;color:#f87168;text-decoration:line-through}
  .cm-bulk-note{font-size:12.5px;color:#9fadbc;margin:-6px 0 14px;line-height:1.45}
  .cm-shift{display:flex;align-items:center;gap:8px;margin-bottom:14px;color:#b6c2cf;font-size:13px}
  .modal .cm-shift input{width:80px;margin:0}
  .cal-side{
    width:220px;flex-shrink:0;
    background:#1d2125;
    border-right:1px solid #2c3338;
    padding:12px 10px;
    overflow-y:auto;
    display:flex;flex-direction:column;
    gap:2px;
  }
  .cal-side h3{
    margin:0 0 8px;padding:0 8px;
    font-size:11px;font-weight:700;color:#9fadbc;
    text-transform:uppercase;letter-spacing:0.6px;
  }
  .cal-person-row{
    display:flex;align-items:center;gap:10px;
    padding:7px 8px;
    border-radius:6px;
    cursor:pointer;
    user-select:none;
    font-size:13px;
    color:#b6c2cf;
    transition:background 0.12s;
    --pc:#579dff;
  }
  .cal-person-row:hover{background:#2c3338}
  .cal-person-row.group{font-weight:600;color:#cce0ff}
  .cal-person-row.mixed .cal-cb{background:var(--pc);border-color:var(--pc)}
  .cal-person-row.mixed .cal-cb::after{
    content:"";position:absolute;left:2px;right:2px;top:50%;height:2px;margin-top:-1px;
    background:#1d2125;border-radius:1px;
  }
  .cal-person-row.all{
    font-weight:700;color:#cce0ff;
    margin-bottom:4px;
  }
  .cal-cb{
    width:16px;height:16px;
    border:2px solid #38414b;
    border-radius:4px;
    flex-shrink:0;
    background:#1d2125;
    position:relative;
    transition:background 0.12s,border-color 0.12s;
  }
  .cal-person-row.checked .cal-cb{
    background:var(--pc);
    border-color:var(--pc);
  }
  .cal-person-row.checked .cal-cb::after{
    content:"";
    position:absolute;
    left:4px;top:1px;
    width:4px;height:8px;
    border:solid #1d2125;
    border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }
  .cal-person-name{
    flex:1;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .cal-person-count{
    background:#22272b;
    color:#9fadbc;
    font-size:10px;font-weight:700;
    padding:1px 7px;border-radius:10px;
    flex-shrink:0;
  }
  .cal-side-divider{
    height:1px;background:#2c3338;
    margin:6px 4px;
  }
  .cal-side-actions{
    display:flex;gap:6px;margin:6px 0 4px;
  }
  .cal-side-actions button{
    flex:1;
    background:#22272b;border:1px solid #38414b;color:#9fadbc;
    padding:5px 8px;border-radius:4px;
    font-size:11px;font-weight:600;
    transition:background 0.12s,color 0.12s;
  }
  .cal-side-actions button:hover{background:#2c3338;color:#f4f5f7}
  .cal-side h3.cal-side-sub{margin:12px 0 6px}
  .cal-person-row.inactive .cal-person-name{color:#738496;font-style:italic}
  .cal-person-del{
    background:none;border:0;color:#738496;
    width:20px;height:20px;border-radius:4px;flex-shrink:0;
    font-size:15px;line-height:1;padding:0;
    opacity:0;transition:opacity 0.12s,background 0.12s,color 0.12s;
  }
  .cal-person-row:hover .cal-person-del,.cal-person-del:focus-visible{opacity:1}
  .cal-person-del:hover{background:#3d2a2a;color:#f87168}
  .cal-person-edit{display:inline-flex;align-items:center;justify-content:center}
  .cal-person-row[draggable="true"]{cursor:grab}
  .cal-person-row.dragging{opacity:0.4}
  .cal-person-row.drop-before{box-shadow:inset 0 2px 0 #579dff}
  .cal-person-row.drop-after{box-shadow:inset 0 -2px 0 #579dff}
  .cal-filter-hint{margin:-4px 8px 8px;font-size:11px;line-height:1.4;color:#738496}
  .cal-ps-order{display:flex;gap:8px;margin-bottom:14px}
  .cal-ps-order button{flex:1;border:1px solid #38414b;border-radius:6px}
  .cal-ps-order button:disabled{opacity:0.4;cursor:default}
  .cal-ps-months button.on{background:#1f3d2f;border-color:#4bce97;color:#bdf0d6}
  .cal-person-sheet .actions .cal-ps-del{margin-right:auto;color:#f87168}
  .cal-mp-list{display:flex;flex-direction:column;gap:2px;max-height:34vh;overflow-y:auto;margin-bottom:6px}
  .cal-mp-sub{margin:14px 0 6px;font-size:11px;font-weight:700;color:#9fadbc;text-transform:uppercase;letter-spacing:0.6px}
  .cal-person-row.busy .cal-cb{opacity:0.7}
  .cal-extra-toggle{
    display:flex;align-items:center;gap:6px;width:100%;
    background:none;border:0;padding:6px 8px;margin:12px 0 4px;border-radius:6px;
    font-size:11px;font-weight:700;color:#9fadbc;text-transform:uppercase;letter-spacing:0.6px;
    text-align:left;cursor:pointer;
  }
  .cal-extra-toggle:hover{background:#22272b;color:#cce0ff}
  .cal-extra-toggle > span:nth-child(2){flex:1}
  .cal-extra-caret{display:inline-flex;transform:rotate(-90deg);transition:transform 0.12s}
  .cal-extra-toggle.open .cal-extra-caret{transform:none}
  .cal-mp #mp-prev[hidden]{display:none}
  .cal-aband-people{
    margin-left:12px;vertical-align:1px;
    background:#22272b;border:1px solid #38414b;border-radius:10px;
    color:#9fadbc;font-size:10px;font-weight:700;letter-spacing:0.4px;text-transform:uppercase;
    padding:2px 9px;cursor:pointer;
    transition:background 0.12s,border-color 0.12s,color 0.12s;
  }
  .cal-aband-people:hover{border-color:#579dff;color:#cce0ff}
  .cal-add-person{
    display:flex;align-items:center;gap:10px;
    background:none;border:1px dashed #38414b;border-radius:6px;
    color:#9fadbc;font-size:13px;font-weight:600;
    padding:6px 8px;margin-top:4px;text-align:left;
    transition:background 0.12s,border-color 0.12s,color 0.12s;
  }
  .cal-add-person:hover{background:#22272b;border-color:#579dff;color:#cce0ff}
  .cal-add-plus{width:16px;text-align:center;font-size:16px;line-height:1}

  .cal-body{flex:1;overflow:hidden;display:flex;flex-direction:column;background:#101204}

  /* Month view */
  .cal-month{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .cal-month-headrow{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    background:#1d2125;
    border-bottom:1px solid #2c3338;
  }
  .cal-month-headrow > div{
    padding:8px 12px;
    font-size:11px;text-transform:uppercase;letter-spacing:0.5px;
    font-weight:700;color:#9fadbc;
    border-right:1px solid #2c3338;
  }
  .cal-month-headrow > div:last-child{border-right:0}
  .cal-month-grid{
    flex:1;min-height:0;
    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr));
    overflow:hidden;
  }
  .cal-day-cell{
    background:#1d2125;
    border-right:1px solid #2c3338;
    border-bottom:1px solid #2c3338;
    padding:6px 6px 4px;
    display:flex;flex-direction:column;
    cursor:pointer;
    transition:background 0.12s;
    overflow:hidden;
  }
  .cal-day-cell:hover{background:#22272b}
  .cal-day-cell.other-month{background:#161a1d}
  .cal-day-cell.other-month .cal-day-num{color:#5c6c7e}
  .cal-day-cell.today{background:#1c2b41}
  .cal-day-cell.today .cal-day-num{
    background:#579dff;color:#1d2125;
    border-radius:50%;width:24px;height:24px;
    display:inline-flex;align-items:center;justify-content:center;
    font-weight:700;
  }
  .cal-day-num{
    font-size:12px;font-weight:600;color:#b6c2cf;
    align-self:flex-start;
    padding:0 4px;
    margin-bottom:4px;
  }
  /* Una riga per persona (ordine fisso), due caselle: mattina | pomeriggio */
  .cal-month-halves{display:flex;gap:4px;margin-top:2px;font-size:9px;font-weight:600;color:#738496;letter-spacing:0.3px;text-transform:none}
  .cal-month-halves span{flex:1}
  .cal-day-top{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:3px;min-height:0}
  .cal-day-top .cal-day-num{margin-bottom:0}
  .cal-day-more{
    display:inline-flex;align-items:center;gap:3px;flex-shrink:0;
    font-size:10px;font-weight:700;color:#cce0ff;
    background:#2c3338;border-radius:8px;padding:1px 6px 1px 5px;
  }
  /* le sei righe dei soci si dividono l'altezza della casella */
  .cal-mgrid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(6,minmax(0,1fr));gap:2px}
  .cal-mslot{
    --pc:#579dff;--pcbg:rgba(87,157,255,0.22);
    min-height:0;border-radius:2px;
    background:#191d21;
    border-left:2px solid transparent;
    color:#f4f5f7;font-size:9.5px;line-height:14px;
    padding:0 3px;
    overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  }
  .cal-day-cell.other-month .cal-mslot{opacity:0.55}
  .cal-mslot.full{background:var(--pcbg);border-left-color:var(--pc);cursor:pointer}
  .cal-mslot.full:hover{filter:brightness(1.25)}
  .cal-mslot.k-extra{background:repeating-linear-gradient(135deg,#323a41 0 4px,#22272b 4px 8px);color:#b6c2cf}
  .cal-mslot.k-ferie{background:repeating-linear-gradient(45deg,var(--pcbg) 0 4px,transparent 4px 8px);font-weight:700}
  .cal-mslot.tentative{outline:1px dashed var(--pc);outline-offset:-1px;font-style:italic}
  .cal-mslot.full.tentative{background:#ff1f3d;color:#fff;font-weight:700}

  /* Week view: la griglia del vecchio foglio "chi fa cosa". Una riga per
     persona, sempre nello stesso ordine, divisa in mattina e pomeriggio:
     le righe restano allineate su tutta la settimana. */
  .cal-week{flex:1;overflow:auto;background:#1d2125}
  /* Settimana e Giorno: persona | mattina/pomeriggio | giorni */
  .cal-pgrid{
    --plabel:120px;--phalf:44px;
    display:grid;
    grid-template-columns:var(--plabel) var(--phalf) repeat(var(--pdays),minmax(118px,1fr));
    min-width:calc(var(--plabel) + var(--phalf) + var(--pdays) * 118px);
  }
  .cal-pgrid > div{min-width:0}
  .cal-pcorner{
    grid-column:span 2;position:sticky;top:0;left:0;z-index:4;background:#1d2125;
    border-right:1px solid #2c3338;border-bottom:1px solid #38414b;
    font-size:10px;font-weight:700;color:#9fadbc;text-transform:uppercase;letter-spacing:0.5px;
    display:flex;align-items:flex-end;padding:8px 10px;
  }
  .cal-pgrid .cal-week-head{border-right:1px solid #2c3338;border-bottom:1px solid #38414b}
  .cal-pnone{grid-column:1 / -1;padding:16px;color:#738496;font-size:13px}
  .cal-plabel{
    grid-row:span 2;
    position:sticky;left:0;z-index:2;background:#1d2125;
    display:flex;align-items:center;gap:7px;padding:6px 10px;
    font-size:12px;font-weight:600;color:#f4f5f7;
    border-right:1px solid #2c3338;border-bottom:1px solid #38414b;
  }
  .cal-phalf{
    position:sticky;left:var(--plabel);z-index:2;background:#1d2125;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:700;color:#738496;text-transform:uppercase;letter-spacing:0.4px;
    border-right:1px solid #2c3338;border-bottom:1px dashed #2c3338;
  }
  .cal-phalf.pm{border-bottom:1px solid #38414b}
  .cal-pcell{
    padding:3px;min-height:32px;
    display:flex;flex-direction:column;gap:3px;
    border-right:1px solid #2c3338;border-bottom:1px dashed #2c3338;
    cursor:pointer;transition:background 0.12s;
  }
  .cal-pcell.pm{border-bottom:1px solid #38414b}
  .cal-pcell:hover{background:#22272b}
  .cal-pcell.today{background:rgba(28,43,65,0.45)}
  /* Giorno: persona | mattina | pomeriggio */
  .cal-dgrid{
    --plabel:140px;
    display:grid;grid-template-columns:var(--plabel) repeat(2,minmax(0,1fr));
  }
  .cal-dgrid > div{min-width:0}
  .cal-dgrid .cal-pcorner{grid-column:auto}
  .cal-day-view{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .cal-day-view-head{
    padding:18px 24px;
    border-bottom:1px solid #2c3338;
    background:#1d2125;
    text-align:center;
  }
  .cal-day-view-head h3{
    margin:0;color:#f4f5f7;
    font-size:24px;font-weight:700;
    text-transform:capitalize;
  }
  .cal-day-view-head.today h3 span.daynum{color:#579dff}
  .cal-amonth{padding-top:12px;padding-bottom:12px}
  .cal-amonth h3{display:flex;align-items:center;justify-content:center;gap:8px}
  .cal-amonth .cal-aband-people{margin-left:6px}
  .cal-dgrid .cal-week-head{cursor:default;text-align:center;border-right:1px solid #2c3338;border-bottom:1px solid #38414b}
  .cal-dgrid .cal-week-head .cal-week-day-num{font-size:14px}
  .cal-dgrid .cal-plabel{grid-row:auto}
  .cal-dgrid .cal-pcell{padding:6px 8px;gap:6px;min-height:52px;border-bottom:1px solid #38414b}
  .cal-dgrid .cal-day-event-time.notime{display:none}
  .cal-pfree{color:#5c6c7e;font-size:12px;opacity:0;transition:opacity 0.12s;align-self:flex-start;padding:6px 4px}
  .cal-pcell:hover .cal-pfree{opacity:1;color:#cce0ff}
  .cal-week-head{
    position:sticky;top:0;z-index:3;
    background:#1d2125;
    padding:8px 10px;
    cursor:pointer;
    transition:background 0.12s;
  }
  .cal-week-head:hover{background:#22272b}
  .cal-week-head.today{background:#1c2b41}
  .cal-week-head.today .cal-week-day-num{color:#579dff}
  .cal-week-day-name{font-size:11px;color:#9fadbc;text-transform:uppercase;letter-spacing:0.5px;font-weight:700}
  .cal-week-day-num{font-size:18px;font-weight:700;color:#f4f5f7;margin-top:1px}
  .cal-wlabel{
    position:sticky;left:0;z-index:2;
    background:#1d2125;
    padding:6px 8px;
    display:flex;align-items:center;gap:7px;
    font-size:12px;font-weight:600;color:#b6c2cf;
  }
  .cal-wlabel-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cal-chip{
    --pc:#579dff;--pcbg:rgba(87,157,255,0.22);
    background:var(--pcbg);
    border-left:3px solid var(--pc);
    border-radius:3px;
    padding:3px 6px;
    color:#f4f5f7;font-size:11.5px;line-height:1.3;
    word-wrap:break-word;overflow-wrap:anywhere;
    cursor:pointer;
  }
  .cal-chip:hover{filter:brightness(1.2)}
  .cal-chip-time{display:block;font-size:10px;font-weight:700;color:#9fadbc;letter-spacing:0.2px}
  .cal-chip-proj{display:block;font-size:10px;color:#9fadbc;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cal-chip-place svg{width:9px;height:9px;vertical-align:-1px;margin-right:3px}
  .cal-chip.k-extra,.cal-day-event-card.k-extra{background:repeating-linear-gradient(135deg,#323a41 0 6px,#22272b 6px 12px);color:#b6c2cf}
  .cal-chip.k-ferie,.cal-day-event-card.k-ferie{background:repeating-linear-gradient(45deg,var(--pcbg) 0 6px,transparent 6px 12px);font-weight:700}
  .cal-chip.tentative{outline:1px dashed var(--pc);outline-offset:-1px;font-style:italic}
  /* Da confermare: il titolo bianco su rosso acceso, perche' salti all'occhio */
  .cal-chip-title{overflow-wrap:anywhere}
  .tentative .cal-chip-title,.cal-day-event-card.tentative .cal-day-event-title{
    background:#ff1f3d;color:#fff;font-weight:700;font-style:normal;
    padding:0 4px;border-radius:3px;
    -webkit-box-decoration-break:clone;box-decoration-break:clone;
  }
  .cal-day-event-card.tentative .cal-day-event-title{display:inline-block}
  .cal-tag{
    display:inline-block;
    font-size:9px;font-weight:800;letter-spacing:0.4px;text-transform:uppercase;
    padding:1px 5px;border-radius:3px;
    background:#38414b;color:#cce0ff;
    margin-right:4px;vertical-align:1px;font-style:normal;
  }
  .cal-tag.warn{background:#5c4a14;color:#f5cd47}
  .cal-person-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}

  /* Agenda: giorni in verticale (due righe: mattina e pomeriggio),
     persone in orizzontale, scorrimento senza fine. */
  .cal-agenda{
    --alabel:64px;--ahalf:44px;--acol:118px;
    flex:1;overflow:auto;
    position:relative;          /* offsetTop dei giorni misurato da qui */
    overflow-anchor:none;       /* la posizione la tiene lo script quando aggiunge giorni sopra */
    background:#1d2125;
    overscroll-behavior:contain;
  }
  .cal-ahead,.cal-aday,.cal-aband,.cal-search-info{min-width:calc(var(--alabel) + var(--ahalf) + var(--acols, 6) * var(--acol))}
  .cal-ahead{
    display:grid;
    position:sticky;top:0;z-index:6;
    background:#1d2125;
    border-bottom:1px solid #38414b;
    box-shadow:0 4px 10px rgba(0,0,0,0.25);
  }
  .cal-ahead > div{
    padding:9px 8px;
    border-right:1px solid #2c3338;
    font-size:12px;font-weight:700;color:#f4f5f7;
    display:flex;align-items:center;gap:7px;
    min-width:0;overflow:hidden;white-space:nowrap;
  }
  .cal-ahead-person span:last-child{overflow:hidden;text-overflow:ellipsis}
  .cal-ahead-corner,.cal-ahead-half{position:sticky;z-index:2;background:#1d2125}
  .cal-ahead-corner{left:0;color:#9fadbc !important;font-size:10px !important;text-transform:uppercase;letter-spacing:0.5px}
  .cal-ahead-half{left:var(--alabel)}
  .cal-aband{
    background:#161a1d;
    border-bottom:1px solid #2c3338;
    padding:7px 0;
    font-size:11px;font-weight:700;color:#cce0ff;
    text-transform:uppercase;letter-spacing:0.7px;
  }
  .cal-aband span{position:sticky;left:12px;padding:0 12px}
  .cal-aday{
    display:grid;
    grid-template-rows:auto auto;
    border-bottom:1px solid #38414b;
  }
  .cal-aday.past{opacity:0.4}
  .cal-alabel{
    grid-row:1 / span 2;
    position:sticky;left:0;z-index:2;
    background:#1d2125;
    border-right:1px solid #2c3338;
    padding:8px 6px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    cursor:pointer;
    transition:background 0.12s;
  }
  .cal-alabel:hover{background:#22272b}
  .cal-alabel-dow{font-size:10px;font-weight:700;color:#9fadbc;text-transform:uppercase;letter-spacing:0.5px}
  .cal-alabel-num{font-size:20px;font-weight:700;color:#f4f5f7;line-height:1.1}
  .cal-alabel-mon{font-size:10px;color:#738496;text-transform:uppercase;letter-spacing:0.4px}
  .cal-aday.weekend .cal-alabel{background:#1a1e22}
  .cal-aday.weekend .cal-alabel-num{color:#b6c2cf}
  .cal-aday.today .cal-alabel{background:#1c2b41}
  .cal-aday.today .cal-alabel-num,.cal-aday.today .cal-alabel-dow{color:#579dff}
  .cal-ahalf{
    position:sticky;left:var(--alabel);z-index:2;
    background:#1d2125;
    border-right:1px solid #2c3338;
    border-bottom:1px dashed #2c3338;
    padding:6px 4px;
    font-size:10px;font-weight:700;color:#738496;
    text-transform:uppercase;letter-spacing:0.4px;
    display:flex;align-items:center;justify-content:center;
  }
  .cal-ahalf.pm,.cal-acell.pm{border-bottom:0}
  .cal-acell{
    border-right:1px solid #2c3338;
    border-bottom:1px dashed #2c3338;
    padding:3px;min-height:30px;min-width:0;
    display:flex;flex-direction:column;gap:3px;
    cursor:pointer;
    transition:background 0.12s;
  }
  .cal-acell:hover{background:#22272b}
  .cal-aday.today .cal-acell{background:rgba(28,43,65,0.35)}
  .cal-search-info{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:8px 14px;
    background:#1c2b41;color:#cce0ff;font-size:13px;
    border-bottom:1px solid #2c3338;
  }
  .cal-search-info .btn-cancel{color:#85b8ff}

  /* Stella "vista predefinita" accanto ai pulsanti delle viste */
  .cal-default-btn{display:inline-flex;align-items:center;gap:6px}
  .cal-default-btn.on{color:#f5cd47;border-color:#5c4a14;background:#2a2414;cursor:default}
  .cal-default-btn.on svg{fill:currentColor}

  /* Barra di ricerca nell'intestazione */
  .cal-search{
    position:relative;
    display:flex;align-items:center;
    flex:0 1 340px;min-width:180px;
    color:#738496;
  }
  .cal-search > svg{position:absolute;left:10px;pointer-events:none}
  .cal-search input{
    width:100%;
    background:#22272b;border:1px solid #38414b;color:#f4f5f7;
    border-radius:6px;
    padding:7px 30px 7px 31px;
    font-family:inherit;font-size:13px;
    outline:none;
    -webkit-appearance:none;appearance:none;
  }
  .cal-search input::-webkit-search-cancel-button{display:none}
  .cal-search input:focus{border-color:#579dff;background:#1d2125}
  .cal-search-clear{
    position:absolute;right:4px;
    width:24px;height:24px;border:0;border-radius:4px;
    background:transparent;color:#9fadbc;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .cal-search-clear:hover{background:#2c3338;color:#f4f5f7}
  .cal-search-clear[hidden]{display:none}

  .cal-banner{
    background:#3a2f12;color:#f5cd47;
    border-bottom:1px solid #5c4a14;
    padding:8px 16px;font-size:13px;line-height:1.4;
    flex-shrink:0;
  }
  .cal-legend{margin-top:14px;padding-top:10px;border-top:1px solid #2c3338;display:flex;flex-direction:column;gap:6px}
  .cal-legend h3{margin-bottom:2px}
  .cal-legend > div{display:flex;align-items:center;gap:8px;padding:0 8px;font-size:12px;color:#9fadbc}
  .cal-legend-sw{
    --pc:#579dff;--pcbg:rgba(87,157,255,0.3);
    width:22px;height:12px;border-radius:2px;flex-shrink:0;
    background:var(--pcbg);border-left:3px solid var(--pc);
  }
  .cal-legend-sw.k-extra{background:repeating-linear-gradient(135deg,#4a545e 0 3px,#22272b 3px 6px)}
  .cal-legend-sw.k-ferie{background:repeating-linear-gradient(45deg,var(--pcbg) 0 3px,transparent 3px 6px)}
  .cal-legend-sw.tentative{outline:1px dashed var(--pc);outline-offset:-1px;background:#ff1f3d}

  /* Day view */
  .cal-dnone{color:#738496;font-size:13px}
  .cal-day-event-card{
    --pc:#579dff;--pcbg:rgba(87,157,255,0.22);
    background:#1d2125;
    border:1px solid #2c3338;
    border-left:4px solid var(--pc);
    padding:12px 16px;
    border-radius:6px;
    cursor:pointer;
    display:flex;align-items:flex-start;gap:14px;
    transition:background 0.12s,border-color 0.12s;
  }
  .cal-day-event-card:hover{background:#22272b;border-color:#38414b}
  .cal-day-event-card.tentative{border-style:dashed;border-left-style:solid}
  .cal-day-event-time{
    color:#cce0ff;font-weight:700;font-size:13px;
    min-width:90px;flex-shrink:0;
    padding-top:1px;
  }
  .cal-day-event-time.notime{color:#738496;font-style:italic;font-weight:600}
  .cal-day-event-body{flex:1;min-width:0}
  .cal-day-event-title{color:#f4f5f7;font-size:15px;font-weight:600;margin-bottom:4px;word-wrap:break-word}
  .cal-day-event-meta{color:#9fadbc;font-size:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .cal-day-event-notes{color:#9fadbc;font-size:12px;margin-top:6px;line-height:1.4;white-space:pre-wrap}

  .cal-empty{
    text-align:center;color:#738496;padding:80px 24px;font-size:14px;
  }
  .cal-empty h3{margin:0 0 8px;color:#b6c2cf;font-size:16px;font-weight:600}
  .cal-empty p{margin:0 0 18px}

  /* --- mobile drawer toggles (hidden on desktop) ----------------------- */
  .sidebar-toggle,
  .cal-side-toggle{display:none}
  .sidebar-backdrop{
    display:none;position:fixed;inset:0;
    background:rgba(0,0,0,0.5);
    z-index:55;opacity:0;pointer-events:none;
    transition:opacity 0.18s;
  }
  .cal-side-backdrop{
    display:none;position:absolute;inset:0;
    background:rgba(0,0,0,0.45);
    z-index:4;opacity:0;pointer-events:none;
    transition:opacity 0.18s;
  }

  /* --- responsive ------------------------------------------------------- */
  @media (max-width:780px){
    .app{
      grid-template-columns:1fr;
      grid-template-areas:"topbar" "board";
      grid-template-rows:88px 1fr;
    }
    .topbar{
      padding:6px 10px;gap:8px;
      flex-wrap:wrap;
      align-content:center;
      row-gap:6px;
    }
    .topbar-logo{font-size:13px}
    .topbar-logo span{display:none}
    .topbar-logo img{height:22px}
    /* I tab passano a una riga propria, sotto logo e azioni */
    .area-tabs{
      order:1;
      flex:1 1 100%;min-width:0;
      overflow-x:auto;
      scrollbar-width:none;
    }
    .area-tabs::-webkit-scrollbar{display:none}
    .area-tabs button{flex:1;padding:7px 10px;font-size:11.5px}

    /* Hamburger toggle */
    .sidebar-toggle{
      display:inline-flex;
      background:transparent;border:0;color:#b6c2cf;
      width:38px;height:38px;border-radius:6px;
      align-items:center;justify-content:center;
      flex-shrink:0;
      transition:background 0.12s,color 0.12s;
    }
    .sidebar-toggle:hover,.sidebar-toggle:active{background:#2c3338;color:#f4f5f7}
    .sidebar-toggle.active{background:#1c2b41;color:#cce0ff}

    /* Sidebar becomes off-canvas drawer */
    .sidebar{
      display:flex;
      position:fixed;
      top:calc(88px + env(safe-area-inset-top,0px));left:0;bottom:0;
      width:80%;max-width:300px;
      border-right:1px solid #2c3338;
      z-index:60;
      transform:translateX(-100%);
      transition:transform 0.22s cubic-bezier(.4,0,.2,1);
      box-shadow:8px 0 24px rgba(0,0,0,0.5);
    }
    .sidebar.drawer-open{transform:translateX(0)}
    .sidebar-backdrop{display:block;top:calc(88px + env(safe-area-inset-top,0px))}
    .sidebar-backdrop.show{opacity:1;pointer-events:auto}

    /* Project items: bigger tap targets */
    .project-item{padding:10px 8px}
    .project-icon{width:26px;height:26px;font-size:12px}
    .project-name{font-size:15px}
    .project-delete{opacity:1;width:28px;height:30px;margin-left:2px}
    .project-move{opacity:1;width:28px;height:30px}
    .project-share{opacity:1;width:28px;height:30px}
    .project-star{opacity:1;width:28px;height:30px}
    .project-actions{display:flex;position:static;transform:none;background:none;box-shadow:none;padding:0;gap:0}
    .project-archive{display:none}
    .label-head{padding:9px 4px 7px}
    .label-btn{opacity:1;width:28px;height:28px}

    /* Top bar buttons */
    .topbar-btn{padding:7px 10px;border-radius:6px}
    .topbar-btn span{display:none}

    /* Board */
    .board-header{padding:12px 14px;gap:8px}
    .board-title{font-size:17px;min-width:0;flex:1;max-width:none}
    .board-meta{display:none}
    .board-content{
      padding:0 14px 16px;gap:10px;
      scroll-snap-type:x mandatory;
      -webkit-overflow-scrolling:touch;
      scroll-padding-left:14px;
    }
    .column{width:84vw;max-width:300px;scroll-snap-align:start}

    /* Cards: visible delete (no hover on touch) */
    .card{padding:10px 12px}
    .card-actions{opacity:1}
    .card-action{background:rgba(0,0,0,0.35);width:28px;height:28px}
    .add-card{padding:10px 12px}

    .board-warning{margin:0 14px 10px;font-size:11.5px}
    input[type=date].date-input{padding:7px 9px;font-size:13px}

    /* Messaggi e panoramica */
    .msg-panel{top:54px;right:8px;left:8px;width:auto;max-width:none}
    .overview-filters{padding:0 14px 10px}

    /* Archivio */
    .lib-item{padding:10px}
    .lib-actions{opacity:1}
    .lib-action{background:rgba(0,0,0,0.35);width:28px;height:28px}

    /* Modal: bottom-sheet style */
    .modal-backdrop{align-items:flex-end;padding:0}
    .modal{
      max-width:100%;
      width:100%;
      border-radius:14px 14px 0 0;
      padding:20px 18px 24px;
      padding-bottom:calc(24px + env(safe-area-inset-bottom));
      max-height:92vh;
      overflow-y:auto;
    }
    .modal h2{font-size:17px}
    .modal .actions{flex-wrap:wrap;gap:6px}
    .modal .actions .btn-primary,
    .modal .actions .btn-cancel{padding:10px 16px;font-size:14px}

    /* Add-card form pills wrap */
    .add-card-form .priority-row{flex-wrap:wrap;row-gap:6px}
    .priority-pill{padding:6px 12px}

    /* Calendar header */
    .cal-header{padding:10px 12px;gap:6px;row-gap:8px}
    .cal-title{font-size:15px;gap:8px;flex-shrink:0}
    .cal-title svg{width:18px;height:18px}
    .cal-spacer{display:none}
    .cal-period{
      min-width:0;font-size:13px;
      flex:1 1 100%;text-align:left;
      order:10;padding:0 2px;
    }
    .cal-views{order:7}
    .cal-views button{padding:6px 10px;font-size:11px}
    .cal-today-btn{padding:6px 10px;font-size:11px;order:8}

<script>
/* Aggiunta alla schermata Home, l'icona apre la sezione in cui si e':
   da #chi-fa-cosa il calendario, altrimenti i progetti. Il manifest del
   sito pubblico (manifest.webmanifest) apriva invece la home del sito. */
(function(){
  /* L'icona di «Chi fa cosa» parte da app.html?apri=chi-fa-cosa e non da
     #chi-fa-cosa: aperta dalla schermata Home, iOS perde il frammento e
     dopo il login si finiva sui progetti. Qui il parametro torna frammento,
     che il resto della pagina (e il passaggio dal login) gia' conosce. */
  if(/[?&]apri=chi-fa-cosa(&|$)/.test(location.search)){
    history.replaceState(null, "", location.pathname + "#chi-fa-cosa");
  }
  var link = document.getElementById("be-manifest");
  var title = document.getElementById("be-app-title");
  function sync(){
    var cal = location.hash === "#chi-fa-cosa";
    link.href = cal ? "/chi-fa-cosa.webmanifest" : "/app.webmanifest";
    title.content = cal ? "Chi fa cosa" : "Progetti";
  }
  sync();
  window.addEventListener("hashchange", sync);
  window.beSyncManifest = sync;
})();
</script>

<script>
/* =====================================================================
 * Auth gate + data layer (Supabase)
 * ===================================================================== */
var sb = window.beClient;
var DEFAULT_COLUMNS = ["To Do", "In Progress", "Done"];

function uid(prefix){
  return prefix + "_" + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);
}

/* =====================================================================
 * State
 * ===================================================================== */
var AREAS = ["in_progettazione", "in_corso", "amministrazione"];
var DEFAULT_AREA = "in_corso";
function normalizeArea(a){ return AREAS.indexOf(a) >= 0 ? a : DEFAULT_AREA; }

var state = {
  me: null, profiles: [], projects: [], activeProjectId: null,
  area: DEFAULT_AREA,                              /* dashboard attiva in topbar */
  view: "board",                                   /* "board" | "overview" */
  overviewFilter: { projectId: "", onlyDue: false, person: "", groupBy: "status" },
  alerts: [], msgHighlight: [],
  library: {}, libraryError: null, cardDatesError: null, areaError: null,
  startDateError: null, assigneesError: null,      /* sql/task.sql non ancora eseguito */
  isTeam: false,                                   /* email @brown.internal */
  teamIds: [],                                     /* chi vede i progetti del team */
  categories: [],                                  /* le categorie del team */
  favorites: {},                                   /* project_id -> true (solo mie) */
  categoriesError: null,
  selecting: false, selected: {}                   /* selezione multipla nella sidebar */
};

function areaProjects(){
  return state.projects.filter(function(p){ return p.area === state.area; });
}
/* I progetti archiviati restano apribili, ma non entrano in Panoramica,
   scadenze e Chi fa cosa. */
function liveAreaProjects(){
  return areaProjects().filter(function(p){ return !p.archived_at; });
}
function syncActiveProject(){
  var inArea = areaProjects();
  if(!inArea.some(function(p){ return p.id === state.activeProjectId; })){
    var live = liveAreaProjects();
    state.activeProjectId = live.length ? live[0].id : (inArea.length ? inArea[0].id : null);
  }
}
function getActiveProject(){
  var inArea = areaProjects();
  return inArea.find(function(p){ return p.id === state.activeProjectId; }) || inArea[0] || null;
}
function profileName(userId){
  var p = state.profiles.find(function(x){ return x.id === userId; });
  return p ? p.display_name : "?";
}

/* =====================================================================
 * Errori e rete
 *
 * supabase-js non rigetta sugli errori di rete: li restituisce dentro
 * res.error. Senza distinguerli, offline l'app mostrava all'utente il
 * messaggio grezzo della libreria ("TypeError: Load failed").
 * ===================================================================== */
function isNetworkError(err){
  if(!navigator.onLine) return true;
  if(!err) return false;
  if(err.status === 0) return true;
  if(err.name === "AuthRetryableFetchError") return true;
  return /fetch|network|load failed|failed to fetch/i.test(err.message || "");
}

function errorText(err, fallback){
  if(isNetworkError(err)) return "Sei offline: la modifica non è stata salvata.";
  return (fallback || "Errore") + ": " + ((err && err.message) || "imprevisto");
}

/* Pannello a tutta board: usato quando non c'e' proprio nulla da mostrare
   (offline al primo avvio, oppure errore bloccante). Prima al suo posto
   c'era una shell vuota piu' un alert nativo. */
function showBoardPanel(title, text, actionLabel, onAction){
  var $b = document.getElementById("board");
  if(!$b) return;
  $b.innerHTML = "";
  var box = document.createElement("div");
  box.className = "empty-board";
  var h = document.createElement("h2");
  h.textContent = title;
  var p = document.createElement("p");
  p.textContent = text;
  box.appendChild(h);
  box.appendChild(p);
  if(actionLabel){
    var btn = document.createElement("button");
    btn.className = "btn-primary";
    btn.textContent = actionLabel;
    btn.addEventListener("click", onAction);
    box.appendChild(btn);
  }
  $b.appendChild(box);
}

function showOfflinePanel(){
  showBoardPanel(
    "Sei offline",
    "Non riesco a raggiungere il server. I progetti torneranno appena la connessione sarà disponibile.",
    "Riprova",
    function(){ boot(); }
  );
}

function showErrorPanel(title, detail){
  showBoardPanel(title, detail || "Errore imprevisto.", "Riprova", function(){ boot(); });
}

/* Un avviso in pagina al posto di alert(): non blocca, non sembra un
   errore di sistema, e usa il toast condiviso quando c'e'. */
function notify(message, opts){
  opts = opts || {};
  if(window.bePWA && window.bePWA.toast){
    window.bePWA.toast({
      kind: opts.kind || "app",
      html: String(message).replace(/</g, "&lt;"),
      warn: opts.warn !== false,
      autoHide: opts.autoHide || 6000,
      action: opts.action
    });
    return;
  }
  alert(message);
}

/* Le colonne due_date/done_at potrebbero non essere ancora state migrate:
   in quel caso si ricarica senza, e la UI delle date resta nascosta. */
async function fetchCards(){
  /* start_date arriva con sql/task.sql */
  var withStart = await sb.from("be_cards")
    .select("id, project_id, column_id, title, priority, position, start_date, due_date, done_at")
    .order("position", { ascending: true });
  if(!withStart.error){ state.cardDatesError = null; state.startDateError = null; return withStart; }
  state.startDateError = withStart.error.message;
  var full = await sb.from("be_cards")
    .select("id, project_id, column_id, title, priority, position, due_date, done_at")
    .order("position", { ascending: true });
  if(!full.error){ state.cardDatesError = null; return full; }
  var basic = await sb.from("be_cards")
    .select("id, project_id, column_id, title, priority, position")
    .order("position", { ascending: true });
  if(!basic.error) state.cardDatesError = full.error.message;
  return basic;
}

/* =====================================================================
 * Date: scadenza (liste di lavoro) e completamento (lista Done)
 * ===================================================================== */
var DONE_COLUMN_NAMES = ["done","fatto","fatti","completato","completati","completed","finito","finiti","chiuso","chiusi"];

function doneColumnId(proj){
  var cols = (proj.columns || []).slice().sort(function(a,b){ return a.position - b.position; });
  if(!cols.length) return null;
  var byName = cols.find(function(c){
    return DONE_COLUMN_NAMES.indexOf((c.name || "").trim().toLowerCase()) >= 0;
  });
  return byName ? byName.id : cols[cols.length - 1].id;
}

function todayISO(){
  var d = new Date();
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
}

function parseISODate(iso){
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || "");
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}

function formatDateIT(iso){
  var d = parseISODate(iso);
  if(!d) return "";
  var opts = { day: "numeric", month: "short" };
  if(d.getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
  return d.toLocaleDateString("it-IT", opts);
}

function daysUntil(iso){
  var d = parseISODate(iso);
  if(!d) return null;
  var t = new Date(); t.setHours(0,0,0,0);
  return Math.round((d - t) / 86400000);
}

function buildDateBadge(iso, isDone){
  var $b = document.createElement("span");
  $b.className = "card-badge";
  var label = formatDateIT(iso);
  var icon;
  if(isDone){
    $b.classList.add("done");
    icon = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    $b.title = "Completata il " + label;
  } else {
    var n = daysUntil(iso);
    if(n < 0){ $b.classList.add("overdue"); label = "Scaduta · " + label; }
    else if(n === 0){ $b.classList.add("soon"); label = "Oggi"; }
    else if(n === 1){ $b.classList.add("soon"); label = "Domani"; }
    else if(n <= 3){ $b.classList.add("soon"); }
    icon = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';
    $b.title = "Scadenza: " + formatDateIT(iso);
  }
  $b.innerHTML = icon + "<span></span>";
  $b.querySelector("span").textContent = label;
  return $b;
}

/* =====================================================================
 * Task: date di inizio/fine e destinatari (sql/task.sql)
 *
 * Una card puo' avere solo l'inizio, inizio e fine, oppure solo la fine
 * (la scadenza di sempre, due_date). I destinatari sono le persone che
 * vedono il progetto: proprietario piu' chi ha la condivisione.
 * ===================================================================== */
var DATE_MODES = [
  { key: "end",   label: "Fine" },
  { key: "start", label: "Inizio" },
  { key: "range", label: "Inizio e fine" }
];

function dateModeOf(start, due){
  if(start && due) return "range";
  if(start) return "start";
  return "end";
}

/* Badge di una card ancora aperta: scadenza, inizio, o intervallo */
function buildTaskDateBadge(start, due){
  if(!start) return buildDateBadge(due, false);
  var $b = document.createElement("span");
  $b.className = "card-badge";
  var label;
  if(due){
    var n = daysUntil(due);
    if(n < 0) $b.classList.add("overdue");
    else if(n <= 3) $b.classList.add("soon");
    var end = n === 0 ? "oggi" : n === 1 ? "domani" : formatDateIT(due);
    label = formatDateIT(start) + " → " + end;
    $b.title = "Dal " + formatDateIT(start) + " al " + formatDateIT(due) + (n < 0 ? " (scaduta)" : "");
  } else {
    var s = daysUntil(start);
    if(s === 0){ $b.classList.add("soon"); label = "Inizia oggi"; }
    else if(s === 1){ label = "Inizia domani"; }
    else label = (s > 0 ? "Inizia " : "Dal ") + formatDateIT(start);
    $b.title = "Inizio: " + formatDateIT(start);
  }
  $b.innerHTML = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span></span>';
  $b.querySelector("span").textContent = label;
  return $b;
}

/* Date di una card aperta: si sceglie il tipo, poi una o due date.
   Senza la colonna start_date resta la sola scadenza di prima. */
function buildTaskDateField(start, due, inModal){
  if(state.startDateError){
    var single = buildDateField(due, false, inModal);
    var getDue = single.getValue;
    single.getValue = function(){ return { start: null, due: getDue() }; };
    return single;
  }
  var wrap = document.createElement("div");
  wrap.className = "task-dates";
  if(!inModal){
    var lab = document.createElement("span");
    lab.className = "label";
    lab.textContent = "Date";
    wrap.appendChild(lab);
  }
  var mode = dateModeOf(start, due);
  var $modes = document.createElement("div");
  $modes.className = "date-modes";
  $modes.setAttribute("role", "radiogroup");
  DATE_MODES.forEach(function(m){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "priority-pill";
    b.dataset.mode = m.key;
    b.textContent = m.label;
    b.setAttribute("role", "radio");
    $modes.appendChild(b);
  });
  wrap.appendChild($modes);

  function input(value, text){
    var row = document.createElement("label");
    row.className = "date-pick";
    var t = document.createElement("span");
    t.textContent = text;
    var i = document.createElement("input");
    i.type = "date";
    i.className = "date-input";
    i.value = value || "";
    row.appendChild(t);
    row.appendChild(i);
    row.input = i;
    return row;
  }
  var $inputs = document.createElement("div");
  $inputs.className = "date-picks";
  var $start = input(start, "Inizio"), $due = input(due, "Fine");
  $inputs.appendChild($start);
  $inputs.appendChild($due);
  var clear = document.createElement("button");
  clear.type = "button";
  clear.className = "date-clear";
  clear.textContent = "Rimuovi";
  clear.addEventListener("click", function(){ $start.input.value = ""; $due.input.value = ""; });
  $inputs.appendChild(clear);
  wrap.appendChild($inputs);

  function draw(){
    $modes.querySelectorAll(".priority-pill").forEach(function(b){
      var on = b.dataset.mode === mode;
      b.classList.toggle("active", on);
      b.setAttribute("aria-checked", on);
    });
    $start.hidden = mode === "end";
    $due.hidden = mode === "start";
    $due.querySelector("span").textContent = mode === "end" ? "Scadenza" : "Fine";
  }
  $modes.addEventListener("click", function(e){
    var b = e.target.closest(".priority-pill");
    if(!b) return;
    mode = b.dataset.mode;
    draw();
  });
  /* la fine non puo' venire prima dell'inizio */
  $start.input.addEventListener("change", function(){
    $due.input.min = $start.input.value || "";
    if($due.input.value && $start.input.value && $due.input.value < $start.input.value) $due.input.value = $start.input.value;
  });
  $due.input.min = start || "";
  draw();

  wrap.getValue = function(){
    var s = mode === "end" ? null : ($start.input.value || null);
    var d = mode === "start" ? null : ($due.input.value || null);
    if(s && d && d < s){ var t = s; s = d; d = t; }
    return { start: s, due: d };
  };
  return wrap;
}

/* Chi puo' ricevere un task del progetto, cioe' chi lo vede: proprietario,
   condivisioni e, se non e' Personale, tutto il team. Io per primo, poi per nome. */
function projectPeople(proj){
  var ids = [proj.owner_id].concat(proj.shares || [], proj.personal ? [] : state.teamIds);
  var seen = {};
  return ids.filter(function(id){
    if(!id || seen[id]) return false;
    seen[id] = true;
    return true;
  }).map(function(id){
    return { id: id, name: id === state.me.id ? state.me.display_name : profileName(id) };
  }).sort(function(a, b){
    if(a.id === state.me.id) return -1;
    if(b.id === state.me.id) return 1;
    return a.name.localeCompare(b.name, "it");
  });
}

/* Le persone di tutte le card dell'area, per il filtro della Panoramica */
function teamPeople(){
  var seen = {}, out = [];
  liveAreaProjects().forEach(function(p){
    projectPeople(p).forEach(function(x){
      if(!seen[x.id]){ seen[x.id] = true; out.push(x); }
    });
  });
  return out.sort(function(a, b){
    if(a.id === state.me.id) return -1;
    if(b.id === state.me.id) return 1;
    return a.name.localeCompare(b.name, "it");
  });
}

var PERSON_HUES = ["#579dff", "#4bce97", "#f5cd47", "#f87168", "#9f8fef", "#6cc3e0", "#fea362", "#e774bb"];
function personHue(id){
  var h = 0;
  for(var i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
  return PERSON_HUES[h % PERSON_HUES.length];
}
function personInitials(name){
  var parts = String(name || "?").trim().split(/\s+/);
  return ((parts[0] || "?").charAt(0) + (parts[1] ? parts[1].charAt(0) : "")).toUpperCase();
}
function assigneeName(id){
  return id === (state.me && state.me.id) ? state.me.display_name : profileName(id);
}
