  function hexA(hex, a){
    var h = String(hex || "").replace("#", "");
    if(h.length !== 6) return "rgba(87,157,255," + a + ")";
    return "rgba(" + parseInt(h.slice(0,2),16) + "," + parseInt(h.slice(2,4),16) + "," + parseInt(h.slice(4,6),16) + "," + a + ")";
  }
  function isKnown(name){ return KNOWN_PERSONS.indexOf(name) >= 0; }
  function canonicalPerson(name){
    var t = String(name || "").trim();
    for(var i=0;i<KNOWN_PERSONS.length;i++){
      if(KNOWN_PERSONS[i].toLowerCase() === t.toLowerCase()) return KNOWN_PERSONS[i];
    }
    var p = findExtra(t);
    return p ? p.name : t;
  }
  /* La persona del calendario che corrisponde a chi ha fatto login */
  function myPerson(){
    return canonicalPerson(state.me && state.me.display_name);
  }

  /* ---------- mezze giornate ---------- */
  var HALVES = [{ key:"am", label:"Mattina" }, { key:"pm", label:"Pomeriggio" }];
  var HALF_LABEL = { am:"Mattina", pm:"Pomeriggio", day:"Tutto il giorno" };
  /* Dall'orario alla mezza giornata: si parte prima delle 13 = mattina;
     se poi si va oltre le 14 occupa tutta la giornata. */
  function autoHalf(start, end){
    if(!start) return null;
    if(start >= "13:00") return "pm";
    if(end && end > "14:00") return "day";
    return "am";
  }

  /* ---------- storage ----------
   * Gli impegni stanno nella tabella condivisa be_cal_events. Se la tabella
   * non c'e' ancora (sql/calendario.sql non eseguito) si resta nel browser
   * come prima, con un avviso. */
  var LEGACY_KEY   = "brown_calendar_data_v1";
  var LOCAL_KEY    = "brown_calendar_data_v2";
  var MIGRATED_KEY = "brown_calendar_migrated_v2";
  var APPLE_SYNC_KEY = "brown_calendar_apple_sync_v1";
  var DB_FIELDS = ["id","date","date_end","half","start_time","end_time","title","persons","kind",
                   "status","project_id","project_name","notes","series_id","recur","source"];

  var calEvents = [];
  var mode = null;            // "remote" | "local"
  var loadError = null;

  function lsGet(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } }
  function lsSet(k,v){ try{ localStorage.setItem(k, v); }catch(_){} }

  /* Il vecchio formato (una persona, "Mattina"/"Pomeriggio" nelle note,
     orari 9-13 / 14.30-18.30 messi d'ufficio) -> il nuovo */
  function fromLegacy(e){
    var notes = String(e.notes || "");
    var half = null;
    if(/^pomeriggio/i.test(notes)) half = "pm";
    else if(/^mattina/i.test(notes)) half = "am";
    notes = notes.replace(/^(mattina|pomeriggio)\s*(·\s*)?/i, "").trim();
    var t = e.time || "", et = e.endTime || "";
    var placeholder = (t === "09:00" && et === "13:00") || (t === "14:30" && et === "18:30");
    if(placeholder){ t = ""; et = ""; }
    return {
      id: e.id, date: e.date, date_end: null,
      half: half || autoHalf(t, et) || "am",
      start_time: t || null, end_time: et || null,
      title: e.title || "Impegno",
      persons: e.person ? [canonicalPerson(e.person)] : [],
      kind: "lavoro", status: "confermato",
      project_id: null, project_name: null,
      notes: notes || null, series_id: null, recur: null, source: "mario"
    };
  }
  /* I dati del vecchio calendario nel browser, seme compreso */
  function loadLegacy(){
    var data = null;
    try{
      var raw = localStorage.getItem(LEGACY_KEY);
      if(raw){
        var p = JSON.parse(raw);
        if(p && Array.isArray(p.events)) data = p;
      }
    }catch(_){}
    if(!data) data = { version:1, events:[], seedVersion:0 };
    if(typeof data.seedVersion !== "number") data.seedVersion = 0;
    if(data.seedVersion < SEED_VERSION){
      var have = {};
      data.events.forEach(function(e){ have[e.id] = 1; });
      SEED_EVENTS.forEach(function(e){ if(!have[e.id]) data.events.push(e); });
    }
    return data.events.map(fromLegacy);
  }
  function loadLocal(){
    try{
      var raw = localStorage.getItem(LOCAL_KEY);
      if(raw){
        var p = JSON.parse(raw);
        if(p && Array.isArray(p.events)) return p.events;
      }
    }catch(_){}
    return loadLegacy();
  }
  function saveLocal(){
    lsSet(LOCAL_KEY, JSON.stringify({ version:2, events: calEvents }));
  }
  function isMissingTable(err){
    if(!err) return false;
    return err.code === "42P01" || err.code === "PGRST205" ||
           /does not exist|could not find the table|schema cache/i.test(err.message || "");
  }
  function toDb(e){
    var o = {};
    DB_FIELDS.forEach(function(k){ o[k] = e[k] === undefined ? null : e[k]; });
    if(!o.persons) o.persons = [];
    if(!o.source) o.source = "mario";
    return o;
  }
  function chunks(arr, n){
    var out = [];
    for(var i=0;i<arr.length;i+=n) out.push(arr.slice(i, i+n));
    return out;
  }

  async function fetchRemote(){
    var all = [];
    for(var from = 0; ; from += 1000){
      var res = await sb.from("be_cal_events").select(DB_FIELDS.join(","))
        .order("date", { ascending: true }).order("id", { ascending: true })
        .range(from, from + 999);
      if(res.error) return { error: res.error };
      all = all.concat(res.data || []);
      if(!res.data || res.data.length < 1000) break;
    }
    return { data: all };
  }

  /* Il primo accesso dopo l'aggiornamento porta nel calendario condiviso
     cio' che ognuno aveva nel browser. Il vecchio seme si carica una
     volta sola, a tabella vuota: altrimenti chi entra per ultimo
     resusciterebbe gli impegni che gli altri hanno cancellato. */
  async function migrateLegacy(remoteCount){
    if(lsGet(MIGRATED_KEY)) return false;
    var seedIds = {};
    SEED_EVENTS.forEach(function(e){ seedIds[e.id] = 1; });
    var rows = loadLegacy().filter(function(e){
      return remoteCount === 0 || !seedIds[e.id];
    });
    for(var i=0, parts = chunks(rows.map(toDb), 200); i<parts.length; i++){
      var res = await sb.from("be_cal_events").upsert(parts[i], { onConflict:"id", ignoreDuplicates:true });
      if(res.error){ notify(errorText(res.error, "Impegni del browser non caricati")); return false; }
    }
    lsSet(MIGRATED_KEY, "1");
    return rows.length > 0;
  }

  async function loadEvents(){
    var res = await fetchRemote();
    if(res.error && isMissingTable(res.error)){
      mode = "local"; loadError = null;
      calEvents = loadLocal();
      return;
    }
    if(res.error){
      // offline o errore: si mostra l'ultima copia nota
      mode = "remote";
      loadError = res.error;
      if(!calEvents.length){
        try{ calEvents = JSON.parse(lsGet("brown_calendar_cache_v2") || "[]"); }catch(_){ calEvents = []; }
      }
      return;
    }
    mode = "remote"; loadError = null;
    calEvents = res.data;
    if(await migrateLegacy(calEvents.length)){
      var again = await fetchRemote();
      if(!again.error) calEvents = again.data;
    }
    lsSet("brown_calendar_cache_v2", JSON.stringify(calEvents));
  }

  function mergeLocal(rows){
    var byId = {};
    rows.forEach(function(r){ byId[r.id] = r; });
    calEvents = calEvents.map(function(e){
      if(byId[e.id]){ var r = byId[e.id]; delete byId[e.id]; return r; }
      return e;
    });
    Object.keys(byId).forEach(function(k){ calEvents.push(byId[k]); });
  }
  async function saveRows(rows, failMsg){
    if(!rows.length) return true;
    rows = rows.map(toDb);
    if(mode === "remote"){
      for(var i=0, parts = chunks(rows, 200); i<parts.length; i++){
        var res = await sb.from("be_cal_events").upsert(parts[i], { onConflict:"id" });
        if(res.error){ notify(errorText(res.error, failMsg || "Impegno non salvato")); return false; }
      }
    }
    mergeLocal(rows);
    if(mode === "local") saveLocal();
    return true;
  }
  async function deleteRows(ids, failMsg){
    if(!ids.length) return true;
    if(mode === "remote"){
      for(var i=0, parts = chunks(ids, 200); i<parts.length; i++){
        var res = await sb.from("be_cal_events").delete().in("id", parts[i]);
        if(res.error){ notify(errorText(res.error, failMsg || "Impegno non eliminato")); return false; }
      }
    }
    var gone = {};
    ids.forEach(function(id){ gone[id] = 1; });
    calEvents = calEvents.filter(function(e){ return !gone[e.id]; });
    if(mode === "local") saveLocal();
    return true;
  }

  /* ---------- persone fuori dal team ----------
   * Al posto della vecchia riga "Altri": chi lavora con noi da fuori si
   * aggiunge col "+" e diventa una riga come quelle del team. Per ogni
   * mese si decide se c'e' (months: { "2026-11": true, "2026-12": false });
   * un mese senza scelta eredita l'ultima scelta fatta prima. Stanno in
   * be_cal_people, condivisa come gli impegni; senza la tabella
   * (sql/calendario_persone.sql non eseguito) restano nel browser. */
  var PEOPLE_KEY = "brown_calendar_people_v1";
  var PEOPLE_CACHE_KEY = "brown_calendar_people_cache_v1";
  var extraPeople = [];       // [{ name, months }] nell'ordine in cui sono arrivate
  var peopleMode = null;      // "remote" | "local"

  function monthKey(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1); }
  function monthOf(ds){ return ds.slice(0, 7); }
  function addMonths(mk, n){ return monthKey(new Date(+mk.slice(0,4), +mk.slice(5,7) - 1 + n, 1)); }
  function monthName(mk){ return MONTHS[+mk.slice(5,7) - 1]; }
  function findExtra(name){
    var k = String(name || "").trim().toLowerCase();
    if(!k) return null;
    for(var i=0;i<extraPeople.length;i++) if(extraPeople[i].name.toLowerCase() === k) return extraPeople[i];
    return null;
  }
  function decided(p, mk){ return !!p.months && Object.prototype.hasOwnProperty.call(p.months, mk); }
  /* C'e' in quel mese? L'ultima scelta fatta fino a quel mese */
  function activeIn(p, mk){
    var best = null, val = false;
    Object.keys(p.months || {}).forEach(function(k){
      if(k <= mk && (best === null || k > best)){ best = k; val = !!p.months[k]; }
    });
    return val;
  }
  function activeBetween(p, fromStr, toStr){
    for(var mk = monthOf(fromStr), last = monthOf(toStr); mk <= last; mk = addMonths(mk, 1)){
      if(activeIn(p, mk)) return true;
    }
    return false;
  }
  /* Una casella di chi quel mese non c'e': niente impegni nuovi */
  function rowOff(row, ds){
    var p = findExtra(row);
    return !!p && !activeIn(p, monthOf(ds));
  }

  async function loadPeople(){
    var res = await sb.from("be_cal_people").select("name, months").order("created_at", { ascending: true });
    if(res.error && isMissingTable(res.error)){
      peopleMode = "local";
      try{ extraPeople = JSON.parse(lsGet(PEOPLE_KEY) || "[]"); }catch(_){ extraPeople = []; }
      return;
    }
    if(res.error){
      // offline: l'ultima copia nota
      peopleMode = "remote";
      if(!extraPeople.length){
        try{ extraPeople = JSON.parse(lsGet(PEOPLE_CACHE_KEY) || "[]"); }catch(_){ extraPeople = []; }
      }
      return;
    }
    peopleMode = "remote";
    extraPeople = (res.data || []).map(function(r){ return { name: r.name, months: r.months || {} }; });
    lsSet(PEOPLE_CACHE_KEY, JSON.stringify(extraPeople));
  }
  function keepPeople(){
    lsSet(peopleMode === "local" ? PEOPLE_KEY : PEOPLE_CACHE_KEY, JSON.stringify(extraPeople));
  }
  async function savePerson(p){
    if(peopleMode === "remote"){
      var res = await sb.from("be_cal_people").upsert({ name: p.name, months: p.months }, { onConflict: "name" });
      if(res.error){ notify(errorText(res.error, "Persona non salvata")); return false; }
    }
    var old = findExtra(p.name);
    if(old) old.months = p.months;
    else extraPeople.push(p);
    keepPeople();
    return true;
  }
  /* Aggiunge (o rimette) una persona da quel mese in poi. Restituisce il
     nome da usare, null se non si e' potuto. */
  async function addPerson(name, mk){
    var n = String(name || "").trim().replace(/\s+/g, " ");
    if(!n) return null;
    if(n.length > 60){ notify("Il nome è troppo lungo (al massimo 60 caratteri)."); return null; }
    if(isKnown(canonicalPerson(n))) return canonicalPerson(n);
    var p = findExtra(n);
    if(p && activeIn(p, mk)) return p.name;
    var months = Object.assign({}, p ? p.months : {});
    months[mk] = true;
    if(!(await savePerson({ name: p ? p.name : n, months: months }))) return null;
    if(peopleMode === "local") notify("Per ora " + n + " resta solo in questo browser: va eseguito sql/calendario_persone.sql su Supabase.");
    return p ? p.name : n;
  }
  async function setMonth(p, mk, on){
    var months = Object.assign({}, p.months);
    months[mk] = on;
    return savePerson({ name: p.name, months: months });
  }
  async function removePerson(p){
    var ok = await askChoice("Togliere " + p.name + "?",
      "Non si potranno più assegnare impegni a " + p.name + ". Quelli già segnati restano nel calendario.", [
      { label: "Annulla", value: null },
      { label: "Togli", value: "yes", danger: true }
    ]);
    if(!ok) return;
    if(peopleMode === "remote"){
      var res = await sb.from("be_cal_people").delete().eq("name", p.name);
      if(res.error){ notify(errorText(res.error, "Persona non tolta")); return; }
    }
    extraPeople = extraPeople.filter(function(x){ return x !== p; });
    hiddenPersons.delete(p.name);
    saveFilter();
    keepPeople();
    render();
  }
  function promptAddPerson(){
    showInputModal({
      title: "Aggiungi una persona",
      label: "Nome · potrà ricevere impegni da " + monthName(monthKey(new Date())),
      placeholder: "Es. Giulia Rossi",
      confirmText: "Aggiungi",
      onConfirm: async function(name){
        var n = String(name || "").trim();
        if(!n) return;
        if(isKnown(canonicalPerson(n))){ notify(canonicalPerson(n) + " fa già parte del team."); return; }
        var got = await addPerson(n, monthKey(new Date()));
        if(!got) return;
        hiddenPersons.delete(got);
        saveFilter();
        render();
      }
    });
  }

  /* ---------- state ---------- */
  var view = "agenda";        // 'agenda' | 'day' | 'week' | 'month'
  var cursor = new Date();    // anchor date for current view

  /* ---------- person filter ---------- */
  /* Si ricorda chi e' nascosto, non chi si vede: cosi' chi viene aggiunto
     dopo compare subito. */
  var FILTER_KEY = "brown_calendar_hidden_v1";
  var OLD_FILTER_KEY = "brown_calendar_filter_v2";
  var hiddenPersons; // Set<string>
  function loadFilter(){
    try{
      var raw = localStorage.getItem(FILTER_KEY);
      if(raw){
        var arr = JSON.parse(raw);
        if(Array.isArray(arr)) return new Set(arr);
      }
      var old = JSON.parse(localStorage.getItem(OLD_FILTER_KEY) || "null");
      if(Array.isArray(old)) return new Set(KNOWN_PERSONS.filter(function(p){ return old.indexOf(p) < 0; }));
    }catch(_){}
    return new Set();
  }
  function saveFilter(){
    var arr = []; hiddenPersons.forEach(function(p){ arr.push(p); });
    lsSet(FILTER_KEY, JSON.stringify(arr));
  }
  hiddenPersons = loadFilter();

  /* Tutte le righe possibili in [fromStr, toStr]: il team nell'ordine
     fisso, poi chi da fuori c'e' in quel periodo o vi ha impegni, poi i
     nomi scritti a mano prima del "+" (finche' hanno impegni) e in fondo
     "Senza persona", se serve. */
  function allRows(evs, fromStr, toStr){
    var rows = KNOWN_PERSONS.slice(), seen = {};
    rows.forEach(function(p){ seen[p.toLowerCase()] = 1; });
    function add(n){ var k = n.toLowerCase(); if(!seen[k]){ seen[k] = 1; rows.push(n); } }
    function inEvents(n){ return evs.some(function(e){ return e.persons && e.persons.indexOf(n) >= 0; }); }
    extraPeople.forEach(function(p){
      if(activeBetween(p, fromStr, toStr) || inEvents(p.name)) add(p.name);
    });
    var loose = [];
    evs.forEach(function(e){
      (e.persons || []).forEach(function(n){
        if(!isKnown(n) && !findExtra(n) && loose.indexOf(n) < 0) loose.push(n);
      });
    });
    loose.sort(function(a, b){ return a.localeCompare(b, "it"); }).forEach(add);
    if(evs.some(function(e){ return !e.persons || !e.persons.length; })) rows.push(NOBODY);
    return rows;
  }
  function visibleRows(evs, fromStr, toStr){
    return allRows(evs, fromStr, toStr).filter(function(r){ return !hiddenPersons.has(r); });
  }
  function hasPerson(e, row){
    if(row === NOBODY) return !e.persons || !e.persons.length;
    return !!e.persons && e.persons.indexOf(row) >= 0;
  }
  function rowColor(row){ return row === NOBODY ? NOBODY_COLOR : personColor(row); }
  function rowLabel(row){ return row === NOBODY ? "Senza persona" : row; }

  /* ---------- DOM refs ---------- */
  var $overlay = document.getElementById("cal-overlay");
  var $body    = document.getElementById("cal-body");
  var $side    = document.getElementById("cal-side");
  var $period  = document.getElementById("cal-period");
  var $views   = $overlay.querySelectorAll(".cal-views button");

  /* ---------- open / close ---------- */
  var loadingPromise = null;
  function refresh(){
    if(!loadingPromise){
      loadingPromise = Promise.all([loadEvents(), loadPeople()]).then(function(){
        loadingPromise = null;
        if($overlay.classList.contains("show")){ render(); askNextMonth(); }
        maybeAutoSyncApple();
      });
    }
    return loadingPromise;
  }
  /* ---------- indirizzo ----------
   * app.html#chi-fa-cosa apre direttamente il calendario, cosi' si puo'
   * salvare tra i preferiti. Aprendolo dal pulsante l'indirizzo lo segue
   * e "indietro" lo chiude invece di uscire da Mario. */
  var CAL_HASH = "#chi-fa-cosa";
  var pushedHash = false;     // la voce nella cronologia l'abbiamo aggiunta noi
  function isOpen(){ return $overlay.classList.contains("show"); }
  function urlWithoutHash(){ return location.pathname + location.search; }

  function open(fromUrl){
    if(fromUrl !== true && location.hash !== CAL_HASH){
      history.pushState(null, "", CAL_HASH);
      pushedHash = true;
    }
    cursor = new Date();
    view = defaultView();
    $views.forEach(function(b){ b.classList.toggle("active", b.dataset.view === view); });
    syncDefaultBtn();
    agenda.from = agenda.to = agenda.lastTop = null;
    agenda.jumpTo = todayKey();
    $overlay.classList.add("show");
    $overlay.setAttribute("aria-hidden","false");
    document.body.style.overflow = "hidden";
    if(mode === null) $body.innerHTML = '<div class="cal-empty"><p>Carico il calendario…</p></div>';
    else render();
    refresh();
  }
  function close(fromUrl){
    if(fromUrl !== true && location.hash === CAL_HASH){
      // si torna alla voce di prima; chiude poi l'evento hashchange
      if(pushedHash){ pushedHash = false; history.back(); return; }
      history.replaceState(null, "", urlWithoutHash());
    }
    $overlay.classList.remove("show");
    $overlay.setAttribute("aria-hidden","true");
    document.body.style.overflow = "";
  }

  /* ---------- view nav ---------- */
  function setView(v){
    if(v === "agenda" && view !== "agenda") agenda.jumpTo = fmtDate(cursor);
    view = v;
    $views.forEach(function(b){ b.classList.toggle("active", b.dataset.view === v); });
    syncDefaultBtn();
    render();
  }

  /* ---------- vista predefinita ----------
   * Ognuno sceglie con quale vista si apre "Chi fa cosa". La scelta sta
   * negli user_metadata (come il nome di "Senza label"): segue l'account
   * su ogni dispositivo senza toccare lo schema. */
  var VIEWS = ["agenda", "day", "week", "month"];
  var VIEW_LABEL = { agenda: "Agenda", day: "Giorno", week: "Settimana", month: "Mese" };
  function defaultView(){
    var v = state.me && state.me.cal_default_view;
    return VIEWS.indexOf(v) >= 0 ? v : "agenda";
  }
  function syncDefaultBtn(){
    var $b = document.getElementById("cal-default-btn");
    var on = view === defaultView();
    $b.classList.toggle("on", on);
    $b.setAttribute("aria-pressed", on ? "true" : "false");
    $b.querySelector("span").textContent = on ? "Predefinita" : "Rendi predefinita";
    $b.title = on
      ? "«" + VIEW_LABEL[view] + "» è la vista con cui si apre Chi fa cosa"
      : "Apri sempre Chi fa cosa in «" + VIEW_LABEL[view] + "»";
  }
  async function makeDefaultView(){
    if(!state.me || view === defaultView()) return;
    var prev = state.me.cal_default_view, v = view;
    state.me.cal_default_view = v;
    syncDefaultBtn();
    var res = await sb.auth.updateUser({ data: { cal_default_view: v } });
    if(res.error){
      state.me.cal_default_view = prev;
      syncDefaultBtn();
      notify(errorText(res.error, "Vista predefinita non salvata"));
      return;
    }
    notify("«" + VIEW_LABEL[v] + "» è ora la vista predefinita.", { warn: false, autoHide: 2500 });
  }
  function shift(direction){
    if(view === "agenda"){
      agenda.jumpTo = fmtDate(addDays(parseDate(agenda.lastTop || todayKey()), 7*direction));
    }
    if(view === "day")   cursor = addDays(cursor, direction);
    if(view === "week")  cursor = addDays(cursor, 7*direction);
    if(view === "month") cursor = new Date(cursor.getFullYear(), cursor.getMonth()+direction, 1);
    render();
  }
  function goToday(){
    cursor = new Date();
    agenda.jumpTo = todayKey();
    render();
  }

  /* ---------- event helpers ---------- */
  function covers(e, dateStr){
    return e.date <= dateStr && (e.date_end || e.date) >= dateStr;
  }
  function eventsInRange(fromStr, toStr){
    return calEvents.filter(function(e){ return e.date <= toStr && (e.date_end || e.date) >= fromStr; });
  }
  function byTime(a, b){
    var ka = (a.kind === "ferie" ? "0" : "1") + (a.start_time || "99:99");
    var kb = (b.kind === "ferie" ? "0" : "1") + (b.start_time || "99:99");
    return ka.localeCompare(kb);
  }
  /* Gli impegni di una casella: persona x giorno x mezza giornata */
  function slotEvents(evs, row, dateStr, half){
    return evs.filter(function(e){
      if(!covers(e, dateStr)) return false;
      if(half && e.half !== half && e.half !== "day") return false;
      if(!eventShownOn(e, dateStr)) return false;
      return hasPerson(e, row);
    }).sort(byTime);
  }
  function offTitle(row, ds){ return row + " non c'è a " + monthName(monthOf(ds)); }
  function fmtTimeRange(ev){
    if(!ev.start_time) return HALF_LABEL[ev.half] || "";
    if(ev.end_time && ev.end_time !== ev.start_time) return ev.start_time + " – " + ev.end_time;
    return ev.start_time;
  }
  function displayTitle(e){
    var t = e.kind === "ferie" ? (e.title && e.title !== "Ferie" ? "Ferie · " + e.title : "Ferie") : e.title;
    return e.status === "da_confermare" ? "? " + t + " ?" : t;
  }
  function chipClass(e){
    return "k-" + (e.kind || "lavoro") + (e.status === "da_confermare" ? " tentative" : "") +
           (e.source === "apple" ? " from-apple" : "");
  }
  function paintChip(el, e, row){
    var c = rowColor(row);
    el.style.setProperty("--pc", c);
    el.style.setProperty("--pcbg", hexA(c, 0.22));
  }
  function eventTooltip(e){
    var bits = [displayTitle(e), fmtTimeRange(e)];
    if(e.project_name) bits.push("Progetto: " + e.project_name);
    if(e.persons && e.persons.length) bits.push(e.persons.join(", "));
    if(e.kind === "extra") bits.push("Extra fosforo" + (e.source === "apple" ? " (da Apple Calendar)" : ""));
    return bits.filter(Boolean).join("\n");
  }

  /* ---------- rendering ---------- */
  /* Il mese prossimo: dal 20 si chiede chi ci sara' */
  function asksNextMonth(){ return new Date().getDate() >= 20; }
  function undecidedNext(){
    var next = addMonths(monthKey(new Date()), 1);
    return extraPeople.filter(function(p){ return !decided(p, next); });
  }
  /* Una volta al mese, aprendo il calendario, un promemoria */
  function askNextMonth(){
    if(!asksNextMonth() || !undecidedNext().length) return;
    var next = addMonths(monthKey(new Date()), 1);
    var k = "brown_calendar_asked_" + next;
    if(lsGet(k)) return;
    lsSet(k, "1");
    notify("Decidi chi c'è a " + monthName(next) + ": lo trovi in Persone, sotto «Chi c'è».", { warn: false, autoHide: 6000 });
  }

  function renderPersonSide(){
    var today = todayKey();
    var cur = monthKey(new Date()), next = addMonths(cur, 1);
    // da fuori: chi e' in elenco, piu' i nomi scritti a mano con impegni in arrivo
    var outside = extraPeople.map(function(p){ return p.name; });
    calEvents.forEach(function(e){
      if((e.date_end || e.date) < today) return;
      (e.persons || []).forEach(function(n){
        if(!isKnown(n) && !findExtra(n) && outside.indexOf(n) < 0) outside.push(n);
      });
    });
    var people = KNOWN_PERSONS.concat(outside);
    $side.innerHTML = "";

    var h = document.createElement("h3");
    h.textContent = "Persone";
    $side.appendChild(h);

    var allRow = document.createElement("div");
    allRow.className = "cal-person-row all";
    var allOn = people.every(function(p){ return !hiddenPersons.has(p); });
    if(allOn) allRow.classList.add("checked");
    allRow.innerHTML = '<div class="cal-cb"></div><div class="cal-person-name">Tutti</div>';
    allRow.addEventListener("click", function(){
      if(allOn) people.forEach(function(p){ hiddenPersons.add(p); });
      else hiddenPersons.clear();
      saveFilter();
      render();
    });
    $side.appendChild(allRow);

    var divider = document.createElement("div");
    divider.className = "cal-side-divider";
    $side.appendChild(divider);

    function personRow(p){
      var row = document.createElement("div");
      row.className = "cal-person-row";
      if(!hiddenPersons.has(p)) row.classList.add("checked");
      row.style.setProperty("--pc", rowColor(p));
      var count = calEvents.reduce(function(n,e){
        if((e.date_end || e.date) < today) return n;
        return n + (hasPerson(e, p) ? 1 : 0);
      }, 0);
      var extra = findExtra(p);
      var tip = count + " impegni da oggi in poi";
      if(extra && !activeIn(extra, cur)) { row.classList.add("inactive"); tip += " · non c'è a " + monthName(cur); }
      if(!extra && !isKnown(p)) { row.classList.add("inactive"); tip += " · non in elenco: si aggiunge col +"; }
      row.title = tip;
      row.innerHTML =
        '<div class="cal-cb"></div>'+
        '<div class="cal-person-name">'+ escapeHtml(p) +'</div>'+
        '<div class="cal-person-count">'+ count +'</div>';
      if(extra){
        var del = document.createElement("button");
        del.type = "button";
        del.className = "cal-person-del";
        del.title = "Togli " + p;
        del.setAttribute("aria-label", "Togli " + p);
        del.textContent = "×";
        del.addEventListener("click", function(ev){ ev.stopPropagation(); removePerson(extra); });
        row.appendChild(del);
      }
      row.addEventListener("click", function(e){
        if(e.shiftKey || e.metaKey || e.ctrlKey){
          // modifier-click: solo questa persona
          people.forEach(function(x){ hiddenPersons.add(x); });
          hiddenPersons.delete(p);
        } else {
          if(hiddenPersons.has(p)) hiddenPersons.delete(p);
          else hiddenPersons.add(p);
        }
        saveFilter();
        render();
      });
      return row;
    }
    KNOWN_PERSONS.forEach(function(p){ $side.appendChild(personRow(p)); });

    var h2 = document.createElement("h3");
    h2.className = "cal-side-sub";
    h2.textContent = "Da fuori";
    $side.appendChild(h2);
    outside.forEach(function(p){ $side.appendChild(personRow(p)); });

    var add = document.createElement("button");
    add.type = "button";
    add.className = "cal-add-person";
    add.innerHTML = '<span class="cal-add-plus">+</span>Aggiungi persona';
    add.addEventListener("click", promptAddPerson);
    $side.appendChild(add);

    // ogni mese si decide se chi e' da fuori c'e' anche il mese dopo
    if(extraPeople.length){
      var pending = asksNextMonth() && undecidedNext().length > 0;
      var box = document.createElement("div");
      box.className = "cal-months" + (pending ? " ask" : "");
      box.innerHTML =
        '<h3>Chi c\'è</h3>' +
        (pending ? '<p class="cal-months-ask">Decidi chi c\'è a ' + monthName(next) + '.</p>' : '') +
        '<div class="cal-months-grid"><span></span><span>' + MONTH_ABBR[+cur.slice(5,7)-1] + '</span>' +
        '<span>' + MONTH_ABBR[+next.slice(5,7)-1] + '</span></div>';
      var grid = box.querySelector(".cal-months-grid");
      extraPeople.forEach(function(p){
        var name = document.createElement("span");
        name.className = "cal-months-name";
        name.textContent = p.name;
        grid.appendChild(name);
        [cur, next].forEach(function(mk){
          var on = activeIn(p, mk), open = mk === next && !decided(p, mk);
          var b = document.createElement("button");
          b.type = "button";
          b.className = "cal-months-cell" + (on ? " on" : "") + (open ? " open" : "");
          b.textContent = open ? "?" : (on ? "✓" : "–");
          b.title = p.name + " a " + monthName(mk) + ": " +
            (open ? "da decidere (se non scegli, " + (on ? "c'è" : "non c'è") + " come ora)" : (on ? "c'è" : "non c'è")) +
            ". Clic per " + (open ? "confermare" : "cambiare") + ".";
          b.setAttribute("aria-label", b.title);
          b.addEventListener("click", async function(){
            // il primo clic su "?" conferma come ora; poi alterna
            if(await setMonth(p, mk, open ? on : !on)) render();
          });
          grid.appendChild(b);
        });
      });
      var hint = document.createElement("p");
      hint.className = "cal-months-hint";
      hint.textContent = "✓ c'è · – non c'è · ? da decidere. Se non scegli, il mese dopo resta come questo.";
      box.appendChild(hint);
      $side.appendChild(box);
    }

    var actions = document.createElement("div");
    actions.className = "cal-side-actions";
    actions.innerHTML =
      '<button data-act="all">Tutti</button>'+
      '<button data-act="none">Nessuno</button>';
    actions.querySelector('[data-act="all"]').addEventListener("click", function(){
      hiddenPersons.clear();
      saveFilter(); render();
    });
    actions.querySelector('[data-act="none"]').addEventListener("click", function(){
      people.forEach(function(p){ hiddenPersons.add(p); });
      hiddenPersons.add(NOBODY);
      saveFilter(); render();
    });
    $side.appendChild(actions);

    var legend = document.createElement("div");
    legend.className = "cal-legend";
    legend.innerHTML =
      '<h3>Legenda</h3>'+
      '<div><span class="cal-legend-sw k-lavoro"></span>Lavoro</div>'+
      '<div><span class="cal-legend-sw k-extra"></span>Extra fosforo (non disponibile)</div>'+
      '<div><span class="cal-legend-sw k-ferie"></span>Ferie</div>'+
      '<div><span class="cal-legend-sw k-lavoro tentative"></span>? Da confermare ?</div>';
    $side.appendChild(legend);
  }

  function renderBanner(){
    var msg = null;
    if(mode === "local"){
      msg = "Il calendario non è ancora condiviso: va eseguito sql/calendario.sql su Supabase. " +
            "Nel frattempo gli impegni restano solo in questo browser.";
    } else if(loadError){
      msg = isNetworkError(loadError)
        ? "Sei offline: vedi l'ultima copia scaricata, le modifiche non verranno salvate."
        : "Calendario non aggiornato: " + (loadError.message || "errore imprevisto");
    }
    if(!msg) return;
    var b = document.createElement("div");
    b.className = "cal-banner";
    b.textContent = msg;
    $body.appendChild(b);
  }

  function render(){
    renderPersonSide();
    $body.innerHTML = "";
    renderBanner();
    if(view === "agenda") renderAgenda();
    if(view === "day")   renderDay();
    if(view === "week")  renderWeek();
    if(view === "month") renderMonth();
  }

  /* Una casella vuota ma cliccabile: apre un impegno gia' compilato
     con persona, giorno e mezza giornata */
  function newFor(row, dateStr, half){
    if(row && rowOff(row, dateStr)){
      notify(offTitle(row, dateStr) + ": si cambia in Persone, sotto «Chi c'è».", { warn: false, autoHide: 3500 });
      return;
    }
    openEventModal(null, {
      date: dateStr, half: half || "am",
      persons: row && row !== NOBODY ? [row] : []
    });
  }

  /* =====================================================================
   * Ricerca
   *
   * Parole: cercano in titolo, progetto, note, persone, tipo e stato
   * (tutte devono esserci, senza badare ad accenti e maiuscole).
   * Date: "27/10", "27/10/2026", "2026-10-27", "27 ottobre", "oggi",
   * "domani", "ieri", un mese ("novembre", anche con l'anno) o un giorno
   * della settimana ("martedì"). Una data da sola porta a quel giorno;
   * insieme a delle parole restringe i risultati.
   * ===================================================================== */
  var MONTH_ABBR = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
  var WEEKDAY_NAMES = ["lunedi","martedi","mercoledi","giovedi","venerdi","sabato","domenica"];
  function norm(s){
    return String(s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  }
  function monthIndex(t, allowAbbr){
    var i = MONTHS.indexOf(t);
    if(i >= 0) return i;
    return allowAbbr ? MONTH_ABBR.indexOf(t.replace(/\.$/, "")) : -1;
  }

  var search = null;   // null = nessuna ricerca
  function parseSearch(q){
    var toks = norm(q).trim().split(/\s+/).filter(Boolean);
    var s = { raw: q.trim(), words: [], days: [], months: [], weekdays: [] };
    var today = new Date();
    for(var i = 0; i < toks.length; i++){
      var t = toks[i], m, next = toks[i + 1], after = toks[i + 2];
      if(t === "oggi" || t === "domani" || t === "ieri"){
        var d = addDays(today, t === "oggi" ? 0 : t === "domani" ? 1 : -1);
        s.days.push({ d: d.getDate(), m: d.getMonth(), y: d.getFullYear() });
        continue;
      }
      if((m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(t))){
        s.days.push({ d: +m[3], m: +m[2] - 1, y: +m[1] });
        continue;
      }
      if((m = /^(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2}|\d{4}))?$/.exec(t)) && +m[1] <= 31 && +m[2] >= 1 && +m[2] <= 12){
        var y = m[3] ? (m[3].length === 2 ? 2000 + +m[3] : +m[3]) : null;
        s.days.push({ d: +m[1], m: +m[2] - 1, y: y });
        continue;
      }
      if(/^\d{1,2}$/.test(t) && next && monthIndex(next, true) >= 0 && +t >= 1 && +t <= 31){
        var dy = after && /^\d{4}$/.test(after) ? +after : null;
        s.days.push({ d: +t, m: monthIndex(next, true), y: dy });
        i += dy ? 2 : 1;
        continue;
      }
      if(monthIndex(t, false) >= 0){
        var my = next && /^\d{4}$/.test(next) ? +next : null;
        s.months.push({ m: monthIndex(t, false), y: my });
        if(my) i++;
        continue;
      }
      var wd = WEEKDAY_NAMES.indexOf(t);
      if(wd >= 0){ s.weekdays.push(wd); continue; }
      s.words.push(t);
    }
    s.hasDate = s.days.length + s.months.length + s.weekdays.length > 0;
    return s;
  }

  /* Il giorno rispetta la parte "data" della ricerca? */
  function searchDayOk(ds){
    if(!search || !search.hasDate) return true;
    var d = parseDate(ds);
    if(search.days.length && !search.days.some(function(x){
      return x.d === d.getDate() && x.m === d.getMonth() && (x.y === null || x.y === d.getFullYear());
    })) return false;
    if(search.months.length && !search.months.some(function(x){
      return x.m === d.getMonth() && (x.y === null || x.y === d.getFullYear());
    })) return false;
    if(search.weekdays.length && search.weekdays.indexOf((d.getDay() + 6) % 7) < 0) return false;
    return true;
  }
  /* L'impegno contiene tutte le parole cercate? */
  function searchEventOk(e){
    if(!search || !search.words.length) return true;
    if(!e._hay){
      e._hay = norm([
        e.title, e.project_name, e.notes, (e.persons || []).join(" "),
        e.kind === "extra" ? "extra fosforo" : e.kind,
        e.status === "da_confermare" ? "da confermare ?" : "confermato",
        e.source === "apple" ? "apple" : "",
        HALF_LABEL[e.half], e.start_time
      ].join(" "));
    }
    return search.words.every(function(w){ return e._hay.indexOf(w) >= 0; });
  }
  /* Una data da sola (un giorno, un mese) porta li'; tutto il resto filtra */
  function searchFilters(){ return !!search && !searchTarget(); }
  /* Solo date, nessuna parola: la ricerca porta a quel giorno invece di filtrare */
  function searchTarget(){
    if(!search || search.words.length || search.weekdays.length) return null;
    var today = new Date();
    if(search.days.length === 1){
      var x = search.days[0];
      var y = x.y;
      if(y === null){
        // senza anno: la prossima volta che capita (o oggi)
        y = today.getFullYear();
        if(new Date(y, x.m, x.d) < new Date(today.getFullYear(), today.getMonth(), today.getDate() - 1)) y++;
      }
      var d = new Date(y, x.m, x.d);
      return d.getMonth() === x.m ? d : null;
    }
    if(search.months.length === 1 && !search.days.length){
      var mm = search.months[0], yy = mm.y;
      if(yy === null) yy = mm.m < today.getMonth() ? today.getFullYear() + 1 : today.getFullYear();
      return mm.m === today.getMonth() && yy === today.getFullYear() ? today : new Date(yy, mm.m, 1);
    }
    return null;
  }
  function eventShownOn(e, ds){
    if(searchFilters()) return searchDayOk(ds) && searchEventOk(e);
    return true;
  }

  var searchTimer = null;
  function onSearchInput(){
    clearTimeout(searchTimer);
    searchTimer = setTimeout(applySearch, 160);
  }
  function applySearch(){
    var q = document.getElementById("cal-search").value;
    document.getElementById("cal-search-clear").hidden = !q;
    var wasSearching = !!search;
    search = q.trim() ? parseSearch(q) : null;
    // cancellata la ricerca si torna dove si era prima di cominciarla
    if(search && !wasSearching) agenda.beforeSearch = { top: agenda.lastTop, cursor: cursor };
    var target = searchTarget();
    if(target){
      cursor = target;
      agenda.jumpTo = fmtDate(target);
    } else if(!search && wasSearching && agenda.beforeSearch){
      cursor = agenda.beforeSearch.cursor || new Date();
      agenda.jumpTo = agenda.beforeSearch.top || todayKey();
      agenda.beforeSearch = null;
    }
    render();
  }
  function clearSearch(){
    var $i = document.getElementById("cal-search");
    $i.value = "";
    applySearch();
  }

  /* =====================================================================
   * Agenda: i giorni scorrono in verticale senza fine, due righe ciascuno
   * (mattina e pomeriggio); in alto le persone, sempre nello stesso
   * ordine. Si apre sul giorno di oggi; sopra ci sono i giorni passati,
   * attenuati.
   * ===================================================================== */
  var AGENDA_CHUNK = 35;
  var agenda = { from: null, to: null, jumpTo: null, lastTop: null };

  /* L'agenda scorre senza fine: le colonne sono quelle di un paio di mesi
     indietro e un anno avanti */
  function agendaRows(){
    var from = fmtDate(addDays(new Date(), -60)), to = fmtDate(addDays(new Date(), 365));
    return visibleRows(eventsInRange(from, to), from, to);
  }
  function agendaTemplate(rows){
    return "var(--alabel) var(--ahalf) repeat(" + Math.max(rows.length, 1) + ", minmax(var(--acol), 1fr))";
  }

  /* Indice giorno -> impegni, solo per i giorni da disegnare */
  function indexByDay(fromStr, toStr){
    var idx = {};
    calEvents.forEach(function(e){
      var end = e.date_end || e.date;
      if(e.date > toStr || end < fromStr) return;
      var d = parseDate(e.date < fromStr ? fromStr : e.date);
      for(var n = 0; n < 400; n++, d = addDays(d, 1)){
        var ds = fmtDate(d);
        if(ds > end || ds > toStr) break;
        (idx[ds] = idx[ds] || []).push(e);
      }
    });
    return idx;
  }

  function agendaChip(e, row){
    var chip = document.createElement("div");
    chip.className = "cal-chip " + chipClass(e);
    paintChip(chip, e, row);
    var html = "";
    if(e.start_time) html += '<span class="cal-chip-time">' + escapeHtml(fmtTimeRange(e)) + '</span>';
    if(e.kind === "extra") html += '<span class="cal-tag">Extra</span>';
    html += escapeHtml(displayTitle(e));
    if(e.project_name) html += '<span class="cal-chip-proj">' + escapeHtml(e.project_name) + '</span>';
    chip.innerHTML = html;
    chip.title = eventTooltip(e);
    chip.addEventListener("click", function(ev){ ev.stopPropagation(); openEventModal(e); });
    return chip;
  }

  function agendaBand(d, isStart){
    var b = document.createElement("div");
    b.className = "cal-aband" + (isStart ? " cal-aband-start" : "");
    b.innerHTML = "<span>" + MONTHS[d.getMonth()] + " " + d.getFullYear() + "</span>";
    return b;
  }

  function agendaDay(ds, rows, evs, tpl){
    var d = parseDate(ds);
    var today = todayKey();
    var block = document.createElement("div");
    block.className = "cal-aday";
    block.dataset.date = ds;
    block.style.gridTemplateColumns = tpl;
    if(ds < today) block.classList.add("past");
    if(ds === today) block.classList.add("today");
    var dow = (d.getDay() + 6) % 7;
    if(dow >= 5) block.classList.add("weekend");

    var label = document.createElement("div");
    label.className = "cal-alabel";
    label.innerHTML = '<span class="cal-alabel-dow">' + DAYS_SHORT[dow] + '</span>' +
                      '<span class="cal-alabel-num">' + d.getDate() + '</span>' +
                      '<span class="cal-alabel-mon">' + MONTH_ABBR[d.getMonth()] + '</span>';
    label.title = fmtItalianDay(d);
    label.addEventListener("click", function(){ cursor = d; setView("day"); });
    block.appendChild(label);

    HALVES.forEach(function(h, hi){
      var hl = document.createElement("div");
      hl.className = "cal-ahalf" + (hi ? " pm" : "");
      hl.textContent = hi ? "Pom." : "Mat.";
      hl.title = h.label;
      block.appendChild(hl);
      rows.forEach(function(row){
        var cell = document.createElement("div");
        cell.className = "cal-acell" + (hi ? " pm" : "");
        var se = slotEvents(evs, row, ds, h.key);
        se.forEach(function(e){ cell.appendChild(agendaChip(e, row)); });
        if(!se.length && rowOff(row, ds)){ cell.classList.add("off"); cell.title = offTitle(row, ds); }
        else if(!se.length) cell.title = rowLabel(row) + " · " + h.label + ": libero (clic per aggiungere)";
        cell.addEventListener("click", function(){ newFor(row, ds, h.key); });
        block.appendChild(cell);
      });
    });
    return block;
  }

  /* I giorni [fromStr, toStr], con la fascia del mese a ogni inizio mese.
     withStart: anche una fascia in cima se il blocco non parte dal 1. */
  function agendaChunk(fromStr, toStr, rows, tpl, withStart){
    var frag = document.createDocumentFragment();
    var idx = indexByDay(fromStr, toStr);
    for(var d = parseDate(fromStr), first = true; fmtDate(d) <= toStr; d = addDays(d, 1), first = false){
      var ds = fmtDate(d);
      if(d.getDate() === 1) frag.appendChild(agendaBand(d, false));
      else if(first && withStart) frag.appendChild(agendaBand(d, true));
      frag.appendChild(agendaDay(ds, rows, idx[ds] || [], tpl));
    }
    return frag;
  }

  function agendaHead(rows, tpl){
    var head = document.createElement("div");
    head.className = "cal-ahead";
    head.style.gridTemplateColumns = tpl;
    head.innerHTML = '<div class="cal-ahead-corner">Giorno</div><div class="cal-ahead-half"></div>';
    rows.forEach(function(row){
      var c = document.createElement("div");
      c.className = "cal-ahead-person";
      c.innerHTML = '<span class="cal-person-dot" style="background:' + rowColor(row) + '"></span>' +
                    '<span>' + escapeHtml(rowLabel(row)) + '</span>';
      head.appendChild(c);
    });
    if(!rows.length){
      var none = document.createElement("div");
      none.className = "cal-ahead-person";
      none.textContent = "Nessuna persona selezionata";
      head.appendChild(none);
    }
    return head;
  }

  /* Il primo giorno visibile sotto l'intestazione */
  function agendaTopDay(scroller){
    var headH = scroller.querySelector(".cal-ahead").offsetHeight;
    var y = scroller.scrollTop + headH + 1;
    var days = scroller.querySelectorAll(".cal-aday");
    for(var i = 0; i < days.length; i++){
      if(days[i].offsetTop + days[i].offsetHeight > y) return days[i];
    }
    return days[days.length - 1] || null;
  }
  function agendaScrollTo(scroller, ds, smooth){
    var el = scroller.querySelector('.cal-aday[data-date="' + ds + '"]');
    if(!el) return false;
    var headH = scroller.querySelector(".cal-ahead").offsetHeight;
    var prev = el.previousElementSibling;
    // se il giorno apre il mese, si mostra anche la fascia del mese
    var top = (prev && prev.classList.contains("cal-aband") ? prev.offsetTop : el.offsetTop) - headH;
    scroller.scrollTo({ top: Math.max(0, top), behavior: smooth ? "smooth" : "auto" });
    return true;
  }
  function agendaUpdatePeriod(scroller){
    if(!scroller.isConnected) return;          // una vista gia' sostituita da un ridisegno
    var top = agendaTopDay(scroller);
    if(!top) return;
    var d = parseDate(top.dataset.date);
    $period.textContent = MONTHS[d.getMonth()] + " " + d.getFullYear();
    agenda.lastTop = top.dataset.date;
    cursor = d;
  }

  function renderAgenda(){
    var rows = agendaRows();
    var tpl = agendaTemplate(rows);

    var scroller = document.createElement("div");
    scroller.className = "cal-agenda";
    scroller.style.setProperty("--acols", Math.max(rows.length, 1));
    scroller.appendChild(agendaHead(rows, tpl));
    var list = document.createElement("div");
    list.className = "cal-alist";
    scroller.appendChild(list);
    $body.appendChild(scroller);

    if(searchFilters()) return renderAgendaResults(scroller, list, rows, tpl);

    // l'intervallo disegnato resta tra un ridisegno e l'altro: si ricomincia
    // da oggi solo quando si apre il calendario o si salta a un giorno
    var jump = agenda.jumpTo || agenda.lastTop || todayKey();
    agenda.jumpTo = null;
    if(!agenda.from || jump < agenda.from || jump > agenda.to){
      agenda.from = fmtDate(addDays(parseDate(jump), -21));
      agenda.to = fmtDate(addDays(parseDate(jump), 60));
    }
    list.appendChild(agendaChunk(agenda.from, agenda.to, rows, tpl, true));
    agendaScrollTo(scroller, jump, false);
    agendaUpdatePeriod(scroller);

    function extendDown(){
      var from = fmtDate(addDays(parseDate(agenda.to), 1));
      var to = fmtDate(addDays(parseDate(agenda.to), AGENDA_CHUNK));
      list.appendChild(agendaChunk(from, to, rows, tpl, false));
      agenda.to = to;
    }
    function extendUp(){
      var to = fmtDate(addDays(parseDate(agenda.from), -1));
      var from = fmtDate(addDays(parseDate(agenda.from), -AGENDA_CHUNK));
      // la vecchia fascia "inizio intervallo" non serve piu': il blocco nuovo porta la sua
      var stale = list.querySelector(".cal-aband-start");
      var before = scroller.scrollHeight;
      if(stale) stale.remove();
      list.insertBefore(agendaChunk(from, to, rows, tpl, true), list.firstChild);
      scroller.scrollTop += scroller.scrollHeight - before;   // la vista resta ferma dov'era
      agenda.from = from;
    }
    // vicino ai bordi si aggiungono altri giorni: sopra il passato, sotto il futuro
    var EDGE = 900;
    function edges(){
      if(!scroller.isConnected) return;
      // anche piu' volte di fila, se si scorre molto veloce o lo schermo e' alto
      for(var n = 0; n < 6 && scroller.scrollTop + scroller.clientHeight > scroller.scrollHeight - EDGE; n++) extendDown();
      for(var m = 0; m < 6 && scroller.scrollTop < EDGE; m++) extendUp();
    }
    // il mese in alto si aggiorna al massimo ogni 80 ms, e comunque alla fine
    var lastPeriod = 0, periodTimer = null;
    scroller.addEventListener("scroll", function(){
      edges();
      clearTimeout(periodTimer);
      var now = Date.now();
      if(now - lastPeriod > 80){ lastPeriod = now; agendaUpdatePeriod(scroller); }
      else periodTimer = setTimeout(function(){ agendaUpdatePeriod(scroller); }, 90);
    }, { passive: true });
  }

  /* Con una ricerca attiva: solo i giorni con impegni che corrispondono */
  function renderAgendaResults(scroller, list, rows, tpl){
    var days = {};
    calEvents.forEach(function(e){
      if(!searchEventOk(e)) return;
      var end = e.date_end || e.date;
      for(var d = parseDate(e.date), n = 0; n < 400 && fmtDate(d) <= end; d = addDays(d, 1), n++){
        var ds = fmtDate(d);
        if(searchDayOk(ds)) (days[ds] = days[ds] || []).push(e);
      }
    });
    var keys = Object.keys(days).sort();
    var count = 0, seen = {};
    keys.forEach(function(k){ days[k].forEach(function(e){ if(!seen[e.id]){ seen[e.id] = 1; count++; } }); });

    var info = document.createElement("div");
    info.className = "cal-search-info";
    info.innerHTML = count
      ? "<b>" + count + "</b> " + (count === 1 ? "impegno trovato" : "impegni trovati") + " in " + keys.length + (keys.length === 1 ? " giorno" : " giorni")
      : "Nessun impegno trovato";
    var clr = document.createElement("button");
    clr.type = "button";
    clr.className = "btn-cancel";
    clr.textContent = "Cancella ricerca";
    clr.addEventListener("click", clearSearch);
    info.appendChild(clr);
    scroller.insertBefore(info, list);

    var lastMonth = null;
    keys.forEach(function(ds){
      var d = parseDate(ds);
      var mk = d.getFullYear() * 12 + d.getMonth();
      if(mk !== lastMonth){ list.appendChild(agendaBand(d, false)); lastMonth = mk; }
      list.appendChild(agendaDay(ds, rows, days[ds], tpl));
    });
    $period.textContent = count ? "Risultati della ricerca" : "—";
    // si parte dal primo risultato da oggi in poi
    var today = todayKey();
    var firstNext = keys.filter(function(k){ return k >= today; })[0] || keys[keys.length - 1];
    if(firstNext) requestAnimationFrame(function(){ agendaScrollTo(scroller, firstNext, false); });
  }

  function renderMonth(){
    $period.textContent = MONTHS[cursor.getMonth()] + " " + cursor.getFullYear();

    var wrap = document.createElement("div");
    wrap.className = "cal-month";

    var head = document.createElement("div");
    head.className = "cal-month-headrow";
    DAYS_SHORT.forEach(function(d){
      var h = document.createElement("div");
      h.innerHTML = d + '<span class="cal-month-halves"><span>mattina</span><span>pom.</span></span>';
      head.appendChild(h);
    });
    wrap.appendChild(head);

    var grid = document.createElement("div");
    grid.className = "cal-month-grid";

    var firstOfMonth = startOfMonth(cursor);
    var gridStart = startOfWeek(firstOfMonth);
    var today = new Date();
    var evs = eventsInRange(fmtDate(gridStart), fmtDate(addDays(gridStart, 41)));
    var rows = visibleRows(evs, fmtDate(gridStart), fmtDate(addDays(gridStart, 41)));

    for(var i=0;i<42;i++){
      var d = addDays(gridStart, i);
      var ds = fmtDate(d);
      var cell = document.createElement("div");
      cell.className = "cal-day-cell";
      if(d.getMonth() !== cursor.getMonth()) cell.classList.add("other-month");
      if(isSameDay(d, today)) cell.classList.add("today");

      var num = document.createElement("span");
      num.className = "cal-day-num";
      num.textContent = d.getDate();
      cell.appendChild(num);

      // Una riga per persona, sempre nello stesso ordine; a sinistra la
      // mattina, a destra il pomeriggio. Le caselle vuote restano.
      var mg = document.createElement("div");
      mg.className = "cal-mgrid";
      rows.forEach(function(row){
        HALVES.forEach(function(h){
          var se = slotEvents(evs, row, ds, h.key);
          var slot = document.createElement("div");
          slot.className = "cal-mslot";
          if(se.length){
            var e = se[0];
            slot.className += " full " + chipClass(e);
            paintChip(slot, e, row);
            slot.textContent = (e.status === "da_confermare" ? "? " : "") +
              (e.kind === "ferie" ? "Ferie" : e.title) + (se.length > 1 ? " +" + (se.length - 1) : "");
            slot.title = rowLabel(row) + " · " + h.label + "\n" + se.map(eventTooltip).join("\n\n");
            slot.addEventListener("click", function(ev){ ev.stopPropagation(); openEventModal(e); });
          } else if(rowOff(row, ds)){
            slot.className += " off";
            slot.title = offTitle(row, ds);
          } else {
            slot.title = rowLabel(row) + " · " + h.label + ": libero";
          }
          mg.appendChild(slot);
        });
      });
      cell.appendChild(mg);

      (function(date){
        cell.addEventListener("click", function(){
          cursor = date;
          setView("day");
        });
      })(new Date(d));

      grid.appendChild(cell);
    }
    wrap.appendChild(grid);
    $body.appendChild(wrap);
  }

  function renderWeek(){
    var ws = startOfWeek(cursor);
    var we = addDays(ws, 6);
    if(ws.getMonth() === we.getMonth()){
      $period.textContent = ws.getDate() + " – " + we.getDate() + " " + MONTHS[ws.getMonth()] + " " + ws.getFullYear();
    } else {
      $period.textContent = ws.getDate() + " " + MONTHS[ws.getMonth()] + " – " + we.getDate() + " " + MONTHS[we.getMonth()] + " " + we.getFullYear();
    }

    var evs = eventsInRange(fmtDate(ws), fmtDate(we));
    var rows = visibleRows(evs, fmtDate(ws), fmtDate(we));
    var today = new Date();

    var wrap = document.createElement("div");
    wrap.className = "cal-week";
    var grid = document.createElement("div");
    grid.className = "cal-wgrid";

    var corner = document.createElement("div");
    corner.className = "cal-wcorner";
    grid.appendChild(corner);
    for(var i=0;i<7;i++){
      var d = addDays(ws, i);
      var head = document.createElement("div");
      head.className = "cal-week-head";
      if(isSameDay(d, today)) head.classList.add("today");
      head.innerHTML = '<div class="cal-week-day-name">'+ DAYS_SHORT[i] +'</div>'+
                       '<div class="cal-week-day-num">'+ d.getDate() +'</div>';
      (function(date){
        head.addEventListener("click", function(){ cursor = date; setView("day"); });
      })(new Date(d));
      grid.appendChild(head);
    }

    if(!rows.length){
      var none = document.createElement("div");
      none.className = "cal-wband";
      none.innerHTML = "<span>Nessuna persona selezionata</span>";
      grid.appendChild(none);
    }

    HALVES.forEach(function(h){
      if(!rows.length) return;
      var band = document.createElement("div");
      band.className = "cal-wband";
      band.innerHTML = "<span>" + h.label + "</span>";
      grid.appendChild(band);

      rows.forEach(function(row){
        var label = document.createElement("div");
        label.className = "cal-wlabel";
        label.innerHTML = '<span class="cal-person-dot" style="background:'+ rowColor(row) +'"></span>' +
                          '<span class="cal-wlabel-name">' + escapeHtml(rowLabel(row)) + '</span>';
        grid.appendChild(label);

        for(var i=0;i<7;i++){
          var d = addDays(ws, i);
          var ds = fmtDate(d);
          var cell = document.createElement("div");
          cell.className = "cal-wcell";
          if(isSameDay(d, today)) cell.classList.add("today");
          var se = slotEvents(evs, row, ds, h.key);
          se.forEach(function(e){
            var chip = document.createElement("div");
            chip.className = "cal-chip " + chipClass(e);
            paintChip(chip, e, row);
            var html = "";
            if(e.start_time) html += '<span class="cal-chip-time">' + escapeHtml(fmtTimeRange(e)) + '</span>';
            if(e.kind === "extra") html += '<span class="cal-tag">Extra</span>';
            html += escapeHtml(displayTitle(e));
            if(e.project_name) html += '<span class="cal-chip-proj">' + escapeHtml(e.project_name) + '</span>';
            chip.innerHTML = html;
            chip.title = eventTooltip(e);
            chip.addEventListener("click", function(ev){ ev.stopPropagation(); openEventModal(e); });
            cell.appendChild(chip);
          });
          if(!se.length && rowOff(row, ds)){ cell.classList.add("off"); cell.title = offTitle(row, ds); }
          else cell.title = se.length ? "" : rowLabel(row) + " · " + h.label + ": libero (clic per aggiungere)";
          (function(row, ds, half){
            cell.addEventListener("click", function(){ newFor(row, ds, half); });
          })(row, ds, h.key);
          grid.appendChild(cell);
        }
      });
    });

    wrap.appendChild(grid);
    $body.appendChild(wrap);
  }

  function renderDay(){
    $period.textContent = cursor.getDate() + " " + MONTHS[cursor.getMonth()] + " " + cursor.getFullYear();
    var ds = fmtDate(cursor);

    var wrap = document.createElement("div");
    wrap.className = "cal-day-view";

    var head = document.createElement("div");
    head.className = "cal-day-view-head";
    if(isSameDay(cursor, new Date())) head.classList.add("today");
    head.innerHTML = '<h3>'+ DAYS_LONG[(cursor.getDay()+6)%7] +' <span class="daynum">'+ cursor.getDate() +'</span> '+ MONTHS[cursor.getMonth()] +'</h3>';
    wrap.appendChild(head);

    var list = document.createElement("div");
    list.className = "cal-day-scroll";

        name.className = "cal-dname";

        r.appendChild(name);

        var cards = document.createElement("div");
        cards.className = "cal-dcards";

          cards.appendChild(free);
        }
        se.forEach(function(e){ cards.appendChild(dayCard(e, row)); });

      });

      }
      list.appendChild(sec);

    wrap.appendChild(list);
    $body.appendChild(wrap);

  function dayCard(e, row){
    var card = document.createElement("div");
    card.className = "cal-day-event-card " + chipClass(e);
    paintChip(card, e, row);

    var t = document.createElement("div");
    t.className = "cal-day-event-time" + (e.start_time ? "" : " notime");
    t.textContent = fmtTimeRange(e);

    var body = document.createElement("div");
    body.className = "cal-day-event-body";
    var title = document.createElement("div");
    title.className = "cal-day-event-title";
    title.textContent = displayTitle(e);
    body.appendChild(title);

    var meta = document.createElement("div");
    meta.className = "cal-day-event-meta";
    var bits = [];
    if(e.kind === "extra") bits.push('<span class="cal-tag">Extra fosforo</span>');
    if(e.kind === "ferie") bits.push('<span class="cal-tag">Ferie</span>');
    if(e.status === "da_confermare") bits.push('<span class="cal-tag warn">Da confermare</span>');
    if(e.source === "apple") bits.push('<span class="cal-tag">Da Apple Calendar</span>');
    if(e.project_name) bits.push('<span>Progetto: ' + escapeHtml(e.project_name) + '</span>');
    if(e.persons && e.persons.length > 1) bits.push('<span>Con: ' + escapeHtml(e.persons.join(", ")) + '</span>');
    if(e.date_end && e.date_end !== e.date){
      bits.push('<span>Dal ' + escapeHtml(fmtShort(e.date)) + ' al ' + escapeHtml(fmtShort(e.date_end)) + '</span>');
    }
    if(e.series_id) bits.push('<span>Ricorrente</span>');
    meta.innerHTML = bits.join("");
    if(bits.length) body.appendChild(meta);

    if(e.notes){
      var n = document.createElement("div");
      n.className = "cal-day-event-notes";
      n.textContent = e.notes;
      body.appendChild(n);
    }
    card.appendChild(t);
    card.appendChild(body);
    card.addEventListener("click", function(){ openEventModal(e); });
    return card;
  }
  function fmtShort(s){
    var d = parseDate(s);
    return d.getDate() + " " + MONTHS[d.getMonth()];
  }

  function escapeHtml(s){
    return String(s||"").replace(/[&<>"']/g, function(c){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[c];
    });
  }

  /* ---------- piccole finestre di scelta ---------- */
  function askChoice(title, text, choices){
    return new Promise(function(resolve){
      var bd = document.createElement("div");
      bd.className = "modal-backdrop";
      bd.style.zIndex = "110";
      bd.innerHTML =
        '<div class="modal" role="dialog" aria-modal="true" style="max-width:400px">' +
          '<h2></h2><p class="cm-ask-text"></p><div class="actions cm-ask-actions"></div>' +
        '</div>';
      bd.querySelector("h2").textContent = title;
      bd.querySelector("p").textContent = text;
      var $a = bd.querySelector(".cm-ask-actions");
      function done(v){ bd.remove(); document.removeEventListener("keydown", onKey, true); resolve(v); }
      function onKey(e){ if(e.key === "Escape"){ e.stopPropagation(); done(null); } }
      choices.forEach(function(c){
        var b = document.createElement("button");
        b.className = c.primary ? "btn-primary" : "btn-cancel";
        if(c.danger) b.style.color = "#f87168";
        b.textContent = c.label;
        b.addEventListener("click", function(){ done(c.value); });
        $a.appendChild(b);
      });
      bd.addEventListener("click", function(e){ if(e.target === bd) done(null); });
      document.addEventListener("keydown", onKey, true);
      document.body.appendChild(bd);
    });
  }

  /* ---------- event modal ---------- */
  var WEEKDAY_LETTERS = ["L","M","M","G","V","S","D"];
  function isoDow(d){ return ((d.getDay() + 6) % 7) + 1; }   // 1 = lunedi'

  function hourOptions(){
    var o = '<option value="">--</option>';
    for(var h=0; h<24; h++) o += '<option value="'+ pad(h) +'">'+ pad(h) +'</option>';
    return o;
  }
  function minuteOptions(){
    var o = "";
    for(var m=0; m<60; m+=5) o += '<option value="'+ pad(m) +'">'+ pad(m) +'</option>';
    return o;
  }
  function projectOptions(current){
    var projs = (state.projects || []).slice().sort(function(a,b){ return a.name.localeCompare(b.name, "it"); });
    var o = '<option value="">— Scegli il progetto —</option>';
    var found = false;
    projs.forEach(function(p){
      if(current && current.project_id === p.id) found = true;
      o += '<option value="'+ escapeHtml(p.id) +'">'+ escapeHtml(p.name) +'</option>';
    });
    // un progetto di qualcun altro, che chi modifica non vede: resta com'era
    if(current && current.project_id && !found){
      o += '<option value="'+ escapeHtml(current.project_id) +'">'+ escapeHtml(current.project_name || "Progetto") +'</option>';
    }
    o += '<option value="__altro__">Altro (specificare)…</option>';
    return o;
  }

  function openEventModal(existing, preset){
    if(existing && existing.source === "apple") return openAppleEventInfo(existing);
    var isEdit = !!existing;
    preset = preset || {};
    var me = myPerson();
    var data = existing ? JSON.parse(JSON.stringify(existing)) : {

      date: preset.date || fmtDate(cursor),
      date_end: null,
      half: preset.half || "am",
      start_time: null, end_time: null,

             : (isKnown(me) ? [me] : []),

        '<div class="cm-row">' +
          '<div><label for="cm-date" id="cm-date-label">Data</label><input type="date" id="cm-date"></div>' +
