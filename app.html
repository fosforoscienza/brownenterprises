<!DOCTYPE html>
<html data-be-bg="dark" lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1, viewport-fit=cover">
<title>Mario Project Manager · Brown Enterprises</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0E1217">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<style>
  /* --- reset & base ----------------------------------------------------- */
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Inter",Roboto,sans-serif;
    background:#1d2125;
    color:#b6c2cf;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer}
  ::selection{background:rgba(87,157,255,0.4);color:#fff}

  /* --- layout ----------------------------------------------------------- */
  .app{
    display:grid;
    grid-template-rows:44px 1fr;
    grid-template-columns:260px 1fr;
    grid-template-areas:"topbar topbar" "sidebar board";
    height:100vh;
    /* dvh: su iOS 100vh include la barra di Safari, quindi il fondo della
       board restava irraggiungibile. Il doppio valore tiene i browser vecchi. */
    height:100dvh;
    padding-top:env(safe-area-inset-top,0px);
  }

  /* --- top bar ---------------------------------------------------------- */
  .topbar{
    grid-area:topbar;
    background:#1d2125;
    border-bottom:1px solid #2c3338;
    display:flex;
    align-items:center;
    padding:0 max(16px, env(safe-area-inset-right,0px)) 0 max(16px, env(safe-area-inset-left,0px));
    gap:14px;
    z-index:20;
  }
  .topbar-logo{
    display:flex;
    align-items:center;
    gap:10px;
    color:#f4f5f7;
    font-weight:700;
    font-size:14px;
    letter-spacing:0.2px;
  }
  .topbar-logo img{height:24px}  /* il logo SVG e' gia' bianco */
  .area-tabs{
    display:inline-flex;background:#22272b;border:1px solid #38414b;border-radius:6px;padding:2px;
  }
  .area-tabs button{
    background:transparent;border:0;color:#9fadbc;
    padding:6px 14px;border-radius:4px;
    font-size:12px;font-weight:600;
    white-space:nowrap;
    user-select:none;
    transition:background 0.12s,color 0.12s;
  }
  .area-tabs button.active{background:#1c2b41;color:#cce0ff}
  .area-tabs button:hover:not(.active){background:#2c3338;color:#f4f5f7}
  .topbar-spacer{flex:1}
  .topbar-user{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .topbar-user .avatar{
    width:28px;height:28px;border-radius:50%;
    background:linear-gradient(135deg,#579dff,#9f8fef);
    color:#1d2125;
    font-weight:700;font-size:12px;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn{
    background:transparent;border:0;color:#9fadbc;
    width:32px;height:32px;border-radius:4px;
    display:inline-flex;align-items:center;justify-content:center;
    transition:background 0.15s,color 0.15s;
  }
  .icon-btn:hover{background:#2c3338;color:#f4f5f7}

  /* --- sidebar ---------------------------------------------------------- */
  .sidebar{
    grid-area:sidebar;
    background:#1d2125;
    border-right:1px solid #2c3338;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .sidebar-header{
    padding:14px 14px 8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .sidebar-title{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.8px;
    color:#9fadbc;
    font-weight:700;
  }
  .sidebar-add{
    background:transparent;border:0;color:#9fadbc;
    width:24px;height:24px;border-radius:4px;
    display:inline-flex;align-items:center;justify-content:center;
    transition:background 0.15s,color 0.15s;
  }
  .sidebar-add:hover{background:#2c3338;color:#f4f5f7}
  .projects{
    flex:1;
    overflow-y:auto;
    padding:4px 8px 12px;
  }
  .project-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 8px;
    border-radius:4px;
    cursor:pointer;
    color:#b6c2cf;
    transition:background 0.12s,color 0.12s;
    margin-bottom:2px;
    user-select:none;
    position:relative;
  }
  .project-item:hover{background:#2c3338}
  .project-item.active{
    background:#1c2b41;
    color:#cce0ff;
  }
  .project-item.active .project-icon{background:#579dff;color:#1d2125}
  .project-icon{
    width:22px;height:22px;border-radius:4px;
    background:linear-gradient(135deg,#4bce97,#579dff);
    color:#1d2125;
    font-size:11px;font-weight:700;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .project-name{
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:14px;
  }
  .project-delete{
    opacity:0;
    background:transparent;border:0;color:#9fadbc;
    width:22px;height:22px;border-radius:4px;
    display:inline-flex;align-items:center;justify-content:center;
    transition:opacity 0.12s,background 0.12s,color 0.12s;
  }
  .project-item:hover .project-delete{opacity:1}
  .project-delete:hover{background:#412a2a;color:#f87168}
  .empty-projects{
    text-align:center;
    color:#738496;
    font-size:12px;
    padding:24px 12px;
    line-height:1.5;
  }
  .sidebar-section-title{
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.6px;
    color:#738496;
    font-weight:700;
    padding:10px 4px 4px 8px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .sidebar-section-title:first-child{padding-top:2px}
  .project-item.dragging{opacity:0.4;cursor:grabbing}
  .sidebar-section-add{
    background:transparent;border:0;color:#9fadbc;
    width:20px;height:20px;border-radius:4px;
    display:inline-flex;align-items:center;justify-content:center;
    transition:background 0.15s,color 0.15s;
  }
  .sidebar-section-add:hover{background:#2c3338;color:#f4f5f7}
  /* --- Label: gruppi di progetti creati da ogni utente ------------------ */
  .label-group{
    border-radius:6px;
    margin-bottom:2px;
    transition:box-shadow 0.12s,background 0.12s;
  }
  .label-group.drop-target{
    background:#1c2b41;
    box-shadow:inset 0 0 0 1px #579dff;
  }
  .label-head{
    display:flex;
    align-items:center;
    gap:4px;
    padding:7px 4px 5px 4px;
    border-radius:4px;
    cursor:pointer;
    user-select:none;
    color:#738496;
  }
  .label-head:hover{background:#22272b}
  .label-caret{
    width:14px;height:14px;flex-shrink:0;
    display:inline-flex;align-items:center;justify-content:center;
    transition:transform 0.15s;
  }
  .label-group.collapsed .label-caret{transform:rotate(-90deg)}
  .label-title{
    flex:1;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:0.6px;
    font-weight:700;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .label-count{
    font-size:10px;font-weight:700;
    background:#2c3338;color:#9fadbc;
    border-radius:9px;padding:1px 6px;
    flex-shrink:0;
  }
  .label-btn{
    opacity:0;
    background:transparent;border:0;color:#9fadbc;
    width:20px;height:20px;border-radius:4px;
    display:inline-flex;align-items:center;justify-content:center;
    flex-shrink:0;
    transition:opacity 0.12s,background 0.12s,color 0.12s;
  }
  .label-head:hover .label-btn{opacity:1}
  .label-btn:hover{background:#2c3338;color:#f4f5f7}
  .label-btn.danger:hover{background:#412a2a;color:#f87168}
  .label-shared{display:inline-flex;align-items:center;color:#579dff;flex-shrink:0}
  .move-group > p.move-hint{margin:0;padding:4px 2px;font-size:13px;line-height:1.4}
  .label-group.collapsed .label-body{display:none}
  .label-empty{
    color:#5c6b7a;
    font-size:11px;
    padding:4px 10px 8px;
    line-height:1.4;
  }
  .project-move{
    opacity:0;
    background:transparent;border:0;color:#9fadbc;
    width:22px;height:22px;border-radius:4px;
    display:inline-flex;align-items:center;justify-content:center;
    transition:opacity 0.12s,background 0.12s,color 0.12s;
  }
  .project-item:hover .project-move{opacity:1}
  .project-move:hover{background:#2c3338;color:#f4f5f7}
  .sidebar-note{
    margin:6px 4px 10px;
    padding:8px 10px;
    border-radius:6px;
    background:#2b2318;
    color:#f5cd47;
    font-size:11px;
    line-height:1.45;
  }
  .project-share{
    opacity:0;
    background:transparent;border:0;color:#9fadbc;
    width:22px;height:22px;border-radius:4px;
    display:inline-flex;align-items:center;justify-content:center;
    transition:opacity 0.12s,background 0.12s,color 0.12s;
  }
  .project-item:hover .project-share{opacity:1}
  .project-share:hover{background:#1c2b41;color:#85b8ff}
  .share-list{
    display:flex;flex-direction:column;gap:2px;
    margin-bottom:14px;
    max-height:260px;overflow-y:auto;
  }
  .share-row{
    display:flex;align-items:center;gap:10px;
    padding:8px;border-radius:6px;
    cursor:pointer;user-select:none;
  }
  .share-row:hover{background:#1d2125}
  .share-row .cal-cb{
    width:16px;height:16px;
    border:2px solid #38414b;
    border-radius:4px;
    flex-shrink:0;
    background:#1d2125;
    position:relative;
    transition:background 0.12s,border-color 0.12s;
  }
  .share-row.checked .cal-cb{background:#579dff;border-color:#579dff}
  .share-row.checked .cal-cb::after{
    content:"";position:absolute;left:4px;top:1px;
    width:4px;height:8px;border:solid #1d2125;border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }
  .share-row-name{font-size:14px;color:#f4f5f7}
  .sidebar-footer{
    padding:10px 14px;
    border-top:1px solid #2c3338;
    font-size:11px;
    color:#738496;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .logout-btn{
    background:transparent;border:0;color:#9fadbc;
    font-size:12px;
    display:inline-flex;align-items:center;gap:4px;
    padding:4px 8px;border-radius:4px;
    transition:background 0.12s,color 0.12s;
  }
  .logout-btn:hover{background:#2c3338;color:#f4f5f7}

  /* --- board ------------------------------------------------------------ */
  .board{
    grid-area:board;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    background:#1d2125;
    background-image:linear-gradient(180deg,rgba(87,157,255,0.05),transparent 280px);
  }
  .board-header{
    padding:14px 24px;
    display:flex;
    align-items:center;
    gap:12px;
    flex-shrink:0;
  }
  .board-title{
    font-size:18px;
    font-weight:700;
    color:#f4f5f7;
    background:transparent;
    border:1px solid transparent;
    border-radius:4px;
    padding:4px 8px;
    margin:0;
    outline:none;
    min-width:120px;
    max-width:600px;
  }
  .board-title:hover{background:rgba(255,255,255,0.04)}
  .board-title:focus{background:#22272b;border-color:#579dff}
  .board-meta{
    color:#8c9bab;
    font-size:12px;
  }
  .board-content{
    flex:1;
    overflow-x:auto;
    overflow-y:hidden;
    padding:0 24px 24px;
    display:flex;
    align-items:flex-start;
    gap:12px;
    scrollbar-width:thin;
    scrollbar-color:#38414b transparent;
  }
  .board-content::-webkit-scrollbar{height:12px}
  .board-content::-webkit-scrollbar-track{background:transparent}
  .board-content::-webkit-scrollbar-thumb{background:#38414b;border-radius:6px;border:3px solid #1d2125}

  /* --- columns ---------------------------------------------------------- */
  .column{
    background:#101204;
    border-radius:10px;
    width:280px;
    flex-shrink:0;
    max-height:100%;
    display:flex;
    flex-direction:column;
    box-shadow:0 1px 0 rgba(255,255,255,0.04);
  }
  .column.drag-over{
    background:#161a1d;
    outline:2px dashed #579dff;
    outline-offset:-2px;
  }
  .column-header{
    padding:10px 12px 6px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-shrink:0;
  }
  .column-title{
    font-size:13px;
    font-weight:700;
    color:#f4f5f7;
    display:flex;align-items:center;gap:8px;
  }
  .column-count{
    background:#22272b;
    color:#9fadbc;
    font-size:11px;
    font-weight:600;
    padding:1px 7px;
    border-radius:10px;
  }
  .cards{
    flex:1;
    overflow-y:auto;
    padding:0 8px;
    scrollbar-width:thin;
    scrollbar-color:#38414b transparent;
    min-height:8px;
  }
  .cards::-webkit-scrollbar{width:8px}
  .cards::-webkit-scrollbar-track{background:transparent}
  .cards::-webkit-scrollbar-thumb{background:#38414b;border-radius:4px}

  /* --- card ------------------------------------------------------------- */
  .card{
    background:#22272b;
    border-radius:8px;
    padding:8px 12px;
    margin-bottom:8px;
    cursor:grab;
    transition:background 0.12s,box-shadow 0.12s,transform 0.12s;
    border:1px solid transparent;
    box-shadow:0 1px 0 rgba(0,0,0,0.25);
    position:relative;
    user-select:none;
  }
  .card:hover{
    background:#2c3338;
    border-color:#38414b;
  }
  .card.dragging{
    opacity:0.4;
    cursor:grabbing;
    transform:rotate(1.5deg);
  }
  .card-priority{
    display:inline-block;
    height:6px;
    width:42px;
    border-radius:3px;
    margin-bottom:6px;
  }
  .card-priority.red   { background:#f87168 }
  .card-priority.yellow{ background:#f5cd47 }
  .card-priority.green { background:#4bce97 }
  .card-title{
    color:#f4f5f7;
    font-size:14px;
    line-height:1.35;
    word-wrap:break-word;
    white-space:pre-wrap;
  }
  .card-actions{
    position:absolute;
    top:6px;
    right:6px;
    opacity:0;
    transition:opacity 0.12s;
  }
  .card:hover .card-actions{opacity:1}
  .card-action{
    background:rgba(0,0,0,0.4);
    border:0;color:#9fadbc;
    width:22px;height:22px;border-radius:4px;
    display:inline-flex;align-items:center;justify-content:center;
    margin-left:2px;
    transition:background 0.12s,color 0.12s;
  }
  .card-action:hover{background:#412a2a;color:#f87168}

  /* --- add card --------------------------------------------------------- */
  .add-card{
    margin:4px 8px 8px;
    padding:8px 12px;
    color:#9fadbc;
    background:transparent;
    border:0;
    border-radius:6px;
    font-size:14px;
    text-align:left;
    display:flex;
    align-items:center;
    gap:6px;
    transition:background 0.12s,color 0.12s;
  }
  .add-card:hover{
    background:rgba(255,255,255,0.06);
    color:#f4f5f7;
  }
  .add-card-form{
    margin:4px 8px 8px;
    background:transparent;
  }
  .add-card-form textarea{
    width:100%;
    background:#22272b;
    border:1px solid #579dff;
    color:#f4f5f7;
    border-radius:8px;
    padding:8px 12px;
    font-family:inherit;
    font-size:14px;
    resize:vertical;
    min-height:60px;
    outline:none;
    box-shadow:0 1px 0 rgba(0,0,0,0.25);
  }
  .add-card-form .priority-row{
    display:flex;
    gap:6px;
    margin-top:8px;
    align-items:center;
  }
  .priority-row .label{font-size:11px;color:#9fadbc;text-transform:uppercase;letter-spacing:0.5px;font-weight:700;margin-right:2px}
  .priority-pill{
    background:transparent;
    border:1px solid #38414b;
    border-radius:999px;
    padding:3px 10px;
    font-size:11px;
    color:#b6c2cf;
    display:inline-flex;align-items:center;gap:5px;
    transition:background 0.12s,border-color 0.12s;
  }
  .priority-pill:hover{background:#2c3338}
  .priority-pill.active{border-color:#579dff;background:#1c2b41}
  .priority-pill .dot{
    width:8px;height:8px;border-radius:50%;
  }
  .priority-pill .dot.red{background:#f87168}
  .priority-pill .dot.yellow{background:#f5cd47}
  .priority-pill .dot.green{background:#4bce97}
  .add-card-form .actions{
    display:flex;
    gap:6px;
    margin-top:8px;
    align-items:center;
  }
  .btn-primary{
    background:#579dff;
    color:#1d2125;
    border:0;
    padding:7px 14px;
    border-radius:4px;
    font-weight:700;
    font-size:13px;
    transition:background 0.12s;
  }
  .btn-primary:hover{background:#85b8ff}
  .btn-cancel{
    background:transparent;
    border:0;
    color:#9fadbc;
    padding:6px 8px;
    border-radius:4px;
    font-size:13px;
  }
  .btn-cancel:hover{background:#2c3338;color:#f4f5f7}

  /* --- date sulle card --------------------------------------------------- */
  .card-badges{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    margin-top:7px;
  }
  .card-badge{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-size:11px;
    font-weight:600;
    padding:2px 7px;
    border-radius:4px;
    background:#2c3338;
    color:#9fadbc;
    white-space:nowrap;
  }
  .card-badge svg{flex-shrink:0}
  .card-badge.overdue{background:#412a2a;color:#f87168}
  .card-badge.soon{background:#413a1f;color:#f5cd47}
  .card-badge.done{background:#173328;color:#4bce97}
  .date-row{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:8px;
    flex-wrap:wrap;
  }
  .date-row .label{
    font-size:11px;color:#9fadbc;text-transform:uppercase;
    letter-spacing:0.5px;font-weight:700;
    flex:0 0 100%;
    margin-bottom:-2px;
  }
  input[type=date].date-input{
    background:#22272b;
    border:1px solid #38414b;
    color:#f4f5f7;
    border-radius:6px;
    padding:5px 8px;
    font-family:inherit;
    font-size:12.5px;
    outline:none;
    color-scheme:dark;
  }
  input[type=date].date-input:focus{border-color:#579dff}
  .date-clear{
    background:transparent;border:0;color:#8c9bab;
    font-size:11px;padding:4px 7px;border-radius:4px;
  }
  .date-clear:hover{background:#2c3338;color:#f4f5f7}
  .board-warning{
    margin:0 24px 12px;
    background:#412a2a;
    border:1px solid #5d3a3a;
    color:#ffbdad;
    font-size:12px;
    line-height:1.45;
    border-radius:8px;
    padding:8px 12px;
  }

  /* --- messaggi / alert -------------------------------------------------- */
  .topbar-msg{position:relative}
  .msg-badge{
    position:absolute;top:-6px;right:-6px;
    min-width:18px;height:18px;padding:0 4px;
    border-radius:9px;
    background:#f87168;color:#1d2125;
    font-size:10px;font-weight:800;line-height:1;
    display:flex;align-items:center;justify-content:center;
    border:2px solid #1d2125;
  }
  .msg-badge[hidden]{display:none}
  .msg-badge.quiet{background:#f5cd47}
  .msg-panel{
    position:fixed;
    top:50px;right:16px;
    width:344px;max-width:calc(100vw - 24px);
    max-height:min(72vh,540px);
    background:#22272b;
    border:1px solid #38414b;
    border-radius:10px;
    box-shadow:0 12px 32px rgba(0,0,0,0.55);
    z-index:60;
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  .msg-panel[hidden]{display:none}
  .msg-panel-head{
    padding:11px 12px;
    border-bottom:1px solid #2c3338;
    display:flex;align-items:center;gap:8px;
  }
  .msg-panel-head h3{font-size:14px;color:#f4f5f7;margin:0;flex:1;font-weight:700}
  .msg-panel-list{overflow-y:auto;padding:6px;scrollbar-width:thin;scrollbar-color:#38414b transparent}
  .msg-panel-list::-webkit-scrollbar{width:8px}
  .msg-panel-list::-webkit-scrollbar-thumb{background:#38414b;border-radius:4px}
  .msg-item{
    display:flex;gap:10px;align-items:flex-start;
    padding:9px 10px;border-radius:8px;cursor:pointer;
    transition:background 0.12s;
  }
  .msg-item:hover{background:#2c3338}
  .msg-item.unread{background:#1c2b41}
  .msg-item.unread:hover{background:#213a5c}
  .msg-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0;background:#579dff}

  .msg-dot.today{background:#f5cd47}
  .msg-body{flex:1;min-width:0}
  .msg-title{font-size:13px;color:#f4f5f7;line-height:1.35;word-wrap:break-word}
  .msg-meta{font-size:11px;color:#8c9bab;margin-top:3px;line-height:1.4}
  .msg-when{font-weight:700;color:#85b8ff}
  .msg-when.overdue{color:#f87168}
  .msg-when.today{color:#f5cd47}
  .msg-empty{padding:26px 16px;text-align:center;color:#738496;font-size:12.5px;line-height:1.5}

    padding:7px 10px;

  .msg-foot-btn{
    background:transparent;border:0;color:#9fadbc;
    font-size:11.5px;padding:5px 8px;border-radius:4px;
  }
  .msg-foot-btn:hover{background:#2c3338;color:#f4f5f7}
  .msg-foot-btn[hidden]{display:none}

  /* --- panoramica -------------------------------------------------------- */
  .overview-item .project-icon{background:linear-gradient(135deg,#f5cd47,#579dff);color:#1d2125}
  .overview-item .project-icon svg{color:#1d2125}
  .overview-filters{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:0 24px 12px;
  }
  .overview-filters select{
    background:#22272b;border:1px solid #38414b;color:#f4f5f7;
    border-radius:6px;padding:6px 8px;
    font-family:inherit;font-size:12.5px;outline:none;
  }
  .overview-filters select:focus{border-color:#579dff}
  .overview-filters .chk{
    display:inline-flex;align-items:center;gap:6px;
    font-size:12.5px;color:#b6c2cf;cursor:pointer;user-select:none;
  }
  .overview-filters .chk input{accent-color:#579dff;width:15px;height:15px}
  .card.static{cursor:pointer}
  .card-project{
    display:inline-block;
    vertical-align:top;
    margin-bottom:6px;
    font-size:10.5px;font-weight:700;
    letter-spacing:0.3px;text-transform:uppercase;
    color:#9fadbc;
    background:#1d2125;
    border:1px solid #38414b;
    border-radius:4px;
    padding:1px 6px;
    max-width:100%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .column-empty{
    text-align:center;color:#738496;
    font-size:12px;padding:18px 10px;line-height:1.5;
  }

  /* --- archivio --------------------------------------------------------- */
  .column.library{
    background:#0f1215;
    border:1px solid #2a3340;
  }
  .column.library .lib-head{display:inline-flex;align-items:center;gap:6px}
  .column.library .lib-head svg{color:#9fadbc;flex-shrink:0}
  .column.library.file-over{
    outline:2px dashed #4bce97;
    outline-offset:-2px;
    background:#101a15;
  }
  .lib-items{
    flex:1;
    overflow-y:auto;
    padding:0 8px;
    scrollbar-width:thin;
    scrollbar-color:#38414b transparent;
    min-height:8px;
  }
  .lib-items::-webkit-scrollbar{width:8px}
  .lib-items::-webkit-scrollbar-track{background:transparent}
  .lib-items::-webkit-scrollbar-thumb{background:#38414b;border-radius:4px}
  .lib-item{
    background:#22272b;
    border:1px solid transparent;
    border-radius:8px;
    padding:8px 10px;
    margin-bottom:8px;
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
    position:relative;
    box-shadow:0 1px 0 rgba(0,0,0,0.25);
    transition:background 0.12s,border-color 0.12s;
  }
  .lib-item:hover{background:#2c3338;border-color:#38414b}
  .lib-icon{
    width:32px;height:32px;
    flex-shrink:0;
    border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    font-size:9px;font-weight:800;letter-spacing:0.3px;
    color:#1d2125;
    background:#8c9bab;
    text-transform:uppercase;
  }
  .lib-icon.link{background:#1c2b41;color:#85b8ff}
  .lib-icon.drive{background:#16301f;color:#4bce97}
  .lib-body{min-width:0;flex:1}
  .lib-title{
    color:#f4f5f7;
    font-size:13.5px;
    line-height:1.3;
    word-break:break-word;
  }
  .lib-meta{
    color:#8c9bab;
    font-size:11px;
    margin-top:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .lib-actions{
    position:absolute;
    top:6px;right:6px;
    opacity:0;
    transition:opacity 0.12s;
    display:flex;
  }
  .lib-item:hover .lib-actions{opacity:1}
  .lib-action{
    background:rgba(0,0,0,0.45);
    border:0;color:#9fadbc;
    width:22px;height:22px;border-radius:4px;
    display:inline-flex;align-items:center;justify-content:center;
    margin-left:2px;
    transition:background 0.12s,color 0.12s;
  }
  .lib-action:hover{background:#2c3338;color:#f4f5f7}
  .lib-action.danger:hover{background:#412a2a;color:#f87168}
  .lib-empty{
    color:#738496;
    font-size:12.5px;
    line-height:1.45;
    text-align:center;
    border:1px dashed #2a3340;
    border-radius:8px;
    padding:16px 12px;
    margin-bottom:8px;
  }
  .lib-warning{
    background:#412a2a;
    border:1px solid #5d3a3a;
    color:#ffbdad;
    font-size:11.5px;
    line-height:1.45;
    border-radius:8px;
    padding:9px 10px;
    margin-bottom:8px;
    word-break:break-word;
  }
  .lib-upload{
    background:#1c2b41;
    border:1px solid #2a4a75;
    border-radius:8px;
    padding:8px 10px;
    margin-bottom:8px;
    display:flex;align-items:center;gap:10px;
  }
  .lib-upload .lib-title{color:#b6c2cf}
  .lib-spinner{
    width:16px;height:16px;flex-shrink:0;
    border:2px solid #2a4a75;
    border-top-color:#85b8ff;
    border-radius:50%;
    animation:lib-spin 0.7s linear infinite;
  }
  @keyframes lib-spin{to{transform:rotate(360deg)}}
  .lib-drop-hint{
    display:none;
    margin:0 8px 8px;
    padding:14px 10px;
    border:2px dashed #4bce97;
    border-radius:8px;
    color:#4bce97;
    font-size:12.5px;
    font-weight:600;
    text-align:center;
  }
  .column.library.file-over .lib-drop-hint{display:block}
  .lib-buttons{display:flex;flex-direction:column}

  /* --- empty state ------------------------------------------------------ */
  .empty-board{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    color:#738496;
    text-align:center;
    padding:40px;
  }
  .empty-board h2{
    color:#b6c2cf;
    font-size:18px;
    margin:0 0 8px;
  }
  .empty-board p{margin:0 0 16px;font-size:14px}
  .empty-board .btn-primary{padding:9px 18px;font-size:14px}

  /* --- modal ------------------------------------------------------------ */
  .modal-backdrop{
    position:fixed;inset:0;
    background:rgba(0,0,0,0.6);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
    backdrop-filter:blur(2px);
  }
  .modal{
    background:#22272b;
    border:1px solid #38414b;
    border-radius:10px;
    padding:24px;
    width:100%;
    max-width:420px;
    box-shadow:0 24px 60px rgba(0,0,0,0.6);
  }
  .modal h2{
    margin:0 0 16px;
    color:#f4f5f7;
    font-size:16px;
    font-weight:700;
  }
  .modal label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:#9fadbc;
    font-weight:700;
    margin-bottom:6px;
  }
  .modal textarea,.modal input[type=text],.modal input[type=date]{
    width:100%;
    background:#1d2125;
    border:1px solid #38414b;
    color:#f4f5f7;
    border-radius:6px;
    padding:9px 11px;
    font-family:inherit;
    font-size:14px;
    outline:none;
    margin-bottom:14px;
  }
  .modal textarea{resize:vertical;min-height:80px}
  .modal textarea:focus,.modal input[type=text]:focus,.modal input[type=date]:focus{border-color:#579dff}
  .modal input[type=date]{color-scheme:dark;width:auto;min-width:180px}
  .col-select{
    width:100%;
    background:#1d2125;
    border:1px solid #38414b;
    color:#f4f5f7;
    border-radius:6px;
    padding:10px 11px;
    font-family:inherit;
    font-size:14px;
    outline:none;
    margin-bottom:14px;
    color-scheme:dark;
  }
  .col-select:focus{border-color:#579dff}

  /* Modulo "Nuovo impegno" del calendario */
  .cm-modal{max-width:560px;max-height:92vh;max-height:92dvh;overflow-y:auto}
  .cm-modal [hidden]{display:none !important}
  .cm-seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .cm-seg button{
    flex:1 1 auto;
    background:#1d2125;border:1px solid #38414b;color:#b6c2cf;
    border-radius:6px;padding:8px 10px;
    font-size:13px;font-weight:600;
    transition:background 0.12s,border-color 0.12s,color 0.12s;
  }
  .cm-seg button:hover{border-color:#579dff;color:#f4f5f7}
  .cm-seg button.on{background:#1c2b41;border-color:#579dff;color:#cce0ff}
  .cm-people{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .cm-person{
    --pc:#579dff;--pcbg:rgba(87,157,255,0.22);
    background:#1d2125;border:1px solid #38414b;color:#b6c2cf;
    border-radius:16px;padding:6px 12px 6px 10px;
    font-size:13px;font-weight:600;
    display:inline-flex;align-items:center;gap:7px;
    transition:background 0.12s,border-color 0.12s,color 0.12s;
  }
  .cm-person .dot{width:9px;height:9px;border-radius:50%;background:var(--pc)}
  .cm-person.on{background:var(--pcbg);border-color:var(--pc);color:#f4f5f7}
  .cm-person-add{border-style:dashed;color:#9fadbc;padding:6px 12px;font-size:14px}
  .cm-person-add:hover{border-color:#579dff;color:#cce0ff}
  .cm-add-person{display:flex;gap:6px;margin-bottom:10px}
  .modal .cm-add-person input{flex:1;min-width:0;margin:0}
  .cm-add-person button{flex-shrink:0;padding:8px 12px}
  .cm-row{display:flex;gap:10px;flex-wrap:wrap}
  .cm-row > div{flex:1 1 160px;min-width:0}
  .modal .cm-row input[type=date]{width:100%;min-width:0}
  .cm-time{display:flex;align-items:center;gap:4px;margin-bottom:14px;color:#9fadbc;font-weight:700}
  .cm-time .col-select{margin:0;flex:1;min-width:0;padding:9px 8px}
  .cm-time .col-select:disabled{opacity:0.45}
  .modal label.cm-check{
    display:flex;align-items:center;gap:8px;
    text-transform:none;letter-spacing:0;
    font-size:13px;font-weight:600;color:#b6c2cf;
    cursor:pointer;margin-bottom:10px;
  }
  .cm-check input{width:16px;height:16px;accent-color:#579dff;margin:0}
  .cm-days{display:flex;gap:4px;margin-bottom:12px}
  .cm-days button{
    flex:1;max-width:44px;height:34px;
    background:#1d2125;border:1px solid #38414b;color:#b6c2cf;
    border-radius:6px;font-weight:700;font-size:13px;
  }
  .cm-days button.on{background:#1c2b41;border-color:#579dff;color:#cce0ff}
  .cm-series-note{font-size:12.5px;color:#9fadbc;margin:0 0 14px;line-height:1.45}
  .cm-error{color:#f87168;font-size:13px;font-weight:600;min-height:18px;margin:0 0 6px}
  .modal .cm-invalid{border-color:#f87168 !important}
  .cm-ask-text{color:#b6c2cf;font-size:14px;line-height:1.5;margin:0 0 12px;white-space:pre-line}
  .cm-ask-actions{flex-wrap:wrap}

  /* Pannello Apple Calendar */
  .ap-box{background:#1d2125;border:1px solid #38414b;border-radius:8px;padding:14px;margin-bottom:14px}
  .ap-box h3{margin:0 0 6px;color:#f4f5f7;font-size:14px}
  .ap-text{color:#9fadbc;font-size:13px;line-height:1.5;margin:0 0 10px}
  .ap-text b{color:#cce0ff}
  .ap-small{font-size:12px;margin:8px 0 0}
  .ap-steps{color:#9fadbc;font-size:12.5px;line-height:1.5;margin:0 0 12px;padding-left:18px}
  .ap-steps b{color:#cce0ff}
  .ap-link{display:flex;gap:6px;align-items:flex-start}
  .modal .ap-link input[type=text]{margin-bottom:8px;font-size:12px}
  .modal .ap-box input[type=text]#ap-url{margin-bottom:10px}
  .ap-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .ap-open{text-decoration:none;display:inline-block}
  .ap-status{color:#9fadbc;font-size:12px;margin:10px 0 0}

  /* Pannello "Sposta progetto": l'alternativa al trascinamento. */
  .move-label{
    margin:0 0 8px;
    font-size:11px;text-transform:uppercase;letter-spacing:0.5px;
    color:#9fadbc;font-weight:700;
  }
  .move-group{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .move-opt{
    flex:1 1 auto;min-height:44px;
    background:#1d2125;border:1px solid #38414b;color:#f4f5f7;
    border-radius:8px;padding:11px 14px;
    font-family:inherit;font-size:14px;font-weight:600;
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    transition:background 0.12s,border-color 0.12s;
  }
  .move-opt:hover:not(:disabled){background:#2c3338;border-color:#579dff}
  .move-opt:disabled{opacity:0.55;cursor:default}
  .move-opt.current{background:#1c2b41;border-color:#1c2b41;color:#cce0ff}
  .move-hint{font-weight:600;text-transform:none;letter-spacing:0;color:#738496}
  .move-now{font-size:11px;font-weight:600;opacity:0.7;text-transform:uppercase;letter-spacing:0.4px}
  .project-move{
    opacity:0;
    background:transparent;border:0;color:#9fadbc;
    width:22px;height:22px;border-radius:4px;
    display:inline-flex;align-items:center;justify-content:center;
    transition:opacity 0.12s,background 0.12s,color 0.12s;
  }
  .project-item:hover .project-move{opacity:1}
  .project-move:hover{background:#2c3338;color:#f4f5f7}
  .modal .actions{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin-top:8px;
  }

  /* --- topbar button (calendar) ----------------------------------------- */
  .topbar-btn{
    background:transparent;border:1px solid #38414b;color:#b6c2cf;
    padding:6px 12px;border-radius:6px;
    display:inline-flex;align-items:center;gap:6px;
    font-size:13px;font-weight:600;
    transition:background 0.12s,color 0.12s,border-color 0.12s;
  }
  .topbar-btn:hover{background:#2c3338;color:#f4f5f7;border-color:#579dff}
  .topbar-btn svg{flex-shrink:0}

  /* --- calendar overlay ------------------------------------------------- */
  .cal-overlay{
    position:fixed;inset:0;
    background:#1d2125;
    z-index:50;
    display:flex;flex-direction:column;
    visibility:hidden;
    opacity:0;
    transition:opacity 0.18s;
  }
  .cal-overlay.show{visibility:visible;opacity:1}

  .cal-header{
    padding:12px 20px;
    border-bottom:1px solid #2c3338;
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
  }
  .cal-title{
    font-size:18px;font-weight:700;color:#f4f5f7;
    display:flex;align-items:center;gap:10px;
    margin:0;
  }
  .cal-title svg{color:#579dff}
  .cal-spacer{flex:1}
  .cal-nav{
    display:flex;align-items:center;gap:2px;
  }
  .cal-nav-btn{
    background:#22272b;border:1px solid #38414b;color:#b6c2cf;
    width:30px;height:30px;
    border-radius:6px;
    display:inline-flex;align-items:center;justify-content:center;
    transition:background 0.12s,color 0.12s;
  }
  .cal-nav-btn:hover{background:#2c3338;color:#f4f5f7}
  .cal-today-btn{
    background:#22272b;border:1px solid #38414b;color:#b6c2cf;
    padding:6px 12px;border-radius:6px;
    font-size:12px;font-weight:600;
    transition:background 0.12s,color 0.12s;
  }
  .cal-today-btn:hover{background:#2c3338;color:#f4f5f7}
  .cal-period{
    color:#f4f5f7;font-weight:700;font-size:15px;
    min-width:200px;text-align:center;
    text-transform:capitalize;
  }
  .cal-views{
    display:inline-flex;background:#22272b;border:1px solid #38414b;border-radius:6px;padding:2px;
  }
  .cal-views button{
    background:transparent;border:0;color:#9fadbc;
    padding:6px 14px;border-radius:4px;
    font-size:12px;font-weight:600;
    transition:background 0.12s,color 0.12s;
  }
  .cal-views button.active{background:#1c2b41;color:#cce0ff}
  .cal-views button:hover:not(.active){background:#2c3338;color:#f4f5f7}
  .cal-add-btn{
    background:#579dff;color:#1d2125;
    border:0;padding:7px 14px;border-radius:6px;
    font-weight:700;font-size:13px;
    display:inline-flex;align-items:center;gap:6px;
    transition:background 0.12s;
  }
  .cal-add-btn:hover{background:#85b8ff}
  .cal-close{
    background:transparent;border:0;color:#9fadbc;
    width:32px;height:32px;border-radius:6px;
    display:inline-flex;align-items:center;justify-content:center;
    transition:background 0.12s,color 0.12s;
  }
  .cal-close:hover{background:#412a2a;color:#f87168}

  .cal-main{flex:1;display:flex;overflow:hidden}
  .cal-side{
    width:220px;flex-shrink:0;
    background:#1d2125;
    border-right:1px solid #2c3338;
    padding:12px 10px;
    overflow-y:auto;
    display:flex;flex-direction:column;
    gap:2px;
  }
  .cal-side h3{
    margin:0 0 8px;padding:0 8px;
    font-size:11px;font-weight:700;color:#9fadbc;
    text-transform:uppercase;letter-spacing:0.6px;
  }
  .cal-person-row{
    display:flex;align-items:center;gap:10px;
    padding:7px 8px;
    border-radius:6px;
    cursor:pointer;
    user-select:none;
    font-size:13px;
    color:#b6c2cf;
    transition:background 0.12s;
    --pc:#579dff;
  }
  .cal-person-row:hover{background:#2c3338}
  .cal-person-row.all{
    font-weight:700;color:#cce0ff;
    margin-bottom:4px;
  }
  .cal-cb{
    width:16px;height:16px;
    border:2px solid #38414b;
    border-radius:4px;
    flex-shrink:0;
    background:#1d2125;
    position:relative;
    transition:background 0.12s,border-color 0.12s;
  }
  .cal-person-row.checked .cal-cb{
    background:var(--pc);
    border-color:var(--pc);
  }
  .cal-person-row.checked .cal-cb::after{
    content:"";
    position:absolute;
    left:4px;top:1px;
    width:4px;height:8px;
    border:solid #1d2125;
    border-width:0 2px 2px 0;
    transform:rotate(45deg);
  }
  .cal-person-name{
    flex:1;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .cal-person-count{
    background:#22272b;
    color:#9fadbc;
    font-size:10px;font-weight:700;
    padding:1px 7px;border-radius:10px;
    flex-shrink:0;
  }
  .cal-side-divider{
    height:1px;background:#2c3338;
    margin:6px 4px;
  }
  .cal-side-actions{
    display:flex;gap:6px;margin:6px 0 4px;
  }
  .cal-side-actions button{
    flex:1;
    background:#22272b;border:1px solid #38414b;color:#9fadbc;
    padding:5px 8px;border-radius:4px;
    font-size:11px;font-weight:600;
    transition:background 0.12s,color 0.12s;
  }
  .cal-side-actions button:hover{background:#2c3338;color:#f4f5f7}
  .cal-side h3.cal-side-sub{margin:12px 0 6px}
  .cal-person-row.inactive .cal-person-name{color:#738496;font-style:italic}
  .cal-person-del{
    background:none;border:0;color:#738496;
    width:20px;height:20px;border-radius:4px;flex-shrink:0;
    font-size:15px;line-height:1;padding:0;
    opacity:0;transition:opacity 0.12s,background 0.12s,color 0.12s;
  }
  .cal-person-row:hover .cal-person-del,.cal-person-del:focus-visible{opacity:1}
  .cal-person-del:hover{background:#3d2a2a;color:#f87168}
  .cal-add-person{
    display:flex;align-items:center;gap:10px;
    background:none;border:1px dashed #38414b;border-radius:6px;
    color:#9fadbc;font-size:13px;font-weight:600;
    padding:6px 8px;margin-top:4px;text-align:left;
    transition:background 0.12s,border-color 0.12s,color 0.12s;
  }
  .cal-add-person:hover{background:#22272b;border-color:#579dff;color:#cce0ff}
  .cal-add-plus{width:16px;text-align:center;font-size:16px;line-height:1}
  .cal-months{
    margin-top:12px;padding:10px 8px 8px;
    border:1px solid #2c3338;border-radius:8px;
  }
  .cal-months h3{padding:0;margin-bottom:6px}
  .cal-months.ask{border-color:#f5cd47;background:rgba(245,205,71,0.06)}
  .cal-months-ask{margin:0 0 8px;font-size:12px;font-weight:600;color:#f5cd47}
  .cal-months-grid{
    display:grid;grid-template-columns:1fr 34px 34px;gap:4px 6px;align-items:center;
    font-size:12px;color:#b6c2cf;
  }
  .cal-months-grid > span:not(.cal-months-name){font-size:10px;font-weight:700;color:#9fadbc;text-transform:uppercase;text-align:center}
  .cal-months-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cal-months-cell{
    height:24px;border-radius:4px;padding:0;
    background:#22272b;border:1px solid #38414b;color:#738496;
    font-size:12px;font-weight:700;
  }
  .cal-months-cell.on{background:rgba(75,206,151,0.16);border-color:#4bce97;color:#4bce97}
  .cal-months-cell.open{border-style:dashed;border-color:#f5cd47;color:#f5cd47;background:transparent}
  .cal-months-cell:hover{filter:brightness(1.3)}
  .cal-months-hint{margin:8px 0 0;font-size:11px;color:#738496;line-height:1.35}
  .cal-acell.off,.cal-wcell.off,.cal-mslot.off,.cal-dfree.off{
    background:repeating-linear-gradient(135deg,transparent 0 5px,rgba(159,173,188,0.06) 5px 10px);
    cursor:default;
  }
  .cal-acell.off:hover,.cal-wcell.off:hover{background:repeating-linear-gradient(135deg,transparent 0 5px,rgba(159,173,188,0.06) 5px 10px)}
  .cal-dfree.off{color:#738496;border-style:solid}

  .cal-body{flex:1;overflow:hidden;display:flex;flex-direction:column;background:#101204}

  /* Month view */
  .cal-month{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .cal-month-headrow{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    background:#1d2125;
    border-bottom:1px solid #2c3338;
  }
  .cal-month-headrow > div{
    padding:8px 12px;
    font-size:11px;text-transform:uppercase;letter-spacing:0.5px;
    font-weight:700;color:#9fadbc;
    border-right:1px solid #2c3338;
  }
  .cal-month-headrow > div:last-child{border-right:0}
  .cal-month-grid{
    flex:1;
    display:grid;
    grid-template-columns:repeat(7,1fr);
    grid-auto-rows:minmax(100px,1fr);
    overflow-y:auto;
  }
  .cal-day-cell{
    background:#1d2125;
    border-right:1px solid #2c3338;
    border-bottom:1px solid #2c3338;
    padding:6px 6px 4px;
    display:flex;flex-direction:column;
    cursor:pointer;
    transition:background 0.12s;
    overflow:hidden;
  }
  .cal-day-cell:hover{background:#22272b}
  .cal-day-cell.other-month{background:#161a1d}
  .cal-day-cell.other-month .cal-day-num{color:#5c6c7e}
  .cal-day-cell.today{background:#1c2b41}
  .cal-day-cell.today .cal-day-num{
    background:#579dff;color:#1d2125;
    border-radius:50%;width:24px;height:24px;
    display:inline-flex;align-items:center;justify-content:center;
    font-weight:700;
  }
  .cal-day-num{
    font-size:12px;font-weight:600;color:#b6c2cf;
    align-self:flex-start;
    padding:0 4px;
    margin-bottom:4px;
  }
  /* Una riga per persona (ordine fisso), due caselle: mattina | pomeriggio */
  .cal-month-halves{display:flex;gap:4px;margin-top:2px;font-size:9px;font-weight:600;color:#738496;letter-spacing:0.3px;text-transform:none}
  .cal-month-halves span{flex:1}
  .cal-mgrid{display:grid;grid-template-columns:1fr 1fr;gap:2px;align-content:start}
  .cal-mslot{
    --pc:#579dff;--pcbg:rgba(87,157,255,0.22);
    height:14px;border-radius:2px;
    background:#191d21;
    border-left:2px solid transparent;
    color:#f4f5f7;font-size:9.5px;line-height:14px;
    padding:0 3px;
    overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  }
  .cal-day-cell.other-month .cal-mslot{opacity:0.55}
  .cal-mslot.full{background:var(--pcbg);border-left-color:var(--pc);cursor:pointer}
  .cal-mslot.full:hover{filter:brightness(1.25)}
  .cal-mslot.k-extra{background:repeating-linear-gradient(135deg,#323a41 0 4px,#22272b 4px 8px);color:#b6c2cf}
  .cal-mslot.k-ferie{background:repeating-linear-gradient(45deg,var(--pcbg) 0 4px,transparent 4px 8px);font-weight:700}
  .cal-mslot.tentative{outline:1px dashed var(--pc);outline-offset:-1px;font-style:italic}

  /* Week view: la griglia del vecchio foglio "chi fa cosa". Una riga per
     persona, sempre nello stesso ordine, divisa in mattina e pomeriggio:
     le righe restano allineate su tutta la settimana. */
  .cal-week{flex:1;overflow:auto;background:#1d2125}
  .cal-wgrid{
    display:grid;
    grid-template-columns:112px repeat(7,minmax(118px,1fr));
    min-width:938px;
  }
  .cal-wgrid > div{border-right:1px solid #2c3338;border-bottom:1px solid #2c3338;min-width:0}
  .cal-wcorner{position:sticky;top:0;left:0;z-index:4;background:#1d2125}
  .cal-week-head{
    position:sticky;top:0;z-index:3;
    background:#1d2125;
    padding:8px 10px;
    cursor:pointer;
    transition:background 0.12s;
  }
  .cal-week-head:hover{background:#22272b}
  .cal-week-head.today{background:#1c2b41}
  .cal-week-head.today .cal-week-day-num{color:#579dff}
  .cal-week-day-name{font-size:11px;color:#9fadbc;text-transform:uppercase;letter-spacing:0.5px;font-weight:700}
  .cal-week-day-num{font-size:18px;font-weight:700;color:#f4f5f7;margin-top:1px}
  .cal-wband{
    grid-column:1 / -1;
    background:#161a1d;
    padding:5px 0;
    font-size:11px;font-weight:700;color:#9fadbc;
    text-transform:uppercase;letter-spacing:0.6px;
  }
  .cal-wband span{position:sticky;left:10px;padding:0 10px}
  .cal-wlabel{
    position:sticky;left:0;z-index:2;
    background:#1d2125;
    padding:6px 8px;
    display:flex;align-items:center;gap:7px;
    font-size:12px;font-weight:600;color:#b6c2cf;
  }
  .cal-wlabel-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cal-wcell{
    padding:3px;min-height:30px;
    display:flex;flex-direction:column;gap:3px;
    cursor:pointer;
    transition:background 0.12s;
  }
  .cal-wcell:hover{background:#22272b}
  .cal-wcell.today{background:rgba(28,43,65,0.45)}
  .cal-chip{
    --pc:#579dff;--pcbg:rgba(87,157,255,0.22);
    background:var(--pcbg);
    border-left:3px solid var(--pc);
    border-radius:3px;
    padding:3px 6px;
    color:#f4f5f7;font-size:11.5px;line-height:1.3;
    word-wrap:break-word;overflow-wrap:anywhere;
    cursor:pointer;
  }
  .cal-chip:hover{filter:brightness(1.2)}
  .cal-chip-time{display:block;font-size:10px;font-weight:700;color:#9fadbc;letter-spacing:0.2px}
  .cal-chip-proj{display:block;font-size:10px;color:#9fadbc;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cal-chip.k-extra,.cal-day-event-card.k-extra{background:repeating-linear-gradient(135deg,#323a41 0 6px,#22272b 6px 12px);color:#b6c2cf}
  .cal-chip.k-ferie,.cal-day-event-card.k-ferie{background:repeating-linear-gradient(45deg,var(--pcbg) 0 6px,transparent 6px 12px);font-weight:700}
  .cal-chip.tentative{outline:1px dashed var(--pc);outline-offset:-1px;font-style:italic}
  .cal-tag{
    display:inline-block;
    font-size:9px;font-weight:800;letter-spacing:0.4px;text-transform:uppercase;
    padding:1px 5px;border-radius:3px;
    background:#38414b;color:#cce0ff;
    margin-right:4px;vertical-align:1px;font-style:normal;
  }
  .cal-tag.warn{background:#5c4a14;color:#f5cd47}
  .cal-person-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}

  /* Agenda: giorni in verticale (due righe: mattina e pomeriggio),
     persone in orizzontale, scorrimento senza fine. */
  .cal-agenda{
    --alabel:64px;--ahalf:44px;--acol:118px;
    flex:1;overflow:auto;
    position:relative;          /* offsetTop dei giorni misurato da qui */
    overflow-anchor:none;       /* la posizione la tiene lo script quando aggiunge giorni sopra */
    background:#1d2125;
    overscroll-behavior:contain;
  }
  .cal-ahead,.cal-aday,.cal-aband,.cal-search-info{min-width:calc(var(--alabel) + var(--ahalf) + var(--acols, 6) * var(--acol))}
  .cal-ahead{
    display:grid;
    position:sticky;top:0;z-index:6;
    background:#1d2125;
    border-bottom:1px solid #38414b;
    box-shadow:0 4px 10px rgba(0,0,0,0.25);
  }
  .cal-ahead > div{
    padding:9px 8px;
    border-right:1px solid #2c3338;
    font-size:12px;font-weight:700;color:#f4f5f7;
    display:flex;align-items:center;gap:7px;
    min-width:0;overflow:hidden;white-space:nowrap;
  }
  .cal-ahead-person span:last-child{overflow:hidden;text-overflow:ellipsis}
  .cal-ahead-corner,.cal-ahead-half{position:sticky;z-index:2;background:#1d2125}
  .cal-ahead-corner{left:0;color:#9fadbc !important;font-size:10px !important;text-transform:uppercase;letter-spacing:0.5px}
  .cal-ahead-half{left:var(--alabel)}
  .cal-aband{
    background:#161a1d;
    border-bottom:1px solid #2c3338;
    padding:7px 0;
    font-size:11px;font-weight:700;color:#cce0ff;
    text-transform:uppercase;letter-spacing:0.7px;
  }
  .cal-aband span{position:sticky;left:12px;padding:0 12px}
  .cal-aday{
    display:grid;
    grid-template-rows:auto auto;
    border-bottom:1px solid #38414b;
  }
  .cal-aday.past{opacity:0.4}
  .cal-alabel{
    grid-row:1 / span 2;
    position:sticky;left:0;z-index:2;
    background:#1d2125;
    border-right:1px solid #2c3338;
    padding:8px 6px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    cursor:pointer;
    transition:background 0.12s;
  }
  .cal-alabel:hover{background:#22272b}
  .cal-alabel-dow{font-size:10px;font-weight:700;color:#9fadbc;text-transform:uppercase;letter-spacing:0.5px}
  .cal-alabel-num{font-size:20px;font-weight:700;color:#f4f5f7;line-height:1.1}
  .cal-alabel-mon{font-size:10px;color:#738496;text-transform:uppercase;letter-spacing:0.4px}
  .cal-aday.weekend .cal-alabel{background:#1a1e22}
  .cal-aday.weekend .cal-alabel-num{color:#b6c2cf}
  .cal-aday.today .cal-alabel{background:#1c2b41}
  .cal-aday.today .cal-alabel-num,.cal-aday.today .cal-alabel-dow{color:#579dff}
  .cal-ahalf{
    position:sticky;left:var(--alabel);z-index:2;
    background:#1d2125;
    border-right:1px solid #2c3338;
    border-bottom:1px dashed #2c3338;
    padding:6px 4px;
    font-size:10px;font-weight:700;color:#738496;
    text-transform:uppercase;letter-spacing:0.4px;
    display:flex;align-items:center;justify-content:center;
  }
  .cal-ahalf.pm,.cal-acell.pm{border-bottom:0}
  .cal-acell{
    border-right:1px solid #2c3338;
    border-bottom:1px dashed #2c3338;
    padding:3px;min-height:30px;min-width:0;
    display:flex;flex-direction:column;gap:3px;
    cursor:pointer;
    transition:background 0.12s;
  }
  .cal-acell:hover{background:#22272b}
  .cal-aday.today .cal-acell{background:rgba(28,43,65,0.35)}
  .cal-search-info{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    padding:8px 14px;
    background:#1c2b41;color:#cce0ff;font-size:13px;
    border-bottom:1px solid #2c3338;
  }
  .cal-search-info .btn-cancel{color:#85b8ff}

  /* Stella "vista predefinita" accanto ai pulsanti delle viste */
  .cal-default-btn{display:inline-flex;align-items:center;gap:6px}
  .cal-default-btn.on{color:#f5cd47;border-color:#5c4a14;background:#2a2414;cursor:default}
  .cal-default-btn.on svg{fill:currentColor}

  /* Barra di ricerca nell'intestazione */
  .cal-search{
    position:relative;
    display:flex;align-items:center;
    flex:0 1 340px;min-width:180px;
    color:#738496;
  }
  .cal-search > svg{position:absolute;left:10px;pointer-events:none}
  .cal-search input{
    width:100%;
    background:#22272b;border:1px solid #38414b;color:#f4f5f7;
    border-radius:6px;
    padding:7px 30px 7px 31px;
    font-family:inherit;font-size:13px;
    outline:none;
    -webkit-appearance:none;appearance:none;
  }
  .cal-search input::-webkit-search-cancel-button{display:none}
  .cal-search input:focus{border-color:#579dff;background:#1d2125}
  .cal-search-clear{
    position:absolute;right:4px;
    width:24px;height:24px;border:0;border-radius:4px;
    background:transparent;color:#9fadbc;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .cal-search-clear:hover{background:#2c3338;color:#f4f5f7}
  .cal-search-clear[hidden]{display:none}

  .cal-banner{
    background:#3a2f12;color:#f5cd47;
    border-bottom:1px solid #5c4a14;
    padding:8px 16px;font-size:13px;line-height:1.4;
    flex-shrink:0;
  }
  .cal-legend{margin-top:14px;padding-top:10px;border-top:1px solid #2c3338;display:flex;flex-direction:column;gap:6px}
  .cal-legend h3{margin-bottom:2px}
  .cal-legend > div{display:flex;align-items:center;gap:8px;padding:0 8px;font-size:12px;color:#9fadbc}
  .cal-legend-sw{
    --pc:#579dff;--pcbg:rgba(87,157,255,0.3);
    width:22px;height:12px;border-radius:2px;flex-shrink:0;
    background:var(--pcbg);border-left:3px solid var(--pc);
  }
  .cal-legend-sw.k-extra{background:repeating-linear-gradient(135deg,#4a545e 0 3px,#22272b 3px 6px)}
  .cal-legend-sw.k-ferie{background:repeating-linear-gradient(45deg,var(--pcbg) 0 3px,transparent 3px 6px)}
  .cal-legend-sw.tentative{outline:1px dashed var(--pc);outline-offset:-1px}

  /* Day view */
  .cal-day-view{
    flex:1;
    display:flex;flex-direction:column;
    overflow:hidden;
    background:#101204;
  }
  .cal-day-view-head{
    padding:18px 24px;
    border-bottom:1px solid #2c3338;
    background:#1d2125;
    text-align:center;
  }
  .cal-day-view-head h3{
    margin:0;color:#f4f5f7;
    font-size:24px;font-weight:700;
    text-transform:capitalize;
  }
  .cal-day-view-head.today h3 span.daynum{color:#579dff}
  .cal-day-scroll{flex:1;overflow-y:auto;padding-bottom:24px}
  .cal-dsec{max-width:900px;margin:0 auto;width:100%;padding:16px 24px 0}
  .cal-dsec h4{
    margin:0 0 6px;
    font-size:11px;font-weight:700;color:#9fadbc;
    text-transform:uppercase;letter-spacing:0.6px;
  }
  .cal-drow{
    display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:start;
    padding:6px 0;border-bottom:1px solid #2c3338;
  }
  .cal-dname{display:flex;align-items:center;gap:8px;font-weight:600;color:#f4f5f7;font-size:13px;padding-top:9px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cal-dcards{display:flex;flex-direction:column;gap:6px;min-width:0}
  .cal-dfree{
    display:flex;justify-content:space-between;align-items:center;
    width:100%;
    background:transparent;border:1px dashed #2c3338;border-radius:6px;
    color:#5c6c7e;font-size:12px;font-family:inherit;
    padding:9px 12px;text-align:left;
    transition:color 0.12s,border-color 0.12s;
  }
  .cal-dfree-add{opacity:0;transition:opacity 0.12s;font-weight:600}
  .cal-dfree:hover{color:#cce0ff;border-color:#579dff}
  .cal-dfree:hover .cal-dfree-add{opacity:1}
  .cal-dnone{color:#738496;font-size:13px}
  .cal-day-event-card{
    --pc:#579dff;--pcbg:rgba(87,157,255,0.22);
    background:#1d2125;
    border:1px solid #2c3338;
    border-left:4px solid var(--pc);
    padding:12px 16px;
    border-radius:6px;
    cursor:pointer;
    display:flex;align-items:flex-start;gap:14px;
    transition:background 0.12s,border-color 0.12s;
  }
  .cal-day-event-card:hover{background:#22272b;border-color:#38414b}
  .cal-day-event-card.tentative{border-style:dashed;border-left-style:solid}
  .cal-day-event-card.tentative .cal-day-event-title{font-style:italic}
  .cal-day-event-time{
    color:#cce0ff;font-weight:700;font-size:13px;
    min-width:90px;flex-shrink:0;
    padding-top:1px;
  }
  .cal-day-event-time.notime{color:#738496;font-style:italic;font-weight:600}
  .cal-day-event-body{flex:1;min-width:0}
  .cal-day-event-title{color:#f4f5f7;font-size:15px;font-weight:600;margin-bottom:4px;word-wrap:break-word}
  .cal-day-event-meta{color:#9fadbc;font-size:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .cal-day-event-notes{color:#9fadbc;font-size:12px;margin-top:6px;line-height:1.4;white-space:pre-wrap}

  .cal-empty{
    text-align:center;color:#738496;padding:80px 24px;font-size:14px;
  }
  .cal-empty h3{margin:0 0 8px;color:#b6c2cf;font-size:16px;font-weight:600}
  .cal-empty p{margin:0 0 18px}

  /* --- mobile drawer toggles (hidden on desktop) ----------------------- */
  .sidebar-toggle,
  .cal-side-toggle{display:none}
  .sidebar-backdrop{
    display:none;position:fixed;inset:0;
    background:rgba(0,0,0,0.5);
    z-index:55;opacity:0;pointer-events:none;
    transition:opacity 0.18s;
  }
  .cal-side-backdrop{
    display:none;position:absolute;inset:0;
    background:rgba(0,0,0,0.45);
    z-index:4;opacity:0;pointer-events:none;
    transition:opacity 0.18s;
  }

  /* --- responsive ------------------------------------------------------- */
  @media (max-width:780px){
    .app{
      grid-template-columns:1fr;
      grid-template-areas:"topbar" "board";
      grid-template-rows:88px 1fr;
    }
    .topbar{
      padding:6px 10px;gap:8px;
      flex-wrap:wrap;
      align-content:center;
      row-gap:6px;
    }
    .topbar-logo{font-size:13px}
    .topbar-logo span{display:none}
    .topbar-logo img{height:22px}
    /* I tab passano a una riga propria, sotto logo e azioni */
    .area-tabs{
      order:1;
      flex:1 1 100%;min-width:0;
      overflow-x:auto;
      scrollbar-width:none;
    }
    .area-tabs::-webkit-scrollbar{display:none}
    .area-tabs button{flex:1;padding:7px 10px;font-size:11.5px}

    /* Hamburger toggle */
    .sidebar-toggle{
      display:inline-flex;
      background:transparent;border:0;color:#b6c2cf;
      width:38px;height:38px;border-radius:6px;
      align-items:center;justify-content:center;
      flex-shrink:0;
      transition:background 0.12s,color 0.12s;
    }
    .sidebar-toggle:hover,.sidebar-toggle:active{background:#2c3338;color:#f4f5f7}
    .sidebar-toggle.active{background:#1c2b41;color:#cce0ff}

    /* Sidebar becomes off-canvas drawer */
    .sidebar{
      display:flex;
      position:fixed;
      top:calc(88px + env(safe-area-inset-top,0px));left:0;bottom:0;
      width:80%;max-width:300px;
      border-right:1px solid #2c3338;
      z-index:60;
      transform:translateX(-100%);
      transition:transform 0.22s cubic-bezier(.4,0,.2,1);
      box-shadow:8px 0 24px rgba(0,0,0,0.5);
    }
    .sidebar.drawer-open{transform:translateX(0)}
    .sidebar-backdrop{display:block;top:calc(88px + env(safe-area-inset-top,0px))}
    .sidebar-backdrop.show{opacity:1;pointer-events:auto}

    /* Project items: bigger tap targets */
    .project-item{padding:10px 8px}
    .project-icon{width:26px;height:26px;font-size:12px}
    .project-name{font-size:15px}
    .project-delete{opacity:1;width:30px;height:30px}
    .project-move{opacity:1;width:30px;height:30px}
    .project-share{opacity:1;width:30px;height:30px}
    .label-head{padding:9px 4px 7px}
    .label-btn{opacity:1;width:28px;height:28px}

    /* Top bar buttons */
    .topbar-btn{padding:7px 10px;border-radius:6px}
    .topbar-btn span{display:none}

    /* Board */

<script>
/* =====================================================================
 * Auth gate + data layer (Supabase)
 * ===================================================================== */
var sb = window.beClient;
var DEFAULT_COLUMNS = ["To Do", "In Progress", "Done"];

function uid(prefix){
  return prefix + "_" + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3);
}

/* =====================================================================
 * State
 * ===================================================================== */
var AREAS = ["in_progettazione", "in_corso", "amministrazione"];
var DEFAULT_AREA = "in_corso";
function normalizeArea(a){ return AREAS.indexOf(a) >= 0 ? a : DEFAULT_AREA; }

var state = {
  me: null, profiles: [], projects: [], activeProjectId: null,
  area: DEFAULT_AREA,                              /* dashboard attiva in topbar */
  view: "board",                                   /* "board" | "overview" */
  overviewFilter: { projectId: "", onlyDue: false },
  alerts: [], msgHighlight: [],
  library: {}, libraryError: null, cardDatesError: null, areaError: null,
  labels: [],                                      /* le label dell'utente collegato */
  projectLabels: {},                               /* project_id -> label_id (solo mie) */
  labelsError: null
};

function areaProjects(){
  return state.projects.filter(function(p){ return p.area === state.area; });
}
function syncActiveProject(){
  var inArea = areaProjects();
  if(!inArea.some(function(p){ return p.id === state.activeProjectId; })){
    state.activeProjectId = inArea.length ? inArea[0].id : null;
  }
}
function getActiveProject(){
  var inArea = areaProjects();
  return inArea.find(function(p){ return p.id === state.activeProjectId; }) || inArea[0] || null;
}
function profileName(userId){
  var p = state.profiles.find(function(x){ return x.id === userId; });
  return p ? p.display_name : "?";
}

/* =====================================================================
 * Errori e rete
 *
 * supabase-js non rigetta sugli errori di rete: li restituisce dentro
 * res.error. Senza distinguerli, offline l'app mostrava all'utente il
 * messaggio grezzo della libreria ("TypeError: Load failed").
 * ===================================================================== */
function isNetworkError(err){
  if(!navigator.onLine) return true;
  if(!err) return false;
  if(err.status === 0) return true;
  if(err.name === "AuthRetryableFetchError") return true;
  return /fetch|network|load failed|failed to fetch/i.test(err.message || "");
}

function errorText(err, fallback){
  if(isNetworkError(err)) return "Sei offline: la modifica non è stata salvata.";
  return (fallback || "Errore") + ": " + ((err && err.message) || "imprevisto");
}

/* Pannello a tutta board: usato quando non c'e' proprio nulla da mostrare
   (offline al primo avvio, oppure errore bloccante). Prima al suo posto
   c'era una shell vuota piu' un alert nativo. */
function showBoardPanel(title, text, actionLabel, onAction){
  var $b = document.getElementById("board");
  if(!$b) return;
  $b.innerHTML = "";
  var box = document.createElement("div");
  box.className = "empty-board";
  var h = document.createElement("h2");
  h.textContent = title;
  var p = document.createElement("p");
  p.textContent = text;
  box.appendChild(h);
  box.appendChild(p);
  if(actionLabel){
    var btn = document.createElement("button");
    btn.className = "btn-primary";
    btn.textContent = actionLabel;
    btn.addEventListener("click", onAction);
    box.appendChild(btn);
  }
  $b.appendChild(box);
}

function showOfflinePanel(){
  showBoardPanel(
    "Sei offline",
    "Non riesco a raggiungere il server. I progetti torneranno appena la connessione sarà disponibile.",
    "Riprova",
    function(){ boot(); }
  );
}

function showErrorPanel(title, detail){
  showBoardPanel(title, detail || "Errore imprevisto.", "Riprova", function(){ boot(); });
}

/* Un avviso in pagina al posto di alert(): non blocca, non sembra un
   errore di sistema, e usa il toast condiviso quando c'e'. */
function notify(message, opts){
  opts = opts || {};
  if(window.bePWA && window.bePWA.toast){
    window.bePWA.toast({
      kind: opts.kind || "app",
      html: String(message).replace(/</g, "&lt;"),
      warn: opts.warn !== false,
      autoHide: opts.autoHide || 6000
    });
    return;
  }
  alert(message);
}

/* Le colonne due_date/done_at potrebbero non essere ancora state migrate:
   in quel caso si ricarica senza, e la UI delle date resta nascosta. */
async function fetchCards(){
  var full = await sb.from("be_cards")
    .select("id, project_id, column_id, title, priority, position, due_date, done_at")
    .order("position", { ascending: true });
  if(!full.error){ state.cardDatesError = null; return full; }
  var basic = await sb.from("be_cards")
    .select("id, project_id, column_id, title, priority, position")
    .order("position", { ascending: true });
  if(!basic.error) state.cardDatesError = full.error.message;
  return basic;
}

/* =====================================================================
 * Date: scadenza (liste di lavoro) e completamento (lista Done)
 * ===================================================================== */
var DONE_COLUMN_NAMES = ["done","fatto","fatti","completato","completati","completed","finito","finiti","chiuso","chiusi"];

function doneColumnId(proj){
  var cols = (proj.columns || []).slice().sort(function(a,b){ return a.position - b.position; });
  if(!cols.length) return null;
  var byName = cols.find(function(c){
    return DONE_COLUMN_NAMES.indexOf((c.name || "").trim().toLowerCase()) >= 0;
  });
  return byName ? byName.id : cols[cols.length - 1].id;
}

function todayISO(){
  var d = new Date();
  return d.getFullYear() + "-" +
    String(d.getMonth() + 1).padStart(2, "0") + "-" +
    String(d.getDate()).padStart(2, "0");
}

function parseISODate(iso){
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || "");
  return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
}

function formatDateIT(iso){
  var d = parseISODate(iso);
  if(!d) return "";
  var opts = { day: "numeric", month: "short" };
  if(d.getFullYear() !== new Date().getFullYear()) opts.year = "numeric";
  return d.toLocaleDateString("it-IT", opts);
}

function daysUntil(iso){
  var d = parseISODate(iso);
  if(!d) return null;
  var t = new Date(); t.setHours(0,0,0,0);
  return Math.round((d - t) / 86400000);
}

function buildDateBadge(iso, isDone){
  var $b = document.createElement("span");
  $b.className = "card-badge";
  var label = formatDateIT(iso);
  var icon;
  if(isDone){
    $b.classList.add("done");
    icon = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
    $b.title = "Completata il " + label;
  } else {
    var n = daysUntil(iso);
    if(n < 0){ $b.classList.add("overdue"); label = "Scaduta · " + label; }
    else if(n === 0){ $b.classList.add("soon"); label = "Oggi"; }
    else if(n === 1){ $b.classList.add("soon"); label = "Domani"; }
    else if(n <= 3){ $b.classList.add("soon"); }
    icon = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>';
    $b.title = "Scadenza: " + formatDateIT(iso);
  }
  $b.innerHTML = icon + "<span></span>";
  $b.querySelector("span").textContent = label;
  return $b;
}

async function loadEverything(){
  var sessionRes = await sb.auth.getSession();
  var session = sessionRes.data && sessionRes.data.session;
  if(!session){
    // Offline getSession puo' fallire pur avendo un refresh token valido in
    // locale: rimandare al login qui significava accusare l'utente di non
    // essere autenticato solo perche' manca la rete.
    if(isNetworkError(sessionRes.error)){ showOfflinePanel(); return false; }
    // l'indirizzo di una sezione (#chi-fa-cosa) sopravvive al login
    window.location.replace("login.html" + (/^#[a-z0-9-]+$/.test(location.hash) ? location.hash : ""));
    return false;
  }
  var user = session.user;
  state.me = {
    id: user.id,
    email: user.email,
    display_name: (user.user_metadata && user.user_metadata.display_name) || user.email,
    no_label_name: (user.user_metadata && user.user_metadata.no_label_name) || "",
    apple_ics_url: (user.user_metadata && user.user_metadata.apple_ics_url) || "",
    cal_default_view: (user.user_metadata && user.user_metadata.cal_default_view) || ""
  };

  var results = await Promise.all([
    sb.from("be_profiles").select("id, display_name"),
    sb.from("be_projects").select("id, name, owner_id, area, created_at").order("created_at", { ascending: true }),
    sb.from("be_project_shares").select("project_id, user_id"),
    sb.from("be_columns").select("id, project_id, name, position").order("position", { ascending: true }),
    fetchCards()
  ]);

  for (var i = 0; i < results.length; i++){
    if(results[i].error){
      if(isNetworkError(results[i].error)){ showOfflinePanel(); return false; }
      showErrorPanel("Errore nel caricamento dei dati", results[i].error.message);
      return false;
    }
  }

  state.profiles = results[0].data || [];

  var sharesByProject = {};
  (results[2].data || []).forEach(function(s){
    (sharesByProject[s.project_id] = sharesByProject[s.project_id] || []).push(s.user_id);
  });

  var columnsByProject = {};
  var columnById = {};
  (results[3].data || []).forEach(function(c){
    var col = { id: c.id, name: c.name, position: c.position, cards: [] };
    columnById[c.id] = col;
    (columnsByProject[c.project_id] = columnsByProject[c.project_id] || []).push(col);
  });

  (results[4].data || []).forEach(function(c){
    var col = columnById[c.column_id];
    if(col) col.cards.push({
      id: c.id, title: c.title, priority: c.priority, position: c.position,
      due_date: c.due_date || null, done_at: c.done_at || null
    });
  });

  state.projects = (results[1].data || []).map(function(p){
    return {
      id: p.id,
      name: p.name,
      owner_id: p.owner_id,
      area: normalizeArea(p.area),
      isOwner: p.owner_id === state.me.id,
      shares: sharesByProject[p.id] || [],
      columns: columnsByProject[p.id] || []
    };
  });

  syncActiveProject();

  await Promise.all([loadLibrary(), loadLabels()]);
  return true;
}

/* =====================================================================
 * Label della colonna di sinistra
 *
 * Ogni utente crea le proprie label e ci mette dentro i progetti che
 * vede (propri o condivisi): label e assegnazioni sono private, quindi
 * lo stesso progetto puo' stare sotto label diverse per persone diverse.
 * Un progetto sta in una sola label per utente.
 * ===================================================================== */
var NO_LABEL = "__nolabel__";
var LABELS_COLLAPSED_KEY = "be_labels_collapsed_v1";

/* Il gruppo dei progetti non catalogati non e' una riga di be_labels:
   il nome scelto dall'utente vive nei suoi user_metadata, cosi' lo segue
   su ogni dispositivo senza toccare lo schema. */
function noLabelName(){
  return (state.me && state.me.no_label_name) || "Senza label";
}

/* Le label nuove di Alessandro sono condivise col team (sql/label_condivise.sql):
   gli altri le vedono con dentro i progetti che ci mette lui, ma solo lui le
   rinomina, le elimina e le riempie. Una label condivisa vince sulla scelta
   privata: un progetto che Alessandro ci ha messo sta li' per tutti. */
async function loadLabels(){
  var res = await Promise.all([
    sb.from("be_labels").select("id, name, position, user_id, shared").order("position", { ascending: true }),
    sb.from("be_project_labels").select("user_id, project_id, label_id")
  ]);
  // senza la migrazione la colonna shared non c'e': label solo private
  if(res[0].error && /shared|user_id/.test(res[0].error.message || "")){
    res[0] = await sb.from("be_labels").select("id, name, position").order("position", { ascending: true });
  }
  var err = (res[0].error || res[1].error);
  if(err){
    state.labels = [];
    state.projectLabels = {};
    state.labelsError = err.message;
    return;
  }
  state.labelsError = null;
  var meId = state.me && state.me.id;
  state.labels = (res[0].data || []).map(function(l){
    var mine = !l.user_id || l.user_id === meId;
    return {
      id: l.id, name: l.name, position: l.position,
      shared: !!l.shared, mine: mine,
      owner: mine ? "" : profileName(l.user_id)
    };
  });

  var byId = {};
  state.labels.forEach(function(l){ byId[l.id] = l; });
  var map = {}, sharedMap = {};
  (res[1].data || []).forEach(function(r){
    var l = byId[r.label_id];
    if(!l) return;
    if(l.shared) sharedMap[r.project_id] = r.label_id;
    else if(!r.user_id || r.user_id === meId) map[r.project_id] = r.label_id;
  });
  Object.keys(sharedMap).forEach(function(pid){ map[pid] = sharedMap[pid]; });
  state.projectLabels = map;
}

function profileName(userId){
  var p = (state.profiles || []).find(function(x){ return x.id === userId; });
  return p ? p.display_name : "un collega";
}
function labelById(labelId){
  return state.labels.find(function(x){ return x.id === labelId; }) || null;
}
/* Il progetto sta in una label condivisa di un altro: lo sposta solo lui */
function lockedByShared(projectId){
  var l = labelById(state.projectLabels[projectId]);
  return l && l.shared && !l.mine ? l : null;
}
function ownLabels(){
  return sortedLabels().filter(function(l){ return l.mine; });
}

function labelsUnavailable(){
  if(!state.labelsError) return false;
  notify("Le label non sono ancora attive sul database.\n\n" + state.labelsError +
        "\n\nEsegui lo script sql/label.sql nell'editor SQL di Supabase.");
  return true;
}

function sortedLabels(){
  return state.labels.slice().sort(function(a,b){
    if(a.position !== b.position) return a.position - b.position;
    return a.name.localeCompare(b.name, "it");
  });
}

function labelName(labelId){
  var l = state.labels.find(function(x){ return x.id === labelId; });
  return l ? l.name : "";
}

/* Le label si applicano dentro l'area di lavoro aperta: la colonna di
   sinistra mostra sempre e solo i progetti dell'area corrente. */
function projectsInLabel(labelId){
  return areaProjects().filter(function(p){
    var l = state.projectLabels[p.id] || null;
    return labelId === NO_LABEL ? !l : l === labelId;
  });
}

/* Gruppi chiusi: preferenza locale del browser, non del database */
function readCollapsed(){
  try {
    var v = JSON.parse(localStorage.getItem(LABELS_COLLAPSED_KEY) || "[]");
    return Array.isArray(v) ? v : [];
  } catch(e){ return []; }
}
function isCollapsed(id){ return readCollapsed().indexOf(id) >= 0; }
function toggleCollapsed(id){
  var ids = readCollapsed(), i = ids.indexOf(id);
  if(i >= 0) ids.splice(i, 1); else ids.push(id);
  try { localStorage.setItem(LABELS_COLLAPSED_KEY, JSON.stringify(ids)); } catch(e){}
}

/* --- mutazioni ----------------------------------------------------------- */
function promptNewLabel(onDone){
  if(labelsUnavailable()) return;
  showInputModal({
    title: "Nuova label",
    label: "Nome della label",
    placeholder: "Es. Bandi, Clienti, Interni",
    confirmText: "Crea",
    onConfirm: async function(name){
      var n = (name || "").trim();
      if(!n) return;
      if(ownLabels().some(function(l){ return l.name.toLowerCase() === n.toLowerCase(); })){
        notify("Hai già una label con questo nome.");
        return;
      }
      var pos = state.labels.reduce(function(m, l){ return Math.max(m, l.position); }, -1) + 1;
      var res = await sb.from("be_labels")
        .insert({ user_id: state.me.id, name: n, position: pos })
        .select().single();
      if(res.error){ notify(errorText(res.error)); return; }
      var label = { id: res.data.id, name: res.data.name, position: res.data.position,
                    shared: !!res.data.shared, mine: true, owner: "" };
      state.labels.push(label);
      renderSidebar();
      if(label.shared) notify("«" + n + "» è condivisa col team: i progetti che ci metti li vedono tutti.", { warn: false, autoHide: 4000 });
      if(onDone) onDone(label);
    }
  });
}

function promptRenameLabel(label){
  showInputModal({
    title: "Rinomina label",
    label: "Nome della label",
    value: label.name,
    confirmText: "Salva",
    onConfirm: async function(name){
      var n = (name || "").trim();
      if(!n || n === label.name) return;
      if(ownLabels().some(function(l){
        return l.id !== label.id && l.name.toLowerCase() === n.toLowerCase();
      })){
        notify("Hai già una label con questo nome.");
        return;
      }
      var res = await sb.from("be_labels").update({ name: n }).eq("id", label.id);
      if(res.error){ notify(errorText(res.error)); return; }
      label.name = n;
      renderSidebar();
    }
  });
}

function promptRenameNoLabel(){
  showInputModal({
    title: "Rinomina «Senza label»",
    label: "Nome del gruppo (vuoto per ripristinare «Senza label»)",
    value: noLabelName(),
    confirmText: "Salva",
    onConfirm: async function(name){
      var n = (name || "").trim();
      if(n === "Senza label") n = "";
      if(n === (state.me.no_label_name || "")) return;
      if(n && state.labels.some(function(l){ return l.name.toLowerCase() === n.toLowerCase(); })){
        notify("Hai già una label con questo nome.");
        return;
      }
      var res = await sb.auth.updateUser({ data: { no_label_name: n || null } });
      if(res.error){ notify(errorText(res.error)); return; }
      state.me.no_label_name = n;
      renderSidebar();
    }
  });
}

async function deleteLabel(label){
  /* Contati su tutte le aree: la label esiste al di sopra delle dashboard. */
  var n = state.projects.filter(function(p){
    return state.projectLabels[p.id] === label.id;
  }).length;
  var msg = "Eliminare la label «" + label.name + "»?";
  if(label.shared) msg += "\n\nÈ condivisa: sparisce per tutto il team. I progetti restano condivisi.";
  if(n){
    msg += "\n\n" + (n === 1 ? "Il progetto contenuto non verrà eliminato: tornerà"
                             : "I " + n + " progetti contenuti non verranno eliminati: torneranno") +
           " in «" + noLabelName() + "».";
  }
  if(!confirm(msg)) return;
  var res = await sb.from("be_labels").delete().eq("id", label.id);
  if(res.error){ notify(errorText(res.error, "Label non eliminata")); return; }
  state.labels = state.labels.filter(function(l){ return l.id !== label.id; });
  Object.keys(state.projectLabels).forEach(function(pid){
    if(state.projectLabels[pid] === label.id) delete state.projectLabels[pid];
  });
  renderSidebar();
}

/* labelId null = fuori da ogni label */
async function setProjectLabel(projectId, labelId){
  if(labelsUnavailable()) return;
  if(!state.projects.some(function(p){ return p.id === projectId; })) return;
  var current = state.projectLabels[projectId] || null;
  if(current === (labelId || null)) return;
  var locked = lockedByShared(projectId);
  if(locked){
    notify("È nella label condivisa «" + locked.name + "»: può spostarlo solo " + locked.owner + ".");
    return;
  }
  var target = labelId ? labelById(labelId) : null;
  if(target && !target.mine){
    notify("«" + target.name + "» è la label condivisa di " + target.owner + ": può riempirla solo chi l'ha creata.");
    return;
  }

  var res;
  if(labelId){
    res = await sb.from("be_project_labels").upsert(
      { user_id: state.me.id, project_id: projectId, label_id: labelId },
      { onConflict: "user_id,project_id" }
    );
  } else {
    res = await sb.from("be_project_labels").delete()
      .eq("user_id", state.me.id).eq("project_id", projectId);
  }
  if(res.error){ notify(errorText(res.error, "Non sono riuscito a spostare il progetto")); return; }

  if(labelId) state.projectLabels[projectId] = labelId;
  else delete state.projectLabels[projectId];
  renderSidebar();
}

/* Un gruppo della colonna di sinistra: una label dell'utente,
   oppure (label = null) i progetti che non ha ancora catalogato. */
function buildLabelGroup(label){

  var groupId  = isNone ? NO_LABEL : label.id;

  var group = document.createElement("div");

  var head = document.createElement("div");
  head.className = "label-head";
  head.title = isNone ? "Progetti non ancora assegnati a una label" : label.name;

  var caret = document.createElement("span");
  caret.className = "label-caret";
  caret.innerHTML = ICON_CARET;

  var title = document.createElement("span");
  title.className = "label-title";
  title.textContent = isNone ? noLabelName() : label.name;

  var count = document.createElement("span");

  count.textContent = projects.length;

  head.appendChild(caret);
